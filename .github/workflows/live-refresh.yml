# While a tracked tournament is on, refresh its results every 15 minutes, while a match is due or on, so the
# standings, brackets, predictions and the next-match module follow the event.
# Outside a tournament the job finds nothing live and ends in seconds without
# touching Liquipedia. The full daily refresh (daily-refresh.yml) stays the
# source of everything else: new events, rosters, images, Valve standings.
#
# GitHub's schedule is best effort: runs start late and some are skipped, which
# is why this runs every 15 minutes (a skipped run costs at most one more wait)
# and why "Run workflow" exists as the manual push.
#
# This job commits DATA only, after the same quality gates as the daily run.
# It does not rebuild the site: Vercel does that on every push (buildCommand
# builds the bundle first), and the daily run keeps the pre-commit build check.
# Skipping the ~5 min bundle build here keeps a live update at about 1 minute
# from Liquipedia to the repo.
name: Live tournament refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ask Liquipedia even when no match is inside its time window (the freshness check sets this for an overdue match)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# the same queue as the daily refresh: two runs never write the cache together
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the branch tip, not the triggering commit: a run queued behind another refresh
      # must start from the data that run just pushed
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh the live tournament pages (1 to 3 requests; exits at once when nothing is live)
        run: python pipeline/daily_refresh.py --live ${{ inputs.force && '--force' || '' }}

      - name: Data quality gates
        id: gates
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            echo '{"passed": true, "note": "no data changes"}' > /tmp/gates.json
            exit 0
          fi
          set -o pipefail
          python checks/data_gates.py --old-git 2>&1 | tee /tmp/gates.json

      - name: Build the SQLite copy (data/faceoff.db)
        run: python pipeline/build_db.py

      - name: Commit and push changed data
        run: |
          git config user.name "faceoff-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Live data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # on a conflict in the data files keep this run's own fresh fetch (-X theirs = the commit being replayed)
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push

      - name: Open an issue when the gates fail
        if: failure() && steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-pipeline --color B60205 --description "Automated data pipeline alerts" 2>/dev/null || true
          {
            echo "The data quality gates failed on a live refresh; nothing was published. Run: $RUN_URL"
            echo
            echo '```json'
            head -c 60000 /tmp/gates.json
            echo
            echo '```'
          } > /tmp/issue.md
          existing=$(gh issue list --label data-pipeline --state open --search "Data gates failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "Data gates failed - publish blocked ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/issue.md --label data-pipeline
          fi

      # a refused page is retried by the next scheduled run (15 min); the run only turns red once
      # pages have been stale for 30 minutes, so one refusal does not email you every 15 minutes
      - name: Fail loudly if a live page could not be refreshed
        run: python pipeline/daily_refresh.py --check-status --max-stale-minutes 30
