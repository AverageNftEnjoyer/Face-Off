# Refresh Faceoff's data from Liquipedia every day and push it. Vercel is
# connected to this repo, so the push triggers a rebuild of
# https://cs2faceoffanalytics.vercel.app (buildCommand in vercel.json).
name: Daily data refresh

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC: results and schedules reach the site same day
    # end-of-day runs at 8 pm New York all year (GitHub cron is UTC and ignores daylight saving):
    - cron: "7 0 * * *"      # 00:07 UTC = 8:07 pm EDT (summer); 7:07 pm EST in winter
    - cron: "7 1 * * *"      # 01:07 UTC = 8:07 pm EST (winter); 9:07 pm EDT in summer
    # GitHub often starts scheduled runs late (sometimes hours on busy days); "Run workflow" is instant.
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh Liquipedia data and Valve standings (rate-limited, cached)
        run: python scripts/daily_refresh.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for the one GitHub API call in data/vrs.py

      # Quality gates run BEFORE anything is published: a red gate blocks the
      # commit below and opens an issue with the report. Never ship bad data.
      # stderr goes into the report too, so a crash is readable in the issue.
      - name: Data quality gates
        id: gates
        run: |
          set -o pipefail
          python scripts/data_gates.py --old-git 2>&1 | tee /tmp/gates.json

      # The viewer renders exclusively from the bundle (gitignored; Vercel
      # rebuilds it via buildCommand). Building it here validates the bundle
      # before the site-build check below, which consumes it.
      - name: Build the derived data bundle
        run: python viewer/build_bundle.py viewer/data-bundle.json

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Check the site builds
        run: python viewer/build_viewer.py public/index.html

      - name: Commit and push changed data
        run: |
          git config user.name "faceoff-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data viewer/assets.json
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          # someone may have pushed code while this ran: replay the data commit on top
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # Loud on failure: a red run must produce a visible issue, never silence.
      # failure() is REQUIRED here: a step with no status-check function gets an
      # implicit success() and is skipped once an earlier step has failed.
      - name: Open an issue when the gates fail
        if: failure() && steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `gh issue create --label X` hard-fails when X does not exist yet
          gh label create data-pipeline --color B60205 --description "Automated data pipeline alerts" 2>/dev/null || true
          {
            echo "The data quality gates failed; nothing was published. Run: $RUN_URL"
            echo
            echo '```json'
            head -c 60000 /tmp/gates.json
            echo
            echo '```'
          } > /tmp/issue.md
          # one open issue at a time: the same failure repeats every run until fixed
          existing=$(gh issue list --label data-pipeline --state open --search "Data gates failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "Data gates failed - publish blocked ($(date -u +%Y-%m-%d))" \
              --body-file /tmp/issue.md --label data-pipeline
          fi

      # The roster candidate and its diff are NOT committed (.gitignore): the
      # issue is the review request, and scripts/promote_rosters.py rebuilds the
      # candidate from the committed cache when someone approves it.
      - name: Open an issue when roster changes need review
        if: ${{ !cancelled() && steps.gates.outcome == 'success' && hashFiles('data/roster_diff.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create roster-review --color FBCA04 --description "Roster candidate needs human review" 2>/dev/null || true
          existing=$(gh issue list --label roster-review --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file data/roster_diff.md
          else
            gh issue create --title "Roster changes need review ($(date -u +%Y-%m-%d))" \
              --body-file data/roster_diff.md --label roster-review
          fi

      # a green run must mean the live pages are current: the retries inside the
      # refresh already waited out Liquipedia's rate limit, so this only fires
      # when it kept refusing (the data is still committed above)
      - name: Fail loudly if a live page could not be refreshed
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("data/refresh_status.json", encoding="utf-8"))
          if s.get("stale_pages"):
              print("Liquipedia refused these live pages, the site still shows older results:", s["stale_pages"])
              sys.exit(1)
          PY
