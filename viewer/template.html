<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faceoff CS2 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..900&display=swap">
<style>
/* Layout: a CS2-HUD style event hub. Dark slate panels like the in-game menus;
   the two sides of every matchup are coloured by CS2's own factions
   (first team = Counter-Terrorist blue, second team = Terrorist gold).
   One typeface (Saira) in two widths: condensed + heavy for team names, scores
   and map names; normal width for everything you read. Single dark theme by
   design, because the subject's own UI is dark. */
:root {
  color-scheme: dark;
  --bg: #171D25;         /* page: CS2 menu slate */
  --panel: #1F2630;      /* cards, rows */
  --raise: #28313D;      /* hover / selected */
  --line: #36414F;       /* hairlines */
  --text: #E8ECF1;
  --dim: #95A1B0;
  --ct: #6E9DE2;         /* first team: Counter-Terrorist blue */
  --t: #E7AB3F;          /* second team: Terrorist gold */
  --ct-deep: #2B4468;
  --t-deep: #5A4219;
  --win: #5BC48B;
  --loss: #E4684F;
  --scrim: rgba(18, 23, 30, .82);
  --hatch: rgba(232, 236, 241, .45);
  --face: "Saira", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
  --s-1: .8125rem;
  --s0: 1rem;
  --s1: 1.25rem;
  --s2: 1.75rem;
  --s3: 2.5rem;
  --s4: clamp(2.75rem, 8vw, 4.5rem);
  --r: 6px;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; }
body {
  font-family: var(--face);
  font-size: var(--s0);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  font-stretch: 100%;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--text); }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }
.cond { font-stretch: 62.5%; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .95; }
.dim { color: var(--dim); }
.small { font-size: var(--s-1); }
.win { color: var(--win); }
.loss { color: var(--loss); }
.ct { color: var(--ct); }
.t { color: var(--t); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 76rem; margin: 0 auto;
  padding-inline: max(16px, 2.5vw);
  display: flex; align-items: center; gap: .5rem 1.5rem; flex-wrap: wrap;
  min-height: 3.5rem;
}
.brand { display: flex; align-items: center; gap: .55rem; font-stretch: 75%; font-weight: 800; font-size: var(--s1); letter-spacing: .04em; }
.brand svg { width: 1.6rem; height: 1.6rem; }
.tabs { display: flex; gap: .25rem; overflow-x: auto; scrollbar-width: none; }
.tabs a {
  padding: .45rem .8rem; border-radius: var(--r);
  color: var(--dim); font-weight: 600; white-space: nowrap;
}
.tabs a:hover { background: var(--panel); color: var(--text); }
.tabs a[aria-current="page"] { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--t); }
.snap { margin-left: auto; font-size: var(--s-1); color: var(--dim); }

.page { max-width: 76rem; margin: 0 auto; padding-inline: max(16px, 2.5vw); padding-block: 1.5rem 4rem; display: grid; gap: 1.5rem; }

/* ---------- generic panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; display: grid; gap: .85rem; align-content: start; min-width: 0; }
.panel > h2, .sec-h { font-stretch: 75%; font-weight: 800; font-size: var(--s1); letter-spacing: .02em; display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.panel > h2 .dim, .sec-h .dim { font-stretch: 100%; font-weight: 400; font-size: var(--s-1); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }

/* ---------- logos, flags ---------- */
.logo { width: 2rem; height: 2rem; object-fit: contain; flex: none; }
.logo.lg { width: 4.5rem; height: 4.5rem; }
.logo.xl { width: clamp(4.5rem, 12vw, 7.5rem); height: clamp(4.5rem, 12vw, 7.5rem); }
.logo.sm { width: 1.35rem; height: 1.35rem; }
.logo-ph { display: grid; place-items: center; border-radius: 50%; background: var(--raise); color: var(--dim); font-weight: 800; font-size: .7rem; }
.flag { width: 1.15rem; height: auto; border-radius: 2px; vertical-align: -.1em; flex: none; }

/* ---------- event hero ---------- */
.hero {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.25rem 1.75rem; align-items: center;
  padding: 1.25rem;
}
.hero .evlogo { width: clamp(5rem, 14vw, 8.5rem); height: auto; }
.hero h1 { font-size: var(--s3); }
.facts { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-top: .6rem; }
.facts div { display: grid; }
.facts dt { font-size: var(--s-1); color: var(--dim); }
.facts dd { margin: 0; font-weight: 700; }
.facts dl { margin: 0; display: contents; }

.pool { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; }
.maptile {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%;
  border-radius: var(--r); overflow: hidden; background: var(--raise) center / cover no-repeat;
  display: flex; align-items: flex-end; padding: .5rem .6rem;
  border: 1px solid var(--line);
  transition: transform .15s ease;
}
.maptile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--scrim)); }
.maptile:hover { transform: translateY(-2px); }
.maptile span { position: relative; font-size: var(--s1); }
.maptile small { position: relative; display: block; font-size: .7rem; color: var(--dim); font-stretch: 100%; text-transform: none; font-weight: 400; }

/* ---------- schedule ---------- */
.days { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .2rem; }
.days button {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
  padding: .35rem .7rem; cursor: pointer; display: grid; text-align: left; min-width: 4.6rem;
}
.days button b { font-weight: 700; }
.days button span { font-size: .72rem; color: var(--dim); }
.days button[aria-pressed="true"] { background: var(--raise); border-color: var(--t); }
.days button:hover { border-color: var(--dim); }

.mrow {
  display: grid;
  grid-template-columns: 4.2rem minmax(0, 1fr) 5.2rem minmax(0, 1fr) auto;
  align-items: center; gap: .75rem;
  padding: .65rem .75rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
}
.mrow:hover { background: var(--raise); }
.mrow .time { font-size: var(--s-1); color: var(--dim); display: grid; }
.mrow .tm { display: flex; align-items: center; gap: .5rem; min-width: 0; font-weight: 600; }
.mrow .tm.r { flex-direction: row-reverse; text-align: right; }
.mrow .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm.lost span { color: var(--dim); font-weight: 400; }
.mrow .mid { text-align: center; font-size: var(--s2); }
.mrow .mid.pct { font-size: var(--s-1); font-stretch: 100%; font-weight: 600; text-transform: none; color: var(--dim); }
.mrow .tag { display: grid; justify-items: end; gap: .15rem; font-size: .72rem; color: var(--dim); white-space: nowrap; }
.mlist { display: grid; gap: .45rem; }

.chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .05rem .5rem; font-size: .72rem; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.chip.live { color: var(--loss); }
.chip.live::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.chip.hit { color: var(--win); }
.chip.miss { color: var(--loss); }
.chip.plain { color: var(--dim); }

/* standings */
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th { text-align: left; color: var(--dim); font-weight: 600; padding: .35rem .4rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
.tlink { display: flex; align-items: center; gap: .5rem; font-weight: 600; min-width: 0; }
.tlink:hover span { text-decoration: underline; }
tr.up td:first-child { box-shadow: inset 3px 0 0 var(--win); }
tr.out td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
tr.out .tlink { color: var(--dim); }
.tablewrap { overflow-x: auto; }

/* bracket */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(9rem, 1fr)); gap: .75rem; overflow-x: auto; }
.bcol { display: grid; gap: .5rem; align-content: space-around; }
.bcol h3 { font-size: var(--s-1); color: var(--dim); font-weight: 600; }
.bm { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); font-size: var(--s-1); }
.bm div { display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem; color: var(--dim); }
.bm div + div { border-top: 1px solid var(--line); }
.bm .when { font-size: .7rem; color: var(--dim); padding: .25rem .5rem; border-top: 1px solid var(--line); }

.prizes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem 1rem; font-size: var(--s-1); }
.prizes b { font-weight: 700; text-align: right; }
.fmt { margin: 0; padding-left: 1rem; font-size: var(--s-1); display: grid; gap: .15rem; }
.fmt li.d1 { list-style: none; margin-left: -1rem; font-weight: 700; color: var(--text); margin-top: .35rem; }
.fmt li { color: var(--dim); }

/* ---------- match page ---------- */
.crumb { font-size: var(--s-1); color: var(--dim); display: flex; gap: .5rem; flex-wrap: wrap; }
.crumb a { text-decoration: underline; text-underline-offset: 3px; }
.vs {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 1rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: clamp(1rem, 3vw, 1.75rem);
  position: relative; overflow: hidden;
}
.vs::before, .vs::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; pointer-events: none; }
.vs::before { left: 0; background: linear-gradient(90deg, var(--ct-deep), transparent); opacity: .55; }
.vs::after { right: 0; background: linear-gradient(270deg, var(--t-deep), transparent); opacity: .55; }
.vs .side { display: grid; justify-items: center; gap: .4rem; text-align: center; position: relative; z-index: 1; min-width: 0; }
.vs .side .cond { font-size: clamp(1.5rem, 4.5vw, 2.6rem); overflow-wrap: anywhere; }
.vs .side.a .cond { color: var(--ct); }
.vs .side.b .cond { color: var(--t); }
.vs .side .meta { font-size: var(--s-1); color: var(--dim); }
.vs .centre { display: grid; justify-items: center; gap: .3rem; position: relative; z-index: 1; text-align: center; }
.vs .score { font-size: var(--s4); display: flex; gap: .6rem; align-items: baseline; }
.vs .score .lost { color: var(--dim); }
.vs .when { font-size: var(--s1); font-weight: 700; }

.tug { display: grid; gap: .6rem; }
.tug .ends { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.tug .ends .cond { font-size: var(--s3); }
.bar { position: relative; height: 2.6rem; border-radius: var(--r); overflow: hidden; background: var(--t); }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--ct); width: 50%; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.bar .band { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(10, 14, 20, .55) 0 2px, rgba(255, 255, 255, .45) 2px 4px, transparent 4px 8px); border-inline: 2px solid var(--bg); transition: left .9s cubic-bezier(.2, .8, .2, 1), width .9s cubic-bezier(.2, .8, .2, 1); }
.bar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--bg); transform: translateX(-1px); }
.tug .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; font-size: var(--s-1); color: var(--dim); align-items: center; }

/* map cards */
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; }
.mapcard {
  position: relative; border-radius: var(--r); overflow: hidden; min-height: 9.5rem;
  background: var(--raise) center / cover no-repeat; border: 1px solid var(--line);
  display: grid; align-content: end; gap: .35rem; padding: .75rem;
  cursor: pointer; text-align: left; width: 100%;
}
.mapcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18, 23, 30, .25), var(--scrim) 65%); transition: background .2s; }
.mapcard > * { position: relative; }
.mapcard .role { font-size: .72rem; color: var(--dim); display: flex; gap: .4rem; align-items: center; }
.mapcard .nm { font-size: var(--s2); }
.mapcard .sc { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--s2); }
.mapcard .sc .x { font-size: var(--s-1); color: var(--dim); font-stretch: 100%; font-weight: 400; text-transform: none; }
.mapcard.wa { box-shadow: inset 0 -3px 0 var(--ct); }
.mapcard.wb { box-shadow: inset 0 -3px 0 var(--t); }
.mapcard .halves { display: none; font-size: var(--s-1); gap: .15rem; }
.mapcard[aria-expanded="true"] .halves { display: grid; }
.mapcard[aria-expanded="true"]::before { background: var(--scrim); }
.halves .hr { display: grid; grid-template-columns: minmax(0, 1fr) 3rem 3rem 3rem; gap: .25rem; }
.halves .hr span:not(:first-child) { text-align: right; }
.halves .hd { color: var(--dim); font-size: .7rem; }
.mapcard .odds { height: .45rem; border-radius: 3px; overflow: hidden; background: var(--t); position: relative; }
.mapcard .odds b { position: absolute; inset: 0 auto 0 0; background: var(--ct); }
.mapcard.ban { min-height: 5.5rem; cursor: default; filter: grayscale(1); opacity: .55; }
.mapcard.ban .nm { text-decoration: line-through; text-decoration-thickness: 2px; font-size: var(--s1); }
.reveal { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { transform: translateY(8px); opacity: .001; } }

/* series scores */
.srow { display: grid; grid-template-columns: 8rem minmax(0, 1fr) 3rem; gap: .6rem; align-items: center; font-size: var(--s-1); }
.srow .trk { height: 1rem; background: var(--bg); border-radius: 3px; overflow: hidden; }
.srow .trk b { display: block; height: 100%; }
.srow.a .trk b { background: var(--ct); }
.srow.b .trk b { background: var(--t); }
.srow.top { font-weight: 700; }
.srow .v { text-align: right; }

/* lineups */
.lineup { display: grid; gap: .4rem; }
.player {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: center;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .65rem;
}
.player .nick { font-size: var(--s1); }
.player .real { font-size: .75rem; color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .badges { display: flex; gap: .3rem; }
.lineup.a .nick { color: var(--ct); }
.lineup.b .nick { color: var(--t); }
.coach { font-size: var(--s-1); color: var(--dim); display: flex; gap: .4rem; align-items: center; padding-left: .2rem; }

/* factors */
.frow { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr) 3.5rem; gap: .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.frow b { display: block; font-size: var(--s0); }
.frow .sub { color: var(--dim); }
.dv { position: relative; height: .9rem; }
.dv::before { content: ""; position: absolute; left: 50%; top: -.3rem; bottom: -.3rem; width: 1px; background: var(--dim); }
.dv b { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.dv b.pos { left: 50%; background: var(--ct); }
.dv b.neg { right: 50%; background: var(--t); }
.frow .v { text-align: right; font-weight: 700; }
.frow.off { color: var(--dim); }
.frow.off b { font-weight: 400; }
details summary { cursor: pointer; color: var(--dim); font-size: var(--s-1); width: fit-content; }
details ul { margin: .5rem 0 0; padding-left: 1.1rem; font-size: var(--s-1); color: var(--dim); display: grid; gap: .3rem; }

/* map pool butterfly */
.fly { display: grid; gap: .35rem; }
.fly .fr { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem minmax(0, 1fr); gap: .5rem; align-items: center; font-size: var(--s-1); }
.fly .half { display: flex; align-items: center; gap: .4rem; }
.fly .half.l { flex-direction: row-reverse; }
.fly .trk { flex: 1; height: .8rem; background: var(--bg); border-radius: 3px; overflow: hidden; display: flex; }
.fly .half.l .trk { justify-content: flex-end; }
.fly .trk b { display: block; height: 100%; }
.fly .half.l b { background: var(--ct); }
.fly .half.r b { background: var(--t); }
.fly .half span { min-width: 4.4rem; color: var(--dim); }
.fly .half.l span { text-align: right; }
.fly .mn { text-align: center; font-size: var(--s0); }

/* form + h2h */
.res { display: grid; gap: .3rem; }
.res a, .res div.r {
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .5rem; align-items: center;
  font-size: var(--s-1); padding: .3rem .4rem; border-radius: var(--r);
}
.res a:hover { background: var(--raise); }
.wl { width: 1.4rem; height: 1.4rem; border-radius: 3px; display: grid; place-items: center; font-weight: 800; font-size: .7rem; color: var(--bg); }
.wl.W { background: var(--win); }
.wl.L { background: var(--loss); }
.res .ev { color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .opp { display: flex; align-items: center; gap: .4rem; min-width: 0; }

.warn { border-left: 3px solid var(--loss); padding: .15rem 0 .15rem .7rem; font-size: var(--s-1); color: var(--dim); }
.links { display: flex; flex-wrap: wrap; gap: .5rem; }
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .45rem .8rem; border-radius: var(--r);
  background: var(--raise); border: 1px solid var(--line); font-weight: 600; font-size: var(--s-1); cursor: pointer;
}
.btn:hover { border-color: var(--dim); }

/* compare picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .4rem; }
.pick .pn { overflow-wrap: anywhere; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
.pick .pv { font-size: .68rem; color: var(--dim); }
.vrs { display: inline-flex; align-items: baseline; gap: .3rem; font-weight: 700; color: var(--text); }
.pick {
  display: grid; justify-items: center; gap: .3rem; padding: .6rem .3rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer;
  font-size: .72rem; text-align: center;
}
.pick:hover { background: var(--raise); }
.pick[data-slot="a"] { border-color: var(--ct); box-shadow: inset 0 -3px 0 var(--ct); background: var(--raise); }
.pick[data-slot="b"] { border-color: var(--t); box-shadow: inset 0 -3px 0 var(--t); background: var(--raise); }
.slots { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; font-size: var(--s-1); color: var(--dim); }

/* teams */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .6rem; }
.tcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .7rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .75rem; }
.tcard:hover { background: var(--raise); }
.tcard .cond { font-size: var(--s1); overflow-wrap: anywhere; }
.tcard .small { grid-column: 2; }
.thead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.25rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; }
.thead h1 { font-size: var(--s3); }
.thead .big { text-align: right; display: grid; }
.thead .big b { font-size: var(--s3); }
.spark { width: 100%; height: auto; display: block; }
.poolbars { display: grid; gap: .4rem; }
.pb { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 6rem; gap: .6rem; align-items: center; font-size: var(--s-1); }
.pb .thumb { height: 2.2rem; border-radius: 4px; background: var(--raise) center / cover; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: .15rem .3rem; }
.pb .thumb::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, var(--scrim)); }
.pb .thumb span { position: relative; font-size: .78rem; }
.pb .trk { height: .9rem; background: var(--bg); border-radius: 3px; overflow: hidden; position: relative; }
.pb .trk b { display: block; height: 100%; background: var(--ct); }
.pb .trk i { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }

/* record */
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.figs div { display: grid; }
.figs b { font-size: var(--s3); }
.calib svg { width: 100%; max-width: 28rem; height: auto; display: block; }

footer.foot { font-size: var(--s-1); color: var(--dim); display: grid; gap: .35rem; max-width: 80ch; }

@media (max-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .pool { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .pool { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mrow { grid-template-columns: 3.4rem minmax(0, 1fr) 3.6rem minmax(0, 1fr); }
  .mrow .tag { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; justify-content: start; gap: .5rem; }
  .vs { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .5rem; }
  .frow { grid-template-columns: minmax(0, 1fr) 3.5rem; }
  .frow .dv { grid-column: 1 / -1; grid-row: 2; }
  .thead { grid-template-columns: auto minmax(0, 1fr); }
  .thead .big { grid-column: 1 / -1; text-align: left; }
  .fly .half span { min-width: 3.2rem; }
  .srow { grid-template-columns: 6.5rem minmax(0, 1fr) 2.75rem; }
  .snap { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bar .fill, .bar .band, .maptile { transition: none; }
  .reveal { animation: none; }
  .chip.live::before { animation: none; }
}

/* ---------- v3: tournaments ---------- */
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .75rem; }
.evcard {
  display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: .35rem .9rem; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem;
}
.evcard:hover { background: var(--raise); border-color: var(--dim); }
.evcard img.evl { width: 4rem; height: 4rem; object-fit: contain; grid-row: span 2; }
.evcard .ename { font-stretch: 75%; font-weight: 800; font-size: var(--s1); line-height: 1.1; }
.evcard .emeta { font-size: var(--s-1); color: var(--dim); display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
.evcard .efoot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-top: .5rem; border-top: 1px solid var(--line); font-size: var(--s-1); }
.evcard .champ { display: flex; align-items: center; gap: .4rem; font-weight: 700; }
.chip.up { color: var(--ct); }
.chip.done { color: var(--dim); }
.subtabs { display: flex; gap: .35rem; flex-wrap: wrap; }
.subtabs a { padding: .5rem .9rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); font-weight: 700; color: var(--dim); }
.subtabs a:hover { color: var(--text); border-color: var(--dim); }
.subtabs a[aria-current="page"] { color: var(--text); background: var(--raise); border-color: var(--t); }
.hero .champline { display: flex; align-items: center; gap: .6rem; margin-top: .75rem; font-weight: 700; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: .75rem; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .85rem; display: grid; gap: .6rem; align-content: start; }
.pcard.sel-a { border-color: var(--ct); box-shadow: inset 0 3px 0 var(--ct); }
.pcard.sel-b { border-color: var(--t); box-shadow: inset 0 3px 0 var(--t); }
.pcard .ph { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .1rem .7rem; align-items: center; }
.pcard .ph .cond { font-size: var(--s1); overflow-wrap: anywhere; }
.pcard .ph .small { grid-column: 2; }
.pcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; font-size: var(--s-1); }
.pcard li { display: flex; align-items: center; gap: .45rem; min-width: 0; }
.pcard li b { font-weight: 700; }
.pcard li .rn { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .btn[aria-pressed="true"] { border-color: var(--t); }
.tray {
  position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem;
  background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: .65rem .9rem;
}
.tray .slot { display: flex; align-items: center; gap: .45rem; font-weight: 700; }
.search { width: 100%; max-width: 22rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .7rem; font: inherit; }
.empty { color: var(--dim); font-size: var(--s-1); padding: .5rem 0; }
.grouptbl + .grouptbl { margin-top: .75rem; }
.grouptbl h3 { font-size: var(--s-1); color: var(--dim); font-weight: 600; margin-bottom: .2rem; }

/* ---------- v4: the matchup desk ----------
   One loud element: the court, split on a slant like the Faceoff mark, each half
   tinted with that team's own logo colour. Everything around it stays quiet. */
.page.wide { max-width: 84rem; }
.page > *, .desk > *, .desk-main > * { min-width: 0; }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.5rem; align-items: start; }
.desk-main { display: grid; gap: 1.25rem; min-width: 0; }
.ctx { display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
.ctx .ev { display: flex; align-items: center; gap: .65rem; min-width: 0; }
.ctx .ev img { width: 2.25rem; height: 2.25rem; object-fit: contain; }
.ctx .ev b { font-weight: 700; }
.ctx .ev span { color: var(--dim); }
.ctx a.btn { font-weight: 600; }

.court {
  position: relative; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 1rem 1.25rem; align-items: end;
  padding: clamp(1rem, 3vw, 1.75rem) clamp(1rem, 3vw, 1.75rem) 1.25rem;
  border-radius: 10px; border: 1px solid var(--line);
  background: linear-gradient(104deg, var(--ct-deep) 0 49.6%, var(--bg) 49.6% 50.4%, var(--t-deep) 50.4% 100%);
}
.court::after { /* faint chevrons from the Faceoff mark, one per side */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .07;
  background:
    linear-gradient(120deg, transparent 46%, var(--ct) 46% 54%, transparent 54%) left -6rem top -2rem / 22rem 22rem no-repeat,
    linear-gradient(60deg, transparent 46%, var(--t) 46% 54%, transparent 54%) right -6rem top -2rem / 22rem 22rem no-repeat;
}
.cside { display: grid; justify-items: start; gap: .3rem; min-width: 0; }
.cside.b { justify-items: end; text-align: right; }
.cside .logo.xl { width: clamp(4rem, 9vw, 6rem); height: clamp(4rem, 9vw, 6rem); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .35)); }
.cname { font-size: clamp(1.4rem, 3.2vw, 2.4rem); overflow-wrap: anywhere; }
.cname:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.cmeta { color: var(--dim); }
.cbig { font-size: clamp(3rem, 8.5vw, 5.75rem); line-height: .85; margin-top: .35rem; }
.cbig small { font-size: .42em; font-weight: 700; }
.cside.a .cbig { color: var(--ct); }
.cside.b .cbig { color: var(--t); }
.ccentre { display: grid; justify-items: center; gap: .5rem; text-align: center; align-self: center; max-width: 10rem; }
.desk-main > .grid2 { align-items: start; }
.ccentre .score { font-size: clamp(2.5rem, 7vw, 4.25rem); display: flex; gap: .5rem; align-items: baseline; }
.ccentre .score .lost { color: var(--dim); }
.ccentre .vsword { font-size: var(--s2); color: var(--dim); }
.ccentre .chip { background: var(--bg); white-space: normal; }
.court .cbar { grid-column: 1 / -1; display: grid; gap: .45rem; }
.court .bar { height: 1.15rem; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
.court .legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; font-size: var(--s-1); color: var(--dim); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; padding: .2rem .7rem; border-radius: 999px; cursor: pointer; font-size: var(--s-1); font-weight: 700; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.seg button:disabled { cursor: default; }
.seg button:not([aria-pressed="true"]):disabled { display: none; }

.dtabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.dtabs button { background: none; border: 0; padding: .55rem 0; cursor: pointer; color: var(--dim); font-weight: 600; white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.dtabs button:hover { color: var(--text); }
.dtabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--ct); }

/* veto tape: every map of the pool in veto order; picks carry the picker's colour */
.tape { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); gap: .4rem; }
.tm {
  position: relative; overflow: hidden; min-height: 6.75rem; padding: .5rem .55rem;
  display: grid; align-content: space-between; text-align: left; cursor: pointer;
  background: var(--raise) center / cover no-repeat; border: 1px solid var(--line); border-radius: 6px;
  border-top-width: 4px;
}
.tm::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18, 23, 30, .35), var(--scrim) 70%); }
.tm > * { position: relative; }
.tm .tn { font-weight: 800; font-size: .78rem; color: var(--dim); }
.tm .tnm { font-size: var(--s1); }
.tm .trole { font-size: .72rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm.pick.sa { border-top-color: var(--ct); }
.tm.pick.sb { border-top-color: var(--t); }
.tm.dec { border-top-color: var(--text); }
.tm.ban.sa { border-top-color: var(--ct); }
.tm.ban.sb { border-top-color: var(--t); }
.tm:hover { border-color: var(--dim); }
.tm[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 1px; }
.tm .trole { color: var(--text); }
.tm .trole i { font-style: normal; font-weight: 800; font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; padding: 0 .3rem; border-radius: 3px; margin-right: .3rem; vertical-align: 1px; }
.tm.ban .trole i { background: var(--loss); color: #fff; }
.tm.pick .trole i { background: var(--win); color: #0b0f14; }
.tm.dec .trole i { background: var(--text); color: var(--bg); }
.tm .tst { display: grid; gap: .05rem; margin-top: .3rem; font-size: .7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tm .tst span { display: flex; align-items: center; gap: .3rem; min-width: 0; white-space: nowrap; }
.tm .tst span::before { content: ""; flex: none; width: .4rem; height: .4rem; border-radius: 50%; background: currentColor; }

.spot { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1rem; align-items: stretch; }
.spot .img {
  position: relative; min-height: 13rem; border-radius: 8px; overflow: hidden;
  background: var(--raise) center / cover no-repeat; display: flex; align-items: flex-end; padding: .9rem 1rem;
}
.spot .img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, var(--scrim)); }
.spot .img > * { position: relative; }
.spot .img .cond { font-size: clamp(2rem, 5vw, 3.25rem); }
.spot .img small { display: block; font-size: var(--s-1); color: var(--dim); font-stretch: 100%; text-transform: none; font-weight: 400; }
.spot .info { display: grid; gap: .8rem; align-content: start; }
.spot .role { font-size: var(--s-1); color: var(--dim); }
.mchance .nums { display: flex; justify-content: space-between; align-items: baseline; }
.mchance .nums .cond { font-size: var(--s3); }
.mchance .odds { height: .55rem; border-radius: 3px; overflow: hidden; background: var(--t); position: relative; margin-top: .35rem; }
.mchance .odds b { position: absolute; inset: 0 auto 0 0; background: var(--ct); }
.mrec { display: grid; gap: .45rem; font-size: var(--s-1); }
.mrec .r { display: grid; grid-template-columns: 1.35rem minmax(0, 1fr) auto; gap: .5rem; align-items: center; }
.mrec .trk { grid-column: 2 / -1; height: .45rem; background: var(--bg); border-radius: 3px; overflow: hidden; position: relative; }
.mrec .trk b { display: block; height: 100%; }
.mrec .trk i { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }
.mrec .a b { background: var(--ct); }
.mrec .b b { background: var(--t); }

/* series score tiles */
.stiles { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: .4rem; }
.stile { display: grid; gap: .2rem; padding: .55rem .5rem .5rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; justify-items: center; text-align: center; }
.stile b { font-size: var(--s2); }
.stile .v { font-size: var(--s-1); color: var(--dim); }
.stile .sb { width: 100%; height: 2.25rem; display: flex; align-items: flex-end; }
.stile .sb i { display: block; width: 100%; border-radius: 2px 2px 0 0; }
.stile.a .sb i { background: var(--ct); }
.stile.b .sb i { background: var(--t); }
.stile.top { border-color: var(--text); }
.stile.top .v { color: var(--text); font-weight: 700; }

/* right rail */
.rail { display: grid; gap: 1rem; position: sticky; top: 4.5rem; }
.rail .panel > h2 { font-size: var(--s0); }
/* build a matchup: full-width logo picker under the desk */
.builder { margin-top: 1.5rem; scroll-margin-top: 4.5rem; }
.builder .bctl { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.builder input[type="search"] { min-width: 0; width: 16rem; max-width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .45rem .65rem; font: inherit; font-size: var(--s-1); }
.builder .slot { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; color: var(--text); }
.builder .slot.a { box-shadow: inset 0 -2px 0 var(--ct); }
.builder .slot.b { box-shadow: inset 0 -2px 0 var(--t); }
.builder .slots .slot img { margin-left: .15rem; }
.rlist { display: grid; }
.rlist a { display: grid; grid-template-columns: 1.6rem 1.35rem minmax(0, 1fr) auto; gap: .5rem; align-items: center; padding: .4rem .2rem; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.rlist a:last-child { border-bottom: 0; }
.rlist a:hover { background: var(--raise); }
.rlist .rk { color: var(--dim); text-align: right; font-weight: 700; }
.rlist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.form5 { display: flex; gap: 2px; }
.form5 i { width: .45rem; height: .9rem; border-radius: 1px; background: var(--line); }
.form5 i.W { background: var(--win); }
.form5 i.L { background: var(--loss); }
.nextm { display: grid; gap: .35rem; padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.nextm:last-child { border-bottom: 0; }
.nextm .tt { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .4rem; align-items: center; }
.nextm .tt span { display: flex; align-items: center; gap: .35rem; min-width: 0; font-weight: 600; }
.nextm .tt span:last-child { justify-content: flex-end; }
.nextm .tt em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nextm .mini { height: .3rem; border-radius: 2px; background: var(--t); overflow: hidden; }
.nextm .mini b { display: block; height: 100%; background: var(--ct); }
.nextm:hover .tt em { text-decoration: underline; }

/* ---------- v4: track record ---------- */
.board { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.board > div { padding: 1.1rem 1.25rem; display: grid; align-content: start; gap: .2rem; }
.board > div + div { border-left: 1px solid var(--line); }
.board .num { font-size: clamp(3rem, 8vw, 5.5rem); line-height: .9; }
.board .num small { font-size: .4em; font-weight: 700; }
.board .lbl { color: var(--dim); font-size: var(--s-1); }
.board .first { background: linear-gradient(180deg, color-mix(in srgb, var(--win) 14%, var(--panel)), var(--panel)); }
.streak { display: flex; gap: 3px; margin-top: .45rem; flex-wrap: wrap; }
.streak i { width: .55rem; height: 1.15rem; border-radius: 2px; }
.streak i.h { background: var(--win); }
.streak i.m { background: var(--loss); }
.chart { width: 100%; height: auto; display: block; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: end; }
.filters label { display: grid; gap: .2rem; font-size: var(--s-1); color: var(--dim); }
.filters select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .4rem .55rem; font: inherit; font-size: var(--s-1); min-width: 10rem; }
.log td { vertical-align: middle; }
.log tr:hover td { background: var(--raise); }
.log .tl { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
.log .tl.won { font-weight: 700; }
.log .tl:not(.won) { color: var(--dim); }
.log .ev { color: var(--dim); display: block; font-size: .72rem; }
.hm { display: inline-grid; place-items: center; min-width: 2.6rem; padding: .1rem .4rem; border-radius: 3px; font-weight: 800; font-size: .72rem; color: var(--bg); }
.hm.h { background: var(--win); }
.hm.m { background: var(--loss); }
.lb { display: grid; gap: .35rem; }
.lb .row { display: grid; grid-template-columns: 1.35rem minmax(0, 1fr) 5.5rem 3.6rem; gap: .5rem; align-items: center; font-size: var(--s-1); }
.lb .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lb .row .rec { color: var(--dim); text-align: right; }
.lb .row .v { text-align: right; font-weight: 700; }
.lb .row .trk { grid-column: 2 / -1; position: relative; height: .5rem; background: var(--bg); border-radius: 3px; }
.lb .row .trk .ci { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--text) 16%, transparent); border-radius: 3px; }
.lb .row .trk .pt { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--text); border-radius: 1px; }
.lb.best .row .trk .pt { background: var(--win); }
.lb.worst .row .trk .pt { background: var(--loss); }
.callcards { display: grid; gap: .45rem; }
.callcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .15rem .75rem; padding: .55rem .7rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: var(--s-1); }
.callcard:hover { border-color: var(--dim); }
.callcard b { font-weight: 700; }
.callcard .dim { grid-column: 1 / -1; }
.callcard .big { font-size: var(--s1); text-align: right; }
.splitfig { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.splitfig div { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .75rem .85rem; display: grid; gap: .15rem; }
.splitfig b { font-size: var(--s3); }
/* track record: wide-screen layout */
.page.rwide { max-width: 136rem; padding-inline: max(16px, 3vw); }
body[data-w="wide"] .top-in { max-width: 84rem; }
body[data-w="rwide"] .top-in { max-width: 136rem; padding-inline: max(16px, 3vw); }
.rec-row3, .rec-quad { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.rec-splits { display: grid; gap: 1rem; align-content: start; min-width: 0; }
.log .xw { display: none; }
.log td.dt { white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (min-width: 761px) {
  .rec-row3, .rec-quad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rec-splits { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .rq-wide { grid-column: 1 / -1; }
}
@media (min-width: 1400px) {
  .rec-row3 { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, .9fr); }
  .rec-splits { grid-column: auto; grid-template-columns: minmax(0, 1fr); }
  .log .xw { display: table-cell; }
  .log .evd { display: none; }
  .log td { padding-block: .45rem; }
}
@media (min-width: 1800px) {
  .rec-quad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (max-width: 1080px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
}
@media (max-width: 760px) {
  .tape { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .spot { grid-template-columns: minmax(0, 1fr); }

<script>
const DATA = /*__DATA__*/null;
const IMG = /*__IMAGES__*/null;

/* ---------------- basics ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
// Largest remainder, same rule as predictor.display_percent: `places` decimals
// on the percentage, and the returned strings sum to exactly 100.00.
function displayPercent(probs, places = 2) {
  const scale = 10 ** places, target = 100 * scale;
  const weights = probs.map(p => (Number.isFinite(p) && p > 0) ? p : 0);
  const total = weights.reduce((a, b) => a + b, 0);
  let base;
  if (!(total > 0)) {
    base = probs.map(() => 0);
    if (base.length) base[0] = target;
  } else {
    const raw = weights.map(w => w / total * target);
    base = raw.map(x => Math.floor(x + 1e-9));
    const left = target - base.reduce((a, b) => a + b, 0);
    const order = raw.map((x, i) => ({ i, frac: x - Math.floor(x + 1e-9) }))
      .sort((a, b) => b.frac - a.frac || a.i - b.i);
    for (let k = 0; k < left; k++) base[order[k].i] += 1;
  }
  return base.map(b => (b / scale).toFixed(places));
}
const T = DATA.teams;
// Valve Regional Standings first (that is how teams are seeded), then Elo for unranked teams
const vrsRank = t => T[t]?.vrs?.rank ?? 1e9;
const NAMES = Object.keys(T).sort((a, b) => vrsRank(a) - vrsRank(b) || (T[b].elo ?? 0) - (T[a].elo ?? 0));
// teams with series in the data; only these have matchup predictions
const CMP_NAMES = NAMES.filter(n => T[n].series > 0);
const REGION = { europe: "Europe", americas: "Americas", asia: "Asia" };
const vrsShort = t => T[t]?.vrs ? `VRS #${T[t].vrs.rank}` : "Not in VRS";
const vrsLine = t => !T[t] ? "No results in the data" : T[t].series ? `${vrsShort(t)}, Elo ${T[t].elo}` : `${vrsShort(t)}, no series in the data`;
const pickTile = (n, attrs) => `<button type="button" class="pick" ${attrs}>${logo(n, "lg")}<span class="pn">${esc(n)}</span><span class="pv">${esc(vrsShort(n))}</span></button>`;
const BY_SLUG = Object.fromEntries(NAMES.map(n => [T[n].slug, n]));
const EV = DATA.events;
const EV_BY = Object.fromEntries(EV.map(e => [e.slug, e]));
const MATCH = {};
for (const e of EV) for (const m of e.matches) MATCH[m.id] = { ...m, ev: e.slug };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const dObj = s => new Date(s + "T12:00:00Z");
const fmtDay = s => { const d = dObj(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const fmtDate = s => { const d = dObj(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const span = (a, b) => a === b ? fmtDate(a) : `${fmtDay(a)} to ${fmtDate(b)}`;
const wday = s => WD[dObj(s).getUTCDay()];
const clock = w => w ? w.slice(11, 16) : null;
const TZN = { "+02:00": "CEST", "+01:00": "CET", "+00:00": "UTC", "+03:00": "MSK", "-04:00": "EDT", "-05:00": "CDT", "-07:00": "PDT", "-03:00": "BRT", "+08:00": "SGT", "+05:00": "ALMT", "+10:00": "AEST", "+04:00": "GST", "+09:00": "KST" };
const tz = w => !w ? "" : (TZN[w.slice(19)] || w.slice(19));
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || "th");

const LABELS = {
  base_strength: ["Team strength", "Elo rating gap"],
  form_30d: ["Last 30 days", "Results vs what the rating expects"],
  form_last5: ["Last 5 series", "Recent swing vs 30-day form"],
  head_to_head: ["Head-to-head", "Meetings in the past year"],
  map_veto: ["Map pool", "Edge on the simulated veto maps"],
  roster: ["Roster", "Stand-ins and missing IGL"],
  stakes: ["Stakes", "Elimination or qualification"],
};
const REL = { H: "Clear read", M: "Fairly clear read", L: "Close or uncertain read" };

/* ---------------- team colours (from each logo, see viewer/team_colors.py) ---------------- */
const DEFAULT_A = "#6E9DE2", DEFAULT_B = "#E7AB3F", PAGE_BG = [23, 29, 37];
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const dist = (x, y) => { const a = rgbOf(x), b = rgbOf(y); return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); };
const deep = h => { const c = rgbOf(h); return `rgb(${c.map((v, i) => Math.round(v * .32 + PAGE_BG[i] * .68)).join(",")})`; };
function pairColors(a, b) {
  const ca = (T[a]?.color || [])[0] || DEFAULT_A;
  const [pb, sb] = T[b]?.color || [];
  let cb = pb || DEFAULT_B;
  if (dist(ca, cb) < 110) {
    // too alike: the second team uses its other logo colour if that is bright
    // enough to read on the dark page, otherwise white, gold or blue
    const bright = c => { const [r, g, bb] = rgbOf(c); return (.2126 * r + .7152 * g + .0722 * bb) / 255 >= .45; };
    cb = sb && bright(sb) && dist(ca, sb) >= 110 ? sb : ["#F2F4F7", DEFAULT_B, DEFAULT_A].find(c => dist(ca, c) >= 110);
  }
  return [ca, cb];
}
let PAIR = null;                      // set by views that show two teams head to head
function applyPair(el) {
  const props = ["--ct", "--t", "--ct-deep", "--t-deep"];
  if (!PAIR) { props.forEach(p => el.style.removeProperty(p)); return; }
  const [ca, cb] = pairColors(PAIR[0], PAIR[1]);
  el.style.setProperty("--ct", ca); el.style.setProperty("--t", cb);
  el.style.setProperty("--ct-deep", deep(ca)); el.style.setProperty("--t-deep", deep(cb));
}
// A miss is only an "Upset" when the losing side was a clear favourite.
const UPSET_AT = 0.75;
const missLabel = (hit, favP) => hit ? "Model called it" : favP >= UPSET_AT ? "Upset" : "Incorrect";

function logo(team, cls = "") {
  const src = IMG.logos[team];
  if (src) return `<img class="logo ${cls}" src="${src}" alt="" loading="lazy">`;
  const ini = String(team || "?").replace(/^Team\s+/, "").split(/\s+/).map(w => w[0]).join("").slice(0, 3);
  return `<span class="logo logo-ph ${cls}" aria-hidden="true">${esc(team ? ini : "?")}</span>`;
}
const flag = cc => cc && IMG.flags[cc] ? `<img class="flag" src="${IMG.flags[cc]}" alt="${esc(cc.toUpperCase())}" title="${esc(cc.toUpperCase())}">` : `<span class="flag" aria-hidden="true"></span>`;
const mapBg = m => IMG.maps[m] ? `background-image:url('${IMG.maps[m]}')` : "";
const tlink = (team, cls = "") => T[team]
  ? `<a class="tlink ${cls}" href="#t-${T[team].slug}">${logo(team, "sm")}<span>${esc(team)}</span></a>`
  : `<span class="tlink ${cls}">${logo(team, "sm")}<span>${esc(team || "To be decided")}</span></span>`;
const statusChip = e => e.status === "live" ? `<span class="chip live">Live</span>` : e.status === "upcoming" ? `<span class="chip up">Upcoming</span>` : `<span class="chip done">Finished</span>`;

/* ---------------- predictions (compact form from the build) ---------------- */
function decode(c) {
  if (!c) return null;
  return {
    p: c.p, band: c.b, rel: c.r, score: { p_2_0: c.s[0], p_2_1: c.s[1], p_1_2: c.s[2], p_0_2: c.s[3] },
    score5: c.s5 ? { p_3_0: c.s5[0], p_3_1: c.s5[1], p_3_2: c.s5[2], p_2_3: c.s5[3], p_1_3: c.s5[4], p_0_3: c.s5[5] } : null,
    maps: c.vm, map_p: c.vp, warn: c.w,
    veto: c.v.map(x => x[0] === "D" ? { verb: "decider", map: x.slice(1) } : { side: x[0], verb: x[1] === "-" ? "bans" : "picks", map: x.slice(2) }),
    factors: DATA.factors.map((k, i) => ({ factor: k, pp: c.f[i] })),
  };
}
function matchupPred(e, a, b) {
  if (e && DATA.epairs[e.slug] && DATA.epairs[e.slug][`${a}|${b}`]) return decode(DATA.epairs[e.slug][`${a}|${b}`]);
  return decode(DATA.pairs[`${a}|${b}`]);
}

/* ---------------- event helpers ---------------- */
const isLive = m => !m.finished && m.maps.length > 0;
const winnerOf = m => m.finished ? (m.w1 > m.w2 ? m.t1 : m.t2) : null;
const groupKey = st => st.replace(/,?\s*round \d+$/i, "").replace(/\s*Round \d+.*$/, "").trim() || "Group stage";

function groupTables(e) {
  const groups = {};
  for (const m of e.matches) {
    if (m.kind !== "groups" || !m.t1 || !m.t2) continue;
    const g = groups[groupKey(m.stage)] = groups[groupKey(m.stage)] || {};
    for (const t of [m.t1, m.t2]) g[t] = g[t] || { team: t, w: 0, l: 0, mw: 0, ml: 0 };
    if (!m.finished) continue;
    const w = winnerOf(m), l = w === m.t1 ? m.t2 : m.t1;
    g[w].w++; g[l].l++;
    g[m.t1].mw += m.w1; g[m.t1].ml += m.w2; g[m.t2].mw += m.w2; g[m.t2].ml += m.w1;
  }
  return Object.entries(groups).map(([name, g]) => [name, Object.values(g).sort((a, b) => b.w - a.w || a.l - b.l || (b.mw - b.ml) - (a.mw - a.ml) || (T[b.team]?.elo || 0) - (T[a.team]?.elo || 0))]);
}

function lineupOf(team, e) {
  const part = e && e.participants.find(p => p.team === team);
  const current = new Set((T[team]?.roster || []).map(p => p.id.toLowerCase()));
  const person = (id, extra) => {
    const p = DATA.players[id.toLowerCase()] || { id, name: "", flag: "", igl: false };
    return { ...p, id: p.id || id, ...extra };
  };
  if (part && (part.players.length || part.coach.length)) {
    const fresh = e.status !== "finished";
    return {
      source: "event",
      players: part.players.map(id => person(id, { standin: fresh && current.size > 0 && !current.has(id.toLowerCase()) })),
      coach: part.coach.map(id => person(id, {})),
      subs: part.subs.map(id => person(id, {})),
    };
  }
  const r = T[team]?.roster || [];
  return { source: "current", players: r.filter(p => !p.coach).map(p => person(p.id, {})), coach: r.filter(p => p.coach).map(p => person(p.id, {})), subs: [] };
}

/* ---------------- shared match widgets ---------------- */
// The win bar animates only when what it shows changes (page, teams or series format);
// tab switches, map clicks and other re-renders of the same matchup set it in place.
let lastBarKey = null;
function animateBars(root) {
  const key = `${location.hash || "#home"}|${PAIR ? PAIR.join("|") : ""}|${desk.bo}`;
  const same = key === lastBarKey;
  lastBarKey = key;
  const els = [...root.querySelectorAll(".bar .fill, .bar .band")];
  const set = () => els.forEach(el => {
    if (el.classList.contains("fill")) el.style.width = el.dataset.w + "%";
    else { el.style.left = el.dataset.l + "%"; el.style.width = el.dataset.bw + "%"; }
  });
  if (!same) { requestAnimationFrame(() => requestAnimationFrame(set)); return; }
  els.forEach(el => { el.style.transition = "none"; });
  set();
  if (els.length) void els[0].offsetWidth;   // commit the final widths before transitions come back
  requestAnimationFrame(() => els.forEach(el => { el.style.transition = ""; }));
}

function playedMaps(m) {
  return `<div class="maps">${m.maps.map((x, i) => {
    const aWon = x.w === 1;
    const has = x.s1 != null;
    const half = (team, side) => team === 1 ? x.side1[side] : x.side2[side];
    const otv = (team) => (team === 1 ? x.s1 : x.s2) - half(team, "ct") - half(team, "t");
    return `<button type="button" class="mapcard reveal ${aWon ? "wa" : "wb"}" style="${mapBg(x.map)};animation-delay:${i * 90}ms" aria-expanded="false" aria-label="${esc(x.map)}: ${has ? `${esc(m.t1)} ${x.s1}, ${esc(m.t2)} ${x.s2}` : `won by ${esc(aWon ? m.t1 : m.t2)}`}. Show halves">
      <span class="role">Map ${i + 1}${x.ot ? `<span class="chip plain">Overtime</span>` : ""}</span>
      <span class="nm cond">${esc(x.map)}</span>
      <span class="sc cond"><span class="${aWon ? "ct" : "dim"}">${has ? x.s1 : aWon ? "W" : "L"}</span><span class="x">${has ? "tap for halves" : "no round data"}</span><span class="${aWon ? "dim" : "t"}">${has ? x.s2 : aWon ? "L" : "W"}</span></span>
      ${has ? `<span class="halves">
        <span class="hr hd"><span></span><span>CT</span><span>T</span><span>OT</span></span>
        <span class="hr"><span class="ct">${esc(m.t1)}</span><span>${half(1, "ct")}</span><span>${half(1, "t")}</span><span>${x.ot ? otv(1) : "-"}</span></span>
        <span class="hr"><span class="t">${esc(m.t2)}</span><span>${half(2, "ct")}</span><span>${half(2, "t")}</span><span>${x.ot ? otv(2) : "-"}</span></span>
        ${x.first1 ? `<span class="hd">${esc(m.t1)} started on ${x.first1 === "ct" ? "CT" : "T"}</span>` : ""}
        ${x.vod ? `<a class="btn" href="${esc(x.vod)}" target="_blank" rel="noopener">Watch VOD</a>` : ""}
      </span>` : ""}
    </button>`;
  }).join("")}</div>`;
}

function vetoView(pred, a, b) {
  const played = {};
  pred.maps.forEach((mp, i) => { played[mp] = pred.map_p[i]; });
  const card = (s, i) => {
    const ban = s.verb === "bans", pm = played[s.map];
    const who = s.side === "A" ? a : s.side === "B" ? b : null;
    const role = s.verb === "decider" ? "Decider" : `${esc(who)} ${s.verb}`;
    const pair = !ban && pm !== undefined ? displayPercent([pm, 1 - pm]) : null;
    const odds = pair ? `<span class="sc cond"><span class="ct">${pair[0]}%</span><span class="x">map win chance</span><span class="t">${pair[1]}%</span></span><span class="odds"><b style="width:${(pm * 100).toFixed(1)}%"></b></span>` : "";
    return `<div class="mapcard reveal ${ban ? "ban" : ""}" style="${mapBg(s.map)};animation-delay:${i * 90}ms">
      <span class="role"><b class="${s.side === "A" ? "ct" : s.side === "B" ? "t" : ""}">${i + 1}</b> ${role}</span>
      <span class="nm cond">${esc(s.map)}</span>${odds}
    </div>`;
  };
  const steps = pred.veto.map((s, i) => [s, i]);
  return `<div class="maps">${steps.filter(([s]) => s.verb !== "bans").map(([s, i]) => card(s, i)).join("")}</div>
    <div class="maps" style="grid-template-columns:repeat(auto-fit,minmax(8rem,1fr))">${steps.filter(([s]) => s.verb === "bans").map(([s, i]) => card(s, i)).join("")}</div>`;
}

function factors(pred, a, b) {
  const fs = pred.factors;
  const mx = Math.max(4, ...fs.map(f => Math.abs(f.pp)));
  const rows = fs.map(f => {
    const [nm, sub] = LABELS[f.factor] || [f.factor, ""];
    const pp = f.pp, off = Math.abs(pp) < 0.05;
    return `<div class="frow${off ? " off" : ""}">
      <div><b>${esc(nm)}</b><span class="sub">${esc(sub)}</span></div>
      <div class="dv" aria-hidden="true">${off ? "" : `<b class="${pp > 0 ? "pos" : "neg"}" style="width:${(Math.abs(pp) / mx * 50).toFixed(2)}%"></b>`}</div>
      <div class="v ${off ? "" : pp > 0 ? "ct" : "t"}">${off ? "none" : "+" + Math.abs(pp).toFixed(1)}</div>
    </div>`;
  }).join("");
  const warns = pred.warn.map(w => {
    let t = w;
    for (const [k, [n]] of Object.entries(LABELS)) t = t.split(`'${k}'`).join(n);
    return `<p class="warn">${esc(t)}</p>`;
  }).join("");
  return `<div class="panel"><h2>What moves the number <span class="dim">points added for <span class="ct">${esc(a)}</span> (left) or <span class="t">${esc(b)}</span> (right)</span></h2>${rows}${warns}</div>`;
}

function lineup(team, side, e) {
  const L = lineupOf(team, e);
  const note = L.source === "event" ? `lineup at ${esc(e.name)}` : "current roster";
  return `<div class="panel"><h2>${tlink(team)} <span class="dim">${note}</span></h2>
    ${L.players.length ? `<div class="lineup ${side}">${L.players.map(p => `<div class="player">
      ${flag(p.flag)}
      <div style="min-width:0"><span class="nick cond">${esc(p.id)}</span><span class="real">${esc(p.name || " ")}</span></div>
      <div class="badges">${p.igl ? `<span class="chip plain" title="In-game leader">IGL</span>` : ""}${p.standin ? `<span class="chip miss" title="Not on the team's listed active roster">Stand-in</span>` : ""}</div>
    </div>`).join("")}</div>` : `<p class="empty">Lineup not announced yet.</p>`}
    ${L.coach.map(c => `<div class="coach">${flag(c.flag)} Coach <b>${esc(c.id)}</b></div>`).join("")}
    ${L.subs.length ? `<div class="coach">Bench: ${L.subs.map(s => `<b>${esc(s.id)}</b>`).join(", ")}</div>` : ""}
  </div>`;
}

function poolCompare(a, b, pool) {
  const ma = T[a]?.maps || {}, mb = T[b]?.maps || {};
  const cell = (m, side) => {
    const v = (side === "l" ? ma : mb)[m], w = v ? v[0] * 100 : 0;
    return `<div class="half ${side}"><span>${v ? `${w.toFixed(2)}% (${v[1]})` : "no maps"}</span><span class="trk"><b style="width:${w.toFixed(1)}%"></b></span></div>`;
  };
  return `<div class="panel"><h2>Map pool <span class="dim">win rate over the last 90 days (maps played)</span></h2>
    <div class="fly">${pool.map(m => `<div class="fr">${cell(m, "l")}<span class="mn cond">${esc(m)}</span>${cell(m, "r")}</div>`).join("")}</div></div>`;
}

function formList(team) {
  const t = T[team];
  if (!t) return `<div class="panel"><h2>${esc(team)}</h2><p class="empty">No results in the data.</p></div>`;
  return `<div class="panel"><h2>${tlink(team)} <span class="dim">last 5</span></h2><div class="res">${t.results.slice(0, 5).map(r => `<div class="r">
      <span class="wl ${r.won ? "W" : "L"}">${r.won ? "W" : "L"}</span>
      <span style="min-width:0"><span class="opp">${logo(r.opp, "sm")}<span>${esc(r.opp)}</span></span><span class="ev">${esc(r.event)}</span></span>
      <span>${esc(r.score)}</span></div>`).join("") || `<p class="empty">No results in the data.</p>`}</div></div>`;
}

function h2hList(a, b) {
  const list = DATA.h2h[[a, b].sort().join("|")] || [];
  const aw = list.filter(x => x.winner === a).length, bw = list.length - aw;
  return `<div class="panel"><h2>Head-to-head <span class="dim">${list.length ? `<span class="ct">${esc(a)} ${aw}</span> to <span class="t">${bw} ${esc(b)}</span> in the last ${list.length}` : "no meetings in the data"}</span></h2>
    <div class="res">${list.map(x => {
      const sc = x.score ? (x.winner === x.a ? x.score : x.score.split("-").reverse().join("-")) : "";
      const loser = x.winner === x.a ? x.b : x.a;
      return `<div class="r"><span class="wl ${x.winner === a ? "W" : "L"}">${x.winner === a ? "W" : "L"}</span>
        <span style="min-width:0"><span class="opp">${logo(x.winner, "sm")}<span>${esc(x.winner)} beat ${esc(loser)}</span></span><span class="ev">${esc(x.event)}, ${fmtDate(x.date)}</span></span>
        <span>${esc(sc)}</span></div>`;
    }).join("")}</div></div>`;
}

/* ---------------- series math (mirrors predictor.series_scorelines / flat_map_prob) ---------------- */
function scorelines(pm) {
  const need = (pm.length + 1) / 2, a = Array(need).fill(0), b = Array(need).fill(0);
  let st = new Map([["0,0", 1]]);
  for (const p of pm) {
    const nx = new Map();
    for (const [k, v] of st) {
      const [i, j] = k.split(",").map(Number);
      for (const [ii, jj, q] of [[i + 1, j, p], [i, j + 1, 1 - p]]) {
        if (ii === need) a[jj] += v * q;
        else if (jj === need) b[ii] += v * q;
        else nx.set(ii + "," + jj, (nx.get(ii + "," + jj) || 0) + v * q);
      }
    }
    st = nx;
  }
  return a.concat(b.reverse());
}
function flatQ(p, n) {
  const need = (n + 1) / 2;
  let lo = 0, hi = 1;
  for (let k = 0; k < 100; k++) {
    const mid = (lo + hi) / 2;
    if (scorelines(Array(n).fill(mid)).slice(0, need).reduce((x, y) => x + y, 0) < p) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
// [{a, b, p}] final scores from team A's view, A's wins first
function scoreSet(pred, bo) {
  let s;
  if (bo === 3) s = [pred.score.p_2_0, pred.score.p_2_1, pred.score.p_1_2, pred.score.p_0_2];
  else if (bo === 5 && pred.score5) s = ["p_3_0", "p_3_1", "p_3_2", "p_2_3", "p_1_3", "p_0_3"].map(k => pred.score5[k]);
  else s = scorelines(Array(bo).fill(flatQ(pred.p, bo)));
  const need = (bo + 1) / 2;
  return s.map((p, i) => i < need ? { a: need, b: i, p } : { a: 2 * need - 1 - i, b: need, p });
}
const winOf = x => x.a > x.b;
const scoreFrom = (x, forA) => forA ? `${x.a}-${x.b}` : `${x.b}-${x.a}`;

/* ---------------- the matchup desk ---------------- */
const desk = { a: null, b: null, feat: null, bo: 3, tab: "overview", spot: null, key: "", next: "a", q: "" };
const DTABS = [["overview", "Overview"], ["lineups", "Lineups"], ["h2h", "Head-to-head"], ["pools", "Map pools"]];
const bigPct = v => { const [i, d] = String(v).split("."); return `${i}<small>.${d}%</small>`; };

function court(pred, a, b, o, bo) {
  const shown = pred ? displayPercent([pred.p, 1 - pred.p]) : null;
  const side = (t, cls, i) => `<div class="cside ${cls}">
      ${T[t] ? `<a href="#t-${T[t].slug}" aria-label="${esc(t)} team page">${logo(t, "xl")}</a>` : logo(t, "xl")}
      ${T[t] ? `<a class="cname cond" href="#t-${T[t].slug}">${esc(t)}</a>` : `<span class="cname cond">${esc(t)}</span>`}
      <span class="small cmeta">${esc(vrsLine(t))}</span>
      ${shown ? `<span class="cbig cond" aria-label="${esc(t)} ${shown[i]}% to win">${bigPct(shown[i])}</span>` : ""}
    </div>`;
  const fmt = `<div class="seg" role="group" aria-label="Series format">${[1, 3, 5].map(n =>
    `<button type="button" data-bo="${n}" aria-pressed="${n === bo}" ${o.fixedBo ? "disabled" : ""}>Bo${n}</button>`).join("")}</div>`;
  const bar = pred ? `<div class="cbar">
      <div class="bar" role="img" aria-label="${esc(`${a} ${shown[0]}%, ${b} ${shown[1]}%; likely range for ${a} ${pct(pred.band[0], 2)} to ${pct(pred.band[1], 2)}`)}">
        <div class="fill" data-w="${(pred.p * 100).toFixed(2)}"></div>
        <div class="band" data-l="${(pred.band[0] * 100).toFixed(2)}" data-bw="${((pred.band[1] - pred.band[0]) * 100).toFixed(2)}" style="left:50%;width:0"></div>
        <div class="mid"></div>
      </div>
      <div class="legend"><span>${esc(o.label || "Model's pre-match call")}. Hatched: likely range ${pct(pred.band[0], 2)} to ${pct(pred.band[1], 2)}</span>
        <span class="chip ${pred.rel === "H" ? "hit" : pred.rel === "L" ? "miss" : "plain"}">${REL[pred.rel]}</span></div>
    </div>` : `<div class="cbar"><p class="empty">No model call: one of these teams has no results in the data.</p></div>`;
  return `<section class="court">${side(a, "a", 0)}<div class="ccentre">${o.centre || `<span class="vsword cond">vs</span>`}${fmt}${o.verdict || ""}</div>${side(b, "b", 1)}${bar}</section>`;
}

function tape(pred, a, b) {
  const steps = pred.veto;
  if (!desk.spot || !steps.some(s => s.map === desk.spot)) desk.spot = pred.maps[0];
  return `<div class="tape" style="--n:${steps.length}" role="group" aria-label="Veto, in order">${steps.map((s, i) => {
    const who = s.side === "A" ? a : s.side === "B" ? b : null;
    const cls = s.verb === "bans" ? "ban" : s.verb === "picks" ? "pick" : "dec";
    const verb = s.verb === "decider" ? "Decider" : s.verb === "bans" ? "Ban" : "Pick";
    const role = s.verb === "decider" ? "Decider" : `${who} ${verb.toLowerCase()}`;
    const stat = (t, c) => {
      const v = (T[t]?.maps || {})[s.map];
      const txt = v && v[1] ? `${(v[0] * 100).toFixed(2)}% (${v[1]})` : "-";
      const tip = v && v[1] ? `${(v[0] * 100).toFixed(2)}% won of ${v[1]} map${v[1] === 1 ? "" : "s"}` : "no maps";
      return `<span class="${c}" title="${esc(`${t} on ${s.map}, last 90 days: ${tip}`)}">${txt}</span>`;
    };
    return `<button type="button" class="tm ${cls} ${s.side === "A" ? "sa" : s.side === "B" ? "sb" : ""}" data-spot="${esc(s.map)}" aria-pressed="${s.map === desk.spot}" style="${mapBg(s.map)}" title="${esc(role)}">
      <span class="tn">${i + 1}</span><span><span class="tnm cond">${esc(s.map)}</span><span class="trole" style="display:block"><i>${verb}</i>${s.verb === "decider" ? "" : esc(who)}</span>
      <span class="tst">${stat(a, "ct")}${stat(b, "t")}</span></span></button>`;
  }).join("")}</div>`;
}

function spotlight(pred, a, b) {
  const m = desk.spot, i = pred.veto.findIndex(s => s.map === m), s = pred.veto[i];
  const who = s.side === "A" ? a : s.side === "B" ? b : null;
  const k = pred.maps.indexOf(m), pm = k >= 0 ? pred.map_p[k] : null;
  const role = s.verb === "decider" ? `The map left after the bans: played third if it goes the distance.`
    : s.verb === "picks" ? `${esc(who)} pick, played as map ${k + 1}.`
    : `${esc(who)} ban at step ${i + 1}. Not played in this veto.`;
  let chance = "";
  if (pm !== null) {
    const pair = displayPercent([pm, 1 - pm]);
    const fav = pm >= .5 ? a : b;
    chance = `<div class="mchance"><div class="small dim">Map win chance, ${esc(fav)} favoured</div>
      <div class="nums"><span class="cond ct">${pair[0]}%</span><span class="cond t">${pair[1]}%</span></div>
      <div class="odds" role="img" aria-label="${esc(`${a} ${pair[0]}%, ${b} ${pair[1]}% on ${m}`)}"><b style="width:${(pm * 100).toFixed(2)}%"></b></div></div>`;
  }
  const rec = (t, cls) => {
    const v = (T[t]?.maps || {})[m];
    const line = v && v[1] ? `${(v[0] * 100).toFixed(2)}% of ${v[1]} map${v[1] === 1 ? "" : "s"}` : "not played in 90 days";
    return `<div class="r ${cls}">${logo(t, "sm")}<span>${esc(t)}</span><span>${line}</span>
      <span class="trk">${v && v[1] ? `<b style="width:${(v[0] * 100).toFixed(1)}%"></b>` : ""}<i></i></span></div>`;
  };
  return `<div class="spot">
    <div class="img" style="${mapBg(m)}"><span class="cond">${esc(m)}<small>${esc(DATA.map_info[m]?.location || "")}</small></span></div>
    <div class="info"><p class="role">${role}</p>${chance}
      <div class="mrec"><span class="small dim">Won on ${esc(m)} in the last 90 days</span>${rec(a, "a")}${rec(b, "b")}</div></div>
  </div>`;
}

function scoreTiles(pred, a, b, bo) {
  const set = scoreSet(pred, bo);
  const shown = displayPercent(set.map(x => x.p));
  const top = set.reduce((m, x, i) => x.p > set[m].p ? i : m, 0);
  const mx = Math.max(...set.map(x => x.p));
  const t = set[top], topTeam = winOf(t) ? a : b;
  const note = bo === 1 ? "One map: the series chance is the map chance."
    : bo === 5 ? "Best-of-five: the same win chance on every map, set so the series total matches the win probability."
    : "Map win chances from the simulated veto.";
  return `<div class="panel"><h2>Series score <span class="dim">most likely ${esc(topTeam)} ${scoreFrom(t, winOf(t))}</span></h2>
    <div class="stiles" style="--n:${set.length}">${set.map((x, i) => {
      const sd = winOf(x) ? "a" : "b";
      return `<div class="stile ${sd}${i === top ? " top" : ""}" title="${esc(`${winOf(x) ? a : b} ${scoreFrom(x, winOf(x))}: ${shown[i]}%`)}">
        ${logo(winOf(x) ? a : b, "sm")}<b class="cond">${scoreFrom(x, winOf(x))}</b><span class="v">${shown[i]}%</span>
        <span class="sb"><i style="height:${(x.p / mx * 100).toFixed(1)}%"></i></span></div>`;
    }).join("")}</div><p class="small dim">${note}</p></div>`;
}

function matchDesk(pred, a, b, o = {}) {
  const key = `${a}|${b}`;
  if (desk.key !== key) { desk.key = key; desk.spot = null; desk.tab = "overview"; }
  const bo = o.fixedBo && [1, 3, 5].includes(o.fixedBo) ? o.fixedBo : desk.bo;
  const pool = (o.ev && o.ev.pool.length ? o.ev.pool : null) || ["Ancient", "Anubis", "Cache", "Dust2", "Inferno", "Mirage", "Nuke"];
  let body;
  if (desk.tab === "lineups") body = `<div class="grid2">${lineup(a, "a", o.ev)}${lineup(b, "b", o.ev)}</div>`;
  else if (desk.tab === "h2h") body = `${h2hList(a, b)}<div class="grid2">${formList(a)}${formList(b)}</div>`;
  else if (desk.tab === "pools") body = poolCompare(a, b, pool);
  else body = `
    ${o.played ? `<section class="panel"><h2>Maps played <span class="dim">tap a map for CT and T halves</span></h2>${o.played}</section>` : ""}
    ${pred ? `<section class="panel"><h2>${o.played ? "The model's simulated veto" : "Simulated veto"} <span class="dim">choose a map to see who it suits</span></h2>${tape(pred, a, b)}${spotlight(pred, a, b)}</section>
    <div class="grid2">${scoreTiles(pred, a, b, bo)}${factors(pred, a, b)}</div>` : ""}`;
  return `${o.ctx || ""}${court(pred, a, b, o, bo)}
    <div class="dtabs" role="tablist" aria-label="Matchup sections">${DTABS.map(([k, l]) => `<button type="button" role="tab" data-dtab="${k}" aria-selected="${desk.tab === k}">${l}</button>`).join("")}</div>
    <div class="desk-main" role="tabpanel">${body}</div>`;
}

/* ---------------- home: the desk plus the rail ---------------- */
function featuredMatch() {
  const all = Object.values(MATCH).filter(m => m.t1 && m.t2 && m.pred && T[m.t1] && T[m.t2]);
  const live = all.filter(isLive);
  if (live.length) return live[0];
  const key = m => (m.day || "") + (m.when || "");
  const up = all.filter(m => !m.finished && m.day && m.day >= DATA.as_of).sort((x, y) => key(x).localeCompare(key(y)));
  return up[0] || null;
}
function ctxFor(m, e) {
  const when = m.day ? `${wday(m.day)} ${fmtDate(m.day)}${m.when ? `, ${clock(m.when)} ${tz(m.when)}` : ""}` : "Date to be announced";
  return `<div class="ctx"><a class="ev" href="#e-${e.slug}">${IMG.events[e.slug] ? `<img src="${IMG.events[e.slug]}" alt="">` : ""}<span style="display:grid"><b>${esc(e.name)}</b><span>${esc(m.stage)}, best of ${m.bo}</span></span></a>
    <span class="small dim">${when}</span></div>`;
}
function centreFor(m, a, b) {
  if (m.finished || isLive(m)) return `<div class="score cond"><span class="${m.w1 >= m.w2 ? "ct" : "lost"}">${m.w1}</span><span class="dim">:</span><span class="${m.w2 >= m.w1 ? "t" : "lost"}">${m.w2}</span></div>
    ${isLive(m) ? `<span class="chip live">Live in this snapshot</span>` : `<span class="small dim">Final</span>`}`;
  return `<span class="vsword cond">vs</span><span class="chip plain">${countdown(m.when) || "Time to be announced"}</span>`;
}
function verdictFor(m, pred) {
  if (!m.finished || !pred) return "";
  const fav = pred.p >= .5 ? m.t1 : m.t2, w = winnerOf(m);
  const pair = displayPercent([pred.p, 1 - pred.p]), fp = pred.p >= .5 ? pair[0] : pair[1];
  return `<span class="chip ${fav === w ? "hit" : "miss"}">${missLabel(fav === w, Math.max(pred.p, 1 - pred.p))}: ${fav === w ? "" : "model had "}${esc(fav)} at ${fp}%</span>`;
}

const builderTiles = () => {
  const q = desk.q.trim().toLowerCase();
  const list = CMP_NAMES.filter(n => !q || n.toLowerCase().includes(q));
  return list.map(n => pickTile(n, `data-dpick="${esc(n)}" ${n === desk.a ? 'data-slot="a"' : n === desk.b ? 'data-slot="b"' : ""} aria-pressed="${n === desk.a || n === desk.b}"`)).join("")
    || `<p class="empty">No team matches "${esc(desk.q)}".</p>`;
};
function builder(showingFeat) {
  const nx = desk.next === "b" ? `<span class="t">Team 2</span>` : `<span class="ct">Team 1</span>`;
  return `<section class="panel builder" id="build" aria-label="Build a matchup">
    <h2>Build a matchup <span class="dim">Next click sets ${nx}</span></h2>
    <div class="bctl"><input type="search" id="dSearch" placeholder="Filter teams" aria-label="Filter teams" value="${esc(desk.q)}" autocomplete="off">
      <button type="button" class="btn" id="exSwap">Swap teams</button>
      ${featuredMatch() && !showingFeat ? `<button type="button" class="btn" data-feat="1">Back to the next match</button>` : ""}</div>
    <div class="picker" id="dGrid">${builderTiles()}</div>
    <div class="slots"><span>Team 1 <span class="slot a">${logo(desk.a, "sm")}${esc(desk.a)}</span></span><span>Team 2 <span class="slot b">${logo(desk.b, "sm")}${esc(desk.b)}</span></span><span>Team 1 bans first in the simulated veto.</span></div>
  </section>`;
}

function rail() {
  const f = featuredMatch();
  const showingFeat = f && desk.feat === f.id && desk.a === f.t1 && desk.b === f.t2;
  const top = NAMES.filter(n => T[n].vrs).slice(0, 8);
  const keyOf = m => (m.day || "") + (m.when || "");
  const next = Object.values(MATCH).filter(m => m.t1 && m.t2 && !m.finished && m.day && m.day >= DATA.as_of)
    .sort((x, y) => keyOf(x).localeCompare(keyOf(y))).slice(0, 5);
  const calls = callLog(), hits = calls.filter(c => c.hit).length;
  return `
  <section class="panel"><h2>Build a matchup</h2>
    <p class="small dim">Pick any two teams by logo and see the model's call.</p>
    <div class="links"><button type="button" class="btn" data-tobuild="1">Build a matchup</button>${f && !showingFeat ? `<button type="button" class="btn" data-feat="1">Back to the next match</button>` : ""}</div>
  </section>
  <section class="panel"><h2>Top of the standings <span class="dim">VRS, last 5</span></h2>
    <div class="rlist">${top.map(n => `<a href="#t-${T[n].slug}"><span class="rk">#${T[n].vrs.rank}</span>${logo(n, "sm")}<span class="nm">${esc(n)}</span>
      <span class="form5" aria-label="last five: ${T[n].results.slice(0, 5).map(r => r.won ? "won" : "lost").join(", ") || "no results"}">${T[n].results.slice(0, 5).reverse().map(r => `<i class="${r.won ? "W" : "L"}"></i>`).join("")}</span></a>`).join("")}</div>
  </section>
  <section class="panel"><h2>Coming up</h2>
    ${next.length ? next.map(m => { const p = m.pred ? decode(m.pred).p : null; return `<a class="nextm" href="#m-${m.id}">
      <span class="small dim">${esc(EV_BY[m.ev].name)}, ${m.day ? fmtDay(m.day) : ""}${m.when ? ` ${clock(m.when)} ${tz(m.when)}` : ""}</span>
      <span class="tt"><span>${logo(m.t1, "sm")}<em>${esc(m.t1)}</em></span><span class="dim">vs</span><span><em>${esc(m.t2)}</em>${logo(m.t2, "sm")}</span></span>
      ${p != null ? `<span class="mini" title="Model: ${esc(m.t1)} ${displayPercent([p, 1 - p])[0]}%"><b style="width:${(p * 100).toFixed(1)}%"></b></span>` : ""}</a>`; }).join("")
      : `<p class="empty">No matches scheduled in this snapshot. <a class="btn" href="#events">See tournaments</a></p>`}
  </section>
  ${calls.length ? `<section class="panel"><h2>Track record</h2><p class="small dim">${hits} of ${calls.length} finished 2026 matches called right before they were played.</p><a class="btn" href="#record">See every call</a></section>` : ""}`;
}

function viewHome() {
  const f = featuredMatch();
  if (!desk.a || !desk.b) {
    if (f) { desk.a = f.t1; desk.b = f.t2; desk.feat = f.id; }
    else { desk.a = CMP_NAMES[0]; desk.b = CMP_NAMES[1]; desk.feat = null; }
  }
  const m = desk.feat && MATCH[desk.feat];
  const isFeat = m && m.t1 === desk.a && m.t2 === desk.b;
  let pred, o;
  if (isFeat) {
    pred = decode(m.pred);
    const e = EV_BY[m.ev];
    o = { ev: e, fixedBo: m.bo, ctx: ctxFor(m, e), centre: centreFor(m), verdict: verdictFor(m, pred), label: "Model's call for this match" };
  } else {
    pred = decode(DATA.pairs[`${desk.a}|${desk.b}`]);
    o = { label: "Model's call today" };
  }
  PAIR = [desk.a, desk.b];
  return `<div class="desk"><div class="desk-main">${matchDesk(pred, desk.a, desk.b, o)}</div><aside class="rail" aria-label="Explore">${rail()}</aside></div>${builder(isFeat)}`;
}

/* ---------------- tournaments index ---------------- */
function evCard(e) {

  return `<a class="evcard" href="#e-${e.slug}">

    <span class="ename">${esc(e.name)}</span>
    <span class="emeta"><span>${span(e.start, e.end)}</span>${e.city ? `<span>${esc(e.city)}${e.country ? ", " + esc(e.country) : ""}</span>` : e.type ? `<span>${esc(e.type)}</span>` : ""}</span>
    <span class="efoot">${e.champion ? `<span class="champ">${logo(e.champion, "sm")}${esc(e.champion)} won</span>` : `<span class="dim">${n ? `${n} teams` : "Teams to be announced"}</span>`}

}
function viewEvents() {

/* ---------------- one tournament ---------------- */
const dayPick = {};
const evPick = {};      // slug -> {a, b, next}

function matchRow(m) {
  const a = m.t1, b = m.t2, live = isLive(m), w = winnerOf(m);
  const pred = decode(m.pred);
  let mid, tag = "";
  if (m.finished || live) mid = `<div class="mid cond"><span class="${m.w1 > m.w2 ? "ct" : ""}">${m.w1}</span> : <span class="${m.w2 > m.w1 ? "t" : ""}">${m.w2}</span></div>`;
  else if (pred) {
    const [ap, bp] = displayPercent([pred.p, 1 - pred.p]);
    mid = `<div class="mid pct" title="Model's pre-match call">${ap}% / ${bp}%</div>`;
  }
  else mid = `<div class="mid pct">vs</div>`;
  if (live) tag = `<span class="chip live">Live</span>`;
  else if (m.finished && pred) {
    const fav = pred.p >= .5 ? a : b;
    const pair = displayPercent([pred.p, 1 - pred.p]);
    const favPct = pred.p >= .5 ? pair[0] : pair[1];
    tag = `<span class="chip ${fav === w ? "hit" : "miss"}" title="Model favored ${esc(fav)} at ${favPct}%">${missLabel(fav === w, Math.max(pred.p, 1 - pred.p))}</span>`;
  }
  const team = (t, side) => `<div class="tm ${side}${w && t !== w ? " lost" : ""}">${logo(t)}<span>${esc(t || "To be decided")}</span></div>`;
  const inner = `<div class="time"><b>${clock(m.when) || (m.day ? fmtDay(m.day) : "TBA")}</b><span>${m.when ? tz(m.when) : ""}</span></div>
    ${team(a, "")}${mid}${team(b, "r")}
    <div class="tag">${tag}<span>${esc(m.stage)}${m.bo !== 3 ? `, Bo${m.bo}` : ""}</span></div>`;
  return a && b ? `<a class="mrow" href="#m-${m.id}">${inner}</a>` : `<div class="mrow">${inner}</div>`;
}

function evHero(e) {
