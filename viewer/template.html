}

function rail() {
  const top = NAMES.filter(n => T[n].vrs).slice(0, 8);
  const keyOf = m => (m.day || "") + (m.when || "");
  const next = Object.values(MATCH).filter(m => m.t1 && m.t2 && !m.finished && m.day && m.day >= daysBefore(DATA.as_of, 1) && topTier(m))
    .sort((x, y) => keyOf(x).localeCompare(keyOf(y))).slice(0, 5);
  return `
  <section class="panel"><h2>Top of the standings <span class="dim">VRS, last 5</span></h2>
    <div class="rlist">${top.map(n => `<a href="#t-${T[n].slug}"><span class="rk">#${T[n].vrs.rank}</span>${logo(n, "sm")}<span class="nm">${esc(n)}</span>
      <span class="form5" aria-label="last five: ${T[n].results.slice(0, 5).map(r => r.won ? "won" : "lost").join(", ") || "no results"}">${T[n].results.slice(0, 5).reverse().map(r => `<i class="${r.won ? "W" : "L"}"></i>`).join("")}</span></a>`).join("")}</div>
  </section>
  <section class="panel"><h2>Coming up</h2>
    ${next.length ? next.map(m => { const p = m.pred ? decode(m.pred).p : null; return `<a class="nextm" href="#m-${m.id}">
      <span class="small dim">${esc(EV_BY[m.ev].name)}, ${m.day ? fmtDay(m.day) : ""}${m.when ? ` ${clock(m.when)} ${tz(m.when)}` : ""}</span>
      <span class="tt"><span>${logo(m.t1, "sm")}<em>${esc(m.t1)}</em></span><span class="dim">vs</span><span><em>${esc(m.t2)}</em>${logo(m.t2, "sm")}</span></span>
      ${p != null ? `<span class="mini" title="Model: ${esc(m.t1)} ${displayPercent([p, 1 - p])[0]}%"><b style="width:${(p * 100).toFixed(1)}%"></b></span>` : ""}</a>`; }).join("")
      : `<p class="empty">No matches scheduled in this snapshot. <a class="btn" href="#events">See tournaments</a></p>`}
  </section>`;
}

function viewHome() {
  const f = featuredMatch();
  if (!desk.a || !desk.b) {
    // open on the next match in its real format; the format buttons stay free to change
    if (f) { desk.a = f.t1; desk.b = f.t2; desk.feat = f.id; desk.bo = [1, 3, 5].includes(f.bo) ? f.bo : 3; }
    else { desk.a = CMP_NAMES[0]; desk.b = CMP_NAMES[1]; desk.feat = null; }
  }
  const m = desk.feat && MATCH[desk.feat];
  const isFeat = m && m.t1 === desk.a && m.t2 === desk.b;
  let pred, o;
  if (isFeat) {
    pred = decode(m.pred);
    const e = EV_BY[m.ev];
    // no fixedBo on the home page: Bo1 / Bo3 / Bo5 are always offered (match pages keep the real format)
    o = { ev: e, ctx: ctxFor(m, e), centre: centreFor(m), status: statusFor(m), verdict: verdictFor(m, pred), change: true, back: false };
  } else {
    pred = decode(DATA.pairs[`${desk.a}|${desk.b}`]);
    o = { change: true, back: f ? true : undefined };
  }
  PAIR = [desk.a, desk.b];
  return `<div class="desk"><div class="desk-main">${matchDesk(pred, desk.a, desk.b, o)}</div><aside class="rail" aria-label="Explore">${rail()}</aside></div>${builder()}`;
}

/* ---------------- tournaments index ---------------- */
function evCard(e) {
  const n = new Set([...e.participants.map(p => p.team), ...e.matches.flatMap(m => [m.t1, m.t2]).filter(Boolean)]).size;
  return `<a class="evcard" href="#e-${e.slug}">
    ${IMG.events[e.slug] ? `<img class="evl" src="${IMG.events[e.slug]}" alt="" loading="lazy">` : `<span class="evl"></span>`}
    <span class="ename">${esc(e.name)}</span>
    <span class="emeta"><span>${span(e.start, e.end)}</span>${e.city ? `<span>${esc(e.city)}${e.country ? ", " + esc(e.country) : ""}</span>` : e.type ? `<span>${esc(e.type)}</span>` : ""}</span>
    <span class="efoot">${e.champion ? `<span class="champ">${logo(e.champion, "sm")}${esc(e.champion)} won</span>` : `<span class="dim">${n ? `${n} teams` : "Teams to be announced"}</span>`}
      <span style="display:flex;gap:.5rem;align-items:center"><span class="dim">${e.prize ? "$" + esc(e.prize) : ""}</span>${statusChip(e)}</span></span>
  </a>`;
}
/* v5: the season as a circuit */
/* v6: tier filter (Tournaments page only). e.tl is Liquipedia's own tier
   (liquipediatier: S / A / B); default S and A on, B off. The choice is kept in
   localStorage when the browser allows it; events without a tier always show. */
const TIERS = [["S", "S-tier"], ["A", "A-tier"], ["B", "B-tier"]];
const TIER_DEFAULT = { S: true, A: true, B: false };
const tierOn = (() => {
  const on = { ...TIER_DEFAULT };
  try {
    const v = JSON.parse(localStorage.getItem("faceoff.tiers") || "null");
    if (v && typeof v === "object") for (const [k] of TIERS) if (typeof v[k] === "boolean") on[k] = v[k];
  } catch (_) { /* no storage: defaults */ }
  return on;
})();
function saveTiers() { try { localStorage.setItem("faceoff.tiers", JSON.stringify(tierOn)); } catch (_) { /* not kept */ } }
const tierShown = e => !(e.tl in tierOn) || tierOn[e.tl];
const tierTag = e => e.tl ? `<i class="tier t${e.tl}" title="${e.tl}-tier on Liquipedia">${e.tl}</i>` : "";
function tierBar() {
  const n = k => EV.filter(e => e.tl === k).length;
  return `<fieldset class="tierbar"><legend>Show tiers</legend>${TIERS.map(([k, l]) => `<label class="tierbox t${k}">
    <input type="checkbox" data-tier="${k}"${tierOn[k] ? " checked" : ""}><span>${l}</span><b>${n(k)}</b></label>`).join("")}
    <span class="dim">Liquipedia's tier for each event</span></fieldset>`;
}
const usd = n =>"$" + Math.round(n).toLocaleString("en-US");
const prizeNum = e => +String(e.prize || "").replace(/[^\d.]/g, "") || 0;
const prizeTxt = e => prizeNum(e) ? usd(prizeNum(e)) : "";
const whereOf = e => e.city ? `${e.city}${e.country ? ", " + e.country : ""}` : (e.type || "");
const shortEv = n => n.replace(/^Intel Extreme Masters/, "IEM").replace(/^ESL Pro League Season/, "Pro League S")
  .replace(/^Esports World Cup/, "EWC").replace(/^StarLadder StarSeries/, "StarSeries")
  .replace(/^Thunderpick World Championship/, "Thunderpick WC").replace(/\s+20\d\d$/, "");
const tcVars = t => { const c = (T[t]?.color || [])[0]; return c ? `--tc:${c};--tcd:color-mix(in srgb, ${c} 11%, var(--panel));` : ""; };
const evImg = (e, cls = "", title = false) => IMG.events[e.slug]
  ? `<img class="${cls}" src="${IMG.events[e.slug]}" loading="lazy" alt="${title ? esc(e.name) : ""}"${title ? ` title="${esc(e.name)}"` : ""}>`
  : `<span class="${cls} evl-ph"${title ? ` title="${esc(e.name)}"` : ` aria-hidden="true"`}>${esc(shortEv(e.name).split(/\s+/).map(w => w[0]).join("").slice(0, 3))}</span>`;
const dayDiff = (a, b) => Math.round((dObj(b) - dObj(a)) / 864e5);
const tchip = (t, extra = "") => T[t] ? `<a href="#t-${T[t].slug}">${logo(t, "sm")}${esc(t)}${extra}</a>` : `<a>${logo(t, "sm")}${esc(t)}${extra}</a>`;
const dayRange = e => {
  const a = dObj(e.start), b = dObj(e.end);
  return a.getUTCMonth() === b.getUTCMonth() ? `${a.getUTCDate()}–${b.getUTCDate()}` : `${a.getUTCDate()}–${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`;
};
const startsIn = e => { const d = dayDiff(DATA.as_of, e.start); return d <= 0 ? "starting" : d === 1 ? "starts tomorrow" : `in ${d} days`; };
function finalOf(e) {
  if (e.status !== "finished" || !e.champion) return null;
  const done = e.matches.filter(m => m.finished && m.t1 && m.t2);
  const gf = done.filter(m => m.stage === "Grand final");
  const m = gf.length ? gf[gf.length - 1] : [...done].sort((x, y) => (x.day || "").localeCompare(y.day || "") || (x.when || "").localeCompare(y.when || "")).pop();
  if (!m) return null;
  const one = winnerOf(m) === m.t1;
  return { m, w: winnerOf(m), l: one ? m.t2 : m.t1, sw: one ? m.w1 : m.w2, sl: one ? m.w2 : m.w1 };
}
// A team's own finish at an event: placement range from the build (results laid onto the prize slots)
function finishOf(e, team) {
  if (e.status === "upcoming") return { text: "Upcoming", cls: "word" };
  const p = (e.placements || {})[team];
  if (!p) return e.status === "live" ? { text: "Still playing", cls: "word on" } : { text: "No series played", cls: "word" };
  if (p.from == null) return { text: p.label, cls: p.label === "Still playing" ? "word on" : "word" };
  const slot = e.prizes.find(s => s.from === p.from && s.to === p.to);
  return { text: p.from === p.to ? ordinal(p.from) : `${ordinal(p.from)}–${ordinal(p.to)}`, from: p.from, to: p.to,
    cls: p.from <= 3 ? "p" + p.from : p.from >= 9 ? "deep" : "", usd: slot && slot.usd || 0 };
}
// Team profile: the team's own finish at every event it entered (never the event winner)
function teamFinishes(team, evs) {
  const rows = evs.map(e => ({ e, f: finishOf(e, team) }));
  const wins = rows.filter(r => r.f.from === 1).length;
  const top4 = rows.filter(r => r.f.from && r.f.to <= 4).length;
  const money = rows.reduce((a, r) => a + (r.f.usd || 0), 0);
  const note = [wins ? `${wins} title${wins > 1 ? "s" : ""}` : "", top4 ? `${top4} top-four finish${top4 > 1 ? "es" : ""}` : "",
    money ? `${usd(money)} in prize money` : ""].filter(Boolean).join(", ");
  return `<section class="panel"><h2>Tournaments in 2026 <span class="dim">${note || "the team's own finish at each event"}</span></h2><div class="tfin">
    ${rows.map(({ e, f }) => `<a href="#e-${e.slug}"><span class="dt">${esc(span(e.start, e.end))}</span>${evImg(e, "el")}
      <span class="en"><b>${esc(e.name)}</b><span>${esc(whereOf(e))}${prizeTxt(e) ? `, ${prizeTxt(e)} pool` : ""}</span></span>
      <span class="plc ${f.cls}">${f.text}</span><span class="won">${f.usd ? `<b>${usd(f.usd)}</b>` : ""}</span></a>`).join("")}
  </div></section>`;
}

function seasonStrip(EV) {
  const yr = +DATA.as_of.slice(0, 4);
  const first = `${yr}-01-01`;
  const last = dObj(EV.reduce((a, e) => e.end > a ? e.end : a, `${yr}-12-31`));
  const endD = new Date(Date.UTC(last.getUTCFullYear(), last.getUTCMonth() + 1, 1));
  const total = Math.round((endD - dObj(first)) / 864e5);
  const x = d => dayDiff(first, d) / total * 100;
  const months = [];
  for (let d = new Date(Date.UTC(yr, 0, 1)); d < endD; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) months.push(d);
  const mo = months.map((d, i) => {
    const iso = d.toISOString().slice(0, 10), nx = (months[i + 1] || endD).toISOString().slice(0, 10);
    return `<span class="mo${nx <= DATA.as_of ? " past" : ""}" style="left:${x(iso)}%;width:${x(nx) - x(iso)}%">${MONTHS[d.getUTCMonth()]}${d.getUTCMonth() === 0 ? ` <b>${d.getUTCFullYear()}</b>` : ""}</span>`;
  }).join("");
  const MINW = 36 / total * 100;                 // a pin is at least ~5 weeks wide so its name fits
  const lanes = [], pins = [];
  for (const e of [...EV].sort((a, b) => a.start.localeCompare(b.start))) {
    const w = Math.max((dayDiff(e.start, e.end) + 1) / total * 100, MINW);
    const l = Math.min(x(e.start), 100 - w);
    let i = lanes.findIndex(r => r <= l - .25);
    if (i < 0) { i = lanes.length; lanes.push(0); }
    lanes[i] = l + w;
    const sub = e.champion ? `${logo(e.champion, "sm")}${esc(e.champion)}` : e.status === "live" ? `<span class="chip live">Live</span>` : esc(span(e.start, e.end));
    pins.push([i, `<a class="pin ${e.status}" href="#e-${e.slug}" style="left:${l}%;width:${w}%;${e.champion ? tcVars(e.champion) : ""}" title="${esc(e.name)}, ${esc(span(e.start, e.end))}${e.champion ? `, won by ${esc(e.champion)}` : ""}">${evImg(e)}<span class="pt"><b>${tierTag(e)}${esc(shortEv(e.name))}</b><span>${sub}</span></span></a>`]);
  }
  const rows = lanes.map((_, i) => `<div class="lane">${pins.filter(p => p[0] === i).map(p => p[1]).join("")}</div>`).join("");
  return `<div class="strip-wrap"><div class="strip" role="group" aria-label="Tournament calendar">${mo}<div class="lanes">${rows}</div>
    <div class="now" style="left:${x(DATA.as_of)}%"><span>Today, ${fmtDay(DATA.as_of)}</span></div></div></div>`;
}

function onAir(e) {
  const live = e.status === "live";
  const total = dayDiff(e.start, e.end) + 1;
  const today = Math.min(Math.max(dayDiff(e.start, DATA.as_of) + 1, 0), total);
  const teams = evTeamsList(e), P = e.placements || {};
  const alive = teams.filter(t => !P[t] || P[t].label === "Still playing");
  const out = teams.filter(t => P[t] && P[t].label !== "Still playing").sort((a, b) => (P[a].from || 99) - (P[b].from || 99));
  const byTime = (a, b) => (a.day || "9").localeCompare(b.day || "9") || (a.when || "").localeCompare(b.when || "");
  const next = e.matches.filter(m => !m.finished && m.t1 && m.t2).sort(byTime).slice(0, 4);
  const counter = live
    ? `<div class="dayctr"><b>Day ${today}<small> of ${total}</small></b><span>${alive.length} of ${teams.length} teams still in</span></div>`
    : `<div class="dayctr"><b>${Math.max(dayDiff(DATA.as_of, e.start), 0)}<small> days</small></b><span>until the first series</span></div>`;
  return `<article class="onair${live ? "" : " soon"}">
    <div class="onair-h">${evImg(e)}
      <div>${statusChip(e)} ${tierTag(e)}<h2 class="evname" style="margin-top:.4rem"><a href="#e-${e.slug}">${esc(e.name)}</a></h2>
        <div class="meta"><span>${esc(span(e.start, e.end))}</span>${whereOf(e) ? `<span>${esc(whereOf(e))}</span>` : ""}${prizeTxt(e) ? `<span><b>${prizeTxt(e)}</b> prize pool</span>` : ""}</div></div>
      ${counter}</div>
    ${live ? `<div class="daytrack" aria-hidden="true">${Array.from({ length: total }, (_, i) => `<i class="${i + 1 < today ? "done" : i + 1 === today ? "today" : ""}"></i>`).join("")}</div>` : ""}
    ${teams.length ? `<div class="alive"><span>${live ? "Still in" : "Teams"}</span><div class="ls">${alive.map(t => tchip(t)).join("")}</div>
      ${out.length ? `<span>Out</span><div class="ls out">${out.map(t => tchip(t, ` <em>${finishOf(e, t).text}</em>`)).join("")}</div>` : ""}</div>` : `<p class="empty">Teams to be announced.</p>`}
    ${next.length ? `<div class="mlist">${next.map(matchRow).join("")}</div>` : ""}
    <div class="links"><a class="btn" href="#e-${e.slug}">Matches and tables</a><a class="btn" href="#e-${e.slug}.matchup">Build a matchup</a></div>
  </article>`;
}

function viewEvents() {
  const bNote = needB(tierOn.B) || "";        // B-tier ticked: fetch its file, show S/A meanwhile
  const EV = DATA.events.filter(e => tierShown(e) && !isLazy(e));   // the tier filter applies to everything below
  const yr = DATA.as_of.slice(0, 4);
  const byStart = (a, b) => a.start.localeCompare(b.start);
  const live = EV.filter(e => e.status === "live").sort(byStart);
  const up = EV.filter(e => e.status === "upcoming").sort(byStart);
  const done = EV.filter(e => e.status === "finished").sort(byStart).reverse();
  const feat = live.length ? live : up.slice(0, 1);
  const rest = up.filter(e => !feat.includes(e));
  const season = EV.filter(e => e.start.startsWith(yr));
  const champs = {};
  for (const e of done) if (e.champion) (champs[e.champion] = champs[e.champion] || []).push(e);
  const pot = season.reduce((a, e) => a + prizeNum(e), 0);
  const tally = [[season.length, "tournaments"], [season.filter(e => e.status === "finished").length, "decided"],
    [Object.keys(champs).length, "different champions"], [`$${(pot / 1e6).toFixed(1)}M`, "in prize pools"]];

  const nu = e => {
    const d = dObj(e.start);
    return `<a class="nu" href="#e-${e.slug}"><span class="dt"><b>${d.getUTCDate()}</b><span>${MONTHS[d.getUTCMonth()]}${String(d.getUTCFullYear()) !== yr ? " " + d.getUTCFullYear() : ""}</span></span>
      ${evImg(e)}<span class="nm"><b>${tierTag(e)}${esc(e.name)}</b><span>${esc(whereOf(e))}</span></span>
      <span class="rt"><b>${prizeTxt(e)}</b><span>${startsIn(e)}</span></span></a>`;
  };
  const row = e => {
    const f = finalOf(e), c = e.champion, d = dObj(e.start);
    return `<a href="#e-${e.slug}" style="${c ? tcVars(c) : ""}">
      <span class="dt"><b>${MONTHS[d.getUTCMonth()]}</b><span>${dayRange(e)}</span></span>
      ${evImg(e, "el")}
      <span class="en"><b>${tierTag(e)}${esc(e.name)}</b><span>${esc(whereOf(e))}</span></span>
      ${c ? `<span class="cw">${logo(c)}<b>${esc(c)}</b><span>Champion</span></span>` : `<span class="cw"><span>No result recorded</span></span>`}
      <span class="fn">${f ? `<span class="sc">${f.sw}–${f.sl}</span>${logo(f.l, "sm")}<em>over ${esc(f.l)} in the final</em>` : ""}</span>
      <span class="pz"><b>${prizeTxt(e)}</b><span>${evTeamsList(e).length} teams</span></span></a>`;
  };
  const titles = Object.entries(champs).sort((a, b) => b[1].length - a[1].length || b[1][0].end.localeCompare(a[1][0].end));
  return `
  <header class="season"><h1 class="cond">${yr} <span>season</span></h1>
    <div class="tally">${tally.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("")}</div></header>
  ${tierBar()}
  ${bNote}
  ${EV.length ? seasonStrip(EV) : `<p class="empty">No tournaments in the selected tiers. Tick a tier above to show its events.</p>`}
  <div class="marquee">
    <div style="display:grid;gap:1.5rem">${feat.map(onAir).join("") || `<p class="empty">Nothing running right now.</p>`}</div>
    <aside class="nextup"><h2>Next up</h2>${rest.map(nu).join("") || `<p class="empty">No further tournaments announced yet.</p>`}</aside>
  </div>
  ${done.length ? `<div class="results">
    <section><h2>Results <span class="dim">newest first, with the grand final score</span></h2><div class="roll">${done.map(row).join("")}</div></section>
    <aside class="titles"><h2>Titles in ${yr} <span class="dim">event wins per team</span></h2>
      ${titles.map(([t, list]) => `<a class="trow" href="${T[t] ? `#t-${T[t].slug}` : "#teams"}" style="${tcVars(t)}">${logo(t)}<b>${esc(t)}</b><span class="n">${list.length}</span><span class="won">${list.map(e => evImg(e, "", true)).join("")}</span></a>`).join("")}
    </aside></div>` : ""}`;
}

/* ---------------- one tournament ---------------- */
const dayPick = {};
const evPick = {};      // slug -> {a, b, next}

function matchRow(m) {
  const a = m.t1, b = m.t2, live = isLive(m), w = winnerOf(m);
  const pred = decode(m.pred);
  let mid, tag = "";
  if (m.finished || live) mid = `<div class="mid cond"><span class="${m.w1 > m.w2 ? "ct" : ""}">${m.w1}</span> : <span class="${m.w2 > m.w1 ? "t" : ""}">${m.w2}</span></div>`;
  else if (pred) {
    const [ap, bp] = displayPercent([pred.p, 1 - pred.p]);
    mid = `<div class="mid pct" title="Model's pre-match call">${ap}% / ${bp}%</div>`;
  }
  else mid = `<div class="mid pct">vs</div>`;
  if (live) tag = `<span class="chip live">Live</span>`;
  else if (m.finished && pred) {
    const fav = pred.p >= .5 ? a : b;
    const pair = displayPercent([pred.p, 1 - pred.p]);
    const favPct = pred.p >= .5 ? pair[0] : pair[1];
    tag = `<span class="chip ${fav === w ? "hit" : "miss"}" title="Model favored ${esc(fav)} at ${favPct}%">${missLabel(fav === w, Math.max(pred.p, 1 - pred.p))}</span>`;
  }
  const team = (t, side) => `<div class="tm ${side}${w && t !== w ? " lost" : ""}">${logo(t)}<span>${esc(t || "To be decided")}</span></div>`;
  const inner = `<div class="time"><b>${clock(m.when) || (m.day ? fmtDay(m.day) : "TBA")}</b><span>${m.when ? tz(m.when) : ""}</span></div>
    ${team(a, "")}${mid}${team(b, "r")}
    <div class="tag">${tag}<span>${esc(m.stage)}${m.bo !== 3 ? `, Bo${m.bo}` : ""}</span></div>`;
  return a && b ? `<a class="mrow" href="#m-${m.id}">${inner}</a>` : `<div class="mrow">${inner}</div>`;
}

function evHero(e) {
  const facts = [
    ["Dates", span(e.start, e.end)],
    e.city ? ["Location", `${e.city}${e.country ? ", " + e.country : ""}`] : e.type ? ["Format", e.type] : null,
    e.venue ? ["Venue", e.venue] : null,
    prizeTxt(e) ? ["Prize pool", prizeTxt(e)] : null,
    e.organizer ? ["Organizer", e.organizer] : null,
    e.tier ? ["Tier", e.tier] : null,
  ].filter(Boolean);
  const n = evTeamsList(e).length;
  if (n) facts.splice(facts.findIndex(f => f[0] === "Prize pool") + 1 || facts.length, 0, ["Teams", String(n)]);
  const f = finalOf(e), P = e.placements || {};
  let crown;
  if (e.champion) {
    const third = Object.keys(P).filter(t => P[t].from === 3);
    crown = `<div class="crown" style="${tcVars(e.champion)}">${logo(e.champion)}
      <span class="lbl">Champion</span>
      ${T[e.champion] ? `<a class="who" href="#t-${T[e.champion].slug}">${esc(e.champion)}</a>` : `<span class="who">${esc(e.champion)}</span>`}
      ${f ? `<span class="sub">Beat ${logo(f.l, "sm")}<b>${esc(f.l)}</b> ${f.sw}–${f.sl} in the final${third.length ? `; ${third.length > 1 ? "semifinalists" : "third"}: ${third.map(esc).join(", ")}` : ""}</span>` : ""}
    </div>`;
  } else if (e.status === "live") {
    const total = dayDiff(e.start, e.end) + 1, today = Math.min(Math.max(dayDiff(e.start, DATA.as_of) + 1, 1), total);
    const alive = evTeamsList(e).filter(t => !P[t] || P[t].label === "Still playing").length;
    crown = `<div class="crown state live"><span class="lbl">Running now</span><span class="who">Day ${today} of ${total}</span><span class="sub"><b>${alive}</b> of ${n} teams still in</span></div>`;
  } else if (e.status === "upcoming") {
    const d = dayDiff(DATA.as_of, e.start);
    crown = `<div class="crown state"><span class="lbl">First series</span><span class="who">${d <= 0 ? "Starting" : d === 1 ? "Tomorrow" : `In ${d} days`}</span><span class="sub">${n ? `<b>${n}</b> teams announced` : "Teams to be announced"}</span></div>`;
  } else crown = "";
  return `<section class="evhero">
    ${evImg(e, "evlogo")}
    <div>
      ${statusChip(e)}
      <h1 class="cond" style="margin-top:.5rem">${esc(e.name)}</h1>
      <dl class="facts">${facts.map(([k, v]) => `<div class="${k === "Prize pool" || k === "Dates" ? "big" : ""}"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    </div>
    ${crown}
  </section>`;
}

function viewEvent(slug, sub) {
  const e = EV_BY[slug];
  if (!e) return `<p>Tournament not found. <a class="btn" href="#events">All tournaments</a></p>`;
  const tabs = [["", "Matches"], ["teams", "Teams & lineups"], ["matchup", "Build a matchup"]];
  const nav = `<nav class="subtabs" aria-label="Tournament sections">${tabs.map(([k, l]) => `<a href="#e-${slug}${k ? "." + k : ""}" ${sub === k ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>`;
  let body;
  if (sub === "teams") body = evTeams(e);
  else if (sub === "matchup") body = evMatchup(e);
  else body = evMatches(e);
  return `<nav class="crumb"><a href="#events">Tournaments</a><span>/</span><span>${esc(e.name)}</span></nav>${evHero(e)}${nav}${body}`;
}

function evMatches(e) {
  const days = [...new Set(e.matches.map(m => m.day).filter(Boolean))].sort();
  if (!days.length) return `<section class="panel"><p class="empty">No schedule published yet. ${e.participants.length ? `See <a class="btn" href="#e-${e.slug}.teams">Teams & lineups</a> or <a class="btn" href="#e-${e.slug}.matchup">build a matchup</a>.` : ""}</p></section>`;
  let d = dayPick[e.slug];
  if (!d || !days.includes(d)) {
    const live = e.matches.find(isLive);
    d = live ? live.day : e.status === "finished" ? days[days.length - 1] : (days.find(x => x >= DATA.as_of) || days[0]);
  }
  dayPick[e.slug] = d;
  const list = e.matches.filter(m => m.day === d).sort((x, y) => (x.when || "").localeCompare(y.when || ""));
  const groups = groupTables(e);
  const po = e.matches.filter(m => m.kind === "playoffs");
  const cols = [];
  for (const m of [...po].sort((x, y) => (x.day || "").localeCompare(y.day || ""))) {
    let c = cols.find(c => c.name === m.stage);
    if (!c) cols.push(c = { name: m.stage, list: [] });
    c.list.push(m);
  }
  const bm = m => {
    const w = winnerOf(m);
    const row = (t, s) => `<div style="${w && t !== w ? "" : w ? "color:var(--text);font-weight:700" : ""}">${logo(t, "sm")}<span style="flex:1">${esc(t || "To be decided")}</span>${m.finished || isLive(m) ? `<b>${s}</b>` : ""}</div>`;
    const inner = `${row(m.t1, m.w1)}${row(m.t2, m.w2)}<div class="when">${m.day ? fmtDay(m.day) : "TBA"}${m.when ? `, ${clock(m.when)} ${tz(m.when)}` : ""}${m.bo !== 3 ? `, Bo${m.bo}` : ""}</div>`;
    return m.t1 && m.t2 ? `<a class="bm" href="#m-${m.id}" style="display:block">${inner}</a>` : `<div class="bm">${inner}</div>`;
  };
  const firstTz = e.matches.find(m => m.when);
  return `
  ${e.pool.length ? `<section class="pool" aria-label="Map pool">${e.pool.map(mp => `<div class="maptile" style="${mapBg(mp)}"><span class="cond">${esc(mp)}<small>${esc(DATA.map_info[mp]?.location || "")}</small></span></div>`).join("")}</section>` : ""}
  <div class="evbody">
    <section class="panel">
      <h2>Matches <span class="dim">${firstTz ? `times in ${esc(tz(firstTz.when))}; ` : ""}percentages are the model's pre-match call</span></h2>
      <div class="days" role="group" aria-label="Match day">${days.map(x => `<button type="button" data-day="${x}" data-ev="${e.slug}" aria-pressed="${x === d}"><b>${wday(x)} ${fmtDay(x)}</b><span>${e.matches.filter(m => m.day === x).length} matches</span></button>`).join("")}</div>
      <div class="mlist">${list.map(matchRow).join("")}</div>
      ${list.some(m => !m.t1 || !m.t2) ? `<p class="small dim">Opponents for open slots are set by earlier results.</p>` : ""}
    </section>
    <div class="evside">
      ${groups.length ? `<section class="panel"><h2>${e.swiss ? "Swiss tables" : "Group tables"} <span class="dim">${e.swiss ? "3 wins to advance, 3 losses out" : "series won and lost"}</span></h2>
        ${groups.map(([name, rows]) => `<div class="grouptbl">${groups.length > 1 ? `<h3>${esc(name)}</h3>` : ""}<div class="tablewrap"><table>
          <thead><tr><th>#</th><th>Team</th><th class="n">Series</th><th class="n">Maps</th><th class="n">VRS</th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr class="${e.swiss && r.w >= 3 ? "up" : e.swiss && r.l >= 3 ? "out" : ""}"><td>${i + 1}</td><td>${tlink(r.team)}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.mw}-${r.ml}</td><td class="n dim">${T[r.team]?.vrs ? "#" + T[r.team].vrs.rank : "-"}</td></tr>`).join("")}</tbody>
        </table></div></div>`).join("")}</section>` : ""}
      ${bracketBlocks(cols).map(([fam, cs]) => `<section class="panel"><h2>${esc(fam)}</h2><div class="bracket" style="grid-template-columns:repeat(${cs.length},minmax(8.5rem,1fr))">${cs.map(c => `<div class="bcol"><h3>${esc(c.label)}</h3>${c.list.map(bm).join("")}</div>`).join("")}</div></section>`).join("")}
    </div>
    <div class="evside">
      ${standings(e)}
      ${e.format.length ? `<section class="panel"><h2>Format</h2><ul class="fmt">${e.format.map(([dd, t]) => `<li class="d${dd}">${esc(t)}</li>`).join("")}</ul></section>` : ""}
      <div class="links"><a class="btn" href="${esc(e.page)}" target="_blank" rel="noopener">Tournament on Liquipedia</a></div>
    </div>
  </div>`;
}

// Bracket columns split into one block per stage ("Play-In", "Group Stage Group A", "Playoffs"),
// so a play-in, its groups and the playoffs are not squeezed into a single row of columns
const ELIM = ["Round of 32", "Round of 16", "Quarterfinal", "Semifinal", "Third-place match", "Grand final"];
function bracketBlocks(cols) {
  const blocks = [];
  for (const c of cols) {
    const fam = ELIM.includes(c.name) ? "Playoffs" : c.name.replace(/,?\s*round \d+$/i, "").trim() || "Playoffs";
    let b = blocks.find(b => b[0] === fam);
    if (!b) blocks.push(b = [fam, []]);
    const r = c.name.match(/round (\d+)$/i);
    b[1].push({ ...c, label: r ? `Round ${r[1]}` : c.name });
  }
  for (const b of blocks) {           // within a block: rounds in order, the final last
    const k = c => ELIM.includes(c.name) ? 100 + ELIM.indexOf(c.name) : +(c.name.match(/round (\d+)$/i) || [0, 0])[1];
    b[1].sort((x, y) => k(x) - k(y));
  }
  return blocks;
}

// Final standings: each prize slot with its money and the teams that finished there
function standings(e) {
  if (!e.prizes.length) return "";
  const P = e.placements || {};
  const teams = Object.keys(P);
  const sort = ts => ts.sort((a, b) => (T[b]?.elo || 0) - (T[a]?.elo || 0));
  const chips = ts => ts.length ? sort(ts).map(t => tlink(t)).join("") : `<span class="open">${e.status === "finished" ? "" : "Open"}</span>`;
  const row = (pl, cls, money, ts) => `<div><span class="pl ${cls}">${pl}</span><span class="usd">${money}</span><span class="tms">${chips(ts)}</span></div>`;
  const alive = teams.filter(t => P[t].label === "Still playing");
  const other = {};
  for (const t of teams) if (P[t].from == null && P[t].label !== "Still playing") (other[P[t].label] = other[P[t].label] || []).push(t);
  const title = e.status === "finished" ? "Final standings" : e.status === "live" ? "Standings so far" : "Prize pool";
  const note = e.status === "upcoming" ? "" : e.status === "live" ? "places fill as teams are knocked out" : "places from the results; prize money per team";
  return `<section class="panel"><h2>${title} <span class="dim">${note}</span></h2><div class="stand">
    ${alive.length ? row("Still in", "", "", alive) : ""}
    ${e.prizes.map(p => row(p.from === p.to ? ordinal(p.from) : `${ordinal(p.from)}–${ordinal(p.to)}`, p.from === 1 ? "p1" : "",
      p.usd ? usd(p.usd) : "", teams.filter(t => P[t].from === p.from && P[t].to === p.to))).join("")}
    ${Object.entries(other).map(([l, ts]) => row(esc(l), "", "", ts)).join("")}
  </div></section>`;
}

function evTeamsList(e) {
  const fromParts = e.participants.map(p => p.team);
  const fromMatches = e.matches.flatMap(m => [m.t1, m.t2]).filter(Boolean);
  return [...new Set([...fromParts, ...fromMatches])].sort((a, b) => (T[b]?.elo || 0) - (T[a]?.elo || 0));
}

function evMatchup(e) {
  // B-tier events carry no matchup grid of their own: only teams in the global grid can be paired
  const list = evTeamsList(e).filter(t => T[t] && (DATA.epairs[e.slug] || CMP_NAMES.includes(t)));
  if (list.length < 2) return `<section class="panel"><p class="empty">${DATA.epairs[e.slug] || e.tl !== "B" ? "Matchups open once at least two teams are announced." : "Matchups are built for S- and A-tier events, and for teams that play at them; fewer than two teams here qualify."}</p></section>`;
  const s = evPick[e.slug] = evPick[e.slug] || {};
  if (!s.a || !list.includes(s.a)) s.a = list[0];
  if (!s.b || !list.includes(s.b) || s.b === s.a) s.b = list.find(t => t !== s.a);
  s.next = s.next || "a";
  const pred = matchupPred(e, s.a, s.b);
  PAIR = [s.a, s.b];
  const asof = e.status === "finished" ? `ratings as of ${fmtDate(e.start)}, the first day of the event` : `ratings as of ${fmtDate(DATA.as_of)}`;
  return `
  <section class="panel">
    <h2>Pick two teams from ${esc(e.name)} <span class="dim">next click sets ${s.next === "a" ? `<span class="ct">Team 1</span>` : `<span class="t">Team 2</span>`}</span></h2>
    <div class="picker">${list.map(n => pickTile(n, `data-epick="${esc(n)}" data-ev="${e.slug}" ${n === s.a ? 'data-slot="a"' : n === s.b ? 'data-slot="b"' : ""} aria-pressed="${n === s.a || n === s.b}"`)).join("")}</div>
    <div class="slots"><span><span class="ct">${esc(s.a)}</span> bans first in the simulated veto</span><button type="button" class="btn" data-eswap="${e.slug}">Swap teams</button></div>
  </section>
  ${matchDesk(pred, s.a, s.b, { ev: e, label: e.status === "finished" ? "Model's call before the event" : "Model's call today",
    ctx: `<div class="ctx"><span class="ev"><span style="display:grid"><b>Hypothetical series</b><span>${asof}</span></span></span></div>` })}`;
}

function viewMatch(id) {

function countdown(when) {
  if (!when) return "";
  const ms = new Date(when) - Date.now();
  if (ms <= 0) return "Start time passed, no result yet";
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  return d >= 1 ? `Starts in ${d} day${d > 1 ? "s" : ""}` : `Starts in ${h} hour${h === 1 ? "" : "s"}`;
}

/* ---------------- teams ---------------- */
function viewTeams() {

}

function spark(trace) {
  if (trace.length < 2) return `<p class="empty">Not enough series to chart.</p>`;
  const W = 560, H = 150, L = 36, R = 10, Tp = 12, B = 22;
  const ys = trace.map(p => p[1]);
  const lo = Math.floor((Math.min(...ys) - 10) / 25) * 25, hi = Math.ceil((Math.max(...ys) + 10) / 25) * 25;
  const x = i => L + i * (W - L - R) / (trace.length - 1);
  const y = v => Tp + (hi - v) * (H - Tp - B) / (hi - lo);
  const pts = trace.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elo after each of the last ${trace.length} series, from ${ys[0]} to ${ys[ys.length - 1]}" data-trace="${esc(JSON.stringify(trace))}" data-geo="${L},${R},${Tp},${B},${lo},${hi},${W},${H}">
    ${[lo, Math.round((lo + hi) / 2), hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("")}
    <polygon points="${L},${H - B} ${pts} ${x(trace.length - 1)},${H - B}" fill="var(--ct)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--ct)" stroke-width="2"/>
    <circle cx="${x(trace.length - 1)}" cy="${y(ys[ys.length - 1])}" r="4" fill="var(--ct)"/>
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--dim)">${fmtDate(trace[0][0])}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" fill="var(--dim)" text-anchor="end">${fmtDate(trace[trace.length - 1][0])}</text>
    <g class="hover" visibility="hidden"><line y1="${Tp}" y2="${H - B}" stroke="var(--dim)" stroke-dasharray="3 3"/><circle r="4" fill="var(--t)"/><text font-size="11" fill="var(--text)"></text></g>
  </svg>`;
}

        : `<span class="small dim">Valve Regional Standings</span><b class="cond">-</b><span class="small dim">not in the current standings</span>`}
      <span class="small dim" style="margin-top:.4rem">${t.series ? `Elo ${t.elo}${t.rank ? `, ${ordinal(t.rank)} of active teams` : `, ${t.series} series in the data`}` : "No series in the data yet"}</span></div>

  <div class="grid2">
    <section class="panel"><h2>Map pool <span class="dim">last 90 days, line marks 50%</span></h2>
      <div class="poolbars">${maps.map(([m, v]) => `<div class="pb"><span class="thumb" style="${mapBg(m)}"><span class="cond">${esc(m)}</span></span><span class="trk"><b style="width:${(v[0] * 100).toFixed(1)}%"></b><i></i></span><span>${pct(v[0])} of ${v[1]}</span></div>`).join("") || `<p class="empty">No maps in the last 90 days.</p>`}</div></section>
    <section class="panel"><h2>Recent results</h2><div class="res">${t.results.map(r => `<div class="r">
      <span class="wl ${r.won ? "W" : "L"}">${r.won ? "W" : "L"}</span>
      <span style="min-width:0"><span class="opp">${logo(r.opp, "sm")}<span>${esc(r.opp)}</span></span><span class="ev">${esc(r.event)}, ${fmtDate(r.date)}</span></span>
      <span>${esc(r.score)}</span></div>`).join("") || `<p class="empty">No results in the data.</p>`}</div></section>
  </div>`;
}

/* ---------------- track record ----------------
   Built only from finished 2026 matches on this site that carry the model's
   pre-match call (each call uses results dated before the match day). */
let CALLS = null;
function callLog() {
  if (CALLS) return CALLS;
  const out = [];
  for (const m of Object.values(MATCH)) {
    if (!m.finished || !m.pred || !m.t1 || !m.t2 || m.w1 === m.w2) continue;
    const pr = decode(m.pred), w = winnerOf(m), pf = pFor(pr, [1, 3, 5].includes(m.bo) ? m.bo : 3).p;
    const pickA = pr.p >= .5, pick = pickA ? m.t1 : m.t2, opp = pickA ? m.t2 : m.t1;
    const set = scoreSet(pr, [1, 3, 5].includes(m.bo) ? m.bo : 3);
    const top = set[predictedIdx(set, pr.p)];
    const elo = m.pred.e || null;
    out.push({
      id: m.id, day: m.day || "", when: m.when || "", e: EV_BY[m.ev], stage: m.stage, a: m.t1, b: m.t2, w,
      // the stated chance is for the format actually played (BO1 calls are less sure, BO5 more)
      pick, opp, pickP: pickA ? pf : 1 - pf, pickShown: displayPercent([pf, 1 - pf])[pickA ? 0 : 1],
      predTeam: winOf(top) ? m.t1 : m.t2, predScore: scoreFrom(top, winOf(top)),
      score: `${Math.max(m.w1, m.w2)}-${Math.min(m.w1, m.w2)}`, hit: pick === w,
      // bonus: the predicted score (the pick's most likely winning score) also happened
      exact: (winOf(top) ? m.t1 : m.t2) === w && scoreFrom(top, winOf(top)) === `${Math.max(m.w1, m.w2)}-${Math.min(m.w1, m.w2)}`,
      pickElo: elo ? elo[pickA ? 0 : 1] : null, oppElo: elo ? elo[pickA ? 1 : 0] : null,
    });
  }
  out.sort((x, y) => (x.day + x.when).localeCompare(y.day + y.when) || String(x.id).localeCompare(String(y.id)));
  return CALLS = out;
}
function wilsonJS(k, n, z = 1.959964) {
  if (!n) return [0, 1];
  const ph = k / n, den = 1 + z * z / n, c = (ph + z * z / (2 * n)) / den;
  const h = z * Math.sqrt(ph * (1 - ph) / n + z * z / (4 * n * n)) / den;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
const acc2 = (h, n) => n ? (h / n * 100).toFixed(2) : "-";
/* numeric ISO dates on this page: days are already "YYYY-MM-DD"; trim any time part */
const isoDate = s => String(s || "").slice(0, 10) || "-";
const rec ={ ev: "", team: "", res: "", limit: 40, b: false };   // b: include B-tier events (their file loads on demand)
const MIN_N = 8;
const BUCKETS = [[.5, .6, "50-60%"], [.6, .7, "60-70%"], [.7, .8, "70-80%"], [.8, .9, "80-90%"], [.9, 1.01, "90% and up"]];

function calibChart(calls) {
  const rows = BUCKETS.map(([lo, hi, lab]) => {
    const b = calls.filter(c => c.pickP >= lo && c.pickP < hi), n = b.length, h = b.filter(c => c.hit).length;
    return { lab, n, h, said: n ? b.reduce((s, c) => s + c.pickP, 0) / n : null, got: n ? h / n : null, ci: wilsonJS(h, n) };
  });
  const live = rows.filter(r => r.n);
  const W = 520, H = 330, L = 50, R = 18, Tp = 14, B = 48;
  const ylo = Math.min(.5, Math.floor(Math.min(...live.map(r => r.ci[0])) * 10) / 10);
  const x = v => L + (v - .5) / .5 * (W - L - R), y = v => Tp + (1 - v) / (1 - ylo) * (H - Tp - B);
  let g = "";
  for (let v = ylo; v <= 1.0001; v += .1) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--dim)">${Math.round(v * 100)}%</text>`;
  for (const v of [.5, .6, .7, .8, .9, 1]) g += `<text x="${x(v)}" y="${H - B + 18}" text-anchor="middle" font-size="11" fill="var(--dim)">${Math.round(v * 100)}%</text>`;
  const band = [[.5, .6], [.9, 1], [1, 1], [1, .9], [.5, .4]].map(([a, b]) => `${x(a)},${y(Math.max(ylo, b))}`).join(" ");
  g += `<polygon points="${band}" fill="var(--text)" fill-opacity=".06"/>`;
  g += `<line x1="${x(.5)}" y1="${y(.5)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--dim)" stroke-dasharray="5 5"/>`;
  g += `<text x="${x(.93)}" y="${y(.93) + 18}" font-size="11" fill="var(--dim)" text-anchor="middle">perfect</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--dim)">What the model said for its pick</text>`;
  g += `<text transform="translate(14 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--dim)">How often the pick won</text>`;
  const mx = Math.max(...live.map(r => r.n));
  for (const r of live) {
    const ok = Math.abs(r.got - r.said) <= .1, col = ok ? "var(--win)" : "var(--loss)";
    const cx = x(r.said), cy = y(Math.max(ylo, r.got));
    g += `<line x1="${cx}" x2="${cx}" y1="${y(Math.max(ylo, r.ci[0]))}" y2="${y(r.ci[1])}" stroke="${col}" stroke-width="2" stroke-opacity=".55"/>`;
    g += `<circle cx="${cx}" cy="${cy}" r="${(5 + 7 * Math.sqrt(r.n / mx)).toFixed(1)}" fill="${col}" stroke="var(--panel)" stroke-width="2"><title>${r.lab}: said ${(r.said * 100).toFixed(2)}% on average, won ${(r.got * 100).toFixed(2)}% (${r.h} of ${r.n})</title></circle>`;
    g += `<text x="${cx}" y="${y(r.ci[1]) - 7}" text-anchor="middle" font-size="11" fill="var(--text)">${r.n}</text>`;
  }
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: stated chance of the pick against how often it won, by bucket">${g}</svg>`;
  const table = `<div class="tablewrap"><table><thead><tr><th>Model said</th><th class="n">Calls</th><th class="n">Said, on average</th><th class="n">Pick won</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.lab}</td><td class="n">${r.n}</td><td class="n">${r.n ? (r.said * 100).toFixed(2) + "%" : "-"}</td><td class="n ${r.n && Math.abs(r.got - r.said) > .1 ? "loss" : ""}">${r.n ? `${(r.got * 100).toFixed(2)}%` : "-"}</td></tr>`).join("")}</tbody></table></div>`;
  return svg + table;
}

const RANGES = [["7", "7D"], ["30", "30D"], ["90", "90D"], ["all", "Season"]];
const daysBefore = (day, n) => new Date(Date.parse(day + "T00:00:00Z") - n * 864e5).toISOString().slice(0, 10);
function timeChart(calls) {
  const n = calls.length, w = Math.max(10, Math.min(40, Math.floor(n / 5)));
  if (n < w + 2) return `<p class="empty">Not enough finished calls to draw a trend yet.</p>`;
  const roll = [];
  let h = 0;
  for (let i = 0; i < n; i++) {
    h += calls[i].hit; if (i >= w) h -= calls[i - w].hit;
    if (i >= w - 1) roll.push({ v: h / w, c: calls[i] });
  }
  const r = rec.range || "all";
  const cut = r === "all" ? "" : daysBefore(calls[n - 1].day, +r);
  const pts = roll.filter(p => p.c.day > cut), inRange = calls.filter(c => c.day > cut);
  const ih = inRange.filter(c => c.hit).length;
  const seg = `<div class="seg" role="group" aria-label="Time range">${RANGES.map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${r === k}">${l}</button>`).join("")}</div>`;
  const label = r === "all" ? "Whole season" : `Last ${r} days`;
  const summary = `<p class="small dim">${label}: ${ih} of ${inRange.length} right${inRange.length ? ` (${acc2(ih, inRange.length)}%)` : ""}. The line is the share right over the previous ${w} calls; the dashed line is the season average. Hover the chart to read any point.</p>`;
  if (pts.length < 2) return `<div class="chart-head">${seg}</div><p class="empty">Fewer than two calls in this range. Pick a longer range.</p>${summary}`;
  const W = 520, H = 300, L = 44, R = 14, Tp = 14, B = 34;
  const all = calls.filter(c => c.hit).length / n;
  const lo = Math.min(.4, Math.floor(Math.min(...pts.map(p => p.v)) * 10) / 10);
  const x = k => L + k / (pts.length - 1) * (W - L - R), y = v => Tp + (1 - v) / (1 - lo) * (H - Tp - B);
  let g = "";
  for (let v = lo; v <= 1.0001; v += .1) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--dim)">${Math.round(v * 100)}%</text>`;
  // axis labels: days for short ranges, months for long ones, never closer than 56 units
  const tickKey = d => r === "all" || r === "90" ? d.slice(0, 7) : d;
  let lastK = "", lastX = -1e9;
  pts.forEach((p, k) => { const tk = tickKey(p.c.day); if (tk !== lastK) { lastK = tk; if (x(k) - lastX < (tk.length > 7 ? 76 : 56) || x(k) > W - R - (tk.length > 7 ? 60 : 44)) return; lastX = x(k); g += `<text x="${x(k)}" y="${H - 12}" font-size="11" fill="var(--dim)">${tk}</text><line x1="${x(k)}" x2="${x(k)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--dim)"/>`; } });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(all)}" y2="${y(all)}" stroke="var(--dim)" stroke-dasharray="5 5"/>`;
  const line = pts.map((p, k) => `${x(k).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  g += `<polygon points="${x(0)},${H - B} ${line} ${x(pts.length - 1)},${H - B}" fill="var(--win)" fill-opacity=".1"/>`;
  g += `<polyline points="${line}" fill="none" stroke="var(--win)" stroke-width="2.25"/>`;
  if (pts.length <= 60) g += pts.map((p, k) => `<circle cx="${x(k).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.5" fill="${p.c.hit ? "var(--win)" : "var(--loss)"}"/>`).join("");
  const lp = pts[pts.length - 1];
  g += `<circle cx="${x(pts.length - 1)}" cy="${y(lp.v)}" r="4" fill="var(--win)"/>`;
  g += `<g class="hover" visibility="hidden"><line y1="${Tp}" y2="${H - B}" stroke="var(--dim)" stroke-dasharray="3 3"/><circle r="5" fill="var(--text)" stroke="var(--panel)" stroke-width="2"/>
    <rect rx="4" fill="var(--bg)" stroke="var(--line)"/><text font-size="11" fill="var(--text)"><tspan class="t1"></tspan><tspan class="t2" fill="var(--dim)"></tspan></text></g>`;
  const data = pts.map((p, k) => [+x(k).toFixed(1), +y(p.v).toFixed(1), p.c.day, (p.v * 100).toFixed(2), `${p.c.a} vs ${p.c.b}, ${p.c.hit ? "right" : "wrong"}`]);
  return `<div class="chart-head">${seg}</div>
    <svg class="chart rchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}: share right over the previous ${w} calls, latest ${(lp.v * 100).toFixed(2)}%" data-pts="${esc(JSON.stringify(data))}" data-geo="${W},${H},${L},${R}">${g}</svg>
    ${summary}${monthTable(calls)}`;
}

function monthTable(calls) {
  const by = new Map();
  for (const c of calls) { const mo = c.day.slice(0, 7) || "-", r = by.get(mo) || { n: 0, h: 0 }; r.n++; r.h += c.hit; by.set(mo, r); }
  return `<div class="tablewrap"><table><thead><tr><th>Month</th><th class="n">Calls</th><th class="n">Right</th><th class="n">Share</th></tr></thead><tbody>
    ${[...by].map(([mo, r]) => `<tr><td>${esc(mo)}</td><td class="n">${r.n}</td><td class="n">${r.h}</td><td class="n">${acc2(r.h, r.n)}%</td></tr>`).join("")}</tbody></table></div>`;
}

function leaderboard(calls) {
  const by = {};
  for (const c of calls) for (const t of [c.a, c.b]) { const r = by[t] = by[t] || { t, n: 0, h: 0 }; r.n++; r.h += c.hit; }
  const rows = Object.values(by).filter(r => r.n >= MIN_N);
  const best = [...rows].sort((p, q) => q.h / q.n - p.h / p.n || q.n - p.n).slice(0, 8);
  const worst = [...rows].sort((p, q) => p.h / p.n - q.h / q.n || q.n - p.n).slice(0, 8);
  const row = r => { const [lo, hi] = wilsonJS(r.h, r.n); return `<div class="row">${logo(r.t, "sm")}<a class="nm" href="${T[r.t] ? `#t-${T[r.t].slug}` : "#record"}">${esc(r.t)}</a>
    <span class="rec">${r.h} of ${r.n}</span><span class="v">${acc2(r.h, r.n)}%</span>
    <span class="trk" title="Range consistent with ${r.n} calls: ${(lo * 100).toFixed(2)}% to ${(hi * 100).toFixed(2)}%"><span class="ci" style="left:${(lo * 100).toFixed(1)}%;width:${((hi - lo) * 100).toFixed(1)}%"></span><span class="pt" style="left:${(r.h / r.n * 100).toFixed(1)}%"></span></span></div>`; };
  const note = `<p class="small dim">Teams with at least ${MIN_N} calls. The pale band is the range that record is consistent with: the fewer the calls, the wider it gets.</p>`;
  return rows.length ? `
    <section class="panel"><h2>Reads best <span class="dim">share of calls involving the team that were right</span></h2><div class="lb best">${best.map(row).join("")}</div>${note}</section>
    <section class="panel"><h2>Keeps it guessing <span class="dim">lowest share of right calls</span></h2><div class="lb worst">${worst.map(row).join("")}</div>${note}</section>`
    : `<section class="panel rq-wide"><h2>Teams</h2><p class="empty">No team has ${MIN_N} calls yet.</p></section>`;
}

function callCard(c, line) {
  return `<a class="callcard" href="#m-${c.id}"><span><b>${esc(line)}</b></span><span class="big cond">${c.score}</span>
    <span class="dim">${esc(c.e.name)}, ${esc(c.stage)}, ${isoDate(c.day)}. Model: ${esc(c.pick)} ${c.pickShown}%${c.pickElo != null ? `, rated ${c.pickElo} against ${c.oppElo}` : ""}</span></a>`;
}

function viewRecord() {
  // S- and A-tier events by default; B-tier ones when ticked (their file loads first, S/A shows meanwhile)
  const bNote = needB(rec.b) || "";
  const calls = callLog().filter(c => rec.b || c.e.tl !== "B");
  const tierPick = `<label class="recb"><input type="checkbox" data-recb="1"${rec.b ? " checked" : ""}> Include B-tier tournaments</label>`;
  if (!calls.length) return `<section class="panel"><h2>Stats</h2><p class="empty">No finished matches with a model call in this snapshot yet. Calls appear here as soon as results come in.</p><p>${tierPick}</p></section>${bNote}`;
  const n = calls.length, hits = calls.filter(c => c.hit).length;
  let k = n - 1, run = 0;
  const lastHit = calls[k].hit;
  while (k >= 0 && calls[k].hit === lastHit) { run++; k--; }
  const evs = [...new Map(calls.map(c => [c.e.slug, c.e])).values()].sort((p, q) => q.start.localeCompare(p.start));
  const teams = [...new Set(calls.flatMap(c => [c.a, c.b]))].sort((p, q) => p.localeCompare(q));
  const list = calls.filter(c => (!rec.ev || c.e.slug === rec.ev) && (!rec.team || c.a === rec.team || c.b === rec.team)
    && (!rec.res || (rec.res === "hit") === c.hit) && (!rec.exact || (rec.exact === "hit") === c.exact)).reverse();
  const ex = calls.filter(c => c.exact).length;
  const lh = list.filter(c => c.hit).length;
  const fav = calls.filter(c => c.pickElo != null && c.pickElo >= c.oppElo), dog = calls.filter(c => c.pickElo != null && c.pickElo < c.oppElo);
  const hitsDog = dog.filter(c => c.hit).sort((p, q) => (q.oppElo - q.pickElo) - (p.oppElo - p.pickElo)).slice(0, 5);
  const misses = calls.filter(c => !c.hit).sort((p, q) => q.pickP - p.pickP).slice(0, 5);
  const sel = (key, label, options) => `<label>${label}<select data-rf="${key}"><option value="">All</option>${options.map(([v, l]) => `<option value="${esc(v)}" ${rec[key] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
  const tl = (t, won) => `<span class="tl ${won ? "won" : ""}">${logo(t, "sm")}${esc(t)}</span>`;
  const fh = fav.filter(c => c.hit).length, dh = dog.filter(c => c.hit).length;
  return `
  <div style="display:grid;gap:.4rem">
    <h1 class="cond" style="font-size:var(--s3)">Stats</h1>
    <p class="dim" style="max-width:68ch">Every finished 2026 match ${rec.b && BLOAD.state === "done" ? "at S-, A- and B-tier tournaments" : "at S- and A-tier tournaments"} on this site where the model made a call. Each call uses only results from before the match day, and every row opens the match it was made for.</p>
    <div>${tierPick}</div>
  </div>
  ${bNote}
  <section class="board" aria-label="Headline numbers">
    <div class="first"><span class="lbl">Winners called right</span><span class="num cond">${bigPct(acc2(hits, n))}</span><span class="lbl">${hits} of ${n} calls</span><span class="lbl">Bonus: exact score also right in ${ex} (${acc2(ex, n)}%)</span></div>
    <div><span class="lbl">Matches tracked</span><span class="num cond">${n}</span><span class="lbl">${isoDate(calls[0].day)} to ${isoDate(calls[n - 1].day)}</span></div>
    <div><span class="lbl">Current run</span><span class="num cond ${lastHit ? "win" : "loss"}">${run}</span><span class="lbl">${lastHit ? "right" : "wrong"} in a row. The last 20 calls, oldest first:</span>
      <span class="streak">${calls.slice(-20).map(c => `<i class="${c.hit ? "h" : "m"}" title="${esc(`${c.a} vs ${c.b}: ${c.hit ? "right" : "wrong"}`)}"></i>`).join("")}</span></div>
  </section>
  <div class="rec-row3">
    <section class="panel"><h2>When it says 75%, does it win 75%? <span class="dim">dots inside the pale band are within 10 points; each bar is the range for that many calls</span></h2>${calibChart(calls)}</section>
    <section class="panel"><h2>Through the season</h2>${timeChart(calls)}</section>
    <div class="rec-splits">
      <section class="panel"><h2>Favourite or underdog <span class="dim">by the two teams' ratings going into the match</span></h2>
        <div class="splitfig">
          <div><span class="small dim">Backed the higher-rated team</span><b class="cond">${acc2(fh, fav.length)}%</b><span class="small dim">${fh} of ${fav.length} right</span></div>
          <div><span class="small dim">Backed the lower-rated team</span><b class="cond">${acc2(dh, dog.length)}%</b><span class="small dim">${dh} of ${dog.length} right</span></div>
        </div></section>
      <section class="panel"><h2>By tournament</h2><div class="tablewrap"><table><thead><tr><th>Tournament</th><th class="n">Calls</th><th class="n">Right</th><th class="n">Share</th></tr></thead><tbody>
        ${evs.map(e => { const cs = calls.filter(c => c.e.slug === e.slug), h = cs.filter(c => c.hit).length; return `<tr><td><a href="#e-${e.slug}">${esc(e.name)}</a></td><td class="n">${cs.length}</td><td class="n">${h}</td><td class="n">${acc2(h, cs.length)}%</td></tr>`; }).join("")}
      </tbody></table></div></section>
    </div>
  </div>
  <section class="panel"><h2>Every call <span class="dim">showing ${Math.min(rec.limit, list.length)} of ${list.length}, ${lh} right</span></h2>
    <div class="filters">${sel("ev", "Tournament", evs.map(e => [e.slug, e.name]))}${sel("team", "Team", teams.map(t => [t, t]))}${sel("res", "Winner", [["hit", "Right"], ["miss", "Wrong"]])}${sel("exact", "Exact score", [["hit", "Right"], ["miss", "Wrong"]])}</div>
    <div class="tablewrap"><table class="log"><thead><tr><th>Date</th><th class="xw">Tournament</th><th>Match</th><th>Model's pick</th><th>Predicted</th><th>Result</th><th></th></tr></thead><tbody>
      ${list.slice(0, rec.limit).map(c => `<tr>
        <td class="dt">${isoDate(c.day)}<span class="ev evd">${esc(c.e.name)}</span></td>
        <td class="xw"><a href="#e-${c.e.slug}">${esc(c.e.name)}</a><span class="ev">${esc(c.stage || "")}</span></td>
        <td><a href="#m-${c.id}" style="display:grid;gap:.15rem">${tl(c.a, c.w === c.a)}${tl(c.b, c.w === c.b)}</a></td>
        <td><span class="tl won">${logo(c.pick, "sm")}${esc(c.pick)}</span><span class="ev">${c.pickShown}%</span></td>
        <td>${esc(c.predTeam)} ${c.predScore}${c.exact ? ` <span class="chip hit" title="The exact score also happened">exact</span>` : ""}</td>
        <td>${esc(c.w)} ${c.score}</td>
        <td><span class="hm ${c.hit ? "h" : "m"}">${c.hit ? "Right" : "Wrong"}</span></td></tr>`).join("") || `<tr><td colspan="7" class="empty">No calls match these filters. Clear one to see more.</td></tr>`}
    </tbody></table></div>
    ${list.length > rec.limit ? `<button type="button" class="btn" data-more="1">Show ${Math.min(40, list.length - rec.limit)} more</button>` : ""}
  </section>
  <div class="rec-quad">
    ${leaderboard(calls)}
    <section class="panel"><h2>Best calls <span class="dim">backed the lower-rated team, and it won</span></h2>
      <div class="callcards">${hitsDog.map(c => callCard(c, `${c.pick} over ${c.opp}`)).join("") || `<p class="empty">The model hasn't backed a lower-rated team that went on to win yet.</p>`}</div></section>
    <section class="panel"><h2>Worst misses <span class="dim">the most confident picks that lost</span></h2>
      <div class="callcards">${misses.map(c => callCard(c, `${c.pick} lost to ${c.opp}`)).join("") || `<p class="empty">No misses yet.</p>`}</div></section>
  </div>
  <footer class="foot">
    <p>Fan analytics only. Ratings are rebuilt from Liquipedia results. Tournaments, lineups, logos, map images and results come from Liquipedia (text CC BY-SA 3.0); logos and map art belong to their owners.</p>
    <p>Snapshot ${isoDate(DATA.as_of)}.</p>
  </footer>`;
}

/* ---------------- router + interactions ---------------- */
function route() {
  const h = decodeURIComponent((location.hash || "#home").slice(1));
  let html, tab = "home";
  PAIR = null;
  if (h === "" || h === "home" || h === "compare") { html = viewHome(); }
  else if (h === "events") { html = viewEvents(); tab = "events"; }
  else if (h === "teams") { html = viewTeams(); tab = "teams"; }
  else if (h === "record") { html = viewRecord(); tab = "record"; }
  // a match not among the S/A matches may be a B-tier one: load that file first, then render
  else if (h.startsWith("m-")) { html = needB(!MATCH[h.slice(2)]) || viewMatch(h.slice(2)); tab = "events"; }
  else if (h.startsWith("t-")) { html = viewTeam(h.slice(2)); tab = "teams"; }
  else if (h.startsWith("e-")) { const [slug, sub = ""] = h.slice(2).split("."); html = needB(isLazy(EV_BY[slug])) || viewEvent(slug, sub); tab = "events"; }
  else html = viewHome();
  $("#view").classList.toggle("wide", !h || h === "home" || h === "compare");
  $("#view").classList.toggle("rwide", h === "record");
  // the top bar follows the page width so its edges line up with the content
  document.body.dataset.w = h === "record" ? "rwide" : (!h || h === "home" || h === "compare") ? "wide" : "";
  const evWide = h === "events" || h.startsWith("e-"); $("#view").classList.toggle("ewide", evWide); if (evWide) document.body.dataset.w = "ewide";
  const v = $("#view");
  v.innerHTML = html;
  applyPair(v);
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.tab === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  animateBars(v);
  return h;
}
let lastHash = null;
function go() {
  const h = route();
  if (h !== lastHash) { window.scrollTo(0, 0); lastHash = h; }
}
window.addEventListener("hashchange", go);

function rerender() {
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
document.addEventListener("click", e => {
  const day = e.target.closest("[data-day]");
  if (day) { dayPick[day.dataset.ev] = day.dataset.day; rerender(); return; }
  const mc = e.target.closest("button.mapcard");
  if (mc && !e.target.closest("a")) { mc.setAttribute("aria-expanded", mc.getAttribute("aria-expanded") === "true" ? "false" : "true"); return; }
  const bo = e.target.closest("[data-bo]");
  // a new format has its own veto: start the spotlight on that format's first played map
  if (bo && !bo.disabled) { desk.bo = +bo.dataset.bo; desk.spot = null; rerender(); return; }
  const dt = e.target.closest("[data-dtab]");
  if (dt) { desk.tab = dt.dataset.dtab; rerender(); return; }
  const sp = e.target.closest("[data-spot]");
  if (sp) { desk.spot = sp.dataset.spot; rerender(); return; }
  if (e.target.closest("#exSwap")) { [desk.a, desk.b] = [desk.b, desk.a]; desk.feat = null; rerender(); return; }
  const chg = e.target.closest("[data-chg]");
  if (chg) { openChooser(chg.dataset.chg); return; }
  if (e.target.closest("[data-dclose]") || e.target.id === "tDlg") { closeChooser(); return; } // the dialog itself is only hit on its backdrop
  const dp = e.target.closest(".pick[data-dpick]");
  if (dp) {
    const t = dp.dataset.dpick, side = dlgSide;
    if (t === desk[side]) { closeChooser(); return; }
    if (side === "a") { if (t !== desk.b) desk.a = t; else if (t !== desk.a) [desk.a, desk.b] = [desk.b, desk.a]; }
    else { if (t !== desk.a) desk.b = t; else if (t !== desk.b) [desk.a, desk.b] = [desk.b, desk.a]; }
    desk.feat = null; closeChooser(); rerender();
    const back = $(`[data-chg="${side}"]`); if (back) back.focus({ preventScroll: true });
    return;
  }
  if (e.target.closest("[data-feat]")) { desk.a = desk.b = null; rerender(); return; }
  if (e.target.closest("[data-more]")) { rec.limit += 40; rerender(); return; }
  if (e.target.closest("[data-bretry]")) { BLOAD.state = "idle"; rerender(); return; }
  const rg = e.target.closest("[data-range]");
  if (rg) { rec.range = rg.dataset.range; rerender(); return; }
  const ep = e.target.closest(".pick[data-epick]");
  if (ep) {
    const s = evPick[ep.dataset.ev] = evPick[ep.dataset.ev] || {}, t = ep.dataset.epick;
    if ((s.next || "a") === "a") { if (t !== s.b) s.a = t; else [s.a, s.b] = [s.b, s.a]; s.next = "b"; }
    else { if (t !== s.a) s.b = t; else [s.a, s.b] = [s.b, s.a]; s.next = "a"; }
    rerender(); return;
  }
  const add = e.target.closest("[data-addpick]");
  if (add) {
    const s = evPick[add.dataset.ev] = evPick[add.dataset.ev] || {}, t = add.dataset.addpick;
    if (s.a === t) s.a = null; else if (s.b === t) s.b = null;
    else if (!s.a) s.a = t; else if (!s.b) s.b = t; else { s.a = s.b; s.b = t; }
    s.next = "a";
    if (s.a && s.b) { location.hash = `e-${add.dataset.ev}.matchup`; return; }
    rerender(); return;
  }
  const es = e.target.closest("[data-eswap]");
  if (es) { const s = evPick[es.dataset.eswap]; [s.a, s.b] = [s.b, s.a]; rerender(); return; }
  const cmp = e.target.closest("[data-cmp]");
  if (cmp) { desk.a = cmp.dataset.cmp; desk.b = CMP_NAMES.find(n => n !== desk.a); desk.feat = null; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.rf) { rec[t.dataset.rf] = t.value; rec.limit = 40; rerender(); }
  if (t.dataset && t.dataset.recb) {
    rec.b = t.checked; rec.limit = 40;
    if (!rec.b && EV_BY[rec.ev]?.tl === "B") rec.ev = "";
    rerender(); const b = $("[data-recb]"); if (b) b.focus({ preventScroll: true });
  }
  if (t.dataset && t.dataset.tier) { tierOn[t.dataset.tier] = t.checked; saveTiers(); rerender(); const b = $(`[data-tier="${t.dataset.tier}"]`); if (b) b.focus({ preventScroll: true }); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "dSearch") return;
  desk.q = e.target.value; // only the dialog's tile grid changes while typing
  const g = $("#dGrid");
  if (g) g.innerHTML = builderTiles();
});
// when the chooser closes (Escape, backdrop, Close), focus goes back to the button that opened it
document.addEventListener("close", e => {
  if (e.target.id !== "tDlg") return;
  const btn = $(`[data-chg="${dlgSide}"]`);
  if (btn && (document.activeElement === document.body || !document.activeElement || e.target.contains(document.activeElement))) btn.focus({ preventScroll: true });
}, true);

document.addEventListener("pointermove", e => {
  const svg = e.target.closest && e.target.closest("svg.spark");
  if (!svg) return;
  const tr = JSON.parse(svg.dataset.trace);
  const [L, R, Tp, B, lo, hi, W, H] = svg.dataset.geo.split(",").map(Number);
  const box = svg.getBoundingClientRect();
  const sx = (e.clientX - box.left) * W / box.width;
  const step = (W - L - R) / Math.max(1, tr.length - 1);
  const i = Math.max(0, Math.min(tr.length - 1, Math.round((sx - L) / step)));
  const x = L + i * step, y = Tp + (hi - tr[i][1]) * (H - Tp - B) / (hi - lo);
  const g = svg.querySelector(".hover");
  g.setAttribute("visibility", "visible");
  const ln = g.querySelector("line"); ln.setAttribute("x1", x); ln.setAttribute("x2", x);
  const c = g.querySelector("circle"); c.setAttribute("cx", x); c.setAttribute("cy", y);
  const tx = g.querySelector("text");
  tx.textContent = `${tr[i][1]} on ${fmtDate(tr[i][0])}`;
  tx.setAttribute("x", x > W / 2 ? x - 8 : x + 8); tx.setAttribute("y", Math.max(Tp + 10, y - 8));
  tx.setAttribute("text-anchor", x > W / 2 ? "end" : "start");
});
document.addEventListener("pointerleave", e => {
  if (e.target.matches && e.target.matches("svg.spark")) e.target.querySelector(".hover").setAttribute("visibility", "hidden");
}, true);

// Stats: hover the season chart to read the nearest point
document.addEventListener("pointermove", e => {
  const svg = e.target.closest && e.target.closest("svg.rchart");
  if (!svg) return;
  const pts = JSON.parse(svg.dataset.pts), [W, H, L, R] = svg.dataset.geo.split(",").map(Number);
  const box = svg.getBoundingClientRect(), sx = (e.clientX - box.left) * W / box.width;
  let k = 0;
  for (let i = 1; i < pts.length; i++) if (Math.abs(pts[i][0] - sx) < Math.abs(pts[k][0] - sx)) k = i;
  const [px, py, day, v, what] = pts[k], g = svg.querySelector(".hover");
  g.setAttribute("visibility", "visible");
  const ln = g.querySelector("line"); ln.setAttribute("x1", px); ln.setAttribute("x2", px);
  const c = g.querySelector("circle"); c.setAttribute("cx", px); c.setAttribute("cy", py);
  const tx = g.querySelector("text"), t1 = tx.querySelector(".t1"), t2 = tx.querySelector(".t2");
  t1.textContent = `${day}: ${v}%`; t2.textContent = what;
  const left = px > W / 2, tw = Math.max(t1.textContent.length, what.length) * 5.6 + 16;
  const bx = left ? px - tw - 10 : px + 10, by = Math.min(Math.max(py - 40, 4), H - 48);
  t1.setAttribute("x", bx + 8); t1.setAttribute("y", by + 15); t2.setAttribute("x", bx + 8); t2.setAttribute("y", by + 30);
  const rc = g.querySelector("rect"); rc.setAttribute("x", bx); rc.setAttribute("y", by); rc.setAttribute("width", tw); rc.setAttribute("height", 38);
});
document.addEventListener("pointerleave", e => {
  if (e.target.matches && e.target.matches("svg.rchart")) e.target.querySelector(".hover").setAttribute("visibility", "hidden");
}, true);

$("#snap").textContent =`Data as of ${fmtDate(DATA.as_of)}`;
go();
</script>
