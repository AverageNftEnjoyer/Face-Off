/* ---------------- one tournament ---------------- */
const dayPick = {};
const evPick = {};      // slug -> {a, b, next}
const evMap = {};       // slug -> the map whose standings are open on that tournament page

// Every team's record on one map at one tournament, from every map with a winner
// played there so far (so day 5 includes days 1-4; it grows with each refresh).
function mapStandings(e, mp) {
  const by = {};
  let maps = 0;
  const days = new Set();
  for (const m of e.matches) {
    if (!m.t1 || !m.t2) continue;
    for (const x of m.maps || []) {
      if (x.map !== mp || (x.w !== 1 && x.w !== 2)) continue;
      maps++; if (m.day) days.add(m.day);
      const has = x.s1 != null && x.s2 != null;
      for (const [t, mine, won] of [[m.t1, 1, x.w === 1], [m.t2, 2, x.w === 2]]) {
        const r = by[t] = by[t] || { team: t, w: 0, l: 0, rf: 0, ra: 0, rounds: false };
        if (won) r.w++; else r.l++;
        if (has) { r.rf += mine === 1 ? x.s1 : x.s2; r.ra += mine === 1 ? x.s2 : x.s1; r.rounds = true; }
      }
    }
  }
  const rows = Object.values(by).sort((p, q) =>
    q.w / (q.w + q.l) - p.w / (p.w + p.l) || (q.w + q.l) - (p.w + p.l) || (q.rf - q.ra) - (p.rf - p.ra) || p.team.localeCompare(q.team));
  return { rows, maps, days: days.size };
}
function mapPlays(e, mp) {
  let n = 0;
  for (const m of e.matches) for (const x of m.maps || []) if (x.map === mp && (x.w === 1 || x.w === 2)) n++;
  return n;
}
function mapPanel(e) {
  const mp = evMap[e.slug];
  if (!mp) return "";
  const { rows, maps, days } = mapStandings(e, mp);
  const body = rows.length ? `<div class="tablewrap"><table class="maptbl">
      <thead><tr><th>#</th><th>Team</th><th class="n">Maps</th><th class="n">Won-lost</th><th class="n">Win rate</th><th class="n">Rounds</th><th class="n">Round diff</th></tr></thead>
      <tbody>${rows.map((r, i) => {
        const n = r.w + r.l, wr = (r.w / n * 100).toFixed(2), rd = r.rf - r.ra;
        return `<tr><td>${i + 1}</td><td>${tlink(r.team)}</td><td class="n">${n}</td><td class="n">${r.w}-${r.l}</td>
          <td class="n"><b class="${pcc(wr)}">${wr}%</b></td>
          <td class="n">${r.rounds ? `${r.rf}-${r.ra}` : "-"}</td><td class="n ${r.rounds ? (rd > 0 ? "win" : rd < 0 ? "loss" : "") : ""}">${r.rounds ? (rd > 0 ? "+" : "") + rd : "-"}</td></tr>`;
      }).join("")}</tbody></table></div>`
    : `<p class="empty">Nobody has played ${esc(mp)} at ${esc(e.name)} yet. It fills in as the maps are played.</p>`;
  return `<section class="panel mapstand" aria-live="polite">
    <h2>${esc(mp)} at ${esc(e.name)} <span class="dim">${maps ? `best to worst, from ${maps} map${maps === 1 ? "" : "s"} played over ${days} day${days === 1 ? "" : "s"}; updates as each day's results come in` : ""}</span></h2>
    ${body}
    <div class="links"><button type="button" class="btn" data-evmap="${esc(mp)}" data-ev="${e.slug}">Close ${esc(mp)}</button></div>
  </section>`;
}

function matchRow(m) {
  const a = m.t1, b = m.t2, live = isLive(m), w = winnerOf(m);
  const pred = decode(m.pred);
  let mid, tag = "";
  if (m.finished || live) mid = `<div class="mid cond"><span class="${m.w1 > m.w2 ? "ct" : ""}">${m.w1}</span> : <span class="${m.w2 > m.w1 ? "t" : ""}">${m.w2}</span></div>`;
  else if (pred) {
    // the model's pick for the format actually played, its most likely winning score and the chance
    const bo = [1, 3, 5].includes(m.bo) ? m.bo : 3;
    const p = pFor(pred, bo).p, pickA = p >= .5, pick = pickA ? a : b;
    const pp = displayPercent([p, 1 - p])[pickA ? 0 : 1];
    const set = scoreSet(pred, bo), top = set[predictedIdx(set, p)];
    const sc = bo === 1 ? "" : scoreFrom(top, pickA).replace("-", "–");
    mid = `<div class="mid mpick" title="${esc(`Model's pre-match pick: ${pick}${sc ? ` ${sc}` : ""}, ${pp}% to win the series`)}">
      <span class="mpl">Model pick</span>
      <span class="pk">${logo(pick, "xs")}<b>${esc(pick)}</b>${sc ? `<span class="psc">${sc}</span>` : ""}</span>
      <span class="pbar"><s class="${pickA ? "" : "r"}"><i style="width:${pp}%"></i></s><span class="pp">${pp}%</span></span></div>`;
  }
  else mid = `<div class="mid pct">vs</div>`;
  if (live) tag = `<span class="chip live">Live</span>`;
  else if (m.finished && pred) {
    const fav = pred.p >= .5 ? a : b;
    const pair = displayPercent([pred.p, 1 - pred.p]);
    const favPct = pred.p >= .5 ? pair[0] : pair[1];
    tag = `<span class="chip ${fav === w ? "hit" : "miss"}" title="Model favored ${esc(fav)} at ${favPct}%">${missLabel(fav === w, Math.max(pred.p, 1 - pred.p))}</span>`;
  }
  const team = (t, side) => {
    const src = !t ? slotSource(m, side ? 1 : 0) : null;   // an open slot names the match that fills it
    return `<div class="tm ${side}${w && t !== w ? " lost" : ""}">${logo(t)}${src ? `<span class="src" title="${esc(src.title)}">${src.html}</span>` : `<span>${esc(t || "To be decided")}</span>`}</div>`;
  };
  // the visitor's own clock; if that falls on another calendar day than the event's, say which
  const ld = localDay(m.when), otherDay = ld && m.day && ld !== m.day;
  const inner = `<div class="time"><b>${clock(m.when) || (m.day ? fmtDay(m.day) : "TBA")}</b><span>${m.when ? tz(m.when) : ""}${otherDay ? ` ${esc(wday(ld))}` : ""}</span></div>
    ${team(a, "")}${mid}${team(b, "r")}
    <div class="tag">${tag}${rfBadge(rfSides(m.rf, a, b))}<span>${esc(m.stage)}${m.bo !== 3 ? `, Bo${m.bo}` : ""}</span></div>`;
  return a && b ? `<a class="mrow" href="#m-${m.id}">${inner}</a>` : `<div class="mrow">${inner}</div>`;
}

function evHero(e) {
  const facts = [
    ["Dates", span(e.start, e.end)],
    e.city ? ["Location", `${e.city}${e.country ? ", " + e.country : ""}`] : e.type ? ["Format", e.type] : null,
    e.venue ? ["Venue", e.venue] : null,
    prizeTxt(e) ? ["Prize pool", prizeTxt(e)] : null,
    e.organizer ? ["Organizer", e.organizer] : null,
    e.tier ? ["Tier", e.tier] : null,
  ].filter(Boolean);
  const n = evTeamsList(e).length;
  if (n) facts.splice(facts.findIndex(f => f[0] === "Prize pool") + 1 || facts.length, 0, ["Teams", String(n)]);
  const f = finalOf(e), P = e.placements || {};
  let crown;
  if (e.champion) {
    const third = Object.keys(P).filter(t => P[t].from === 3);
    crown = `<div class="crown" style="${tcVars(e.champion)}">${logo(e.champion)}
      <span class="lbl">Champion</span>
      ${T[e.champion] ? `<a class="who" href="#t-${T[e.champion].slug}">${esc(e.champion)}</a>` : `<span class="who">${esc(e.champion)}</span>`}
      ${f ? `<span class="sub">Beat ${logo(f.l, "sm")}<b>${esc(f.l)}</b> ${f.sw}–${f.sl} in the final${third.length ? `; ${third.length > 1 ? "semifinalists" : "third"}: ${third.map(esc).join(", ")}` : ""}</span>` : ""}
    </div>`;
  } else if (e.status === "live") {
    const total = dayDiff(e.start, e.end) + 1, today = Math.min(Math.max(dayDiff(e.start, DATA.as_of) + 1, 1), total);
    const alive = evTeamsList(e).filter(t => !P[t] || P[t].label === "Still playing").length;
    crown = `<div class="crown state live"><span class="lbl">Running now</span><span class="who">Day ${today} of ${total}</span><span class="sub"><b>${alive}</b> of ${n} teams still in</span></div>`;
  } else if (e.status === "upcoming") {
    const d = dayDiff(DATA.as_of, e.start);
    crown = `<div class="crown state"><span class="lbl">First series</span><span class="who">${d <= 0 ? "Starting" : d === 1 ? "Tomorrow" : `In ${d} days`}</span><span class="sub">${n ? `<b>${n}</b> teams announced` : "Teams to be announced"}</span></div>`;
  } else crown = "";
  return `<section class="evhero">
    ${evImg(e, "evlogo")}
    <div>
      <div class="evtop">${statusChip(e)}${favBtn(e, true)}</div>
      <h1 class="cond" style="margin-top:.5rem">${esc(e.name)}</h1>
      <dl class="facts">${facts.map(([k, v]) => `<div class="${k === "Prize pool" || k === "Dates" ? "big" : ""}"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    </div>
    ${crown}
  </section>`;
}

function viewEvent(slug, sub) {
  const e = EV_BY[slug];
  if (!e) return `<p>Tournament not found. <a class="btn" href="#events">All tournaments</a></p>`;
  const tabs = [["", "Matches"], ["teams", "Teams & lineups"], ["matchup", "Build a matchup"]];
  const nav = `<nav class="subtabs" aria-label="Tournament sections">${tabs.map(([k, l]) => `<a href="#e-${slug}${k ? "." + k : ""}" ${sub === k ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>`;
  let body;
  if (sub === "teams") body = evTeams(e);
  else if (sub === "matchup") body = evMatchup(e);
  else body = evMatches(e);
  return `<nav class="crumb"><a href="#events">Tournaments</a><span>/</span><span>${esc(e.name)}</span></nav>${evHero(e)}${nav}${body}`;
}

function evMatches(e) {
  const days = [...new Set(e.matches.map(m => m.day).filter(Boolean))].sort();
  if (!days.length) return `<section class="panel"><p class="empty">No schedule published yet. ${e.participants.length ? `See <a class="btn" href="#e-${e.slug}.teams">Teams & lineups</a> or <a class="btn" href="#e-${e.slug}.matchup">build a matchup</a>.` : ""}</p></section>`;
  let d = dayPick[e.slug];
  if (!d || !days.includes(d)) {
    const live = e.matches.find(isLive);
    d = live ? live.day : e.status === "finished" ? days[days.length - 1] : (days.find(x => x >= DATA.as_of) || days[0]);
  }
  dayPick[e.slug] = d;
  const list = e.matches.filter(m => m.day === d).sort((x, y) => (x.when || "").localeCompare(y.when || ""));
  const groups = groupTables(e);
  const cols = playoffCols(e);
  const bm = m => {
    const w = winnerOf(m), live = isLive(m), played = m.finished || live;
    const pred = !played && m.t1 && m.t2 ? decode(m.pred) : null;
    const bo = [1, 3, 5].includes(m.bo) ? m.bo : 3;
    const pp = pred ? (p => ({ p, s: displayPercent([p, 1 - p]) }))(pFor(pred, bo).p) : null;
    const row = (t, s, i) => {
      const cls = !t ? "tbd" : w ? (t === w ? "won" : "lost") : "";
      const right = played ? `<b class="sc">${s}</b>`
        : pp ? `<span class="bp${(pp.p >= .5) === (i === 0) ? " pk" : ""}">${pp.s[i]}%</span>` : "";
      // an open slot names the match that fills it (its favourite first), never a new number
      const src = !t ? slotSource(m, i) : null;
      const nm = src ? `<span class="nm" title="${esc(src.title)}">${src.html}</span>` : `<span class="nm">${esc(t || "To be decided")}</span>`;
      return `<div class="bt ${cls}">${logo(t, "sm")}${nm}${right}</div>`;
    };
    const day = localDay(m.when) || m.day;
    const when = `${day ? `${wday(day)} ${fmtDay(day)}` : "TBA"}${m.when ? `, ${clock(m.when)}` : ""}`;
    const inner = `${row(m.t1, m.w1, 0)}${row(m.t2, m.w2, 1)}<div class="when"><span>${when}</span>${rfBadge(rfSides(m.rf, m.t1, m.t2), true)}${live ? `<span class="chip live">Live</span>` : ""}</div>`;
    const call = m.finished ? callOf(m) : null;
    const tip = pp ? `Model's pre-match chances: ${m.t1} ${pp.s[0]}%, ${m.t2} ${pp.s[1]}%`
      : call ? `Model's pre-match pick: ${call.fav} at ${call.favPct}% (${call.label.toLowerCase()})` : "";
    return m.t1 && m.t2 ? `<a class="bm" href="#m-${m.id}" title="${esc(tip)}">${inner}</a>` : `<div class="bm">${inner}</div>`;
  };
  const firstTz = e.matches.find(m => m.when);
  return `${evHub(e)}
  ${e.pool.length ? `<section class="pool" aria-label="Map pool: choose a map to see every team's record on it at this tournament">${e.pool.map(mp => {
    const n = mapPlays(e, mp);
    return `<button type="button" class="maptile" data-evmap="${esc(mp)}" data-ev="${e.slug}" aria-pressed="${evMap[e.slug] === mp}" style="${mapBg(mp)}" title="${esc(`${mp}: every team's record on it at this tournament`)}">
      <span class="cond">${esc(mp)}<small>${esc(DATA.map_info[mp]?.location || "")}${n ? `, played ${n}×` : ""}</small></span></button>`;
  }).join("")}</section>${mapPanel(e)}` : ""}
  <div class="evbody">
    <section class="panel">
      <h2>Matches <span class="dim">${firstTz ? `times in your time zone (${esc(tz(firstTz.when))}); ` : ""}the middle column is the model's pre-match pick</span></h2>
      <div class="days" role="group" aria-label="Match day">${days.map(x => `<button type="button" data-day="${x}" data-ev="${e.slug}" aria-pressed="${x === d}"><b>${wday(x)} ${fmtDay(x)}</b><span>${e.matches.filter(m => m.day === x).length} matches</span></button>`).join("")}</div>
      <div class="mlist">${list.map(matchRow).join("")}</div>
      ${list.some(m => !m.t1 || !m.t2) ? `<p class="small dim">Opponents for open slots are set by earlier results.</p>` : ""}
    </section>
    <div class="evside">
      ${groups.length ? `<section class="panel"><h2>${e.swiss ? "Swiss tables" : "Group tables"} <span class="dim">${e.swiss ? "3 wins to advance, 3 losses out" : "series won and lost"}</span></h2>
        ${groups.map(([name, rows]) => {
          // each team's next scheduled series in this group, with the model's pre-match chance for that team
          const nx = Object.fromEntries(rows.map(r => [r.team, nextInGroup(e, name, r.team)]));
          const showNx = rows.some(r => nx[r.team]);
          return `<div class="grouptbl">${groups.length > 1 ? `<h3>${esc(name)}</h3>` : ""}<div class="tablewrap"><table${showNx ? ` class="hasnx"` : ""}>
          <thead><tr><th>#</th><th>Team</th><th class="n">Series</th><th class="n">Maps</th>${showNx ? `<th class="gnx" title="Next series and the model's pre-match chance for this team">Next</th>` : ""}<th class="n">VRS</th></tr></thead>
          <tbody>${rows.map((r, i) => `<tr class="${e.swiss && r.w >= 3 ? "up" : e.swiss && r.l >= 3 ? "out" : ""}"><td>${i + 1}</td><td>${tlink(r.team)}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.mw}-${r.ml}</td>${showNx ? `<td class="gnx">${nx[r.team] || ""}</td>` : ""}<td class="n dim">${T[r.team]?.vrs ? "#" + T[r.team].vrs.rank : "-"}</td></tr>`).join("")}</tbody>
        </table></div></div>`;
        }).join("")}</section>` : ""}
    </div>
    <div class="evside">
      ${standings(e)}
      ${e.format.length ? `<section class="panel"><h2>Format</h2><ul class="fmt">${e.format.map(([dd, t]) => `<li class="d${dd}">${esc(t)}</li>`).join("")}</ul></section>` : ""}
    </div>
  </div>
  ${bracketBlocks(cols).map(([fam, cs]) => `<section class="panel"><h2>${esc(fam)}${cs.some(c => c.list.some(m => !m.finished && !isLive(m) && m.t1 && m.t2 && m.pred)) ? ` <span class="dim">percentages are the model's pre-match chances</span>` : ""}</h2>${bracketHtml(cs, bm)}</section>`).join("")}`;
}

// Bracket columns split into one block per stage ("Play-In", "Group Stage Group A", "Playoffs"),
// so a play-in, its groups and the playoffs are not squeezed into a single row of columns
const ELIM = ["Round of 32", "Round of 16", "Quarterfinal", "Semifinal", "Third-place match", "Grand final"];
function bracketBlocks(cols) {
  const blocks = [];
  for (const c of cols) {
    const fam = ELIM.includes(c.name) ? "Playoffs" : c.name.replace(/,?\s*round \d+$/i, "").trim() || "Playoffs";
    let b = blocks.find(b => b[0] === fam);
    if (!b) blocks.push(b = [fam, []]);
    const r = c.name.match(/round (\d+)$/i);
    b[1].push({ ...c, label: r ? `Round ${r[1]}` : c.name });
  }
  for (const b of blocks) {           // within a block: rounds in order, the final last
    const k = c => ELIM.includes(c.name) ? 100 + ELIM.indexOf(c.name) : +(c.name.match(/round (\d+)$/i) || [0, 0])[1];
    b[1].sort((x, y) => k(x) - k(y));
  }
  return blocks;
}

// One bracket block. When every round has half the matches of the one before (a single-
// elimination tree) the matches go in bracket-slot order, so matches 2k-1 and 2k sit beside
// the match k they feed, and CSS draws the joining lines. The third-place match sits under the final.
const bySlot = l => [...l].sort((x, y) => (x.slot ?? 1e3) - (y.slot ?? 1e3));
// A block's rounds in slot order, its third-place match, and whether it is a single-elimination tree
function bracketShape(cs) {
  const rounds = cs.filter(c => c.name !== "Third-place match").map(c => ({ ...c, list: bySlot(c.list) }));
  const third = cs.filter(c => c.name === "Third-place match");
  const tree = rounds.length > 1 && rounds.every((c, i) => !i || c.list.length * 2 === rounds[i - 1].list.length);
  return { rounds, third, tree };
}
function bracketHtml(cs, bm) {
  const { rounds, third, tree } = bracketShape(cs);
  const n = Math.max(1, rounds.length);
  const head = c => {
    const bos = [...new Set(c.list.map(m => m.bo))];
    return `<h3>${esc(c.label)}${bos.length === 1 ? `<small>Bo${bos[0]}</small>` : ""}</h3>`;
  };
  // a line lights up once the match it leaves is decided
  const col = (c, i) => `<div class="bcol${tree && i < n - 1 ? " out" : ""}${tree && i > 0 ? " in" : ""}">${head(c)}<div class="bslots">${c.list.map((m, j) => {
    const fed = i > 0 && tree && [2 * j, 2 * j + 1].some(k => rounds[i - 1].list[k]?.finished);
    return `<div class="bslot${m.finished ? " done" : ""}${fed ? " fed" : ""}">${bm(m)}</div>`;
  }).join("")}</div></div>`;
  const tp = third.map(c => `<div class="bthird" style="grid-column:${n}">${head(c)}${bySlot(c.list).map(bm).join("")}</div>`).join("");
  const tuck = tp && tree && rounds[0].list.length >= 4;
  const cols = rounds.map(col).map((h, i) => tuck && i === n - 1 ? h.replace('class="bcol', 'class="bcol hasthird').replace(/<\/div>$/, tp + "</div>") : h);
  return `<div class="bracket${tree ? " tree" : ""}" style="grid-template-columns:repeat(${n},minmax(10.5rem,17rem))">${cols.join("")}${tuck ? "" : tp}</div>`;
}

// Final standings: each prize slot with its money and the teams that finished there
function standings(e) {
  if (!e.prizes.length) return "";
  const P = e.placements || {};
  const teams = Object.keys(P);
  const sort = ts => ts.sort((a, b) => (T[b]?.elo || 0) - (T[a]?.elo || 0));
  const chips = ts => ts.length ? sort(ts).map(t => tlink(t)).join("") : `<span class="open">${e.status === "finished" ? "" : "Open"}</span>`;
  const row = (pl, cls, money, ts) => `<div><span class="pl ${cls}">${pl}</span><span class="usd">${money}</span><span class="tms">${chips(ts)}</span></div>`;
  const alive = teams.filter(t => P[t].label === "Still playing");
  const other = {};
  for (const t of teams) if (P[t].from == null && P[t].label !== "Still playing") (other[P[t].label] = other[P[t].label] || []).push(t);
  const title = e.status === "finished" ? "Final standings" : e.status === "live" ? "Standings so far" : "Prize pool";
  const note = e.status === "upcoming" ? "" : e.status === "live" ? "places fill as teams are knocked out" : "places from the results; prize money per team";
  return `<section class="panel"><h2>${title} <span class="dim">${note}</span></h2><div class="stand">
    ${alive.length ? row("Still in", "", "", alive) : ""}
    ${e.prizes.map(p => row(p.from === p.to ? ordinal(p.from) : `${ordinal(p.from)}–${ordinal(p.to)}`, p.from === 1 ? "p1" : "",
      p.usd ? usd(p.usd) : "", teams.filter(t => P[t].from === p.from && P[t].to === p.to))).join("")}
    ${Object.entries(other).map(([l, ts]) => row(esc(l), "", "", ts)).join("")}
  </div></section>`;
}

/* ---------------- following a tournament: hub, open slots, next opponents ----------------
   Everything here re-reads the schedule, the results and each match's own pre-match call
   (m.pred). No number is made up: a percentage shown is always one match's own model chance,
   and it says which match. Event state comes from the build (e.status, from the event dates
   and the data's as-of day); match order comes from the schedule's own times. */
const FOLLOW = {
  hubNext: 6,        // "Next up" rows in the hub: about one match day of a big event, without burying the tables
  hubRecent: 4,      // "Latest results" rows in the hub: the last few series; the day list below has the rest
  homeSoonDays: 14,  // home page: an upcoming event that starts within two weeks gets a card
  homeCards: 3,      // home page: at most this many tournament cards, so the matchup desk stays near the top
};
const byTime = (a, b) => (a.day || "9999").localeCompare(b.day || "9999") || (a.when || "").localeCompare(b.when || "");
const boOf = m => [1, 3, 5].includes(m.bo) ? m.bo : 3;
// a match not played yet that is still current: dated no earlier than the day before the data's as-of day
// (the same rule as the home page's "Coming up"; older unfinished records are page rot, not fixtures)
const pendingNow = m => !m.finished && !isLive(m) && m.day && m.day >= daysBefore(DATA.as_of, 1);

// Playoff matches as bracket columns, one per stage name, in date order
function playoffCols(e) {
  const cols = [];
  for (const m of e.matches.filter(m => m.kind === "playoffs").sort((x, y) => (x.day || "").localeCompare(y.day || ""))) {
    let c = cols.find(c => c.name === m.stage);
    if (!c) cols.push(c = { name: m.stage, list: [] });
    c.list.push(m);
  }
  return cols;
}

// Where each playoff match's teams come from and where its winner goes, for single-elimination
// trees only (bracketShape: every round half the one before, slots 2k-1 and 2k feed slot k).
// {id: {from: [id, id], loser: bool, next: id}}; built once, on first use.
let FEED = null;
function feeds() {
  if (FEED) return FEED;
  FEED = {};
  const at = id => FEED[id] = FEED[id] || {};
  for (const e of EV) for (const [, cs] of bracketBlocks(playoffCols(e))) {
    const { rounds, third, tree } = bracketShape(cs);
    if (!tree) continue;
    rounds.forEach((c, i) => c.list.forEach((m, j) => {
      const nx = rounds[i + 1] && rounds[i + 1].list[j >> 1];
      if (nx) at(m.id).next = nx.id;
      if (i) at(m.id).from = [rounds[i - 1].list[2 * j], rounds[i - 1].list[2 * j + 1]].map(x => x && x.id);
    }));
    // the third-place match is played by the two losers of the round before the final
    const semis = rounds[rounds.length - 2];
    if (semis && semis.list.length === 2) for (const c of third) for (const m of c.list) Object.assign(at(m.id), { from: semis.list.map(x => x.id), loser: true });
  }
  return FEED;
}
const loserOf = m => m.finished ? (winnerOf(m) === m.t1 ? m.t2 : m.t1) : null;
// a short name for a match: its two teams, else its round and bracket slot ("Semifinal 1")
const matchName = m => m.t1 && m.t2 ? `${m.t1} vs ${m.t2}` : `${m.stage}${m.slot ? " " + m.slot : ""}`;
// The match that fills an open slot of match m (side 0 = Team 1, 1 = Team 2), as
// {html, title}; null when the bracket shape gives no source. The two candidates are
// listed favourite first by that match's own pre-match call; no new number is shown.
function slotSource(m, side) {
  const f = feeds()[m.id];
  if (!f || !f.from) return null;
  const src = f.from.map(id => MATCH[id]);
  const sent = x => x && x.finished && [m.t1, m.t2].includes(f.loser ? loserOf(x) : winnerOf(x));
  // one side already filled: the open side comes from the feeder that has not sent its team yet
  const open = src.filter(x => x && !sent(x));
  const x = (m.t1 || m.t2) && open.length === 1 ? open[0] : src[side];
  if (!x) return null;
  const role = f.loser ? "Loser" : "Winner";
  if (x.finished) {
    const t = f.loser ? loserOf(x) : winnerOf(x);
    return { html: esc(t), title: `${t}: ${role.toLowerCase()} of ${matchName(x)} (${x.w1}-${x.w2}); the schedule has not filled this slot yet` };
  }
  if (x.t1 && x.t2 && x.pred) {
    const p = pFor(decode(x.pred), boOf(x)).p, pair = displayPercent([p, 1 - p]);
    // for "Loser of", the underdog is the likelier one to arrive, so it is listed first
    const aFirst = (p >= .5) !== !!f.loser;
    const [u, v] = aFirst ? [x.t1, x.t2] : [x.t2, x.t1];
    return { html: `<small>${role}:</small> ${esc(u)} <i>or</i> ${esc(v)}`,
      title: `${role} of ${x.stage}: ${x.t1} vs ${x.t2}. Model's pre-match chances for that match: ${x.t1} ${pair[0]}%, ${x.t2} ${pair[1]}%` };
  }
  return { html: `<small>${role} of</small> ${esc(matchName(x))}`, title: `${role} of ${matchName(x)}` };
}
// Where the winner of match m goes next: {m: next match, opp: html for the other slot}, or null
function nextStep(m) {
  const f = feeds()[m.id];
  const nx = f && f.next && MATCH[f.next];
  if (!nx) return null;
  const nf = feeds()[nx.id] || {};
  const side = nf.from ? nf.from.indexOf(m.id) : -1;
  if (side < 0) return null;
  const oppT = side === 0 ? nx.t2 : nx.t1;
  const os = oppT ? null : slotSource(nx, 1 - side);
  return { m: nx, opp: oppT ? `${logo(oppT, "xs")}<b>${esc(oppT)}</b>` : os ? `<span title="${esc(os.title)}">${os.html}</span>` : "To be decided" };
}
// The model's pre-match call on a finished match, for the format played
function callOf(m) {
  if (!m.finished || !m.pred || !m.t1 || !m.t2) return null;
  const p = pFor(decode(m.pred), boOf(m)).p, pair = displayPercent([p, 1 - p]);
  const fav = p >= .5 ? m.t1 : m.t2, w = winnerOf(m), fp = Math.max(p, 1 - p);
  return { fav, w, hit: fav === w, fp, favPct: p >= .5 ? pair[0] : pair[1], label: missLabel(fav === w, fp) };
}
// A team's next scheduled series in one group / Swiss stage, as a small cell: opponent and the
// model's pre-match chance for this team in that series
function nextInGroup(e, name, team) {
  const m = e.matches.filter(m => m.kind === "groups" && m.t1 && m.t2 && (m.t1 === team || m.t2 === team) && groupKey(m.stage) === name && !m.finished)
    .sort(byTime)[0];
  if (!m) return "";
  const opp = m.t1 === team ? m.t2 : m.t1;
  const p = m.pred ? pFor(decode(m.pred), boOf(m)).p : null;
  const mine = p == null ? null : displayPercent([p, 1 - p])[m.t1 === team ? 0 : 1];
  return `<a href="#m-${m.id}" title="${esc(`${isLive(m) ? "Playing now" : "Next"}: vs ${opp}${mine != null ? `; model's pre-match chance for ${team}: ${mine}%` : ""}`)}">${logo(opp, "xs")}${mine != null ? `<b class="${+mine >= 50 ? "fav" : ""}">${mine}%</b>` : `<span class="dim">vs</span>`}</a>`;
}
// The visitor's own day label for a match day: Today / Tomorrow / "Wed 14 Oct"
function dayWord(d) {
  const now = new Date(), iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  const tom = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  return d === iso(now) ? "Today" : d === iso(tom) ? "Tomorrow" : `${wday(d)} ${fmtDay(d)}`;
}
// The model's record on the finished series of one event, plus its biggest miss
function evRecord(e) {
  const calls = e.matches.map(m => ({ m, c: callOf(m) })).filter(x => x.c);
  if (!calls.length) return null;
  const hits = calls.filter(x => x.c.hit).length;
  const upset = calls.filter(x => !x.c.hit).sort((a, b) => b.c.fp - a.c.fp)[0] || null;
  return { n: calls.length, hits, upset };
}

function notesSkeleton(title = "Matchup context") {

/* Notes are generated on request: a panel renders as a slot (skeleton), the observer below

/* ---------------- track record ----------------
   Built only from finished matches on this site that carry the model's
   pre-match call (each call uses results dated before the match day).
   Calls dated on or before the day the model's weights were last fitted
   (DATA.track.fit_end) are in-sample and are left out.

   The page's own track-record settings, in one place. Each is a display
   choice; the calibration buckets and their pass rule come from the
   evaluation code (DATA.track, from walkforward.py), not from here. */
const TRACK = {
  minTeamCalls: 8,   // best / worst lists skip teams with fewer calls: a share from a handful is noise
  page: 15,          // rows added to the call log (and team table) per "Show more"
  streak: 20,        // calls in the "current run" strip
  cards: 5,          // best calls / worst misses listed
  roll: [10, 40, 5], // season trend: share right over the previous w calls, w = n / 5 kept within 10..40
  z: 1.959964,       // 95% Wilson interval, the same z as backtest.wilson
  eps: 1e-15,        // log-loss probability clip, the same as backtest.log_loss
};
const TR = DATA.track;
const BUCKETS = TR.buckets.map(([lo, hi], i, all) => [lo, hi, i === all.length - 1 && hi >= 1 ? `${Math.round(lo * 100)}% and up` : `${Math.round(lo * 100)}-${Math.round(hi * 100)}%`]);

const inBucket = (p, i) => p >= BUCKETS[i][0] && (p < BUCKETS[i][1] || (i === BUCKETS.length - 1 && p <= BUCKETS[i][1]));
let CALLS = null, CALLS_INSAMPLE = 0;
function callLog() {
  if (CALLS) return CALLS;

  for (const m of Object.values(MATCH)) {
    if (!m.finished || !m.pred || !m.t1 || !m.t2 || m.w1 === m.w2) continue;
    if (TR.fit_end && (m.day || "") <= TR.fit_end) { CALLS_INSAMPLE++; continue; }
    const bo = [1, 3, 5].includes(m.bo) ? m.bo : 3;
    const pr = decode(m.pred), w = winnerOf(m), pf = pFor(pr, bo).p;
    const pickA = pr.p >= .5, pick = pickA ? m.t1 : m.t2, opp = pickA ? m.t2 : m.t1;
    const set = scoreSet(pr, bo);
    const top = set[predictedIdx(set, pr.p)];
    const elo = m.pred.e || null, q = typeof m.pred.q === "number" ? m.pred.q : null;
    out.push({
      id: m.id, day: m.day || "", when: m.when || "", e: EV_BY[m.ev], stage: m.stage, a: m.t1, b: m.t2, w, bo,
      // for scoring: the stated chance for team a (format played), the Elo-only chance for team a, the outcome
      pA: pf, qA: q, y: w === m.t1 ? 1 : 0,
      qPick: q == null ? null : pickA ? q : 1 - q,
      // the stated chance is for the format actually played (BO1 calls are less sure, BO5 more)
      pick, opp, pickP: pickA ? pf : 1 - pf, pickShown: displayPercent([pf, 1 - pf])[pickA ? 0 : 1],
      predTeam: winOf(top) ? m.t1 : m.t2, predScore: scoreFrom(top, winOf(top)),
      score: `${Math.max(m.w1, m.w2)}-${Math.min(m.w1, m.w2)}`, hit: pick === w,
      // bonus: the predicted score (the pick's most likely winning score) also happened
      exact: (winOf(top) ? m.t1 : m.t2) === w && scoreFrom(top, winOf(top)) === `${Math.max(m.w1, m.w2)}-${Math.min(m.w1, m.w2)}`,
      pickElo: elo ? elo[pickA ? 0 : 1] : null, oppElo: elo ? elo[pickA ? 1 : 0] : null,
    });

  out.sort((x, y) => (x.day + x.when).localeCompare(y.day + y.when) || String(x.id).localeCompare(String(y.id)));
  return CALLS = out;
}
function wilsonJS(k, n, z = TRACK.z) {

const acc2 = (h, n) => n ? (h / n * 100).toFixed(2) : "-";
// Stats colour for a share of right calls (as shown, e.g. "63.51"): above 60 green, above 50 amber, 50 and under red
const pcc = s => { const v = parseFloat(s); return isNaN(v) ? "" : v > 60 ? "pc-hi" : v > 50 ? "pc-mid" : "pc-lo"; };
/* numeric ISO dates on this page: days are already "YYYY-MM-DD"; trim any time part */
const isoDate = s => String(s || "").slice(0, 10) || "-";
const rec = { ev: "", team: "", res: "", exact: "", bo: "", band: "", from: "", to: "", limit: TRACK.page, tsort: "n", tlimit: TRACK.page };

/* Proper scores of a set of calls, on team a's stated chance for the format

  if (!n) return out;

  out.brier = brierOf(calls.map(c => c.pA), ys);
  out.ll = llOf(calls.map(c => c.pA), ys);

const f3 = v => v == null ? "-" : v.toFixed(3);
// model minus baseline, signed, coloured: negative (lower) is better for the model
const edge = (m, e) => m == null || e == null ? "" : `<span class="${m < e ? "win" : m > e ? "loss" : "dim"}">${m - e > 0 ? "+" : ""}${(m - e).toFixed(3)}</span>`;
const pctRange = ci => `${(ci[0] * 100).toFixed(1)}-${(ci[1] * 100).toFixed(1)}%`;



const RANGES = [["7", "7D"], ["30", "30D"], ["90", "90D"], ["all", "Season"]];
const daysBefore = (day, n) => new Date(Date.parse(day + "T00:00:00Z") - n * 864e5).toISOString().slice(0, 10);
function timeChart(calls) {
  const n = calls.length, w = Math.max(TRACK.roll[0], Math.min(TRACK.roll[1], Math.floor(n / TRACK.roll[2])));

    if (i >= w - 1) roll.push({ v: h / w, c: calls[i] });

  const cut = r === "all" ? "" : daysBefore(calls[n - 1].day, +r);

  const label = r === "all" ? "Whole season" : `Last ${r} days`;
  const summary = `<p class="small dim">${label}: ${ih} of ${inRange.length} right${inRange.length ? ` (<b class="${pcc(acc2(ih, inRange.length))}">${acc2(ih, inRange.length)}%</b>)` : ""}. The line is the share right over the previous ${w} calls; the dashed line is the season average. Hover the chart to read any point.</p>`;
  if (pts.length < 2) return `<div class="chart-head">${seg}</div><p class="empty">Fewer than two calls in this range. Pick a longer range.</p>${summary}`;

  const lo = Math.min(.4, Math.floor(Math.min(...pts.map(p => p.v)) * 10) / 10);
  const x = k => L + k / (pts.length - 1) * (W - L - R), y = v => Tp + (1 - v) / (1 - lo) * (H - Tp - B);

  // minor gridlines every 5 points, and a faint vertical line at each new month

  return rows.length ? `

}

function callCard(c, line) {

    <span class="dim">${esc(c.e.name)}, ${esc(c.stage)}, ${isoDate(c.day)}. Model: ${esc(c.pick)} ${c.pickShown}%${c.pickElo != null ? `, rated ${c.pickElo} against ${c.oppElo}` : ""}</span></a>`;

// the call log's filters (rec), applied to the whole record; newest first
function filteredCalls(calls) {
  return calls.filter(c => (!rec.ev || c.e.slug === rec.ev) && (!rec.team || c.a.toLowerCase().includes(rec.team.trim().toLowerCase()) || c.b.toLowerCase().includes(rec.team.trim().toLowerCase()))
    && (!rec.bo || String(c.bo) === rec.bo) && (rec.band === "" || inBucket(c.pickP, +rec.band))
    && (!rec.from || c.day >= rec.from) && (!rec.to || c.day <= rec.to)
    && (!rec.res || (rec.res === "hit") === c.hit) && (!rec.exact || (rec.exact === "hit") === c.exact)).reverse();
}
const FILTER_KEYS = ["ev", "team", "bo", "band", "from", "to", "res", "exact"];

// every call in the current filter as CSV: the raw numbers anyone can re-score
function callsCsv(list) {
  const cell = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ["date", "tournament", "stage", "best_of", "team_a", "team_b", "model_p_a", "elo_only_p_a",
    "elo_a", "elo_b", "pick", "pick_p", "winner", "series_score", "pick_right", "match_id"];
  const rows = list.map(c => [c.day, c.e.name, c.stage, c.bo, c.a, c.b, c.pA.toFixed(6), c.qA == null ? "" : c.qA.toFixed(6),

    c.pick, c.pickP.toFixed(6), c.w, c.score, c.hit ? 1 : 0, c.id]);
  return [head, ...rows].map(r => r.map(cell).join(",")).join("\n") + "\n";
}

function teamTable(calls) {

  const key = {
    n: (p, q) => q.n - p.n,

    edge: (p, q) => ((p.brier - (p.brierE ?? p.brier)) - (q.brier - (q.brierE ?? q.brier))) || q.n - p.n,
  }[rec.tsort] || ((p, q) => q.n - p.n);

      <span class="streak">${calls.slice(-TRACK.streak).map(c => `<i class="${c.hit ? "h" : "m"}" title="${esc(`${c.a} vs ${c.b}: ${c.hit ? "right" : "wrong"}`)}"></i>`).join("")}</span></div>
  </section>
  <div class="rec-row3">
    <section class="panel" id="rec-log"><h2>Every call <span class="dim">${list.length ? `${Math.min(rec.off || 0, list.length - 1) + 1}–${Math.min((rec.off || 0) + TRACK.page, list.length)} of ${list.length}` : "none"}, ${ls.h} right</span>
</h2>
    <div class="filters">${sel("ev", "Tournament", evs.map(e => [e.slug, e.name]))}<label>Team<input type="search" data-rq="team" list="recTeams" placeholder="Search teams" value="${esc(rec.team || "")}" autocomplete="off"><datalist id="recTeams">${teams.map(t => `<option value="${esc(t)}"></option>`).join("")}</datalist></label>${fmts.length > 1 ? sel("bo", "Format", fmts.map(b => [String(b), `Best of ${b}`])) : ""}${sel("band", "Model said", BUCKETS.map((b, i) => [String(i), b[2]]))}${dateIn("from", "From")}${dateIn("to", "To")}${sel("res", "Winner", [["hit", "Right"], ["miss", "Wrong"]])}${sel("exact", "Exact score", [["hit", "Right"], ["miss", "Wrong"]])}<div class="fcsv">${anyFilter ? `<button type="button" class="btn" data-rclear="1">Clear</button>` : ""}<button type="button" class="btn" data-csv="1"${ls.n ? "" : " disabled"}>${HI.dl || ""}Download CSV</button></div></div>
    <div class="tablewrap"><table class="log"><thead><tr><th>Date</th><th class="xw">Tournament</th><th>Match</th><th>Model's pick</th><th>Predicted</th><th>Result</th><th class="pgcell"><span class="ho-pg" role="group" aria-label="Page through the calls"><button type="button" data-logpg="-1" aria-label="Newer calls"${(rec.off || 0) <= 0 ? " disabled" : ""}>${HI.prev}</button><button type="button" data-logpg="1" aria-label="Older calls"${(rec.off || 0) + TRACK.page >= list.length ? " disabled" : ""}>${HI.next}</button></span></th></tr></thead><tbody>

    <section class="panel"><h2>Worst misses <span class="dim">the most confident picks that lost</span></h2>

  </div>
</div>`;
}

/* ---------------- router + interactions ---------------- */
function route() {
  const h = decodeURIComponent((location.hash || "#home").slice(1));
  let html, tab = "home";
  PAIR = null;
  if (h === "" || h === "home" || h === "compare") { html = viewHome(); }
  else if (h === "events") { html = viewEvents(); tab = "events"; }
  else if (h === "teams") { html = viewTeams(); tab = "teams"; }
  else if (h === "record") { html = viewRecord(); tab = "record"; }
  else if (h.startsWith("m-")) { html = viewMatch(h.slice(2)); tab = "events"; }
  else if (h.startsWith("t-")) { html = viewTeam(h.slice(2)); tab = "teams"; }
  else if (h.startsWith("e-")) { const [slug, sub = ""] = h.slice(2).split("."); html = viewEvent(slug, sub); tab = "events"; }
  else html = viewHome();
  $("#view").classList.toggle("wide", !h || h === "home" || h === "compare");
  $("#view").classList.toggle("rwide", h === "record");
  // the top bar follows the page width so its edges line up with the content
  document.body.dataset.w = h === "record" ? "rwide" : (!h || h === "home" || h === "compare") ? "wide" : "";
  const evWide = h === "events" || h.startsWith("e-"); $("#view").classList.toggle("ewide", evWide); if (evWide) document.body.dataset.w = "ewide";
  const v = $("#view");
  document.body.dataset.page = tab === "home" ? "home" : "";
  v.innerHTML = html;
  const cu = v.querySelector("#hoCards");
  if (cu) { cu.scrollLeft = homeUi.cuScroll; hoPagerSync(cu); }
  updateBell();
  applyPair(v);
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.tab === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  animateBars(v);
  // narrow screens: the season calendar scrolls sideways; open it on today rather than on January
  const now = v.querySelector(".strip .now"), sw = now && now.closest(".strip-wrap");
  if (sw && sw.scrollWidth > sw.clientWidth) sw.scrollLeft = Math.max(0, now.offsetLeft - sw.clientWidth * .6);
  return h;
}
let lastHash = null;
function go() {
  const h = route();
  if (h !== lastHash) { window.scrollTo(0, 0); lastHash = h; }
}
// scrollbars show only while something scrolls (capture: scroll events do not bubble)
(() => {
  const timers = new WeakMap();
  addEventListener("scroll", e => {
    const el = e.target === document ? document.documentElement : e.target;
    if (!el || !el.classList) return;
    el.classList.add("sb-on");
    clearTimeout(timers.get(el));
    timers.set(el, setTimeout(() => el.classList.remove("sb-on"), 900));
  }, true);
})();
window.addEventListener("hashchange", go);
document.addEventListener("scroll", e => { if (e.target && e.target.id === "hoCards") { homeUi.cuScroll = e.target.scrollLeft; hoPagerSync(e.target); } }, true);
window.addEventListener("resize", () => { const c = $("#hoCards"); if (c) hoPagerSync(c); });

function rerender() {
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
document.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    const slug = fav.dataset.fav;
    if (FAVS.has(slug)) FAVS.delete(slug); else FAVS.add(slug);
    saveFavs(); rerender(); refreshPop(); updateBell(); return;
  }
  const day = e.target.closest("[data-day]");
  if (day) { dayPick[day.dataset.ev] = day.dataset.day; rerender(); return; }
  const em = e.target.closest("[data-evmap]");
  if (em) {   // open / close a map's standings on a tournament page
    evMap[em.dataset.ev] = evMap[em.dataset.ev] === em.dataset.evmap ? null : em.dataset.evmap;
    rerender();
    if (evMap[em.dataset.ev]) { const p = $(".mapstand"); if (p) p.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    return;
  }
  const mc = e.target.closest("button.mapcard");
  if (mc && !e.target.closest("a")) { mc.setAttribute("aria-expanded", mc.getAttribute("aria-expanded") === "true" ? "false" : "true"); return; }
  const bo = e.target.closest("[data-bo]");
  // a new format has its own veto: start the spotlight on that format's first played map
  if (bo && !bo.disabled) { desk.bo = +bo.dataset.bo; desk.spot = null; rerender(); return; }
  const vs = e.target.closest("[data-vspot]");
  if (vs) { desk.spot = vs.dataset.vspot; desk.tab = "veto"; rerender(); const t = $(`.tape .tm[data-spot="${CSS.escape(desk.spot)}"]`); if (t) t.focus({ preventScroll: true }); return; }
  const fn = e.target.closest("[data-fxnav]");
  // on a match page the arrows step through that tournament's matches
  if (fn && !fn.disabled && location.hash.startsWith("#m-")) { if (fn.dataset.go) location.hash = `m-${fn.dataset.go}`; return; }
  if (fn && !fn.disabled) {
    const nav = hoNav(homeLists().next), m = +fn.dataset.fxnav < 0 ? nav.prev : nav.next;
    if (m) { loadMatch(m); rerender(); const b = $(`[data-fxnav="${fn.dataset.fxnav}"]`); if (b && !b.disabled) b.focus({ preventScroll: true }); }
    return;
  }
  const pg = e.target.closest("[data-cupg]");
  if (pg) {
    const sc = $("#hoCards");
    if (sc) sc.scrollBy({ left: +pg.dataset.cupg * sc.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  const dt = e.target.closest("[data-dtab]");
  if (dt) { desk.tab = dt.dataset.dtab; rerender(); return; }
  const sp = e.target.closest("[data-spot]");
  if (sp) {
    const step = sp.classList.contains("snext");
    desk.spot = sp.dataset.spot;
    // swap only the spotlight and the pressed tile: re-rendering the whole page
    // reloaded every image and replayed the entrance animations (a visible flicker)
    const cur = $(".spot");
    if (cur && SPOT_ARGS) {
      document.querySelectorAll(".tape .tm").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.spot === desk.spot)));
      const tmp = document.createElement("div");
      tmp.innerHTML = spotlight(...SPOT_ARGS).trim();
      cur.replaceWith(tmp.firstElementChild);
    } else rerender();
    if (step) { const nb = $(".snext"); if (nb) nb.focus({ preventScroll: true }); } // keep stepping with the keyboard
    return;
  }
  if (e.target.closest("#exSwap")) { [desk.a, desk.b] = [desk.b, desk.a]; desk.feat = null; rerender(); return; }
  const chg = e.target.closest("[data-chg]");
  if (chg) { openChooser(chg.dataset.chg); return; }
  if (e.target.closest("[data-dclose]") || e.target.id === "tDlg") { closeChooser(); return; } // the dialog itself is only hit on its backdrop

    el("alResults").checked = !!a.results;
    el("alBrowser").checked = !!a.browser && "Notification" in window && Notification.permission === "granted";
    el("alBrowserNote").textContent = !("Notification" in window) ? "not supported" : Notification.permission === "denied" ? "blocked in the browser" : "";
    el("alDiscordOn").checked = !!(a.discord && secrets.webhook);
    el("alDiscord").value = secrets.webhook; syncHookRow();
    el("alTeams").innerHTML = Object.keys(T).sort().map(t => `<option value="${esc(t)}"></option>`).join("");
    el("alTestNote").textContent = ""; say("");
    wipeArmed = false; el("setWipe").textContent = "Clear saved data"; el("setWipe").classList.remove("armed");
    paintKeyState(); paintChips();
    if (!dlg.open) dlg.showModal();
  }
  function addTeamFromField() {
    const v = el("alAdd").value.trim();
    if (!v) return;
    const hit = Object.keys(T).find(t => norm(t) === norm(v)) || (nameIndex().find(([k]) => k === norm(v)) || [])[1];
    if (!hit) { say(`No team called "${v}" in the data.`, "bad"); return; }
    if (!draftTeams.includes(hit)) draftTeams.push(hit);
    el("alAdd").value = ""; say(""); paintChips();
  }
  el("alAdd").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addTeamFromField(); } });
  el("alAdd").addEventListener("change", addTeamFromField);
  el("alChips").addEventListener("click", e => {
    const b = e.target.closest("[data-rm]");
    if (b) { draftTeams = draftTeams.filter(t => t !== b.dataset.rm); paintChips(); }
  });
  el("aiLock").addEventListener("change", () => { syncPassRow(); if (el("aiLock").checked) el("aiPass").focus(); });
  el("alDiscordOn").addEventListener("change", () => { syncHookRow(); if (el("alDiscordOn").checked) el("alDiscord").focus(); });
  el("aiProv").addEventListener("change", () => {
    const p = el("aiProv").value;
    fillModels(p);
    const cur = el("aiModel").value.trim();
    if (!cur || Object.values(MODELS).some(l => l.includes(cur))) el("aiModel").value = MODELS[p][0];
  });
  el("aiKeyShow").addEventListener("click", () => {
    const shown = el("aiKey").type === "text";
    el("aiKey").type = shown ? "password" : "text";
    el("aiKeyShow").textContent = shown ? "Show" : "Hide";
    el("aiKeyShow").setAttribute("aria-pressed", String(!shown));
  });
  el("setWipe").addEventListener("click", () => {
    if (!wipeArmed) { wipeArmed = true; el("setWipe").textContent = "Click again to clear everything"; el("setWipe").classList.add("armed"); return; }
    vaultWipe();
    for (const k of [AI_KEY, AL_KEY]) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch { /* ignore */ } }
    if (cryptoOk()) { try { indexedDB.deleteDatabase("faceoff-vault"); } catch { /* ignore */ } }
    secrets = { key: "", webhook: "" }; sessionPass = ""; vaultMode = "none"; locked = false;
    startAlerts(); hist = []; if (!panel.hidden) welcome(); refreshChatState();
    wipeArmed = false; el("setWipe").textContent = "Clear saved data"; el("setWipe").classList.remove("armed");
    openSettings();
    say("Everything saved on this device was removed.", "ok");
  });
  const closeSettings = () => { if (dlg.open) dlg.close(); };
  el("setX").addEventListener("click", closeSettings);
  el("setCancel").addEventListener("click", closeSettings);
  dlg.addEventListener("click", e => { if (e.target === dlg) closeSettings(); });
  el("unlockDlg").addEventListener("click", e => { if (e.target === el("unlockDlg")) el("unlockCancel").click(); });
  el("setForm").addEventListener("submit", async e => {
    e.preventDefault();
    const prov = el("aiProv").value, base = el("aiBase").value.trim();
    if (base && !/^https?:\/\//i.test(base)) { say("The base URL must start with https:// (or http:// for a local model).", "bad"); return; }
    const key = el("aiKey").value.trim();
    const useHook = el("alDiscordOn").checked, hook = el("alDiscord").value.trim();
    if (useHook && !DISCORD_RE.test(hook)) { say("That is not a Discord webhook URL.", "bad"); return; }
    const wantLock = el("aiLock").checked;
    const pass = wantLock ? (el("aiPass").value || sessionPass) : "";
    if (wantLock && !pass) { say("Enter a passphrase, or untick the lock.", "bad"); showTab("ai"); el("aiPass").focus(); return; }
    const remember = el("aiRemember").checked;
    aiSave({ provider: prov, model: el("aiModel").value.trim() || MODELS[prov][0], base, style: el("aiStyle").value, stream: el("aiStream").value === "1", remember });
    secrets = { key, webhook: useHook ? hook : "" };
    if (!key && !secrets.webhook) { vaultWipe(); vaultMode = "none"; sessionPass = ""; }
    else if (cryptoOk()) {
      try { await seal(secrets, pass, remember); vaultMode = pass ? "pass" : "device"; sessionPass = pass; locked = false; }
      catch { say("Could not encrypt on this device, so nothing secret was saved.", "bad"); return; }
    } else vaultMode = "none";
    let wantBrowser = el("alBrowser").checked;
    if (wantBrowser && "Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch { /* ignore */ }
    }
    if (wantBrowser && !("Notification" in window && Notification.permission === "granted")) wantBrowser = false;
    alSave({ ...alLoad(), teams: draftTeams, lead: Math.max(0, Math.min(180, +el("alLead").value || 0)),
      results: el("alResults").checked, browser: wantBrowser, discord: !!secrets.webhook });
    paintKeyState(); say("Saved.", "ok");
    refreshChatState();
    if (!panel.hidden && !hist.length) welcome();
    startAlerts();
    setTimeout(closeSettings, 400);
  });
  el("setOpen").addEventListener("click", openSettings);
  // the header bell reads the alert set-up and opens these settings on a tab
  window.FO_ALERTS = { load: alLoad, open: async tab => { await openSettings(); if (dlg.open) { showTab(tab === "al" ? "al" : "ai"); el(tab === "al" ? "tabAl" : "tabAi").focus(); } } };

  /* ---------- alerts ---------- */
  async function deliver(a, hook, title, body) {
    const sent = [];
    if (a.browser && "Notification" in window && Notification.permission === "granted") {
      try { new Notification(title, { body, tag: title }); sent.push("browser"); } catch { /* ignore */ }
    }
    if (hook && DISCORD_RE.test(hook)) {
      try {
        const r = await fetch(hook, { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ content: `**${title}**\n${body}`, allowed_mentions: { parse: [] } }) });
        if (r.ok) sent.push("Discord");
      } catch { /* ignore */ }
    }
    return sent;
  }
  el("alTest").addEventListener("click", async () => {
    const hook = el("alDiscordOn").checked ? el("alDiscord").value.trim() : "";
    if (hook && !DISCORD_RE.test(hook)) { el("alTestNote").textContent = "Not a Discord webhook URL."; return; }
    let browser = el("alBrowser").checked;
    if (browser && "Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch { /* ignore */ }
    }
    browser = browser && "Notification" in window && Notification.permission === "granted";
    const sent = await deliver({ browser }, hook, "FaceOff test alert", "Alerts for your followed teams arrive like this.");
    el("alTestNote").textContent = sent.length ? "Sent via " + sent.join(" and ") + "." : "Nothing sent: pick a delivery method first.";
  });
  const alertsOn = a => a.teams.length && (a.browser || (a.discord && (secrets.webhook || locked)));
  async function checkReminders() {
    const a = alLoad();
    if (!alertsOn(a)) return;
    const now = Date.now();
    let changed = false;
    for (const m of Object.values(MATCH)) {
      if (m.finished || !m.t1 || !m.t2 || !m.when) continue;
      if (!a.teams.includes(m.t1) && !a.teams.includes(m.t2)) continue;
      const start = Date.parse(m.when);
      if (!(start > 0)) continue;
      const key = "r" + m.id;
      if (a.sent[key] || now < start - a.lead * 60000 || now > start + 10 * 60000) continue;
      a.sent[key] = now; changed = true;
      const mins = Math.max(0, Math.round((start - now) / 60000));
      const pred = m.pred ? decode(m.pred) : null;
      const pick = pred ? (() => { const p = pFor(pred, [1, 3, 5].includes(m.bo) ? m.bo : 3).p; return `. Model: ${p >= 0.5 ? m.t1 : m.t2} ${PC(Math.max(p, 1 - p))} to win`; })() : "";
      const ev = EV_BY[m.ev];
      await deliver(a, secrets.webhook, `${m.t1} vs ${m.t2} ${mins ? "starts in " + mins + " min" : "is starting"}`, `${ev ? ev.name + ", " : ""}${m.stage}${pick}`);
    }
    if (changed) alSave(a);
  }
  async function checkResults() {
    const a = alLoad();
    if (!alertsOn(a) || !a.results) return;
    let st;
    try {
      const r = await fetch("status.json?ts=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      st = await r.json();
    } catch { return; }
    const fresh = a.primed ? (st.results || []).filter(x => !a.seen[x.id]) : [];
    for (const x of st.results || []) a.seen[x.id] = 1;
    a.primed = true;
    const ids = Object.keys(a.seen);
    if (ids.length > 400) for (const k of ids.slice(0, ids.length - 400)) delete a.seen[k];
    alSave(a);
    for (const x of fresh) {
      if (!a.teams.includes(x.team_a) && !a.teams.includes(x.team_b)) continue;
      const loser = x.winner === x.team_a ? x.team_b : x.team_a;
      await deliver(a, secrets.webhook, `${x.winner} beat ${loser} ${x.series_score}`, `${x.event}${x.stage ? ", " + x.stage : ""}`);
    }
  }
  let alTimers = [];
  function startAlerts() {
    alTimers.forEach(clearInterval);
    alTimers = [];
    if (!alertsOn(alLoad())) return;
    checkReminders();
    alTimers.push(setInterval(checkReminders, 30000));
    checkResults();
    alTimers.push(setInterval(checkResults, 5 * 60000));
  }
  vaultInit().then(startAlerts);
})();

go();
</script>
