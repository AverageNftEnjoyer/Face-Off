<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaceOff Analytics</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1518'/%3E%3Cg transform='translate(4.6 4.4) scale(.72)'%3E%3Cpath d='M10.5 3H31l-2.6 6.5H8z' fill='%23E4EEEC'/%3E%3Cpath d='M6.6 11.5h7.1L7.4 29H.3z' fill='%23E4EEEC'/%3E%3Cpath d='M14.6 13.5h11.6l-2.4 5.6H12.4z' fill='%232FD4A2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,300..900;1,50..125,300..900&display=swap">
<style>
/* Layout: a CS2-HUD style event hub. Dark slate panels like the in-game menus;
   the two sides of every matchup are coloured by CS2's own factions
   (first team = Counter-Terrorist blue, second team = Terrorist gold).
   One typeface (Saira) in two widths: condensed + heavy for team names, scores
   and map names; normal width for everything you read. Single dark theme by
   design, because the subject's own UI is dark. */
:root {
  color-scheme: dark;
  /* v8: a deep teal-black base. The accent is a turf green-teal for "where you
     are" (current section, current tab, selected map, focus), never for a team.
     Teams keep their own logo colours (--ct first team, --t second team). */
  --bg: #0C1618;         /* wells inside panels, rows */
  --panel: #101C1F;      /* cards, panels */
  --raise: #172A2E;      /* hover / selected */
  --line: #1E3236;       /* hairlines */
  --line2: #2A4448;      /* stronger hairline: inputs, outline buttons */
  --text: #E4EEEC;
  --dim: #8BA09E;
  --acc: #2FD4A2;        /* turf teal */
  --acc-deep: #0E3A31;
  --ct: #6E9DE2;         /* first team (set per matchup from its logo) */
  --t: #E7AB3F;          /* second team */
  --ct-deep: #23405A;
  --t-deep: #4E3B18;
  --win: #4FCB8A;
  --loss: #E8644E;
  --scrim: rgba(5, 11, 13, .84);
  --hatch: rgba(232, 236, 241, .45);
  --face: "Saira", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
  --s-1: .8125rem;
  --s0: 1rem;
  --s1: 1.25rem;
  --s2: 1.75rem;
  --s3: 2.5rem;
  --s4: clamp(2.75rem, 8vw, 4.5rem);
  --r: 6px;              /* small things: buttons, chips, rows */
  --rp: 12px;            /* panels and the court */
  --amber: #E5C45A;      /* Stats: 50-60% shares (between --win and --loss) */
  --page: #070F11;       /* the page itself, a shade under the panels */
  --pagew: 150rem;       /* content width; the matchup desk narrows it (body[data-w]) */
  --gut: max(16px, 3vw);
  --toph: 4rem;          /* header bar height */
}

* { box-sizing: border-box; }
/* Page background: deep teal-black with a faint overview-map grid (as on a CS2
   radar) that fades out down the page. Fixed, nothing moves. Painted on html so
   the grid layer (body::before, z-index -1) sits above it and below the content. */
html {
  color: var(--text);
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(47, 212, 162, .06), transparent 70%),
    radial-gradient(ellipse 50% 45% at 100% 100%, rgba(47, 160, 212, .035), transparent 70%),
    linear-gradient(180deg, #0A1517, var(--page) 50rem);
  background-color: var(--page);
}
body { margin: 0; color: var(--text); }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(120, 170, 165, .04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 170, 165, .04) 1px, transparent 1px),
    linear-gradient(rgba(120, 170, 165, .02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 170, 165, .02) 1px, transparent 1px);
  background-size: 128px 128px, 128px 128px, 32px 32px, 32px 32px;
  background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(180deg, #000, rgba(0, 0, 0, .3) 55%, transparent);
  mask-image: linear-gradient(180deg, #000, rgba(0, 0, 0, .3) 55%, transparent);
}
body {
  font-family: var(--face);
  font-size: var(--s0);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  font-stretch: 100%;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--text); }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.cond { font-stretch: 62.5%; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .95; }
.ital { font-style: italic; }
.dim { color: var(--dim); }
.small { font-size: var(--s-1); }
.win { color: var(--win); }
.loss { color: var(--loss); }
.ct { color: var(--ct); }
.t { color: var(--t); }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ----------
   Brand mark and an italic wordmark at the left, sections with small icons (the
   current one underlined in the accent), a search box that finds teams, players
   and matches, and the data date at the right. */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(8, 16, 18, .92);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.top-in {
  max-width: var(--pagew); margin: 0 auto; padding-inline: var(--gut);
  display: flex; align-items: stretch; gap: 0 1.75rem;
  min-height: var(--toph);
}
.brand { display: flex; align-items: center; gap: .55rem; white-space: nowrap; padding-right: .5rem; }
.brand svg { width: 2.1rem; height: 2.1rem; flex: none; }
.bw { display: flex; align-items: baseline; gap: .45rem; line-height: 1; }
.bw b { font-style: italic; font-stretch: 62.5%; font-weight: 900; font-size: 1.9rem; letter-spacing: .01em; text-transform: uppercase; }
.bw span { font-stretch: 87.5%; font-weight: 500; font-size: .92rem; color: var(--dim); }
.brand:hover .bw span { color: var(--text); }
.tabs { display: flex; align-items: stretch; gap: 0 .25rem; }
.tabs a {
  position: relative; display: flex; align-items: center; gap: .5rem;
  padding: 0 .9rem; color: var(--dim); white-space: nowrap;
  font-stretch: 87.5%; font-weight: 600; font-size: 1rem;
}
.tabs a .ico { width: 1.05rem; height: 1.05rem; }
.tabs a:hover { color: var(--text); }
.tabs a::after { /* accent underline under the current section, sitting on the bar's bottom rule */
  content: ""; position: absolute; left: .55rem; right: .55rem; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0;
  background: var(--acc); transform: scaleX(0);
}
.tabs a[aria-current="page"] { color: var(--text); }
.tabs a[aria-current="page"] .ico { color: var(--acc); }
.tabs a[aria-current="page"]::after { transform: none; box-shadow: 0 0 14px rgba(47, 212, 162, .55); }
.tabs a:focus-visible { outline-offset: -4px; }

/* search: a combobox; results drop down under it */
.qwrap { position: relative; margin-left: auto; align-self: center; width: min(26rem, 30vw); display: flex; align-items: stretch; }
.qfield { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
/* settings: the right-hand segment of the search control (same height, border and fill) */
.qset { display: grid; place-items: center; flex: none; width: 2.6rem; height: 2.5rem; padding: 0; cursor: pointer;
  background: rgba(16, 28, 31, .9); color: var(--dim); border: 1px solid var(--line2); border-left: 0; border-radius: 0 8px 8px 0; }
.qset:hover, .qset:focus-visible { color: var(--text); background: var(--raise); }
.qset:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
.qset .ico { width: 1.15rem; height: 1.15rem; }
.qfield > .ico { position: absolute; left: .75rem; width: 1rem; height: 1rem; color: var(--dim); pointer-events: none; }
#q {
  width: 100%; min-width: 0; height: 2.5rem; padding: 0 2.4rem 0 2.3rem;
  background: rgba(16, 28, 31, .9); color: var(--text); border: 1px solid var(--line2); border-radius: 8px 0 0 8px; font: inherit; font-size: .9rem;
  -webkit-appearance: none; appearance: none;
}
#q::placeholder { color: var(--dim); opacity: .85; }
#q:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px rgba(47, 212, 162, .18); }
#q::-webkit-search-cancel-button { display: none; }
.qkey { position: absolute; right: .55rem; font-size: .72rem; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 0 .4rem; line-height: 1.4; pointer-events: none; }
#q:focus ~ .qkey, #q:not(:placeholder-shown) ~ .qkey { display: none; }
.qclose { display: none; }
#qOpen { display: none; }
.qlist {
  position: absolute; left: 0; right: 0; top: calc(100% + .4rem); z-index: 30;
  max-height: min(70vh, 34rem); overflow-y: auto; overscroll-behavior: contain;
  background: #0F1C1F; border: 1px solid var(--line2); border-radius: 10px; padding: .35rem;
  box-shadow: 0 24px 50px -12px rgba(0, 0, 0, .75);
  scrollbar-width: thin;
}
.qlist[hidden] { display: none; }
.qgrp { display: grid; }
.qgrp + .qgrp { border-top: 1px solid var(--line); margin-top: .3rem; padding-top: .3rem; }
.qgh { font-size: .72rem; color: var(--dim); padding: .3rem .55rem .15rem; font-weight: 600; }
.qopt { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr) auto; gap: .65rem; align-items: center; padding: .4rem .55rem; border-radius: 6px; cursor: pointer; min-height: 2.75rem; }
.qopt .logo { width: 1.6rem; height: 1.6rem; }
.qopt .qm { display: grid; min-width: 0; line-height: 1.25; }
.qopt .qm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qopt .qm span { font-size: .75rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qopt .qr { font-size: .75rem; color: var(--dim); white-space: nowrap; text-align: right; }
.qopt mark { background: none; color: var(--acc); }
.qopt[aria-selected="true"], .qopt:hover { background: var(--raise); }
.qopt[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--acc); }
.qpl { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--raise); color: var(--dim); }
.qpl .ico { width: .95rem; height: .95rem; }
.qvs { display: flex; align-items: center; }
.qvs .logo.sm { width: 1.1rem; height: 1.1rem; }
.qvs .logo.sm + .logo.sm { margin-left: -.3rem; margin-top: .55rem; }
.qempty { padding: .7rem .6rem; font-size: var(--s-1); color: var(--dim); }

.snap { align-self: center; display: flex; align-items: center; gap: .55rem; font-size: .75rem; color: var(--dim); white-space: nowrap; line-height: 1.15; }
.snap .ico { width: 1.25rem; height: 1.25rem; color: var(--dim); }
.snap > span { display: grid; }
.snap b { color: var(--text); font-weight: 600; font-size: .88rem; }

.page { max-width: var(--pagew); margin: 0 auto; padding-inline: var(--gut); padding-block: 1.75rem 4rem; display: grid; gap: 1.5rem; }
/* the matchup desk (home, match pages) reads best a little narrower than the data pages */
body[data-w="wide"], body:has(#view > .court) { --pagew: 140rem; }

@media (max-width: 1180px) {
  .top-in { gap: 0 1rem; }
  .tabs a { padding: 0 .6rem; }
  .snap .ico { display: none; }
  .qwrap { width: min(18rem, 26vw); }
}
/* below 900px the search box folds into an icon that opens a full-width search row */
@media (max-width: 900px) {
  .qwrap { width: auto; margin-left: auto; position: static; }
  .qfield, .qkey { display: none; }
  #qOpen { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line2); border-radius: 8px 0 0 8px; background: var(--panel); cursor: pointer; color: var(--text); }
  .qset { width: 44px; height: 44px; background: var(--panel); }
  #qOpen .ico { width: 1.15rem; height: 1.15rem; }
  header.top.qon::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top, 0px) + var(--toph)); background: #0A1517; z-index: 30; border-bottom: 1px solid var(--line); }
  header.top.qon .qfield { display: flex; position: absolute; left: var(--gut); right: var(--gut); top: calc(env(safe-area-inset-top, 0px) + (var(--toph) - 2.7rem) / 2); z-index: 31; }
  header.top.qon #q { height: 2.7rem; font-size: 1rem; padding-right: 3.2rem; border-radius: 8px; }
  header.top.qon .qclose { display: grid; place-items: center; position: absolute; right: .2rem; width: 2.6rem; height: 2.6rem; border: 0; background: none; color: var(--dim); cursor: pointer; }
  header.top.qon .qclose .ico { width: 1.15rem; height: 1.15rem; }
  .qlist { position: fixed; left: var(--gut); right: var(--gut); top: calc(env(safe-area-inset-top, 0px) + var(--toph) + .35rem); max-height: calc(100dvh - var(--toph) - 2rem); }
}
/* phones: brand row scrolls away, the four sections stay pinned as an even row */
@media (max-width: 640px) {
  :root { --toph: 3.4rem; }
  header.top { top: calc(-1 * var(--toph)); }
  header.top.qon { top: 0; }
  .top-in { flex-wrap: wrap; gap: 0 .6rem; }
  .brand { min-height: var(--toph); padding-right: 0; }
  .brand svg { width: 1.8rem; height: 1.8rem; }
  .bw b { font-size: 1.65rem; }
  .bw span { display: none; }
  .snap b { font-size: .8rem; }
  .tabs { order: 3; flex: 1 0 100%; display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 0; margin-inline: -.55rem; border-top: 1px solid var(--line); }
  .tabs a { min-height: 46px; padding: 0 .5rem; font-size: .98rem; justify-content: center; gap: .4rem; }
  .tabs a::after { left: .35rem; right: .35rem; }
}
@media (max-width: 370px) { .tabs a .ico { display: none; } }
@media (prefers-reduced-motion: no-preference) {
  .tabs a::after { transition: transform .18s ease; }
}

/* ---------- generic panels ---------- */
.panel {
  background: linear-gradient(180deg, rgba(23, 42, 46, .35), transparent 7rem), var(--panel);
  border: 1px solid var(--line); border-radius: var(--rp); padding: 1.1rem 1.15rem; display: grid; gap: .9rem; align-content: start; min-width: 0;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .025) inset, 0 14px 32px -22px rgba(0, 0, 0, .8);
}
.panel > p { max-width: 80ch; }
.panel > h2, .sec-h { font-style: italic; font-stretch: 62.5%; font-weight: 800; font-size: 1.45rem; line-height: 1.1; letter-spacing: .01em; display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.panel > h2 .dim, .sec-h .dim { font-style: normal; font-stretch: 100%; font-weight: 400; font-size: var(--s-1); }
.panel > h2 .tlink { font-style: normal; font-stretch: 87.5%; font-size: var(--s1); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }

/* ---------- logos, flags ---------- */
.logo { width: 2rem; height: 2rem; object-fit: contain; flex: none; }
.logo.lg { width: 4.5rem; height: 4.5rem; }
.logo.xl { width: clamp(4.5rem, 12vw, 7.5rem); height: clamp(4.5rem, 12vw, 7.5rem); }
.logo.sm { width: 1.35rem; height: 1.35rem; }
.logo-ph { display: grid; place-items: center; border-radius: 50%; background: var(--raise); color: var(--dim); font-weight: 800; font-size: .7rem; }
.flag { width: 1.15rem; height: auto; border-radius: 2px; vertical-align: -.1em; flex: none; }

/* ---------- event hero ---------- */
.hero {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.25rem 1.75rem; align-items: center;
  padding: 1.25rem;
}
.hero .evlogo { width: clamp(5rem, 14vw, 8.5rem); height: auto; }
.hero h1 { font-size: var(--s3); }
.facts { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-top: .6rem; }
.facts div { display: grid; }
.facts dt { font-size: var(--s-1); color: var(--dim); }
.facts dd { margin: 0; font-weight: 700; }
.facts dl { margin: 0; display: contents; }

.pool { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; }
/* map tiles on a tournament page are buttons: click for the map's standings */
button.maptile { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.maptile[aria-pressed="true"] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc), 0 0 22px -6px rgba(47, 212, 162, .7); }
.mapstand .maptbl td:nth-child(2) { min-width: 10rem; }
.mapstand .maptbl tr:first-child td { font-weight: 700; }
.maptile {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%;
  border-radius: var(--r); overflow: hidden; background: var(--raise) center / cover no-repeat;
  display: flex; align-items: flex-end; padding: .5rem .6rem;
  border: 1px solid var(--line);
}
.maptile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--scrim)); }
/* no movement on hover: a transformed tile can be re-rasterised and look like a different photo for a moment */
.maptile:hover { border-color: var(--dim); }
.maptile span { position: relative; font-size: var(--s1); }
.maptile small { position: relative; display: block; font-size: .7rem; color: var(--dim); font-stretch: 100%; text-transform: none; font-weight: 400; }

/* ---------- schedule ---------- */
.days { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .2rem; }
.days button {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
  padding: .35rem .7rem; cursor: pointer; display: grid; text-align: left; min-width: 4.6rem;
}
.days button { flex: none; white-space: nowrap; }
.days button b { font-weight: 700; }
.days button span { font-size: .72rem; color: var(--dim); }
.days button[aria-pressed="true"] { background: var(--raise); border-color: var(--t); }
.days button:hover { border-color: var(--dim); }

.mrow {
  display: grid;
  grid-template-columns: 4.2rem minmax(0, 1fr) minmax(8.5rem, 11.5rem) minmax(0, 1fr) auto;
  align-items: center; gap: .75rem;
  padding: .65rem .75rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
}
.mrow:hover { background: var(--raise); }
.mrow .time { font-size: var(--s-1); color: var(--dim); display: grid; }
.mrow .tm { display: flex; align-items: center; gap: .5rem; min-width: 0; font-weight: 600; }
.mrow .tm.r { flex-direction: row-reverse; text-align: right; }
.mrow .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm.lost span { color: var(--dim); font-weight: 400; }
/* the veto tape also uses .tm; keep match rows clear of it */
.mrow .tm { position: static; overflow: visible; min-height: 0; padding: 0; background: none; border: 0; border-radius: 0; cursor: inherit; }
.mrow .tm::before { content: none; }
.mrow .mid { text-align: center; font-size: var(--s2); }
.mrow .mid.pct { font-size: var(--s-1); font-stretch: 100%; font-weight: 600; text-transform: none; color: var(--dim); }
/* the model's call for an unplayed match: the pick, its most likely score, the chance and a
   bar that grows from the picked team's side */
.mrow .mid.mpick { display: grid; gap: .3rem; min-width: 0; text-align: left; font-size: var(--s-1); line-height: 1.15;
  background: linear-gradient(180deg, var(--raise), var(--bg)); border: 1px solid var(--line2); border-radius: 8px; padding: .45rem .6rem .5rem; }
.mrow .mid.mpick .mpl { font-size: .62rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.mrow .mid.mpick .pk { display: flex; align-items: center; gap: .4rem; min-width: 0; }
.mrow .mid.mpick .pk b { flex: 1; min-width: 0; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .mid.mpick .psc { flex: none; font-family: var(--face); font-stretch: 85%; font-weight: 800; font-size: .95rem; letter-spacing: .02em;
  padding: 0 .4rem; border-radius: 4px; background: var(--acc-deep); color: var(--acc); font-variant-numeric: tabular-nums; }
.mrow .mid.mpick .logo.xs, .mrow .mid.mpick .logo-ph { width: 1.15rem; height: 1.15rem; flex: none; }
.mrow .mid.mpick .pbar { display: flex; align-items: center; gap: .45rem; }
.mrow .mid.mpick .pbar s { flex: 1; display: flex; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; text-decoration: none; }
.mrow .mid.mpick .pbar s i { display: block; height: 100%; background: var(--acc); border-radius: 2px; }
.mrow .mid.mpick .pbar s.r { justify-content: flex-end; }
.mrow .mid.mpick .pp { color: var(--acc); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow .tag { display: grid; justify-items: end; gap: .15rem; font-size: .72rem; color: var(--dim); white-space: nowrap; }
.mlist { display: grid; gap: .45rem; }

.chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .05rem .5rem; font-size: .72rem; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.chip.live { color: var(--loss); }
.chip.live::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.chip.hit { color: var(--win); }
.chip.miss { color: var(--loss); }
.chip.plain { color: var(--dim); }
/* roster caution flag (roster_flags.py; display only, never in the numbers) */
.rflag { display: inline-flex; align-items: center; gap: .25rem; border-radius: 999px; padding: .05rem .45rem; font-size: .68rem; font-weight: 700;
  line-height: 1.3; white-space: nowrap; border: 1px solid currentColor; color: var(--amber); cursor: help; vertical-align: middle; }
.rflag.change { color: var(--dim); }
.rflag .ico { width: .9em; height: .9em; }
.small > .rflag, .ph > .rflag { margin-left: .4rem; }
.ph > .rflag { grid-column: 2; justify-self: start; margin-left: 0; }
.bm .when .rflag { padding: 0 .3rem; margin-left: auto; }
.cid > .rflag { font-size: .72rem; background: rgba(4, 10, 12, .6); }
.cid > .rflag.change { color: var(--text); }
.rfpanel ul { list-style: none; margin: 0 0 .5rem; padding: 0; display: grid; gap: .6rem; }
.rfpanel li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .6rem; align-items: start; font-size: var(--s-1); }
.rfpanel li > span:last-child { display: grid; gap: .15rem; min-width: 0; overflow-wrap: anywhere; }
.rfpanel li > .rflag { border: 0; padding: .1rem 0 0; font-size: 1rem; }
.rfpanel.standin { border-left: 3px solid var(--amber); }
/* staleness badge: one shared component, bundle-owned values, always visible */
.stale { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .6rem; font-size: .72rem; color: var(--dim); border: 1px dashed var(--line); white-space: nowrap; }
.stale b { color: var(--text); font-weight: 700; }

/* standings */
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th { text-align: left; color: var(--dim); font-weight: 600; padding: .35rem .4rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
.tlink { display: flex; align-items: center; gap: .5rem; font-weight: 600; min-width: 0; }
.tlink:hover span { text-decoration: underline; }
tr.up td:first-child { box-shadow: inset 3px 0 0 var(--win); }
tr.out td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
tr.out .tlink { color: var(--dim); }
.tablewrap { overflow-x: auto; }

/* bracket: one column per round. A single-elimination tree (each round half the one before)
   is laid out by bracket slot and joined with elbow lines; finished matches light their line. */
.evbody + .panel, .evbody ~ .panel { margin-top: 1.5rem; }
.bracket { --bgap: 1.6rem; display: grid; column-gap: var(--bgap); row-gap: 1.1rem; overflow-x: auto; padding: .1rem .1rem .3rem; }
.bcol { display: flex; flex-direction: column; min-width: 0; }
.bcol h3, .bthird h3 { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin: 0 0 .55rem;
  padding-bottom: .35rem; border-bottom: 1px solid var(--line);
  font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.bcol h3 small, .bthird h3 small { font-weight: 600; letter-spacing: .04em; text-transform: none; opacity: .8; }
.bslots { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: .6rem; }
.bracket.tree .bslots { gap: 0; }
.bracket.tree .bslot { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: .35rem 0; position: relative; }
.bracket.tree .bcol.out .bslot::after { content: ""; position: absolute; right: calc(var(--bgap) / -2); width: calc(var(--bgap) / 2);
  border: 0 solid var(--line2); pointer-events: none; }
.bracket.tree .bcol.out .bslot:nth-child(odd)::after { top: 50%; bottom: 0; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 7px; }
.bracket.tree .bcol.out .bslot:nth-child(even)::after { top: 0; bottom: 50%; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 7px; }
.bracket.tree .bcol.out .bslot.done::after { border-color: color-mix(in srgb, var(--acc) 55%, var(--line2)); }
.bracket.tree .bcol.in .bslot::before { content: ""; position: absolute; left: calc(var(--bgap) / -2); width: calc(var(--bgap) / 2); top: 50%;
  border-top: 2px solid var(--line2); pointer-events: none; }
.bracket.tree .bcol.in .bslot.fed::before { border-top-color: color-mix(in srgb, var(--acc) 55%, var(--line2)); }
.bthird { align-self: start; }
/* a tree four or more matches deep has room for the third-place match under the final */
.bcol.hasthird { position: relative; }
.bcol.hasthird .bthird { position: absolute; left: 0; right: 0; bottom: 0; }
.bm { display: block; position: relative; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; font-size: var(--s-1); overflow: hidden;
  transition: border-color .15s, background .15s; }
a.bm:hover { border-color: var(--acc); background: var(--raise); }
.bm .bt { display: flex; align-items: center; gap: .45rem; min-height: 2.15rem; padding: .3rem .55rem; color: var(--text); }
.bm .bt + .bt { border-top: 1px solid var(--line); }
.bm .bt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bm .bt.tbd { color: var(--dim); }
.bm .bt.tbd .nm { font-weight: 400; font-style: italic; }
.bm .bt.lost { color: var(--dim); }
.bm .bt.lost .nm { font-weight: 400; }
.bm .bt.won { box-shadow: inset 3px 0 0 var(--acc); }
.bm .bt.won .nm { font-weight: 800; }
.bm .bt .sc { flex: none; min-width: 1.6rem; text-align: center; font-family: var(--face); font-weight: 800; font-size: .95rem;
  font-variant-numeric: tabular-nums; padding: .05rem .3rem; border-radius: 4px; background: var(--panel); }
.bm .bt.won .sc { background: var(--acc-deep); color: var(--acc); }
.bm .bt .bp { flex: none; font-size: .7rem; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
.bm .bt .bp.pk { color: var(--acc); }
.bm .when { display: flex; justify-content: space-between; gap: .4rem; font-size: .68rem; color: var(--dim); padding: .22rem .55rem;
  border-top: 1px solid var(--line); background: var(--panel); }
.bm .when .chip { font-size: .62rem; padding: 0 .4rem; }

.prizes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem 1rem; font-size: var(--s-1); }
.prizes b { font-weight: 700; text-align: right; }
.fmt { margin: 0; padding-left: 1rem; font-size: var(--s-1); display: grid; gap: .15rem; }
.fmt li.d1 { list-style: none; margin-left: -1rem; font-weight: 700; color: var(--text); margin-top: .35rem; }
.fmt li { color: var(--dim); }

/* ---------- match page ---------- */
.crumb { font-size: var(--s-1); color: var(--dim); display: flex; gap: .5rem; flex-wrap: wrap; }
.crumb a { text-decoration: underline; text-underline-offset: 3px; }
.vs {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 1rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: clamp(1rem, 3vw, 1.75rem);
  position: relative; overflow: hidden;
}
.vs::before, .vs::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; pointer-events: none; }
.vs::before { left: 0; background: linear-gradient(90deg, var(--ct-deep), transparent); opacity: .55; }
.vs::after { right: 0; background: linear-gradient(270deg, var(--t-deep), transparent); opacity: .55; }
.vs .side { display: grid; justify-items: center; gap: .4rem; text-align: center; position: relative; z-index: 1; min-width: 0; }
.vs .side .cond { font-size: clamp(1.5rem, 4.5vw, 2.6rem); overflow-wrap: anywhere; }
.vs .side.a .cond { color: var(--ct); }
.vs .side.b .cond { color: var(--t); }
.vs .side .meta { font-size: var(--s-1); color: var(--dim); }
.vs .centre { display: grid; justify-items: center; gap: .3rem; position: relative; z-index: 1; text-align: center; }
.vs .score { font-size: var(--s4); display: flex; gap: .6rem; align-items: baseline; }
.vs .score .lost { color: var(--dim); }
.vs .when { font-size: var(--s1); font-weight: 700; }

.tug { display: grid; gap: .6rem; }
.tug .ends { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.tug .ends .cond { font-size: var(--s3); }
.bar { position: relative; height: 2.6rem; border-radius: var(--r); overflow: hidden; background: var(--t); }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--ct); width: 50%; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.bar .band { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(10, 14, 20, .55) 0 2px, rgba(255, 255, 255, .45) 2px 4px, transparent 4px 8px); border-inline: 2px solid var(--bg); transition: left .9s cubic-bezier(.2, .8, .2, 1), width .9s cubic-bezier(.2, .8, .2, 1); }
.bar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--bg); transform: translateX(-1px); }
.tug .legend { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; font-size: var(--s-1); color: var(--dim); align-items: center; }

/* map cards */
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; }
.mapcard {
  position: relative; border-radius: var(--r); overflow: hidden; min-height: 9.5rem;
  background: var(--raise) center / cover no-repeat; border: 1px solid var(--line);
  display: grid; align-content: end; gap: .35rem; padding: .75rem;
  cursor: pointer; text-align: left; width: 100%;
}
.mapcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18, 23, 30, .25), var(--scrim) 65%); transition: background .2s; }
.mapcard > * { position: relative; }
.mapcard .role { font-size: .72rem; color: var(--dim); display: flex; gap: .4rem; align-items: center; }
.mapcard .nm { font-size: var(--s2); }
.mapcard .sc { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--s2); }
.mapcard .sc .x { font-size: var(--s-1); color: var(--dim); font-stretch: 100%; font-weight: 400; text-transform: none; }
.mapcard.wa { box-shadow: inset 0 -3px 0 var(--ct); }
.mapcard.wb { box-shadow: inset 0 -3px 0 var(--t); }
.mapcard .halves { display: none; font-size: var(--s-1); gap: .15rem; }
.mapcard[aria-expanded="true"] .halves { display: grid; }
.mapcard[aria-expanded="true"]::before { background: var(--scrim); }
.halves .hr { display: grid; grid-template-columns: minmax(0, 1fr) 3rem 3rem 3rem; gap: .25rem; }
.halves .hr span:not(:first-child) { text-align: right; }
.halves .hd { color: var(--dim); font-size: .7rem; }
.mapcard .odds { height: .45rem; border-radius: 3px; overflow: hidden; background: var(--t); position: relative; }
.mapcard .odds b { position: absolute; inset: 0 auto 0 0; background: var(--ct); }
.mapcard.ban { min-height: 5.5rem; cursor: default; filter: grayscale(1); opacity: .55; }
.mapcard.ban .nm { text-decoration: line-through; text-decoration-thickness: 2px; font-size: var(--s1); }
.reveal { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { transform: translateY(8px); opacity: .001; } }

/* series scores */
.srow { display: grid; grid-template-columns: 8rem minmax(0, 1fr) 3rem; gap: .6rem; align-items: center; font-size: var(--s-1); }
.srow .trk { height: 1rem; background: var(--bg); border-radius: 3px; overflow: hidden; }
.srow .trk b { display: block; height: 100%; }
.srow.a .trk b { background: var(--ct); }
.srow.b .trk b { background: var(--t); }
.srow.top { font-weight: 700; }
.srow .v { text-align: right; }

/* lineups */
.lineup { display: grid; gap: .4rem; }
.player {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: center;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .65rem;
}
.player .nick { font-size: var(--s1); }
.player .real { font-size: .75rem; color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .badges { display: flex; gap: .3rem; }
.lineup.a .nick { color: var(--ct); }
.lineup.b .nick { color: var(--t); }
.coach { font-size: var(--s-1); color: var(--dim); display: flex; gap: .4rem; align-items: center; padding-left: .2rem; }

/* factors */
.frow { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr) 3.5rem; gap: .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.frow b { display: block; font-size: var(--s0); }
.frow .sub { color: var(--dim); }
.dv { position: relative; height: .9rem; }
.dv::before { content: ""; position: absolute; left: 50%; top: -.3rem; bottom: -.3rem; width: 1px; background: var(--dim); }
.dv b { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.dv b.pos { left: 50%; background: var(--ct); }
.dv b.neg { right: 50%; background: var(--t); }
.frow .v { text-align: right; font-weight: 700; }
.frow.off { color: var(--dim); }
.frow.off b { font-weight: 400; }
details summary { cursor: pointer; color: var(--dim); font-size: var(--s-1); width: fit-content; }
details ul { margin: .5rem 0 0; padding-left: 1.1rem; font-size: var(--s-1); color: var(--dim); display: grid; gap: .3rem; }

/* map pool butterfly */
.fly { display: grid; gap: .35rem; }
.fly .fr { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem minmax(0, 1fr); gap: .5rem; align-items: center; font-size: var(--s-1); }
.fly .half { display: flex; align-items: center; gap: .4rem; }
.fly .half.l { flex-direction: row-reverse; }
.fly .trk { flex: 1; height: .8rem; background: var(--bg); border-radius: 3px; overflow: hidden; display: flex; }
.fly .half.l .trk { justify-content: flex-end; }
.fly .trk b { display: block; height: 100%; }
.fly .half.l b { background: var(--ct); }
.fly .half.r b { background: var(--t); }
.fly .half span { min-width: 4.4rem; color: var(--dim); }
.fly .half.l span { text-align: right; }
.fly .mn { text-align: center; font-size: var(--s0); }

/* form + h2h */
.res { display: grid; gap: .3rem; }
.res a, .res div.r {
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .5rem; align-items: center;
  font-size: var(--s-1); padding: .3rem .4rem; border-radius: var(--r);
}
.res a:hover { background: var(--raise); }
.wl { width: 1.4rem; height: 1.4rem; border-radius: 3px; display: grid; place-items: center; font-weight: 800; font-size: .7rem; color: var(--bg); }
.wl.W { background: var(--win); }
.wl.L { background: var(--loss); }
.res .ev { color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .opp { display: flex; align-items: center; gap: .4rem; min-width: 0; }
.res .ev .chip.lt { font-size: .62rem; padding: 0 .4rem; margin-right: .35rem; vertical-align: 1px; }

.warn { border-left: 3px solid var(--loss); padding: .15rem 0 .15rem .7rem; font-size: var(--s-1); color: var(--dim); }
.links { display: flex; flex-wrap: wrap; gap: .5rem; }
.btn {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .45rem .85rem; border-radius: 8px;
  background: rgba(23, 42, 46, .55); border: 1px solid var(--line2); font-weight: 600; font-size: var(--s-1); cursor: pointer;
}
.btn:hover { border-color: var(--dim); background: var(--raise); }

/* compare picker */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .4rem; }
.pick .pn { overflow-wrap: anywhere; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
.pick .pv { font-size: .68rem; color: var(--dim); }
.vrs { display: inline-flex; align-items: baseline; gap: .3rem; font-weight: 700; color: var(--text); }
/* team-picker tiles. :not(.tm): veto tiles for picked maps also carry class "pick", and a
   `background:` shorthand here reset their map photo's size and position on hover/press
   (the photo jumped to a zoomed, tiled crop on Mirage, Anubis, Inferno...) */
.pick:not(.tm) {
  display: grid; justify-items: center; gap: .3rem; padding: .6rem .3rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer;
  font-size: .72rem; text-align: center;
}
.pick:not(.tm):hover { background: var(--raise); }
.pick:not(.tm)[data-slot="a"] { border-color: var(--ct); box-shadow: inset 0 -3px 0 var(--ct); background: var(--raise); }
.pick:not(.tm)[data-slot="b"] { border-color: var(--t); box-shadow: inset 0 -3px 0 var(--t); background: var(--raise); }
.slots { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; font-size: var(--s-1); color: var(--dim); }

/* teams */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .6rem; }
.tcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .7rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .75rem; }
.tcard:hover { background: var(--raise); }
.tcard .cond { font-size: var(--s1); overflow-wrap: anywhere; }
.tcard .small { grid-column: 2; }
.thead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.25rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; }
.thead h1 { font-size: var(--s3); }
.thead .big { text-align: right; display: grid; }
.thead .big b { font-size: var(--s3); }
.spark { width: 100%; height: auto; display: block; }
.poolbars { display: grid; gap: .4rem; }
.pb { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 6rem; gap: .6rem; align-items: center; font-size: var(--s-1); }
.pb .thumb { height: 2.2rem; border-radius: 4px; background: var(--raise) center / cover; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: .15rem .3rem; }
.pb .thumb::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, var(--scrim)); }
.pb .thumb span { position: relative; font-size: .78rem; }
.pb .trk { height: .9rem; background: var(--bg); border-radius: 3px; overflow: hidden; position: relative; }
.pb .trk b { display: block; height: 100%; background: var(--ct); }
.pb .trk i { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }

/* record */
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.figs div { display: grid; }
.figs b { font-size: var(--s3); }
.calib svg { width: 100%; max-width: 28rem; height: auto; display: block; }

footer.foot { font-size: var(--s-1); color: var(--dim); display: grid; gap: .35rem; max-width: 80ch; }

@media (max-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .pool { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .pool { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mrow { grid-template-columns: 3.4rem minmax(0, 1fr) 3.6rem minmax(0, 1fr); }
  .mrow .tag { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; justify-content: start; gap: .5rem; }
  .vs { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .5rem; }
  .frow { grid-template-columns: minmax(0, 1fr) 3.5rem; }
  .frow .dv { grid-column: 1 / -1; grid-row: 2; }
  .thead { grid-template-columns: auto minmax(0, 1fr); }
  .thead .big { grid-column: 1 / -1; text-align: left; }
  .fly .half span { min-width: 3.2rem; }
  .srow { grid-template-columns: 6.5rem minmax(0, 1fr) 2.75rem; }
}
@media (prefers-reduced-motion: reduce) {
  .bar .fill, .bar .band, .maptile { transition: none; }
  .reveal { animation: none; }
  .chip.live::before { animation: none; }
}

/* ---------- v3: tournaments ---------- */
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .75rem; }
.evcard {
  display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: .35rem .9rem; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem;
}
.evcard:hover { background: var(--raise); border-color: var(--dim); }
.evcard img.evl { width: 4rem; height: 4rem; object-fit: contain; grid-row: span 2; }
.evcard .ename { font-stretch: 75%; font-weight: 800; font-size: var(--s1); line-height: 1.1; }
.evcard .emeta { font-size: var(--s-1); color: var(--dim); display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
.evcard .efoot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-top: .5rem; border-top: 1px solid var(--line); font-size: var(--s-1); }
.evcard .champ { display: flex; align-items: center; gap: .4rem; font-weight: 700; }
.chip.up { color: var(--ct); }
.chip.done { color: var(--dim); }
.subtabs { display: flex; gap: .35rem; flex-wrap: wrap; }
.subtabs a { padding: .5rem .9rem; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); font-weight: 700; color: var(--dim); }
.subtabs a:hover { color: var(--text); border-color: var(--dim); }
.subtabs a[aria-current="page"] { color: var(--text); background: var(--raise); border-color: var(--t); }
.hero .champline { display: flex; align-items: center; gap: .6rem; margin-top: .75rem; font-weight: 700; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: .75rem; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .85rem; display: grid; gap: .6rem; align-content: start; }
.pcard.sel-a { border-color: var(--ct); box-shadow: inset 0 3px 0 var(--ct); }
.pcard.sel-b { border-color: var(--t); box-shadow: inset 0 3px 0 var(--t); }
.pcard .ph { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .1rem .7rem; align-items: center; }
.pcard .ph .cond { font-size: var(--s1); overflow-wrap: anywhere; }
.pcard .ph .small { grid-column: 2; }
.pcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; font-size: var(--s-1); }
.pcard li { display: flex; align-items: center; gap: .45rem; min-width: 0; }
.pcard li b { font-weight: 700; }
.pcard li .rn { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .btn[aria-pressed="true"] { border-color: var(--t); }
.tray {
  position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem;
  background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: .65rem .9rem;
}
.tray .slot { display: flex; align-items: center; gap: .45rem; font-weight: 700; }
.search { width: 100%; max-width: 22rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .7rem; font: inherit; }
.empty { color: var(--dim); font-size: var(--s-1); padding: .5rem 0; }
.grouptbl + .grouptbl { margin-top: .75rem; }
.grouptbl h3 { font-size: var(--s-1); color: var(--dim); font-weight: 600; margin-bottom: .2rem; }

/* ---------- v5: tournaments ----------
   The season read as a circuit: one calendar strip with every event on its own
   dates, the event running now pulled forward, and the finished ones as an
   honours roll where each champion sits in its own logo colour (--tc, and the
   page-mixed --tcd for fills). No cards for their own sake: rows on hairlines. */
/* page widths: every page uses --pagew (see .page); body[data-w] narrows the desk */
.evname { font-stretch: 62.5%; font-weight: 800; text-transform: uppercase; line-height: .95; }
/* v6: tier filter + tier labels (S solid, A outlined) */
.tierbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; border: 0; padding: 0; margin: 0; }
.tierbar legend { float: left; margin-right: .4rem; color: var(--dim); font-size: var(--s-1); }
.tierbar > .dim { font-size: var(--s-1); }
.tierbox { display: inline-flex; align-items: center; gap: .45rem; padding: .35rem .7rem .35rem .5rem; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); cursor: pointer; font-weight: 700; user-select: none; }
.tierbox:hover { background: var(--raise); }
.tierbox input { margin: 0; width: 1rem; height: 1rem; accent-color: var(--text); }
.tierbox b { font-weight: 400; color: var(--dim); font-size: var(--s-1); }
.tierbox:has(input:checked) { border-color: var(--text); }
.tierbox:has(input:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }
.tier { display: inline-grid; place-items: center; min-width: 1.15em; height: 1.15em; padding: 0 .2em; margin-right: .35em; border-radius: 2px; font-style: normal; font-stretch: 100%; font-weight: 800; font-size: .72em; line-height: 1; vertical-align: .12em; border: 1px solid var(--text); color: var(--text); }
.tier.tS { background: var(--text); color: var(--bg); }
.onair .tier { font-size: .8rem; vertical-align: middle; }

.season { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 3rem; }
.season h1 { font-size: clamp(3rem, 7vw, 5.75rem); line-height: .8; }
.season h1 span { color: var(--dim); font-weight: 600; }
.tally { display: flex; flex-wrap: wrap; gap: .75rem 2.75rem; }
.tally div { display: grid; gap: .15rem; }
.tally b { font-stretch: 62.5%; font-weight: 800; font-size: clamp(2rem, 3.4vw, 2.9rem); line-height: .9; }
.tally span { color: var(--dim); font-size: var(--s-1); }

.strip-wrap { overflow-x: auto; scrollbar-width: thin; border-block: 1px solid var(--line); }
.strip { position: relative; min-width: 62rem; padding: 2.1rem 0 1.6rem; }
.strip .mo { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); padding: .45rem .5rem; font-size: var(--s-1); color: var(--dim); white-space: nowrap; }
.strip .mo.past { background: rgba(0, 0, 0, .12); }
.strip .mo b { color: var(--text); font-weight: 700; }
.strip .lanes { position: relative; display: grid; gap: .45rem; }
.strip .lane { position: relative; height: 3.25rem; }
.pin {
  position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: .45rem;
  padding: 0 .45rem 0 .4rem; min-width: 0; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  box-shadow: inset 3px 0 0 var(--tc, var(--line));
}
.pin:hover, .pin:focus-visible { background: var(--raise); z-index: 3; }
.pin > img { width: 2rem; height: 2rem; object-fit: contain; flex: none; }
.pin .pt { display: grid; min-width: 0; }
.pin .pt b { font-stretch: 62.5%; font-weight: 800; font-size: .95rem; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin .pt span { display: flex; align-items: center; gap: .3rem; font-size: .7rem; color: var(--dim); white-space: nowrap; overflow: hidden; }
.pin .pt .logo { width: .95rem; height: .95rem; }
.pin.live { border-color: var(--loss); box-shadow: inset 3px 0 0 var(--loss), 0 0 0 1px var(--loss); }
.pin.upcoming { background: var(--bg); border-style: dashed; }
.pin.upcoming .pt b { color: var(--dim); }
.strip .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--loss); z-index: 2; pointer-events: none; }

.marquee { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(20rem, 1fr); gap: 1.5rem 2.5rem; align-items: start; }
.onair { display: grid; gap: 1.1rem; padding: 1.25rem 1.4rem 1.4rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: inset 0 3px 0 var(--loss); }
.onair.soon { box-shadow: inset 0 3px 0 var(--ct); }
.onair-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1rem 1.5rem; align-items: center; }
.onair-h > img { width: clamp(5rem, 8vw, 7.5rem); height: auto; }
.onair-h h2 { font-size: clamp(2rem, 3.6vw, 3.25rem); }
.onair-h h2 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.onair .meta { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; margin-top: .5rem; color: var(--dim); }
.onair .meta b { color: var(--text); font-weight: 700; }
.dayctr { display: grid; justify-items: end; text-align: right; }
.dayctr b { font-stretch: 62.5%; font-weight: 800; font-size: clamp(3rem, 6vw, 5rem); line-height: .8; }
.dayctr b small { font-size: .45em; color: var(--dim); font-weight: 700; }
.dayctr span { color: var(--dim); font-size: var(--s-1); margin-top: .75rem; }
.daytrack { display: flex; gap: 3px; }
.daytrack i { flex: 1; height: .4rem; border-radius: 1px; background: var(--line); }
.daytrack i.done { background: var(--dim); }
.daytrack i.today { background: var(--loss); }
.alive { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .6rem 1rem; align-items: center; }
.alive > span { color: var(--dim); font-size: var(--s-1); white-space: nowrap; }
.alive .ls { display: flex; flex-wrap: wrap; gap: .35rem .5rem; }
.alive .ls a { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .55rem .2rem .3rem; border-radius: 3px; background: var(--bg); font-size: var(--s-1); font-weight: 700; }
.alive .ls a:hover { background: var(--raise); }
.alive .ls.out a { background: none; color: var(--dim); font-weight: 400; padding-inline: .2rem; }
.alive .ls.out em { font-style: normal; color: var(--text); font-weight: 700; }

.nextup { display: grid; align-content: start; }
.nextup h2 { font-stretch: 75%; font-weight: 800; font-size: var(--s1); padding-bottom: .5rem; border-bottom: 1px solid var(--line); }
.nu { display: grid; grid-template-columns: 3.4rem 2.75rem minmax(0, 1fr) auto; gap: .2rem .85rem; align-items: center; padding: .75rem .25rem; border-bottom: 1px solid var(--line); }
.nu:hover { background: var(--panel); }
.nu .dt { display: grid; justify-items: center; line-height: 1; }
.nu .dt b { font-stretch: 62.5%; font-weight: 800; font-size: 1.9rem; }
.nu .dt span { font-size: .72rem; color: var(--dim); }
.nu > img, .nu > .evl-ph { width: 2.75rem; height: 2.75rem; object-fit: contain; }
.nu .nm { display: grid; min-width: 0; }
.nu .nm b { font-stretch: 62.5%; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; line-height: 1.05; }
.nu .nm span { font-size: var(--s-1); color: var(--dim); }
.nu .rt { display: grid; justify-items: end; font-size: var(--s-1); }
.nu .rt b { font-weight: 700; }
.nu .rt span { color: var(--dim); }
.evl-ph { display: grid; place-items: center; background: var(--raise); border-radius: 3px; color: var(--dim); font-weight: 800; font-size: .7rem; }

.results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(18rem, 23rem); gap: 1.5rem 2.5rem; align-items: start; }
.results h2, .titles h2 { font-stretch: 75%; font-weight: 800; font-size: var(--s1); padding-bottom: .5rem; border-bottom: 1px solid var(--line); display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; }
.results h2 .dim, .titles h2 .dim { font-stretch: 100%; font-weight: 400; font-size: var(--s-1); }
.roll { display: grid; }
.roll > a {
  display: grid; grid-template-columns: 4.25rem 3.75rem minmax(11rem, 1.25fr) minmax(15rem, 1.35fr) minmax(12rem, 1fr) 6.5rem;
  gap: .5rem 1.1rem; align-items: center; padding: .6rem .25rem; border-bottom: 1px solid var(--line);
}
.roll > a:hover { background: var(--panel); }
.roll .dt { display: grid; line-height: 1.05; }
.roll .dt b { font-stretch: 62.5%; font-weight: 800; font-size: 1.35rem; text-transform: uppercase; }
.roll .dt span { font-size: .72rem; color: var(--dim); }
.roll .el { width: 3.75rem; height: 3.75rem; object-fit: contain; }
.roll .en { display: grid; min-width: 0; gap: .15rem; }
.roll .en b { font-stretch: 62.5%; font-weight: 800; font-size: 1.3rem; text-transform: uppercase; line-height: 1; }
.roll .en span { font-size: var(--s-1); color: var(--dim); }
.roll .cw { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 .8rem; align-items: center; padding: .45rem .8rem .45rem .6rem; border-radius: 3px; background: var(--tcd, var(--panel)); box-shadow: inset 4px 0 0 var(--tc, var(--line)); }
.roll .cw .logo { width: 2.9rem; height: 2.9rem; grid-row: span 2; }
.roll .cw b { font-stretch: 62.5%; font-weight: 800; font-size: 1.6rem; text-transform: uppercase; line-height: .95; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roll .cw span { font-size: .72rem; color: var(--dim); }
.roll .fn { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: .55rem; align-items: center; color: var(--dim); font-size: var(--s-1); min-width: 0; }
.roll .fn .sc { font-stretch: 62.5%; font-weight: 800; font-size: 1.5rem; color: var(--text); white-space: nowrap; }
.roll .fn em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roll .pz { display: grid; justify-items: end; font-size: var(--s-1); }
.roll .pz b { font-weight: 700; font-size: var(--s0); }
.roll .pz span { color: var(--dim); }

.titles { display: grid; align-content: start; }
.trow { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) auto; gap: .2rem .8rem; align-items: center; padding: .65rem .25rem; border-bottom: 1px solid var(--line); }
.trow:hover { background: var(--panel); }
.trow .logo { width: 2.75rem; height: 2.75rem; grid-row: span 2; }
.trow > b { font-stretch: 62.5%; font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1; }
.trow .n { font-stretch: 62.5%; font-weight: 800; font-size: 2.6rem; line-height: .8; grid-row: span 2; color: var(--tc, var(--text)); }
.trow .won { display: flex; flex-wrap: wrap; gap: .25rem; }
.trow .won img { width: 1.9rem; height: 1.9rem; object-fit: contain; }
.trow .won { grid-column: 2; }
.trow .won .evl-ph { width: 1.4rem; height: 1.4rem; font-size: .55rem; }
.pin > .evl-ph { width: 2rem; height: 2rem; flex: none; }
.onair-h > .evl-ph { width: 6rem; height: 6rem; }
.roll .el.evl-ph, .tfin .el.evl-ph { font-size: .8rem; }
.evhero > .evlogo.evl-ph { height: clamp(6rem, 11vw, 10.5rem); font-size: 1.5rem; }

/* one tournament */
.evhero { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(17rem, 30rem); gap: 1.25rem 2.5rem; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
.evhero > .evlogo { width: clamp(6rem, 11vw, 10.5rem); height: auto; }
.evhero h1 { font-size: clamp(2.4rem, 5vw, 4.5rem); line-height: .85; }
.evhero .facts { gap: .6rem 2.25rem; margin-top: 1rem; }
.evhero .facts dd { font-size: var(--s1); font-stretch: 87.5%; }
.evhero .facts .big dd { font-stretch: 62.5%; font-weight: 800; font-size: var(--s2); line-height: 1.1; }
.crown { align-self: stretch; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .15rem 1.1rem; align-content: center; padding: 1.1rem 1.3rem; border-radius: var(--r); background: var(--tcd, var(--panel)); box-shadow: inset 5px 0 0 var(--tc, var(--line)); }
.crown > .logo { width: clamp(4rem, 6vw, 5.75rem); height: clamp(4rem, 6vw, 5.75rem); grid-row: span 3; }
.crown .lbl { font-size: var(--s-1); color: var(--dim); }
.crown .who { font-stretch: 62.5%; font-weight: 800; font-size: clamp(1.9rem, 3vw, 2.8rem); text-transform: uppercase; line-height: .9; overflow-wrap: anywhere; }
.crown .who:hover { text-decoration: underline; }
.crown .sub { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; font-size: var(--s-1); color: var(--dim); }
.crown .sub b { color: var(--text); }
.crown.state { grid-template-columns: minmax(0, 1fr); }
.crown.state .who { font-size: clamp(2.4rem, 4vw, 3.6rem); }
.crown.live { box-shadow: inset 5px 0 0 var(--loss); }

.evbody { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 1.5rem; align-items: start; }
.evbody > .evside { display: grid; gap: 1.5rem; min-width: 0; }
.evbody > .evside + .evside { grid-column: 2; }
.evbody > section:first-child { grid-row: span 2; }
.page.ewide .pool .maptile { aspect-ratio: 16 / 7; }

.stand { display: grid; }
.stand > div { display: grid; grid-template-columns: 4.75rem 5.5rem minmax(0, 1fr); gap: .5rem .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.stand > div:last-child { border-bottom: 0; }
.stand .pl { font-stretch: 62.5%; font-weight: 800; font-size: 1.15rem; text-transform: uppercase; }
.stand .pl.p1 { color: var(--t); }
.stand .usd { font-weight: 700; text-align: right; }
.stand .tms { display: flex; flex-wrap: wrap; gap: .25rem .75rem; min-width: 0; }
.stand .tms .tlink { font-weight: 600; }
.stand .tms .open { color: var(--dim); }

/* following a tournament: the hub above the schedule */
.hub { margin-bottom: 1rem; box-shadow: inset 0 3px 0 var(--loss); }
.hub.done { box-shadow: none; }
.hubgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1rem 1.5rem; align-items: start; }
/* finished rows carry a score, not a pick: a narrow middle column keeps the team names readable */
@media (min-width: 641px) { .hubres .mrow { grid-template-columns: 4.2rem minmax(0, 1fr) 3.6rem minmax(0, 1fr) auto; } }
.hubh { display: flex; align-items: center; gap: .5rem; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: .4rem 0 .35rem; }
.hubday { font-size: var(--s-1); font-weight: 700; margin: .55rem 0 .2rem; }
.hubrec { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; font-size: var(--s-1); color: var(--dim); margin: 0 0 .5rem; }
.hubrec b { color: var(--text); }
.hubrec a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.hubpath { display: grid; margin-top: .5rem; }
.hubpath > a { display: grid; gap: .1rem; padding: .4rem .25rem; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.hubpath > a:last-child { border-bottom: 0; }
.hubpath > a:hover { background: var(--raise); }
.hubpath .logo.xs { vertical-align: -.15rem; margin-right: .2rem; }
.mrow .tm .src, .bm .bt .nm small, .mrow .tm .src small { font-weight: 400; color: var(--dim); }
.mrow .tm .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
.mrow .tm .src i, .bm .bt .nm i { font-style: normal; color: var(--dim); }
.gnx { white-space: nowrap; }
.gnx a { display: inline-flex; align-items: center; gap: .3rem; font-size: var(--s-1); font-variant-numeric: tabular-nums; }
.gnx a b { font-weight: 700; color: var(--dim); }
.gnx a b.fav { color: var(--acc); }
.mpath { margin: .5rem 0 0; }
.mpath a { text-decoration: underline; text-underline-offset: 2px; }
.mpath .logo.xs { vertical-align: -.15rem; margin-right: .15rem; }
@media (max-width: 960px) { .hubgrid { grid-template-columns: minmax(0, 1fr); } }
/* phone: a group table with the Next column drops its VRS column (shown on every team page) to fit */
@media (max-width: 640px) { table.hasnx tr > :last-child { display: none; } }

/* home page: tournaments running now and starting soon */
.hband { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.25rem; }
.hbcard { display: grid; gap: .55rem; align-content: start; padding: .8rem 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: inset 0 3px 0 var(--ct); min-width: 0; flex: 1 1 16rem; }
.hbcard.live { box-shadow: inset 0 3px 0 var(--loss); }
.hbcard:hover { border-color: var(--dim); }
.hbh { display: flex; align-items: center; gap: .65rem; min-width: 0; }
.hbh .hbl { width: 2.5rem; height: 2.5rem; object-fit: contain; flex: none; }
.hbh .evl-ph.hbl { display: grid; place-items: center; font-size: .75rem; font-weight: 800; }
.hbt { display: grid; gap: .15rem; min-width: 0; }
.hbt b { font-stretch: 62.5%; font-weight: 800; font-size: 1.15rem; text-transform: uppercase; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbt > span { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .4rem; font-size: .72rem; color: var(--dim); }
.hbnext { display: grid; gap: .2rem; font-size: var(--s-1); min-width: 0; }
.hbnext small { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.hbm { display: flex; align-items: center; gap: .35rem; min-width: 0; font-weight: 600; }
.hbm em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hbm i { font-style: normal; color: var(--dim); font-weight: 400; }
.hbp { color: var(--dim); }
.hbp b { color: var(--acc); font-weight: 800; }
@media (max-width: 640px) {
  /* phone: the cards scroll sideways in one row instead of stacking above the desk */
  .hband { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: .2rem; }
  .hbcard { flex: 0 0 82%; scroll-snap-align: start; }
}

/* team profile: the team's own finish at each event */
.tfin { display: grid; }
.tfin > a { display: grid; grid-template-columns: 6.5rem 2.75rem minmax(0, 1fr) minmax(6.5rem, auto) 6.5rem; gap: .25rem 1rem; align-items: center; padding: .55rem .25rem; border-bottom: 1px solid var(--line); }
.tfin > a:last-child { border-bottom: 0; }
.tfin > a:hover { background: var(--raise); }
.tfin .dt { font-size: var(--s-1); color: var(--dim); }
.tfin .el { width: 2.75rem; height: 2.75rem; object-fit: contain; }
.tfin .en { display: grid; min-width: 0; }
.tfin .en b { font-stretch: 62.5%; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; line-height: 1.05; }
.tfin .en span { font-size: var(--s-1); color: var(--dim); }
.plc { font-stretch: 62.5%; font-weight: 800; font-size: 1.75rem; line-height: 1; text-transform: uppercase; text-align: right; white-space: nowrap; }
/* medal colours for the top three, green for events still running or coming up */
.plc.p1 { color: #F2C14E; text-shadow: 0 0 18px rgba(242, 193, 78, .35); }
.plc.p2 { color: #C9D3DC; text-shadow: 0 0 18px rgba(201, 211, 220, .25); }
.plc.p3 { color: #D08A4E; text-shadow: 0 0 18px rgba(208, 138, 78, .3); }

.plc.word { font-size: 1.1rem; color: var(--dim); }
.plc.word.on { font-size: 1.5rem; color: var(--win); }

@media (max-width: 1500px) {
