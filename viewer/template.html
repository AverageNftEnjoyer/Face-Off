/* ---------- v4/v8: the matchup desk ----------
   One loud element: the court. Each half is that team's map from the simulated
   veto, darkened and washed in the team's own logo colour, split on a slant like
   the FaceOff mark. Everything around it stays quiet. */
.page > *, .desk > *, .desk-main > * { min-width: 0; }
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.5rem; align-items: start; }
.desk-main { display: grid; gap: 1.25rem; min-width: 0; }
.ctx { display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
.ctx .ev { display: flex; align-items: center; gap: .65rem; min-width: 0; }
.ctx .ev img { width: 2.25rem; height: 2.25rem; object-fit: contain; }
.ctx .ev b { font-weight: 700; }
.ctx .ev span { color: var(--dim); }
.ctx a.btn { font-weight: 600; }

.logo.xs { width: .95rem; height: .95rem; }
.logo.md { width: 2.4rem; height: 2.4rem; }

.court {
  --seam: 104deg;
  position: relative; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 1rem 1.25rem; align-items: stretch;
  min-height: clamp(20rem, 25vw, 26rem);
  padding: clamp(1.1rem, 2.6vw, 2rem) clamp(1rem, 2.6vw, 2.25rem) 1.1rem;
  border-radius: var(--rp); border: 1px solid var(--line2);
  background: #040A0C;
  box-shadow: 0 24px 60px -30px rgba(0, 0, 0, .9);
}
/* the two backdrops: each half is lit in its team's own colour from its outer
   corner and falls off into the dark toward the seam and the bottom edge */
.cbg {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-color: #060D10;
}
.cbg.a {
  background-image:
    linear-gradient(180deg, transparent 45%, rgba(4, 10, 12, .78) 100%),
    radial-gradient(ellipse 75% 95% at 0% 0%, color-mix(in srgb, var(--ct) 48%, transparent), transparent 68%),
    radial-gradient(ellipse 55% 60% at 22% 105%, color-mix(in srgb, var(--ct) 16%, transparent), transparent 72%),
    linear-gradient(112deg, var(--ct-deep) 0%, color-mix(in srgb, var(--ct-deep) 55%, #060D10) 38%, #060D10 58%);
  -webkit-mask-image: linear-gradient(var(--seam), #000 0 49.6%, transparent 49.6%); mask-image: linear-gradient(var(--seam), #000 0 49.6%, transparent 49.6%);
}
.cbg.b {
  background-image:
    linear-gradient(180deg, transparent 45%, rgba(4, 10, 12, .78) 100%),
    radial-gradient(ellipse 75% 95% at 100% 0%, color-mix(in srgb, var(--t) 48%, transparent), transparent 68%),
    radial-gradient(ellipse 55% 60% at 78% 105%, color-mix(in srgb, var(--t) 16%, transparent), transparent 72%),
    linear-gradient(248deg, var(--t-deep) 0%, color-mix(in srgb, var(--t-deep) 55%, #060D10) 38%, #060D10 58%);
  -webkit-mask-image: linear-gradient(var(--seam), transparent 50.4%, #000 50.4%); mask-image: linear-gradient(var(--seam), transparent 50.4%, #000 50.4%);
}
/* a lit edge along the split */
.court::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--seam), transparent 49.62%, rgba(255, 255, 255, .22) 49.75%, rgba(255, 255, 255, .22) 50.25%, transparent 50.38%);
}
.cside { display: grid; align-content: space-between; gap: 1.25rem; min-width: 0; }
.chead { display: flex; align-items: center; gap: clamp(.75rem, 1.6vw, 1.4rem); min-width: 0; }
.cside.b .chead { flex-direction: row-reverse; text-align: right; }
.clogo { flex: none; display: block; }
/* no filter on the logo image: Safari can draw a drop-shadow on a freshly swapped,
   lazily decoded transparent image as a faint box around the logo */
.cside .logo.xl { width: clamp(4.5rem, 7.5vw, 7.75rem); height: clamp(4.5rem, 7.5vw, 7.75rem); background: none; border-radius: 0; }
.cid { display: grid; justify-items: start; gap: .35rem; min-width: 0; }
.cside.b .cid { justify-items: end; }
.cname {
  font-style: italic; font-weight: 900; font-size: clamp(1.6rem, 3.1vw, 3.1rem); line-height: .92;
  overflow-wrap: anywhere; text-shadow: 0 2px 18px rgba(0, 0, 0, .6);
}
.cname:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.crank { display: flex; flex-wrap: wrap; gap: .1rem .9rem; font-style: italic; font-stretch: 75%; font-weight: 800; font-size: clamp(1rem, 1.5vw, 1.35rem); line-height: 1.1; letter-spacing: .01em; }
.cside.b .crank { justify-content: flex-end; }
.cside.a .crank { color: var(--ct); }
.cside.b .crank { color: var(--t); }
.cside .cchg {
  margin-top: .3rem; padding: .3rem .65rem; font-size: .78rem; gap: .45rem;
  background: rgba(4, 10, 12, .5); border-color: rgba(228, 238, 236, .3); color: var(--text);
  position: relative; z-index: 2;
}
.cside .cchg:hover { border-color: var(--text); background: rgba(4, 10, 12, .7); }
.cside .cchg .ico { width: .95rem; height: .95rem; }
.cpct { display: grid; justify-items: start; gap: .35rem; }
.cside.b .cpct { justify-items: end; }
.cbig { font-size: clamp(3.4rem, 6.6vw, 6.4rem); line-height: .82; font-weight: 900; color: var(--text); pointer-events: none; text-shadow: 0 4px 24px rgba(0, 0, 0, .5); letter-spacing: -.005em; }
.cbig small { font-size: .5em; font-weight: 800; }
.cside.a .cbig small { color: var(--ct); }
.cside.b .cbig small { color: var(--t); }
.clbl { font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(228, 238, 236, .82); }
.ccentre { display: grid; justify-items: center; gap: .5rem; text-align: center; align-self: center; max-width: 12rem; }
.ccentre .vsword { font-style: italic; font-weight: 900; font-size: clamp(3rem, 6.5vw, 6.5rem); color: var(--text); letter-spacing: -.02em; text-shadow: 0 6px 30px rgba(0, 0, 0, .7); }
.ccentre .score { font-size: clamp(3rem, 7vw, 5.5rem); font-style: italic; display: flex; gap: .5rem; align-items: baseline; text-shadow: 0 6px 30px rgba(0, 0, 0, .7); }
.ccentre .score .lost { color: var(--dim); }
.ccentre .chip { background: var(--bg); white-space: normal; }
.court .cbar { grid-column: 1 / -1; display: grid; gap: .55rem; }
/* the win bar: team 1's colour from the left, team 2's from the right (fading toward
   its end), the likely range striped in each team's colour on its side of the
   estimate, and a white line at the estimate itself */
.court .bar {
  height: .95rem; border-radius: 999px; overflow: hidden;
  /* team 2's colour stays flat (so its side of the striped range matches it) and only
     dims over the last stretch, mirroring team 1's fill which brightens toward the estimate */
  background: linear-gradient(90deg, color-mix(in srgb, var(--t) 92%, #fff) 0 72%, color-mix(in srgb, var(--t) 62%, #0B1518) 100%);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 0 22px -6px color-mix(in srgb, var(--ct) 55%, transparent);
}
.court .bar .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--ct) 70%, #0B1518), var(--ct)); }
/* the likely range: the same solid team colours as the rest of the bar (team 1 up to
   the estimate, team 2 after it) with soft, darker stripes laid over them, so it reads
   as a textured part of the same bar rather than a separate dark block */
.court .bar .band {
  border: 0;
  background-image:
    repeating-linear-gradient(120deg, rgba(4, 10, 12, .26) 0 4px, rgba(255, 255, 255, .06) 4px 5px, transparent 5px 9px),
    linear-gradient(90deg, var(--ct) 0 var(--split, 50%), color-mix(in srgb, var(--t) 92%, #fff) var(--split, 50%) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(0, 0, 0, .2);
}
.court .bar .mk {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px;
  background: #fff; box-shadow: 0 0 0 1px rgba(4, 10, 12, .7), 0 0 8px rgba(255, 255, 255, .85);
  transition: left .9s cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-reduced-motion: reduce) { .court .bar .mk { transition: none; } }
.court .legend { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .4rem 1rem; font-size: var(--s-1); color: rgba(228, 238, 236, .72); }
.court .legend .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.court .legend .chip { background: rgba(4, 10, 12, .6); padding: .1rem .6rem; }
.chip.rel::before { content: ""; width: .4rem; height: .4rem; border-radius: 50%; background: currentColor; }

/* controls row inside the court, centred under the bar */
/* one row under the bar: section tabs at the left (under team 1), Format + Swap at the right */
.court .cctl { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem 1rem; margin-top: .35rem; }
.court .cctl .cctl-r { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .5rem .75rem; margin-left: auto; }
.court .cctl .dtabs { background: rgba(4, 10, 12, .55); }
/* the row must never be wider than the court (the tabs' natural width pushed the bar off-screen on phones) */
.court .cbar, .court .cctl, .court .cctl .dtabs { min-width: 0; max-width: 100%; }
.dtabs .tl-short { display: none; }
@media (max-width: 760px) { .dtabs .tl-full { display: none; } .dtabs .tl-short { display: inline; } }
@media (max-width: 760px) {
  .court .cctl { flex-direction: column; align-items: stretch; }
  .court .cctl .dtabs { width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .court .cctl .dtabs button { padding-inline: .2rem; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .court .cctl .cctl-r { justify-content: center; margin-left: 0; }
}
.court .cctl .btn { background: rgba(4, 10, 12, .55); }
.court .cctl .btn:disabled { opacity: .45; cursor: default; }
.court .cctl .chip { background: rgba(4, 10, 12, .6); }
.cbelow { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: .6rem 1rem; margin-top: -.35rem; }
.cbelow .cb-l, .cbelow .cb-r { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.cbelow .btn:disabled { opacity: .45; cursor: default; }
.btn .ico { width: .95rem; height: .95rem; }
.btn.acc { border-color: color-mix(in srgb, var(--acc) 55%, transparent); color: var(--acc); }
.btn.acc:hover { border-color: var(--acc); background: rgba(47, 212, 162, .08); }

.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; padding: .25rem .75rem; border-radius: 6px; cursor: pointer; font-size: var(--s-1); font-weight: 700; color: var(--dim); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--acc-deep); color: var(--acc); box-shadow: inset 0 0 0 1px rgba(47, 212, 162, .35); }
.seg button:disabled { cursor: default; }
.seg button:not([aria-pressed="true"]):disabled { display: none; }

/* section tabs: one connected strip of pills */
.dtabs { display: flex; width: fit-content; max-width: 100%; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); overflow-x: auto; scrollbar-width: none; }
.dtabs button {
  display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap;
  background: none; border: 1px solid transparent; border-radius: 8px; padding: .5rem 1.05rem; cursor: pointer;
  color: var(--dim); font-weight: 600; font-size: .95rem;
}
.dtabs button .ico { width: 1.05rem; height: 1.05rem; }
.dtabs button:hover { color: var(--text); background: var(--raise); }
.dtabs button[aria-selected="true"] { color: var(--acc); background: var(--acc-deep); border-color: rgba(47, 212, 162, .3); }
.dtabs button[aria-selected="true"] span { color: var(--text); }

/* veto tape: every map of the pool in veto order */
.tape { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); gap: .45rem; }
.tm {
  position: relative; overflow: hidden; min-height: 8.75rem; padding: .45rem .55rem .55rem;
  display: grid; grid-template-rows: auto 1fr; text-align: left; cursor: pointer;
  background: var(--raise) center / cover no-repeat; border: 1px solid var(--line2); border-radius: 9px;
}
.tm::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 11, 13, .1), rgba(5, 11, 13, .55) 38%, rgba(5, 11, 13, .95) 70%); }
.tm > * { position: relative; }
.tm .tn { font-weight: 800; font-size: .72rem; color: rgba(228, 238, 236, .75); }
.tm .tbody { align-self: end; display: grid; gap: .2rem; min-width: 0; }
.tm .tnm { font-style: italic; font-weight: 900; font-size: 1.2rem; }
.tm .trole { display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .3rem; min-width: 0; font-size: .72rem; line-height: 1.25; color: var(--text); }
/* a narrow tile puts the team name on its own line rather than cutting it */
.tm .trole em { font-style: normal; flex: 1 1 100%; max-width: 100%; overflow-wrap: anywhere; white-space: normal; }
.tm .trole i { flex: none; font-style: normal; font-weight: 800; font-size: .6rem; letter-spacing: .05em; text-transform: uppercase; padding: 0 .3rem; border-radius: 3px; line-height: 1.5; }
.tm.ban .trole i { background: var(--loss); color: #fff; }
.tm.pick .trole i { background: var(--win); color: #06100c; }
.tm.dec .trole i { background: var(--text); color: var(--bg); }
.tm .tst { display: grid; gap: .1rem; margin-top: .25rem; font-size: .72rem; font-weight: 700; }
.tm .tst > span { display: flex; align-items: center; gap: .35rem; min-width: 0; white-space: nowrap; }
.tm .tst > span > span { overflow: hidden; text-overflow: ellipsis; }
.tm .tst .na { color: var(--dim); font-weight: 600; }
.tm:hover { border-color: var(--dim); }
.tm:hover::before { background: linear-gradient(180deg, rgba(5, 11, 13, 0), rgba(5, 11, 13, .45) 38%, rgba(5, 11, 13, .93) 70%); }
.tm[aria-pressed="true"] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc), 0 0 22px -6px rgba(47, 212, 162, .7); }

.spot { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1.1rem; align-items: stretch; }
.spot .img {
  position: relative; min-height: 14rem; border-radius: 10px; overflow: hidden; border: 1px solid var(--line2);
  background: var(--raise) center / cover no-repeat; display: flex; align-items: flex-end; padding: 1rem 1.15rem;
}
.spot .img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(200deg, transparent 35%, rgba(5, 11, 13, .9) 85%); }
.spot .img > * { position: relative; }
.sname { display: grid; gap: .3rem; }
.sname b { font-style: italic; font-weight: 900; font-size: clamp(2.4rem, 4.6vw, 3.9rem); text-shadow: 0 3px 18px rgba(0, 0, 0, .6); }
.sname small { font-size: .9rem; color: rgba(228, 238, 236, .85); }
.snext {
  position: absolute !important; right: .8rem; bottom: 1rem; width: 2.75rem; height: 3.5rem;
  display: grid; place-items: center; cursor: pointer; color: var(--text);
  background: rgba(5, 11, 13, .62); border: 1px solid rgba(228, 238, 236, .32); border-radius: 9px;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.snext:hover { border-color: var(--acc); color: var(--acc); }
.snext .ico { width: 1.2rem; height: 1.2rem; }
.spot .info { display: grid; gap: .9rem; align-content: start; }
.spot .role { font-size: var(--s-1); color: var(--dim); }
.mchance .nums { display: flex; justify-content: space-between; align-items: baseline; }
.mchance .nums .cond { font-size: var(--s3); }
.mchance .odds { height: .55rem; border-radius: 999px; overflow: hidden; background: var(--t); position: relative; margin-top: .35rem; }
.mchance .odds b { position: absolute; inset: 0 auto 0 0; background: var(--ct); }
.mrec { display: grid; gap: .55rem; font-size: var(--s-1); }
.mrec .r { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .2rem .6rem; align-items: center; }
.mrec .r .logo { width: 1.6rem; height: 1.6rem; grid-row: span 2; }
.mrec .r > span:nth-of-type(1) { font-weight: 600; }
.mrec .trk { grid-column: 2 / -1; height: .4rem; background: var(--bg); border-radius: 999px; overflow: hidden; position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.mrec .trk b { display: block; height: 100%; border-radius: 999px; }
.mrec .trk i { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }
.mrec .a b { background: var(--ct); }
.mrec .b b { background: var(--t); }

/* pick and ban chances: one row per pool map, a bar split by who picks it / the decider */
.vch { margin-top: 1.4rem; display: grid; gap: .6rem; }
.vch h3 { font-size: var(--s0); font-weight: 800; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem; }
.vch h3 .dim { font-weight: 400; }
.vlist { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.vrow {
  position: relative; overflow: hidden; background: var(--bg) center / cover no-repeat; border: 1px solid var(--line); border-radius: 9px;
  padding: .55rem .75rem; display: grid; gap: .15rem .9rem; align-items: center;
  grid-template-columns: minmax(5.5rem, 8rem) minmax(0, 1fr) minmax(0, 1.1fr);
  grid-template-areas: "nm pl bar" "nm sp ban" "nt nt nt";
}
.vrow::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 11, 13, .55), var(--scrim) 40%); }
.vrow > * { position: relative; min-width: 0; }
.vnm { grid-area: nm; font-style: italic; font-weight: 900; font-size: 1.3rem; }
.vpl { grid-area: pl; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.vpl b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.vbar { grid-area: bar; display: flex; height: .6rem; border-radius: 999px; overflow: hidden; background: var(--line); }
.vbar i { display: block; height: 100%; }
.vbar i.ct { background: var(--ct); }
.vbar i.t { background: var(--t); }
.vbar i.dec { background: var(--dim); }
.vsplit, .vban { display: flex; flex-wrap: wrap; gap: .1rem .8rem; font-variant-numeric: tabular-nums; }
.vsplit { grid-area: sp; }
.vban { grid-area: ban; }
.vnotes { grid-area: nt; display: flex; flex-wrap: wrap; gap: .2rem .8rem; }
.vmask { font-weight: 600; }
.vmask::before { content: "\2298\00a0"; }
.vpool { margin-top: .6rem; }
@media (max-width: 760px) {
  .vrow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "nm pl" "bar bar" "sp sp" "ban ban" "nt nt"; padding: .6rem .7rem; }
  .vpl { justify-content: flex-end; }
  .vpl .small { display: none; }
  .vrow::before { background: linear-gradient(90deg, rgba(5, 11, 13, .7), var(--scrim) 60%); }
}

/* series score: team 1's winning scores | vs | team 2's */
.stiles { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .75rem; align-items: center; container-type: inline-size; }
/* a narrow panel drops the team name under each score: the logo already says whose it is */
@container (max-width: 30rem) { .stile .sn { display: none; } }
.scol { display: grid; gap: .55rem; }
.svs { font-style: italic; font-weight: 900; font-size: 1.75rem; color: var(--acc); }
.stile {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .35rem .8rem; align-items: center;
  padding: .7rem .85rem .65rem; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
.stile .logo { grid-row: span 2; }
.stile .sx { display: grid; min-width: 0; line-height: 1.05; }
.stile .sx b { font-size: 1.75rem; font-weight: 900; }
.stile .sn { font-size: .75rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: .15rem; }
.stile .v { font-size: .9rem; color: var(--dim); font-weight: 600; text-align: right; }
.stile .sb { grid-column: 2 / -1; height: .3rem; border-radius: 999px; background: var(--line); overflow: hidden; }
.stile .sb i { display: block; height: 100%; border-radius: 999px; }
.stile.a .sb i { background: var(--ct); }
.stile.b .sb i { background: var(--t); }
.stile.top { border-color: var(--acc); background: linear-gradient(180deg, rgba(47, 212, 162, .1), rgba(47, 212, 162, .02)), var(--bg); box-shadow: 0 0 24px -10px rgba(47, 212, 162, .6); }
.stile.top .v { color: var(--text); font-weight: 800; }
.stile .pk { position: absolute; top: -.6rem; right: .7rem; font-size: .66rem; font-weight: 800; letter-spacing: .04em; color: #04120D; background: var(--acc); border-radius: 4px; padding: 0 .4rem; line-height: 1.5; }

/* what moves the number */
.frow { display: grid; grid-template-columns: 2.4rem minmax(8.5rem, 13rem) minmax(0, 1fr) 3.5rem; gap: .9rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.frow:last-of-type { border-bottom: 0; }
.fic { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg); color: var(--acc); }
.fic .ico { width: 1.15rem; height: 1.15rem; }
.frow.off .fic { color: var(--dim); }
.frow .fl b { display: block; font-size: var(--s0); font-weight: 600; }
.dv { height: .55rem; }
.dv::before { top: -.35rem; bottom: -.35rem; background: var(--line2); }
.dv b { border-radius: 999px; }
.dv b.pos { box-shadow: 0 0 12px -2px color-mix(in srgb, var(--ct) 70%, transparent); }
.dv b.neg { box-shadow: 0 0 12px -2px color-mix(in srgb, var(--t) 70%, transparent); }
.frow .v { font-size: var(--s0); }
.frow.off .v { font-weight: 400; font-size: var(--s-1); }

/* right rail */
.rail { display: grid; gap: 1rem; position: sticky; top: 5rem; }
.rail .panel > h2 { font-size: 1.35rem; }
/* team chooser: a modal dialog opened from the court's "Change Team" buttons */
.tdlg {
  padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text);
  width: min(46rem, calc(100vw - 1.5rem)); max-width: none; max-height: min(85vh, 44rem); overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.tdlg[open] { display: flex; }
.tdlg::backdrop { background: rgba(5, 8, 12, .7); }
.tdlg-in { display: flex; flex-direction: column; gap: .65rem; padding: 1rem; min-height: 0; width: 100%; }
.tdlg-h { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.tdlg-h h2 { margin: 0; font-size: var(--s1); }
.tdlg input[type="search"] { min-width: 0; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .55rem .7rem; font: inherit; }
.tdlg p { margin: 0; }
.tdlg .picker { overflow-y: auto; min-height: 0; flex: 1 1 auto; padding: 2px; overscroll-behavior: contain; }
@media (max-width: 520px) { .tdlg-in { padding: .75rem; } .tdlg .picker { grid-template-columns: repeat(auto-fill, minmax(4.75rem, 1fr)); } }
.rlist { display: grid; }
.rlist a { display: grid; grid-template-columns: 1.9rem 1.35rem minmax(0, 1fr) auto; gap: .55rem; align-items: center; padding: .42rem .45rem; border-radius: 7px; font-size: var(--s-1); }
.rlist a + a { margin-top: 1px; }
.rlist a:hover { background: var(--raise); }
/* the two teams in the matchup above */
.rlist a.on { background: linear-gradient(90deg, rgba(47, 212, 162, .1), rgba(47, 212, 162, .02)); }
.rlist a.oa { box-shadow: inset 3px 0 0 var(--ct); }
.rlist a.ob { box-shadow: inset 3px 0 0 var(--t); }
.rlist a.on .nm { color: var(--text); font-weight: 700; }
.rlist .rk { color: var(--dim); text-align: right; font-weight: 700; }
.rlist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.form5 { display: flex; gap: 2px; }
.form5 i { width: .42rem; height: .95rem; border-radius: 2px; background: var(--line); }
.form5 i.W { background: var(--win); }
.form5 i.L { background: var(--loss); }
.nextm { display: grid; gap: .4rem; padding: .65rem 0; border-bottom: 1px solid var(--line); font-size: var(--s-1); }
.nextm:last-child { border-bottom: 0; }
.nextm .tt { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .4rem; align-items: center; }
.nextm .tt span { display: flex; align-items: center; gap: .35rem; min-width: 0; font-weight: 600; }
.nextm .tt span:last-child { justify-content: flex-end; }
.nextm .tt em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nextm .mini { height: .22rem; border-radius: 999px; background: var(--c2, var(--t)); overflow: hidden; display: flex; }
.nextm .mini b { display: block; height: 100%; background: var(--c1, var(--ct)); border-right: 2px solid var(--panel); }
  border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; }
.rtag { justify-self: start; font-size: .75rem; font-weight: 700; padding-left: .45rem; border-left: 2px solid currentColor; line-height: 1.2; }
.rtag.hit { color: var(--win); }
.rtag.miss { color: var(--loss); }
.nextm:hover .tt em { text-decoration: underline; }

/* ---------- v4: track record ---------- */
.board { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.board > div { padding: 1.1rem 1.25rem; display: grid; align-content: start; gap: .2rem; }
.board > div + div { border-left: 1px solid var(--line); }
.board .num { font-size: clamp(3rem, 8vw, 5.5rem); line-height: .9; }
.board .num small { font-size: .4em; font-weight: 700; }
.board .lbl { color: var(--dim); font-size: var(--s-1); }
.board .first { background: linear-gradient(180deg, color-mix(in srgb, var(--win) 14%, var(--panel)), var(--panel)); }
.streak { display: flex; gap: 3px; margin-top: .45rem; flex-wrap: wrap; }
.streak i { width: .55rem; height: 1.15rem; border-radius: 2px; }
.streak i.h { background: var(--win); }
.streak i.m { background: var(--loss); }
.chart { width: 100%; height: auto; display: block; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: end; }
.filters label { display: grid; gap: .2rem; font-size: var(--s-1); color: var(--dim); }
.filters select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .4rem .55rem; font: inherit; font-size: var(--s-1); min-width: 10rem; }
.log td { vertical-align: middle; }
.log tr:hover td { background: var(--raise); }
.log .tl { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
.log .tl.won { font-weight: 700; }
.log .tl:not(.won) { color: var(--dim); }
.log .ev { color: var(--dim); display: block; font-size: .72rem; }
.hm { display: inline-grid; place-items: center; min-width: 2.6rem; padding: .1rem .4rem; border-radius: 3px; font-weight: 800; font-size: .72rem; color: var(--bg); }
.hm.h { background: var(--win); }
.hm.m { background: var(--loss); }
.lb { display: grid; gap: .35rem; }
.lb .row { display: grid; grid-template-columns: 1.35rem minmax(0, 1fr) 5.5rem 3.6rem; gap: .5rem; align-items: center; font-size: var(--s-1); }
.lb .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lb .row .rec { color: var(--dim); text-align: right; }
.lb .row .v { text-align: right; font-weight: 700; }
.lb .row .trk { grid-column: 2 / -1; position: relative; height: .5rem; background: var(--bg); border-radius: 3px; }
.lb .row .trk .ci { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--text) 16%, transparent); border-radius: 3px; }
.lb .row .trk .pt { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--text); border-radius: 1px; }
.lb.best .row .trk .pt { background: var(--win); }
.lb.worst .row .trk .pt { background: var(--loss); }
.callcards { display: grid; gap: .45rem; }
.callcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .15rem .75rem; padding: .55rem .7rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: var(--s-1); }
.callcard:hover { border-color: var(--dim); }
.callcard b { font-weight: 700; }
.callcard .dim { grid-column: 1 / -1; }
.callcard .big { font-size: var(--s1); text-align: right; }
.splitfig { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.splitfig div { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .75rem .85rem; display: grid; gap: .15rem; }
.splitfig b { font-size: var(--s3); }
.chart-head { display: flex; justify-content: flex-end; }
/* track record: how-to note, baseline scores, filtered summary, team table */
.rec-pair { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.how p { font-size: var(--s-1); color: var(--dim); }
.how p b { color: var(--text); }
.how details > p, .how details > .tablewrap { margin-top: .5rem; }
.scores td .dim { display: block; font-size: .72rem; }
.scores td.n, .tteam td.n { font-variant-numeric: tabular-nums; }
.tteam td.n, .ctab td.n, .ctab td:first-child { white-space: nowrap; }
.filters input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: .35rem .5rem; font: inherit; font-size: var(--s-1); color-scheme: dark; }
.fsum { display: flex; flex-wrap: wrap; gap: .35rem 1rem; align-items: center; padding: .6rem .75rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--dim); }
.fsum b { color: var(--text); }
.fsum .fbtns { display: flex; flex-wrap: wrap; gap: .5rem; margin-left: auto; }
.tteam .tl { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
.tteam td:first-child { position: sticky; left: 0; background: var(--panel); }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--acc); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
@media (min-width: 761px) { .rec-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .filters label { flex: 1 1 calc(50% - .75rem); min-width: 0; }
  .filters select, .filters input { min-width: 0; width: 100%; }
  .fsum .fbtns { margin-left: 0; }
}
svg.rchart { cursor: crosshair; touch-action: pan-y; }
/* track record: wide-screen layout */
.rec-row3, .rec-quad { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.rec-splits { display: grid; gap: 1rem; align-content: start; min-width: 0; }
.log .xw { display: none; }
.log td.dt { white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (min-width: 761px) {
  .rec-row3, .rec-quad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rec-splits { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .rq-wide { grid-column: 1 / -1; }
}
@media (min-width: 1400px) {
  .rec-row3 { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, .9fr); }
  .rec-splits { grid-column: auto; grid-template-columns: minmax(0, 1fr); }
  .log .xw { display: table-cell; }
  .log .evd { display: none; }
  .log td { padding-block: .45rem; }
}
@media (min-width: 1800px) {
  .rec-quad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

@media (max-width: 1080px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
}
@media (max-width: 760px) {
  .tape { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .spot { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: minmax(0, 1fr); }
  .board > div + div { border-left: 0; border-top: 1px solid var(--line); }
  /* the court on narrow screens: logo over name on each side, a smaller VS between */
  .court { --seam: 100deg; min-height: 0; gap: 1rem .5rem; padding: 1rem .9rem .9rem; }
  .chead, .cside.b .chead { flex-direction: column; align-items: flex-start; gap: .55rem; }
  .cside.b .chead { align-items: flex-end; }
  .cside .logo.xl { width: 3.6rem; height: 3.6rem; }
  .cname { font-size: clamp(1.25rem, 5.6vw, 1.75rem); }
  .crank { font-size: .95rem; gap: 0 .55rem; }
  .cside .cchg { font-size: .74rem; padding: .25rem .5rem; }
  .cbig { font-size: clamp(2.4rem, 11vw, 3.4rem); }
  .clbl { font-size: .62rem; letter-spacing: .1em; }
  .ccentre .vsword { font-size: 2rem; }
  .ccentre .score { font-size: 2.4rem; }
  .ccentre { align-self: start; margin-top: 1.4rem; }
  .court .legend { font-size: .75rem; }
  .frow { grid-template-columns: 2.4rem minmax(0, 1fr) 3.5rem; gap: .25rem .75rem; }
  .frow .fic { grid-row: span 2; align-self: start; }
  .frow .dv { grid-column: 2 / -1; grid-row: 2; }
  .stiles { gap: .4rem; }
  .svs { font-size: 1.15rem; }
  .stile { grid-template-columns: auto minmax(0, 1fr); padding: .6rem .6rem .55rem; gap: .25rem .55rem; }
  .stile .logo.md { width: 1.7rem; height: 1.7rem; grid-row: span 1; }
  .stile .sx b { font-size: 1.35rem; }
  .stile .sn { display: none; }
  .stile .v { grid-column: 1 / -1; text-align: left; font-size: .8rem; }
  .stile .sb { grid-column: 1 / -1; }
  .stile .pk { right: .4rem; }
}
@media (max-width: 520px) {
  .splitfig { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- v7: wide screens, phones, Stats rows ---------- */
/* thin dark scrollbars for every scroller, page included: invisible at rest, shown while that
   element scrolls (JS adds .sb-on for ~1 s after each scroll event) */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; transition: scrollbar-color .35s; }
.sb-on { scrollbar-color: #3B4757 transparent; }
.tablewrap, .strip-wrap, .scrolly, .rec-row3 > .panel, .rec-splits > .panel, .rec-quad > .panel, .tdlg .picker {
  scrollbar-width: thin;
}
.tablewrap::-webkit-scrollbar, .strip-wrap::-webkit-scrollbar, .rec-row3 > .panel::-webkit-scrollbar, .rec-splits > .panel::-webkit-scrollbar, .rec-quad > .panel::-webkit-scrollbar, .tdlg .picker::-webkit-scrollbar { width: 8px; height: 8px; }
.tablewrap::-webkit-scrollbar-thumb, .strip-wrap::-webkit-scrollbar-thumb, .rec-row3 > .panel::-webkit-scrollbar-thumb, .rec-splits > .panel::-webkit-scrollbar-thumb, .rec-quad > .panel::-webkit-scrollbar-thumb, .tdlg .picker::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; border: 2px solid var(--panel); }
.tablewrap::-webkit-scrollbar-track, .strip-wrap::-webkit-scrollbar-track, .rec-row3 > .panel::-webkit-scrollbar-track, .rec-splits > .panel::-webkit-scrollbar-track, .rec-quad > .panel::-webkit-scrollbar-track, .tdlg .picker::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
.sb-on::-webkit-scrollbar-thumb { background: #3B4757; }
/* a table wider than its box shows a soft edge on the side that has more to scroll to */
.tablewrap {
  background:
    linear-gradient(90deg, var(--panel) 40%, rgba(31, 38, 48, 0)) left / 2.5rem 100% no-repeat local,
    linear-gradient(270deg, var(--panel) 40%, rgba(31, 38, 48, 0)) right / 2.5rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(149, 161, 176, .32), transparent) left / .8rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(149, 161, 176, .32), transparent) right / .8rem 100% no-repeat scroll;
}

/* matchup desk: on wide screens the veto, the series score and the factors sit side by side */
.ovw { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.ovw > * { min-width: 0; }
@media (min-width: 761px) {
  .ovw { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ovw-veto { grid-column: 1 / -1; }
}
@media (min-width: 1500px) {
  .ovw { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); grid-template-areas: "veto fac" "score fac"; }
  .ovw-veto { grid-area: veto; }
  .ovw > :nth-child(2) { grid-area: score; }
  .ovw > :nth-child(3) { grid-area: fac; align-self: stretch; }
  .desk { grid-template-columns: minmax(0, 1fr) 22rem; gap: 2rem; }
}
.rail .rsc { font-size: 1.15rem; white-space: nowrap; }
.rail .rsc i { font-style: normal; padding-inline: .15rem; }
.nextm .tt .lost em { color: var(--dim); font-weight: 400; }
@media (max-height: 999px) { .rail { position: static; } }

/* team profile: roster, Elo and map pool across; finishes and results below */
.tlay { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
.tlay > * { min-width: 0; }
@media (min-width: 761px) {
  .tlay { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "line elo" "fin fin" "pool res"; }
  .tlay > :first-child { grid-area: line; }
  .tlay > .tl-elo { grid-area: elo; align-self: stretch; }
  .tlay > .panel:has(.tfin) { grid-area: fin; }
  .tlay > .tl-pool { grid-area: pool; }
  .tlay > .tl-res { grid-area: res; }
}
@media (min-width: 1500px) {
  .tlay { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "line elo pool" "fin fin res"; }
  .tlay > .tl-pool { align-self: stretch; }
}
.tgrid { grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }

/* Stats: modules in a row are one height; longer content scrolls inside its own panel */
.pclegend { max-width: none; margin-top: -.5rem; }
.pclegend span { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; margin-inline: .2rem .55rem; }
.pclegend span:nth-of-type(3) { margin-right: 0; }
.pclegend span::before { content: ""; width: .7rem; height: .7rem; border-radius: 2px; background: currentColor; }
.pc-hi { color: var(--win); }
.pc-mid { color: var(--amber); }
.pc-lo { color: var(--loss); }
td.pc-hi, td.pc-mid, td.pc-lo, .lb .row .v { font-weight: 700; }
.board .num.pc-hi, .board .num.pc-mid, .board .num.pc-lo { text-shadow: 0 0 28px color-mix(in srgb, currentColor 25%, transparent); }
/* home: coming up, as a list of fixtures. One hairline between rows, no boxes. */
.fxlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 31rem), 1fr)); column-gap: 3rem; }
.fx { display: grid; grid-template-columns: 11.5rem minmax(0, 1fr) 2rem; gap: 0 1rem; align-items: start; padding: .8rem 0; border-top: 1px solid var(--line); }
.fxlist > .fx:first-child { border-top-color: transparent; }
@media (min-width: 761px) { .fxlist > .fx:nth-child(2) { border-top-color: transparent; } }
@media (max-width: 760px) { .fx { grid-template-columns: minmax(0, 1fr) 2rem; } .fx-main { grid-column: 1 / -1; grid-row: 2; } }
.fx-meta { display: grid; gap: .15rem; min-width: 0; font-size: var(--s-1); line-height: 1.3; }
.fx-when { color: var(--text); white-space: nowrap; }
.fx-when b { font-weight: 700; font-variant-numeric: tabular-nums; }
.fx-ev { display: flex; align-items: center; gap: .4rem; min-width: 0; color: var(--dim); }
.fx-ev > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-main { display: grid; gap: 0; min-width: 0; color: inherit; text-decoration: none; }
.fx-names { display: flex; justify-content: space-between; gap: 1rem; min-width: 0; }
.fx-t { display: flex; align-items: center; gap: .45rem; min-width: 0; }

/* record page: panels size to their content (no scroll boxes inside the page); columns share a row height */

}

/* phones */
@media (max-width: 640px) {
  .dtabs { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 2px; width: 100%; }
  .dtabs button { min-height: 44px; font-size: .9rem; padding-inline: .55rem; justify-content: center; }
  .dtabs button .ico { display: none; }
  /* match rows: both team names get the full width, the call or score on the right */
  .mrow { grid-template-columns: 3.3rem minmax(0, 1fr) auto; grid-template-areas: "time a mid" "time b mid" "tag tag tag"; gap: .3rem .65rem; }
  .mrow .time { grid-area: time; align-self: start; }
  .mrow > .tm:not(.r) { grid-area: a; }
  .mrow > .tm.r { grid-area: b; flex-direction: row; text-align: left; }
  .mrow .mid { grid-area: mid; text-align: right; }

  /* the tag line (result chip, roster badge, stage) wraps instead of pushing the page sideways */
  .mrow .tag { grid-area: tag; display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .5rem; }
  .evhero { grid-template-columns: minmax(0, 1fr); }
  .evhero > .evlogo { width: 4rem; }
  .strip-wrap { -webkit-mask-image: linear-gradient(90deg, transparent, #000 1.25rem, #000 calc(100% - 2.5rem), transparent); mask-image: linear-gradient(90deg, transparent, #000 1.25rem, #000 calc(100% - 2.5rem), transparent); }
  .page .strip-hint { display: block; }

  .onair-h > img { width: 3.75rem; }
  .onair { padding: 1rem; }
}
.strip-hint { display: none; font-size: var(--s-1); color: var(--dim); margin-top: -1rem; }
@media (max-width: 520px) {
  .tape { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tm { padding-inline: .45rem; }
  .tm .tst { font-size: .66rem; }
  .tm .tst > span { gap: .25rem; }
  .tm .tst .logo.xs { width: .8rem; height: .8rem; }
  .tdlg .pick .logo.lg { width: 3rem; height: 3rem; }
  .log td, .log th { padding-inline: .3rem; }
  .tablewrap:has(> .log)::before { content: "Swipe the table sideways for the pick, the prediction and the result."; display: block; font-size: var(--s-1); color: var(--dim); padding-bottom: .4rem; position: sticky; left: 0; }
}
/* touch screens: controls at least 44px tall */
@media (pointer: coarse) {

  .subtabs a { display: inline-flex; align-items: center; }

  .rlist a, .nextm, .res a, .alive .ls a, .stand .tms .tlink { min-height: 44px; }
  /* links set in running text or headings: a taller hit area without moving the layout */
  .crumb a, .cname, .crown .who { display: inline-block; padding-block: .7rem; margin-block: -.7rem; }
  .tablewrap td a { display: inline-block; padding-block: .8rem; }

  .lb .row .nm { padding-block: .75rem; }
}

/* ---------- v9: header actions, footer strip, and the home dashboard ----------
   The home page follows the owner's dashboard mockup: a navy-teal base, compact
   bordered panels, condensed upper-case panel titles with a teal icon, and every
   team-coloured mark in the two teams' own logo colours (--ct / --t, pairColors). */
header.top { background: rgba(7, 17, 23, .94); }
.top-in { position: relative; }
.bw { flex-direction: column; align-items: flex-start; gap: .1rem; }
.bw b { font-size: 1.85rem; line-height: .82; }
.bw span { font-size: .56rem; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; font-stretch: 100%; color: var(--dim); }
.tsep { align-self: center; width: 1px; height: 2.1rem; background: var(--line2); margin-left: -.5rem; }
.tabs a { font-weight: 500; font-size: 1.02rem; padding: 0 1rem; }

.tabs a::after { left: .45rem; right: .45rem; }
#q { border-radius: 8px; padding-right: 4.2rem; height: 2.55rem; }

.qkey { font-family: var(--face); font-size: .7rem; font-weight: 600; letter-spacing: .04em; padding: .05rem .45rem; background: rgba(255, 255, 255, .04); }
.hacts { display: flex; align-items: center; gap: .5rem; align-self: center; margin-left: -.25rem; padding-left: 1.1rem; border-left: 1px solid var(--line2); height: 2.1rem; }
.hact, .hav { position: relative; display: grid; place-items: center; flex: none; width: 2.5rem; height: 2.5rem; padding: 0; cursor: pointer;
  background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 10px; }
.hact[aria-expanded="true"] { color: var(--text); }
.hact .ico { width: 1.25rem; height: 1.25rem; stroke-width: 1.8; }
.hav { width: 2.35rem; height: 2.35rem; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--acc) 70%, var(--line2)); background: radial-gradient(circle at 50% 30%, #17323A, #0B1A20); color: var(--text); }
.hav:hover, .hav[aria-expanded="true"] { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(47, 212, 162, .16); }
.hav .ico { width: 1.25rem; height: 1.25rem; stroke-width: 1.8; }
.hdot { position: absolute; top: .45rem; right: .5rem; width: .5rem; height: .5rem; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2px #071117; }

.hpop { position: absolute; z-index: 40; top: calc(100% + .45rem); right: var(--gut); width: min(23rem, calc(100vw - 2 * var(--gut)));
  max-height: min(70vh, 32rem); overflow-y: auto; overscroll-behavior: contain; padding: .9rem 1rem 1rem;
  background: #0E1D25; border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 24px 50px -12px rgba(0, 0, 0, .8); display: grid; gap: .75rem; }

.hpop h3 { margin: 0; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }

.hpop p b { color: var(--text); font-weight: 600; }

.hpop li > a, .hpop li > .prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: center; padding: .4rem .45rem; border-radius: 8px; font-size: var(--s-1); }

/* footer strip under every page */
#view { min-height: calc(100dvh - var(--toph) - 3.4rem); align-content: start; }
.sitefoot { border-top: 1px solid var(--line); background: rgba(6, 15, 20, .7); }
.sf-in { max-width: var(--pagew); margin: 0 auto; padding: .8rem var(--gut) calc(.8rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.1rem;
  font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sf-brand { display: inline-flex; align-items: center; gap: .45rem; color: var(--text); letter-spacing: 0; }
.sf-brand svg { width: 1.5rem; height: 1.5rem; }
.sf-brand b { font-style: italic; font-stretch: 62.5%; font-weight: 900; font-size: 1.15rem; text-transform: uppercase; }
.sf-brand span { font-size: .5rem; letter-spacing: .35em; color: var(--dim); }

.sf-tag { margin-left: auto; letter-spacing: .18em; }
body:has(.chat-fab:not([hidden])) .sf-in { padding-right: max(var(--gut), 11rem); }

/* the home page's own palette: a navy-teal base (other pages keep theirs) */
body {
  --page: #06121A; --bg: #0A1820; --panel: #0C1C25; --raise: #132833; --line: #17303C; --line2: #22414E; --dim: #8EA4AE;
}
html {
  background:
    radial-gradient(ellipse 55% 35% at 10% 0%, rgba(47, 212, 162, .07), transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(40, 120, 200, .05), transparent 70%),
    linear-gradient(180deg, #08161E, #06121A 40rem);
  background-color: #06121A;
}
body[data-page="home"] .page { padding-block: 1.4rem 1.6rem; }

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ho { display: grid; grid-template-columns: minmax(0, 1fr) minmax(20rem, 23.25rem); gap: 1.1rem;
  grid-template-areas: "cu un" "court st" "tabs res" "body res"; align-items: start; }
.ho > * { min-width: 0; }
.ho-cu { grid-area: cu; align-self: stretch; } .ho-un { grid-area: un; align-self: stretch; }
.ho-court { grid-area: court; align-self: stretch; } .ho-st { grid-area: st; align-self: stretch; }
.ho-tabs { grid-area: tabs; } .ho-body { grid-area: body; } .ho-res { grid-area: res; }
.ho .ct { color: color-mix(in srgb, var(--ct) 82%, #fff); }
.ho .t { color: color-mix(in srgb, var(--t) 82%, #fff); }

.ho-p {
  background: linear-gradient(180deg, rgba(22, 48, 60, .42), rgba(12, 28, 37, 0) 6rem), var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: .85rem 1rem 1rem; display: grid; gap: .8rem; align-content: start;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03), 0 18px 36px -26px rgba(0, 0, 0, .9);
}
.ho-h { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.ho-h > .ico { width: 1.45rem; height: 1.45rem; color: var(--acc); flex: none; stroke-width: 1.9; }
.ho-h > div { display: grid; gap: .05rem; min-width: 0; }
.ho-h h2 { font-stretch: 62.5%; font-weight: 700; font-size: 1.32rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .015em; display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.ho-h h2 small { font-stretch: 87.5%; font-weight: 600; font-size: .72rem; letter-spacing: .06em; color: var(--dim); padding-left: .55rem; border-left: 2px solid var(--acc); line-height: 1; }
.ho-h p { font-size: .78rem; color: var(--dim); line-height: 1.3; }
.ho-h .ho-pg { margin-left: auto; display: flex; gap: .35rem; }
.ho-pg button { display: grid; place-items: center; width: 1.85rem; height: 1.85rem; padding: 0; cursor: pointer; border-radius: 6px;
  background: rgba(255, 255, 255, .03); border: 1px solid var(--line2); color: var(--text); }
.ho-pg button:hover:not(:disabled) { border-color: var(--acc); color: var(--acc); }
.ho-pg button:disabled { opacity: .35; cursor: default; }
.ho-pg .ico { width: .95rem; height: .95rem; }
.ho-pg[hidden] { display: none; }

/* coming up: four compact cards per view; the arrows scroll the row */
.ho-cu.ho-p { padding-bottom: .9rem; }
.ho-cu .ho-h h2 { color: var(--acc); }
.ho-cards { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * .7rem) / 4); gap: .7rem;
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.ho-cards::-webkit-scrollbar { display: none; }
.ho-fx { position: relative; scroll-snap-align: start; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .65rem; align-items: center;
  padding: .7rem .8rem .55rem; background: linear-gradient(180deg, rgba(255, 255, 255, .025), transparent), var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.ho-fx:hover { border-color: var(--line2); background: linear-gradient(180deg, rgba(255, 255, 255, .04), transparent), var(--raise); }
.ho-fx:focus-within { border-color: var(--line2); }
.ho-fx > .logo { width: 2.3rem; height: 2.3rem; }
.ho-fxl { display: grid; min-width: 0; line-height: 1.2; color: var(--text); }
.ho-fxl::after { content: ""; position: absolute; inset: 0; border-radius: 7px; }
.ho-fxl:focus-visible { outline: none; }
.ho-fxl:focus-visible::after { outline: 2px solid var(--acc); outline-offset: -1px; }
.ho-fxl b { font-stretch: 75%; font-weight: 700; font-size: 1.02rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ho-fxl b i { font-style: normal; text-transform: none; font-weight: 500; color: var(--dim); }
.ho-fxl span { font-size: .76rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ho-fxbar { grid-column: 1 / -1; display: flex; gap: 2px; height: 6px; margin-top: .45rem; }
.ho-fxbar i { display: block; border-radius: 999px; }
.ho-fxbar i:first-child { flex: 0 0 calc(var(--p) - 1px); background: linear-gradient(90deg, color-mix(in srgb, var(--c1) 55%, #0A1820), var(--c1)); }
.ho-fxbar i:last-child { flex: 1 1 0; background: linear-gradient(90deg, var(--c2), color-mix(in srgb, var(--c2) 60%, #0A1820)); }
.ho-fxbar.none { background: var(--line); border-radius: 999px; }
.ho-fxn { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 700; }
.ho-fxe { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: .1rem; min-width: 0; font-size: .68rem; font-weight: 500; color: var(--dim); }
.ho-fxe > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ho-fxe .fav { min-width: 1.6rem; height: 1.6rem; }
.ho-fxe .fav .ico { width: .9rem; height: .9rem; }
.ho-fxe .rflag { position: relative; }
.ho-cu .empty a { margin-left: .5rem; }

/* up next: the next match over its likely first map */
.ho-un { position: relative; overflow: hidden; isolation: isolate; display: grid; align-content: center; justify-items: start; gap: .25rem;
  min-height: 9.6rem; padding: 1rem 1.2rem; border-radius: 8px; border: 1px solid var(--line2); background: var(--raise) center / cover no-repeat; }
.ho-un::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(6, 18, 26, .95) 0%, rgba(6, 18, 26, .78) 45%, rgba(6, 18, 26, .25) 100%), linear-gradient(0deg, rgba(6, 18, 26, .55), transparent 50%); }
.ho-unl { display: inline-flex; align-items: center; gap: .4rem; font-stretch: 75%; font-weight: 700; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); }
.ho-unl::before { content: ""; width: 3px; height: .9rem; border-radius: 2px; background: var(--acc); }
.ho-unl.live { color: var(--loss); }
.ho-unl.live::before { background: var(--loss); }
.ho-unt { font-stretch: 62.5%; font-weight: 800; font-size: 1.95rem; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); }
.ho-unt i { font-style: normal; font-weight: 500; text-transform: none; font-size: .8em; color: rgba(230, 240, 242, .8); }
.ho-uns { font-size: .9rem; color: rgba(230, 240, 242, .88); }
.ho-btn { margin-top: .55rem; display: inline-flex; align-items: center; gap: .55rem; padding: .4rem .9rem; border-radius: 7px;
  border: 1px solid var(--acc); background: rgba(6, 18, 26, .6); color: var(--text); font-weight: 600; font-size: .88rem; }
.ho-btn .ico { width: 1rem; height: 1rem; color: var(--acc); }
.ho-btn:hover { background: rgba(47, 212, 162, .14); color: var(--text); }

/* the court: two halves lit in the teams' own colours */
.ho-court {
  position: relative; overflow: hidden; isolation: isolate;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 24rem) minmax(0, 1fr); gap: 1rem 1.25rem; align-items: center;
  min-height: 15rem; padding: 1rem clamp(1rem, 2.2vw, 2.2rem);
  border-radius: 8px; border: 1px solid transparent;
  background:
    radial-gradient(ellipse 45% 85% at 0% 30%, color-mix(in srgb, var(--ct) 30%, transparent), transparent 70%) padding-box,
    radial-gradient(ellipse 45% 85% at 100% 30%, color-mix(in srgb, var(--t) 30%, transparent), transparent 70%) padding-box,
    linear-gradient(90deg, color-mix(in srgb, var(--ct) 30%, #08161E) 0%, color-mix(in srgb, var(--ct) 10%, #08161E) 34%, #08161E 50%, color-mix(in srgb, var(--t) 10%, #08161E) 66%, color-mix(in srgb, var(--t) 30%, #08161E) 100%) padding-box,
    linear-gradient(90deg, var(--ct), color-mix(in srgb, var(--ct) 25%, var(--line)) 35%, var(--line) 50%, color-mix(in srgb, var(--t) 25%, var(--line)) 65%, var(--t)) border-box;
  box-shadow: 0 24px 50px -30px rgba(0, 0, 0, .9);
}
/* a fine diagonal texture over each half */
.ho-court::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(118deg, transparent 0 22px, rgba(255, 255, 255, .025) 22px 23px);
  -webkit-mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000); mask-image: linear-gradient(90deg, #000, transparent 30%, transparent 70%, #000); }
.ho-side { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "logo id" "logo pct"; gap: .7rem clamp(.8rem, 1.5vw, 1.6rem); align-items: center; min-width: 0; }
.ho-side.b { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id logo" "pct logo"; }
.ho-clogo { grid-area: logo; display: block; }
.ho-clogo .logo.xl { width: clamp(4.5rem, 6.8vw, 7.5rem); height: clamp(4.5rem, 6.8vw, 7.5rem); }
.ho-id { grid-area: id; display: grid; justify-items: start; gap: .35rem; min-width: 0; }
.ho-name { font-stretch: 62.5%; font-weight: 700; font-size: clamp(1.4rem, 1.95vw, 2rem); line-height: .95; text-transform: uppercase; color: var(--text); overflow-wrap: anywhere; text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
.ho-name:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ho-rank { display: flex; align-items: center; flex-wrap: wrap; gap: .1rem .5rem; font-stretch: 87.5%; font-size: .98rem; font-weight: 600; color: rgba(230, 240, 242, .85); }
.ho-rank b { font-weight: 700; }
.ho-side.a .ho-rank b { color: color-mix(in srgb, var(--ct) 82%, #fff); }
.ho-side.b .ho-rank b { color: color-mix(in srgb, var(--t) 82%, #fff); }
.ho-rank > i { width: 2px; height: .95rem; border-radius: 1px; background: currentColor; opacity: .5; }
.ho-chg { display: inline-flex; align-items: center; gap: .3rem; margin-left: .2rem; padding: .12rem .5rem; cursor: pointer; border-radius: 999px;
  background: rgba(4, 12, 16, .45); border: 1px solid rgba(230, 240, 242, .22); color: var(--text); font: inherit; font-stretch: 100%; font-size: .7rem; font-weight: 600; }
.ho-chg:hover { border-color: var(--text); }
.ho-chg .ico { width: .8rem; height: .8rem; }
.ho-dots { display: flex; gap: .55rem; }
.ho-dots i { display: grid; justify-items: center; gap: .15rem; font-style: normal; font-size: .62rem; font-weight: 700; color: var(--dim); }
.ho-dots i b { width: .62rem; height: .62rem; border-radius: 50%; }
.ho-dots i.W b { background: var(--win); box-shadow: 0 0 8px color-mix(in srgb, var(--win) 70%, transparent); }
.ho-dots i.L b { background: var(--loss); box-shadow: 0 0 8px color-mix(in srgb, var(--loss) 70%, transparent); }
.ho-dots i.W { color: color-mix(in srgb, var(--win) 75%, #fff); }
.ho-dots i.L { color: color-mix(in srgb, var(--loss) 80%, #fff); }
.ho-pct { grid-area: pct; display: grid; justify-items: start; gap: .25rem; }
.ho-big { font-stretch: 62.5%; font-style: italic; font-weight: 800; font-size: clamp(2.8rem, 4.6vw, 4.6rem); line-height: .85; letter-spacing: -.01em; text-shadow: 0 4px 22px rgba(0, 0, 0, .5); }
.ho-big small { font-size: .62em; font-weight: 700; }
.ho-side.a .ho-big { color: color-mix(in srgb, var(--ct) 55%, #fff); }
.ho-side.b .ho-big { color: color-mix(in srgb, var(--t) 70%, #fff); }
.ho-lbl { font-size: .74rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.ho-side.a .ho-lbl { color: color-mix(in srgb, var(--ct) 70%, #fff); }
.ho-side.b .ho-lbl { color: color-mix(in srgb, var(--t) 70%, #fff); }
.ho-side .rflag { background: rgba(4, 10, 12, .6); }
.ho-mid { display: grid; justify-items: center; gap: .55rem; text-align: center; min-width: 0; }
.ho-fmt { font-size: .82rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(230, 240, 242, .9); }
.ho-pred { display: inline-flex; align-items: center; gap: .4rem; padding: .22rem .95rem; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--amber) 75%, transparent);
  background: rgba(229, 196, 90, .07); color: var(--amber); font-stretch: 75%; font-weight: 700; font-size: .98rem; text-transform: uppercase; letter-spacing: .02em; }
.ho-pred .ico { width: .85rem; height: .85rem; fill: currentColor; stroke: none; }
.ho-vsrow { display: flex; align-items: center; justify-content: center; gap: clamp(.8rem, 2.4vw, 2.2rem); }
.ho-vs { font-stretch: 62.5%; font-style: italic; font-weight: 900; font-size: clamp(3rem, 5vw, 4.6rem); line-height: .9; color: var(--text); text-shadow: 0 6px 30px rgba(0, 0, 0, .7); padding-right: .1em; }
.ho-mid .score { font-stretch: 62.5%; font-style: italic; font-weight: 900; font-size: clamp(3rem, 5vw, 4.4rem); line-height: .9; display: flex; gap: .4rem; }
.ho-mid .score .lost { color: var(--dim); }
.ho-arw { display: grid; place-items: center; width: 2.2rem; height: 2.75rem; padding: 0; cursor: pointer; background: none; border: 1px solid transparent; border-radius: 8px; }
.ho-arw .ico { width: 1.9rem; height: 1.9rem; stroke-width: 2.6; }
.ho-arw.a { color: color-mix(in srgb, var(--ct) 82%, #fff); }
.ho-arw.b { color: color-mix(in srgb, var(--t) 82%, #fff); }

.ho-arw:disabled { opacity: .3; cursor: default; }
.ho-mid .cbar { width: 100%; }
.ho-court .bar { width: 100%; height: .95rem; border-radius: 999px; overflow: hidden; margin-top: .25rem;
  background: linear-gradient(90deg, color-mix(in srgb, var(--t) 92%, #fff) 0 72%, color-mix(in srgb, var(--t) 62%, #0B1518) 100%);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 0 22px -6px color-mix(in srgb, var(--ct) 55%, transparent); }
.ho-court .bar .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--ct) 70%, #0B1518), var(--ct)); }
.ho-court .bar .band { border: 0;
  background-image: repeating-linear-gradient(120deg, rgba(4, 10, 12, .3) 0 4px, rgba(255, 255, 255, .07) 4px 5px, transparent 5px 9px),
    linear-gradient(90deg, var(--ct) 0 var(--split, 50%), color-mix(in srgb, var(--t) 92%, #fff) var(--split, 50%) 100%); }
.ho-court .bar .mk { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1px rgba(4, 10, 12, .7), 0 0 8px rgba(255, 255, 255, .85); transition: left .9s cubic-bezier(.2, .8, .2, 1); }
.ho-unc { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(230, 240, 242, .8); cursor: help; }
.ho-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .35rem; }
.ho-chips .chip { background: rgba(4, 10, 12, .6); }
.ho-court .empty { color: rgba(230, 240, 242, .8); }

/* VRS standings */
.ho-st.ho-p { gap: .55rem; }
.ho-tbl { display: grid; }
.ho-tr { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) 3.4rem 4.1rem; gap: .65rem; align-items: center; padding: .42rem .4rem; border-bottom: 1px solid var(--line); font-size: .9rem; border-radius: 4px; }
.ho-tr:last-child { border-bottom: 0; }
.ho-tr.hd { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-block: .2rem .35rem; }
.ho-tr.hd span:nth-child(3) { text-align: right; }
a.ho-tr:hover { background: var(--raise); }
.ho-tr .rk { color: var(--dim); font-weight: 600; text-align: center; }
.ho-tr .nm { display: flex; align-items: center; gap: .6rem; min-width: 0; font-weight: 600; }
.ho-tr .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ho-tr .wlr { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ho-tr.oa { box-shadow: inset 3px 0 0 var(--ct); background: linear-gradient(90deg, color-mix(in srgb, var(--ct) 10%, transparent), transparent); }
.ho-tr.ob { box-shadow: inset 3px 0 0 var(--t); background: linear-gradient(90deg, color-mix(in srgb, var(--t) 10%, transparent), transparent); }
.ho-tr .form5 { justify-content: flex-end; gap: 3px; }
.ho-tr .form5 i { width: .5rem; height: 1rem; }

/* section tabs + format */
.ho-tabs { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between; gap: 0 1rem; padding: 0 .9rem 0 0;
  background: linear-gradient(180deg, rgba(22, 48, 60, .35), transparent), var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 3.1rem; }
.ho-tl { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.ho-tl::-webkit-scrollbar { display: none; }
.ho-tl button { position: relative; display: inline-flex; align-items: center; gap: .6rem; padding: 0 1.25rem; white-space: nowrap; cursor: pointer;
  background: none; border: 0; color: var(--dim); font: inherit; font-weight: 500; font-size: .98rem; }
.ho-tl button .ico { width: 1.1rem; height: 1.1rem; }
.ho-tl button:hover { color: var(--text); }
.ho-tl button:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
.ho-tl button[aria-selected="true"] { color: var(--text); font-weight: 600; background: linear-gradient(180deg, rgba(47, 212, 162, .04), rgba(47, 212, 162, .13)); }
.ho-tl button[aria-selected="true"] .ico { color: var(--acc); }
.ho-tl button[aria-selected="true"]::after { content: ""; position: absolute; left: .5rem; right: .5rem; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--acc); box-shadow: 0 0 12px rgba(47, 212, 162, .55); }
.ho-tl button:focus-visible { outline-offset: -3px; }
.ho-tr2 { display: flex; align-items: center; gap: .6rem; padding-block: .4rem; }
.ho-tr2 .lbl { font-size: .85rem; color: var(--dim); }
.ho-tr2 .seg { background: rgba(4, 12, 16, .5); }
.ho-tr2 .seg button { padding: .25rem .8rem; }
.ho-swap { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; padding: 0; cursor: pointer; border-radius: 8px; background: rgba(4, 12, 16, .5); border: 1px solid var(--line2); color: var(--text); }
.ho-swap:hover { border-color: var(--acc); color: var(--acc); }
.ho-swap .ico { width: 1rem; height: 1rem; }
.ho-body { display: grid; gap: 1rem; min-width: 0; }

/* overview: veto cards | what moves the number + series scores */
.ho-ovw { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); gap: 1rem; align-items: stretch; }
.ho-ovw > * { min-width: 0; }
.ho-col { display: grid; gap: .7rem; align-content: start; }
.ho-maps { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); gap: .55rem; }
.ho-map { position: relative; display: grid; grid-template-rows: minmax(7.4rem, 1fr) auto auto; padding: 0; text-align: left; cursor: pointer; overflow: hidden; min-width: 0;
  background: linear-gradient(180deg, #0F2430, #0B1A22); border: 1px solid var(--line2); border-radius: 7px; color: var(--text);
  box-shadow: inset 0 -3px 0 var(--side, var(--dim)); }
.ho-map.sa { --side: var(--ct); } .ho-map.sb { --side: var(--t); } .ho-map.k-dec { --side: #6F8FB0; }
.ho-map:hover { border-color: var(--dim); }
.ho-map:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
.ho-mart { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: .3rem; padding: .5rem .55rem; background: var(--raise) center / cover no-repeat; }
.ho-mart::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 18, 26, 0) 25%, rgba(6, 18, 26, .9)); }
.ho-mart > * { position: relative; }
.ho-mart b { font-stretch: 62.5%; font-weight: 800; font-size: 1.22rem; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0, 0, 0, .7); }
.ho-mart i { font-style: normal; font-size: .64rem; font-weight: 800; letter-spacing: .06em; padding: .08rem .45rem; border-radius: 3px; line-height: 1.4; }
.ho-map.k-ban .ho-mart i { background: #D23F45; color: #fff; }
.ho-map.k-pick .ho-mart i { background: #2FD4A2; color: #04130E; }
.ho-map.k-dec .ho-mart i { background: #4E6E92; color: #fff; }
.ho-map.k-ban .ho-mart { filter: saturate(.55); }
.ho-mst { display: grid; gap: .15rem; padding: .45rem .55rem .35rem; font-size: .76rem; }
.ho-mst > span { display: flex; justify-content: space-between; gap: .3rem; min-width: 0; }
.ho-mst em { font-style: normal; color: rgba(230, 240, 242, .85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ho-mst b { font-weight: 700; flex: none; }
.ho-mst .na b { color: var(--dim); font-weight: 500; }

/* ---------- v10: brand mark, navy-indigo base, a court with more life ---------- */
