<script>
const DATA = /*__DATA__*/null;
const IMG = /*__IMAGES__*/null;
// the site background image, if the build shipped one (CSS reads --site-bg)
if (IMG && IMG.site && IMG.site.bg) document.documentElement.style.setProperty("--site-bg", `url("${IMG.site.bg}")`);
const FIXTURES = /*__FIXTURES__*/null;   // upcoming matches, expanded prediction form (docs/bundle-schema.md)
const RESULTS = /*__RESULTS__*/null;     // recent results with model verdicts (docs/bundle-schema.md)
const META = /*__META__*/null;           // {bundle_version, generated_at, data_through, data_hash, vrs_date}
const NOTES = /*__NOTES__*/null;         // matchup notes, display only (docs/notes-contracts.md); null when the bundle has none
// the bundle schema this page reads; build_viewer.py's drift check fails the build when it is not
// the version the build writes (SUPPORTED_BUNDLE_VERSION)
const PAGE_BUNDLE_VERSION = 2;

/* Bundle contract: refuse to render a bundle whose schema version we don't understand. */
if (!META || META.bundle_version !== PAGE_BUNDLE_VERSION || !DATA || !FIXTURES || !RESULTS) {
  document.getElementById("view").innerHTML = `<section class="panel"><h2>Data unavailable</h2>
    <p class="dim">This page build's data bundle (v${META && META.bundle_version}) isn't supported by this page version. The site needs a fresh build from a compatible bundle.</p></section>`;
  throw new Error("unsupported bundle: refusing to render");
}

/* Shared staleness badge: one component, bundle-owned values, rendered verbatim.
   data_through is the last match date ingested; generated_at is the bundle build time. */
const staleBadge = (long) => `<span class="stale" title="Bundle v${META.bundle_version} · built ${esc(META.generated_at)} · data hash ${esc(META.data_hash)}">latest result <b>${esc(fmtDate(META.data_through))}</b>${long ? ` · updated ${esc(String(META.generated_at).replace("T", " ").slice(0, 16))} UTC` : ""}</span>`;

/* ---------------- basics ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
// small line icons (24px grid, stroked in currentColor)
const svgI = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  swap: svgI(`<path d="M4 8.5h15l-3.5-3.5M20 15.5H5l3.5 3.5"/>`),
  next: svgI(`<path d="M9 5l7 7-7 7"/>`),
  user: svgI(`<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1-3.9 3.9-5.8 7.5-5.8s6.5 1.9 7.5 5.8"/>`),
  overview: svgI(`<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>`),
  lineups: svgI(`<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.8-3.3 3.1-5 6-5s5.2 1.7 6 5M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.7c1.8.6 3 2.2 3.5 4.8"/>`),
  h2h: svgI(`<path d="M2.5 12h7.5M6.5 8l4 4-4 4M21.5 12H14M17.5 8l-4 4 4 4"/>`),
  pools: svgI(`<path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/>`),
  base_strength: svgI(`<path d="M12 3l7.5 3v5.2c0 4.4-3.1 7.9-7.5 9.8-4.4-1.9-7.5-5.4-7.5-9.8V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>`),
  form_30d: svgI(`<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2M16 14h.5"/>`),
  form_last5: svgI(`<path d="M3.5 17l5-5 4 3.5 7-8M15 7.5h4.5V12"/>`),
  head_to_head: svgI(`<path d="M2.5 12h7.5M6.5 8l4 4-4 4M21.5 12H14M17.5 8l-4 4 4 4"/>`),
  map_veto: svgI(`<path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/>`),
  roster: svgI(`<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.8-3.3 3.1-5 6-5s5.2 1.7 6 5M15.5 5.6a3.2 3.2 0 0 1 0 6M17.5 14.7c1.8.6 3 2.2 3.5 4.8"/>`),
  caution: svgI(`<path d="M12 3.8l9 15.7H3z"/><path d="M12 10v4.3M12 16.9v.2"/>`),
  stakes: svgI(`<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3.2 4M16 6h3a3 3 0 0 1-3.2 4M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/>`),
  map_depth: svgI(`<path d="M12 3.5l8.5 4.5-8.5 4.5-8.5-4.5zM3.5 12l8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5"/>`),
};
// Largest remainder, same rule as predictor.display_percent: `places` decimals
// on the percentage, and the returned strings sum to exactly 100.00.
function displayPercent(probs, places = 2) {
  const scale = 10 ** places, target = 100 * scale;
  const weights = probs.map(p => (Number.isFinite(p) && p > 0) ? p : 0);
  const total = weights.reduce((a, b) => a + b, 0);
  let base;
  if (!(total > 0)) {
    base = probs.map(() => 0);
    if (base.length) base[0] = target;
  } else {
    const raw = weights.map(w => w / total * target);
    base = raw.map(x => Math.floor(x + 1e-9));
    const left = target - base.reduce((a, b) => a + b, 0);
    const order = raw.map((x, i) => ({ i, frac: x - Math.floor(x + 1e-9) }))
      .sort((a, b) => b.frac - a.frac || a.i - b.i);
    for (let k = 0; k < left; k++) base[order[k].i] += 1;
  }
  return base.map(b => (b / scale).toFixed(places));
}
const T = DATA.teams;
// Valve Regional Standings first (that is how teams are seeded), then Elo for unranked teams
const vrsRank = t => T[t]?.vrs?.rank ?? 1e9;
const NAMES = Object.keys(T).filter(n => !T[n].inactive).sort((a, b) => vrsRank(a) - vrsRank(b) || (T[b].elo ?? 0) - (T[a].elo ?? 0));
// teams with series in the data; only these have matchup predictions
const CMP_NAMES = NAMES.filter(n => T[n].series > 0 && T[n].cmp !== false); // cmp: in DATA.pairs
const REGION = { europe: "Europe", americas: "Americas", asia: "Asia" };
const vrsShort = t => T[t]?.vrs ? `VRS #${T[t].vrs.rank}` : "Not in VRS";
const vrsLine = t => !T[t] ? "No results in the data" : T[t].series ? `${vrsShort(t)}, Elo ${T[t].elo}` : `${vrsShort(t)}, no series in the data`;
const pickTile = (n, attrs) => `<button type="button" class="pick" ${attrs}>${logo(n, "lg")}<span class="pn">${esc(n)}</span><span class="pv">${esc(vrsShort(n))}</span></button>`;
const BY_SLUG = Object.fromEntries(Object.keys(T).map(n => [T[n].slug, n]));   // inactive teams keep their page
const EV = DATA.events;
const EV_BY = Object.fromEntries(EV.map(e => [e.slug, e]));
const MATCH = {};
for (const e of EV) for (const m of e.matches) MATCH[m.id] = { ...m, ev: e.slug };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const dObj = s => new Date(s + "T12:00:00Z");
const fmtDay = s => { const d = dObj(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const fmtDate = s => { const d = dObj(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const span = (a, b) => a === b ? fmtDate(a) : `${fmtDay(a)} to ${fmtDate(b)}`;
const wday = s => WD[dObj(s).getUTCDay()];
// Match times are stored with the event's UTC offset ("2026-10-09T18:00:00+02:00");
// show them on the visitor's own clock, labelled with their own time zone.
const whenDate = w => { const d = w ? new Date(w) : null; return d && !isNaN(d) ? d : null; };
const clock = w => { const d = whenDate(w); return d ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : null; };
const tz = w => {
  const d = whenDate(w); if (!d) return "";
  try { return (new Intl.DateTimeFormat([], { timeZoneName: "short" }).formatToParts(d).find(p => p.type === "timeZoneName") || {}).value || ""; }
  catch (e) { return ""; }
};
// the visitor's calendar day for a match time (can differ from the event's local day)
const localDay = w => { const d = whenDate(w); return d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` : null; };
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || "th");

const LABELS = {
  base_strength: ["Team strength", "Elo rating gap"],
  form_30d: ["Last 30 days", "Results vs what the rating expects"],
  form_last5: ["Last 5 series", "Recent swing vs 30-day form"],
  head_to_head: ["Head-to-head", "Meetings in the past year"],
  map_veto: ["Map pool", "Edge on the simulated veto maps"],
  roster: ["Roster", "Stand-ins and missing IGL"],
  stakes: ["Stakes", "Elimination or qualification"],
  map_depth: ["Map pool depth", "Maps played 3+ times and won 50%+, last 90 days"],
};
const REL = { H: "Clear read", M: "Fairly clear read", L: "Close or uncertain read" };

/* ---------------- team colours (from each logo, see viewer/team_colors.py) ---------------- */
const DEFAULT_A = "#6E9DE2", DEFAULT_B = "#E7AB3F", PAGE_BG = [16, 28, 31];
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const dist = (x, y) => { const a = rgbOf(x), b = rgbOf(y); return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); };
const deep = h => { const c = rgbOf(h); return `rgb(${c.map((v, i) => Math.round(v * .32 + PAGE_BG[i] * .68)).join(",")})`; };
// Each team keeps its own logo colour (Falcons green vs Aurora teal stay green and teal).
// Only when the two are nearly the same colour (red vs red) do they split into a lighter
// and a deeper shade of it; two white teams become white and grey.
const mixHex = (h, to, w) => "#" + rgbOf(h).map((v, i) => Math.round(v * (1 - w) + rgbOf(to)[i] * w).toString(16).padStart(2, "0")).join("");
const lumOf = h => { const [r, g, b] = rgbOf(h); return (.2126 * r + .7152 * g + .0722 * b) / 255; };
const SAME_COLOUR = 45;   // RGB distance under which two colours read as one
function pairColors(a, b) {
  const ca = (T[a]?.color || [])[0] || DEFAULT_A;
  const cb = (T[b]?.color || [])[0] || DEFAULT_B;
  if (dist(ca, cb) >= SAME_COLOUR) return [ca, cb];
  if (lumOf(ca) > .8 && lumOf(cb) > .8) return [ca, "#8D98A2"];          // white and white: white and grey
  // same colour family: team 1 a lighter shade, team 2 a deeper one, both still readable on the dark page
  const light = mixHex(ca, "#FFFFFF", lumOf(ca) > .6 ? .15 : .35);
  let deepW = .38, deepC = mixHex(cb, "#000000", deepW);
  while (lumOf(deepC) < .16 && deepW > .1) { deepW -= .06; deepC = mixHex(cb, "#000000", deepW); }
  return [light, deepC];
}
let PAIR = null;                      // set by views that show two teams head to head
function applyPair(el) {
  const props = ["--ct", "--t", "--ct-deep", "--t-deep"];
  if (!PAIR) { props.forEach(p => el.style.removeProperty(p)); return; }
  const [ca, cb] = pairColors(PAIR[0], PAIR[1]);
  el.style.setProperty("--ct", ca); el.style.setProperty("--t", cb);
  el.style.setProperty("--ct-deep", deep(ca)); el.style.setProperty("--t-deep", deep(cb));
}
// A miss is only an "Upset" when the losing side was a clear favourite.
const UPSET_AT = 0.75;
const missLabel = (hit, favP) => hit ? "Correct" : favP >= UPSET_AT ? "Upset" : "Incorrect";

function logo(team, cls = "") {
  const src = IMG.logos[team];
  // big logos (court, team header) load eagerly: they're on screen immediately and a
  // lazy swap is what made Safari flash a box around them
  if (src) return `<img class="logo ${cls}" src="${src}" alt=""${/\b(xl|lg)\b/.test(cls) ? ` decoding="sync"` : ` loading="lazy"`}>`;
  const ini = String(team || "?").replace(/^Team\s+/, "").split(/\s+/).map(w => w[0]).join("").slice(0, 3);
  return `<span class="logo logo-ph ${cls}" aria-hidden="true">${esc(team ? ini : "?")}</span>`;
}
const flag = cc => cc && IMG.flags[cc] ? `<img class="flag" src="${IMG.flags[cc]}" loading="lazy" alt="${esc(cc.toUpperCase())}" title="${esc(cc.toUpperCase())}">` : `<span class="flag" aria-hidden="true"></span>`;
const mapBg = m => IMG.maps[m] ? `background-image:url('${IMG.maps[m]}')` : "";
const tlink = (team, cls = "") => T[team]
  ? `<a class="tlink ${cls}" href="#t-${T[team].slug}">${logo(team, "sm")}<span>${esc(team)}</span></a>`
  : `<span class="tlink ${cls}">${logo(team, "sm")}<span>${esc(team || "To be decided")}</span></span>`;
const statusChip = e => e.status === "live" ? `<span class="chip live">Live</span>` : e.status === "upcoming" ? `<span class="chip up">Upcoming</span>` : `<span class="chip done">Finished</span>`;

/* ---------------- predictions (compact form from the build) ---------------- */
function decode(c) {
  if (!c) return null;
  return {
    p: c.p, band: c.b, rel: c.r, score: { p_2_0: c.s[0], p_2_1: c.s[1], p_1_2: c.s[2], p_0_2: c.s[3] },
    score5: c.s5 ? { p_3_0: c.s5[0], p_3_1: c.s5[1], p_3_2: c.s5[2], p_2_3: c.s5[3], p_1_3: c.s5[4], p_0_3: c.s5[5] } : null,
    maps: c.vm, map_p: c.vp, warn: c.w,
    veto: c.v.map(x => x[0] === "D" ? { verb: "decider", map: x.slice(1) } : { side: x[0], verb: x[1] === "-" ? "bans" : "picks", map: x.slice(2) }),
    factors: DATA.factors.map((k, i) => ({ factor: k, pp: c.f[i] })), fx: c.fx || null,
    pf: c.pf || null, bf: c.bf || null, mr: c.mr || null, vd: c.vd || null,
    ...vetoFmt(c.v1, [c.pf ? c.pf[0] : c.p], 1), ...vetoFmt(c.v5, c.p5, 5),
  };
}
// Win chance and likely range for a series length. The engine's p is a BO3
// number; the same per-map edge is worth less over one map and more over five
// (predictor.py, "Series length changes the odds").
function pFor(pred, bo) {
  if (bo === 1) return pred.pf ? { p: pred.pf[0], band: pred.bf[0] } : { p: flatQ(pred.p, 3), band: pred.band.map(x => flatQ(x, 3)) };
  if (bo === 5) {
    const five = x => scorelines(Array(5).fill(flatQ(x, 3))).slice(0, 3).reduce((s, v) => s + v, 0);
    return pred.pf ? { p: pred.pf[1], band: pred.bf[1] } : { p: five(pred.p), band: pred.band.map(five) };
  }
  return { p: pred.p, band: pred.band };
}
// BO1 / BO5 vetoes, coded by build_viewer.veto_code: two characters per step,
// kind (a/b ban, x/y permaban, A/B pick, D decider) then a DATA.vmaps index.
const VCODE = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
function vetoFmt(code, mp, n) {
  if (!code || !mp) return { [`veto${n}`]: null, [`maps${n}`]: null, [`map_p${n}`]: null };
  const steps = [];
  for (let i = 0; i < code.length; i += 2) {
    const k = code[i], map = (DATA.vmaps || [])[VCODE.indexOf(code[i + 1])];
    steps.push(k === "D" ? { verb: "decider", map }
      : { side: "aAx".includes(k) ? "A" : "B", verb: "AB".includes(k) ? "picks" : "bans", map });
  }
  return { [`veto${n}`]: steps, [`maps${n}`]: steps.filter(s => s.verb !== "bans").map(s => s.map), [`map_p${n}`]: mp };
}
// the veto, maps and map chances shown for a series format (BO3 when the format has none)
function vetoFor(pred, bo) {
  return bo === 1 && pred.veto1 ? { veto: pred.veto1, maps: pred.maps1, map_p: pred.map_p1 }
    : bo === 5 ? (pred.veto5 ? { veto: pred.veto5, maps: pred.maps5, map_p: pred.map_p5 } : null)   // null: the pool is too small for a best-of-five
    : { veto: pred.veto, maps: pred.maps, map_p: pred.map_p };
}
// A team's 90-day record on a map: as of the prediction's own day when the build kept it
// (matches, finished tournaments), else the team page's current record.
function mapRec(pred, t, mp) {
  const src = pred && pred.mr && pred.mr[t] ? pred.mr[t] : (T[t] || {}).maps || {};
  const v = src[mp];
  return v && v[1] ? v : null;
}
// Pick and ban chances for a format (the build's compact form, see build_viewer.vd_encode):
// five thousandths per pool map in pool order, in two base-32 characters each.
const B32 = "0123456789abcdefghijklmnopqrstuv";
function vdFor(pred, bo) {
  const c = pred && pred.vd && pred.vd[String(bo)];
  if (!c || !c.pl || !c.m) return null;
  const maps = [...c.pl].map(ch => (DATA.vmaps || [])[VCODE.indexOf(ch)]);
  const k = bo === 1 ? 3 : 5;   // chances per map: a BO1 has no picks
  const rows = maps.map((map, i) => {
    const v = Array.from({ length: k }, (_, n) => {
      const j = (i * k + n) * 2;
      return (B32.indexOf(c.m[j]) * 32 + B32.indexOf(c.m[j + 1])) / 1000;
    });
    if (!map || v.length !== k || c.m.length !== maps.length * k * 2 || v.some(x => !(x >= 0 && x <= 1))) return null;
    return k === 3 ? { map, pa: 0, pb: 0, dec: v[0], ba: v[1], bb: v[2], played: v[0] }
      : { map, pa: v[0], pb: v[1], dec: v[2], ba: v[3], bb: v[4], played: v[0] + v[1] + v[2] };
  });
  if (rows.some(r => !r)) return null;
  const names = s => [...(s || "")].map(ch => (DATA.vmaps || [])[VCODE.indexOf(ch)]).filter(Boolean);
  return { rows, startA: typeof c.st === "number" ? c.st / 1000 : null,
    masked: { a: names((c.mk || [])[0]), b: names((c.mk || [])[1]) },
    cold: { a: (c.cd || "").includes("a"), b: (c.cd || "").includes("b") }, warn: Array.isArray(c.w) ? c.w : [] };
}
function matchupPred(e, a, b) {
  if (e && DATA.epairs[e.slug] && DATA.epairs[e.slug][`${a}|${b}`]) {
    const p = decode(DATA.epairs[e.slug][`${a}|${b}`]);
    if (e.status === "finished" && DATA.emr && DATA.emr[e.slug]) p.mr = DATA.emr[e.slug];   // records as of the event's first day
    return p;
  }
  return decode(DATA.pairs[`${a}|${b}`]);
}

/* ---------------- event helpers ---------------- */
const isLive = m => !m.finished && m.maps.length > 0;
const winnerOf = m => m.finished ? (m.w1 > m.w2 ? m.t1 : m.t2) : null;
const groupKey = st => st.replace(/,?\s*round \d+$/i, "").replace(/\s*Round \d+.*$/, "").trim() || "Group stage";

function groupTables(e) {
  const groups = {};
  for (const m of e.matches) {
    if (m.kind !== "groups" || !m.t1 || !m.t2) continue;
    const g = groups[groupKey(m.stage)] = groups[groupKey(m.stage)] || {};
    for (const t of [m.t1, m.t2]) g[t] = g[t] || { team: t, w: 0, l: 0, mw: 0, ml: 0 };
    if (!m.finished) continue;
    const w = winnerOf(m), l = w === m.t1 ? m.t2 : m.t1;
    g[w].w++; g[l].l++;
    g[m.t1].mw += m.w1; g[m.t1].ml += m.w2; g[m.t2].mw += m.w2; g[m.t2].ml += m.w1;
  }
  return Object.entries(groups).map(([name, g]) => [name, Object.values(g).sort((a, b) => b.w - a.w || a.l - b.l || (b.mw - b.ml) - (a.mw - a.ml) || (T[b.team]?.elo || 0) - (T[a.team]?.elo || 0))]);
}

function lineupOf(team, e) {
  const part = e && e.participants.find(p => p.team === team);
  const current = new Set((T[team]?.roster || []).map(p => p.id.toLowerCase()));
  const person = (id, extra) => {
    const p = DATA.players[id.toLowerCase()] || { id, name: "", flag: "", igl: false };
    return { ...p, id: p.id || id, ...extra };
  };
  if (part && (part.players.length || part.coach.length)) {
    const fresh = e.status !== "finished";
    return {
      source: "event",
      players: part.players.map(id => person(id, { standin: fresh && current.size > 0 && !current.has(id.toLowerCase()) })),
      coach: part.coach.map(id => person(id, {})),
      subs: part.subs.map(id => person(id, {})),
    };
  }
  const r = T[team]?.roster || [];
  return { source: "current", players: r.filter(p => !p.coach).map(p => person(p.id, {})), coach: r.filter(p => p.coach).map(p => person(p.id, {})), subs: [] };
}

/* ---------------- roster caution flags (roster_flags.py) ----------------
   A team fielding a stand-in or a recently changed lineup. DISPLAY ONLY: a flag
   never changes a number on the page. Each flag is {k, src, r, since?, thru?}:
   k "standin" | "change", r the reason line. Point-in-time: a match's flags
   (m.rf) use only what was known before its day; DATA.rflags holds the flags
   for the matchup tools (now = today; ev = per tournament). One component:
   rfBadge for cards and the court, rfPanel for the full reasons. */
const RF_SRC = {
  event: () => "Listed as a stand-in for this tournament. Those lists carry no dates, so the player may have played only some of its matches.",
  lineups: f => `From published five-man lineups${f.thru ? `, known through ${fmtDate(f.thru)}` : ""}; they lag results by up to a month, so a newer change may be missing.`,
  override: () => "From a roster move entered by hand.",
};
const RF_WHY = {
  standin: "Stand-ins are where the model misses most.",
  change: "A new lineup alone has not made past calls less accurate; shown for context.",
};
const RF_FOOT = "A caution only: not counted in the win chances.";
// [[team, flags], ...] for a match's two sides; empty when no side is flagged
const rfSides = (rf, a, b) => rf ? [[a, rf.a || []], [b, rf.b || []]].filter(([, l]) => l.length) : [];
// flags for a matchup tool: a tournament's own list (its stand-ins apply) or today's
function rfTool(e, a, b) {
  const src = (e ? (DATA.rflags.ev || {})[e.slug] : DATA.rflags.now) || {};
  return src[a] || src[b] ? { a: src[a] || [], b: src[b] || [] } : null;
}
const rfSev = sides => sides.some(([, l]) => l.some(f => f.k === "standin")) ? "standin" : "change";
const rfText = sides => sides.map(([t, l]) => l.map(f => `${t}: ${f.r}`).join("; ")).join("; ");
// the badge: one per card (both teams) or per team; the reasons ride in the tooltip
function rfBadge(sides, short = false) {
  if (!sides.length) return "";
  const sev = rfSev(sides), label = sev === "standin" ? "Stand-in" : "New lineup";
  const tip = `Treat with caution. ${rfText(sides)}. ${RF_WHY[sev]} ${RF_FOOT}`;
  return `<span class="rflag ${sev}" title="${esc(tip)}" aria-label="${esc(tip)}">${ICON.caution}${short ? "" : `<span>${label}</span>`}</span>`;
}
// the full reasons, with where each comes from and how far it can be trusted
function rfPanel(sides, cls = {}) {
  if (!sides.length) return "";
  const sev = rfSev(sides);
  const rows = sides.flatMap(([t, l]) => l.map(f => `<li class="${f.k}"><span class="rflag ${f.k}" aria-hidden="true">${ICON.caution}</span><span><b class="${cls[t] || ""}">${esc(t)}</b> ${esc(f.r)}${f.igl ? " (the in-game leader)" : ""}
    <span class="small dim">${esc((RF_SRC[f.src] || (() => ""))(f))}</span></span></li>`)).join("");
  return `<section class="panel rfpanel ${sev}"><h2>Treat with caution <span class="dim">roster</span></h2><ul>${rows}</ul>
    <p class="small dim">${RF_WHY[sev]} ${RF_FOOT}</p></section>`;
}

/* ---------------- shared match widgets ---------------- */
// The win bar animates only when what it shows changes (page, teams or series format);
// tab switches, map clicks and other re-renders of the same matchup set it in place.
let lastBarKey = null;
function animateBars(root) {
  const key = `${location.hash || "#home"}|${PAIR ? PAIR.join("|") : ""}|${desk.bo}`;
  const same = key === lastBarKey;
  lastBarKey = key;
  const els = [...root.querySelectorAll(".bar .fill, .bar .band, .bar .mk")];
  const set = () => els.forEach(el => {
    if (el.classList.contains("fill")) el.style.width = el.dataset.w + "%";
    else if (el.classList.contains("mk")) el.style.left = el.dataset.w + "%";
    else { el.style.left = el.dataset.l + "%"; el.style.width = el.dataset.bw + "%"; }
  });
  if (!same) { requestAnimationFrame(() => requestAnimationFrame(set)); return; }
  els.forEach(el => { el.style.transition = "none"; });
  set();
  if (els.length) void els[0].offsetWidth;   // commit the final widths before transitions come back
  requestAnimationFrame(() => els.forEach(el => { el.style.transition = ""; }));
}

function playedMaps(m) {
  return `<div class="maps">${m.maps.map((x, i) => {
    const aWon = x.w === 1;
    const has = x.s1 != null;
    const half = (team, side) => team === 1 ? x.side1[side] : x.side2[side];
    const otv = (team) => (team === 1 ? x.s1 : x.s2) - half(team, "ct") - half(team, "t");
    return `<button type="button" class="mapcard reveal ${aWon ? "wa" : "wb"}" style="${mapBg(x.map)};animation-delay:${i * 90}ms" aria-expanded="false" aria-label="${esc(x.map)}: ${has ? `${esc(m.t1)} ${x.s1}, ${esc(m.t2)} ${x.s2}` : `won by ${esc(aWon ? m.t1 : m.t2)}`}. Show halves">
      <span class="role">Map ${i + 1}${x.ot ? `<span class="chip plain">Overtime</span>` : ""}</span>
      <span class="nm cond">${esc(x.map)}</span>
      <span class="sc cond"><span class="${aWon ? "ct" : "dim"}">${has ? x.s1 : aWon ? "W" : "L"}</span><span class="x">${has ? "tap for halves" : "no round data"}</span><span class="${aWon ? "dim" : "t"}">${has ? x.s2 : aWon ? "L" : "W"}</span></span>
      ${has ? `<span class="halves">
        <span class="hr hd"><span></span><span>CT</span><span>T</span><span>OT</span></span>
        <span class="hr"><span class="ct">${esc(m.t1)}</span><span>${half(1, "ct")}</span><span>${half(1, "t")}</span><span>${x.ot ? otv(1) : "-"}</span></span>
        <span class="hr"><span class="t">${esc(m.t2)}</span><span>${half(2, "ct")}</span><span>${half(2, "t")}</span><span>${x.ot ? otv(2) : "-"}</span></span>
        ${x.first1 ? `<span class="hd">${esc(m.t1)} started on ${x.first1 === "ct" ? "CT" : "T"}</span>` : ""}
        ${x.vod ? `<a class="btn" href="${esc(x.vod)}" target="_blank" rel="noopener">Watch VOD</a>` : ""}
      </span>` : ""}
    </button>`;
  }).join("")}</div>`;
}

// Plain-language text for the veto engine's warning codes (predictor.VETO_WARN_TEXT); an unknown
// code is shown as its own words rather than dropped.
function vetoWarnText(code, a, b) {
  const m = /^(.*)_(a|b)$/.exec(code), t = m ? (m[2] === "a" ? a : b) : null;
  const base = m ? m[1] : code;
  if (code === "cold_start_both") return "Neither team has recent map history, so the chances are close to even across the pool.";
  if (base === "cold_start" && t) return `${t} has no recent map history; its picks and bans follow what teams usually do.`;
  if (base === "mask_exhausted" && t) return `${t} has not played any of the maps left at a pick step; the "not played lately" filter was lifted there.`;
  if (code === "pool_default") return "No map pool was given for this series; the usual pool is used.";
  if (code === "pool_size_n") return "The map pool is not seven maps; the veto steps follow the standard rules for this pool size.";
  if (code === "pool_too_large") return "The map pool is too large for exact chances; one simulated veto is shown.";
  const w = String(code).replace(/_/g, " ").trim();
  return w ? w[0].toUpperCase() + w.slice(1) + "." : "";
}
const vPct = v => v < 0.005 ? "0%" : v < 0.01 ? "<1%" : `${Math.round(v * 100)}%`;

// Notes about the single simulated veto: engine warnings for the format, and any pick by a team on a
// map the model otherwise treats as one it avoids (no games on it lately).
function vetoNotes(pred, a, b, bo, V) {
  const D = vdFor(pred, bo), out = [];
  if (D) {
    for (const w of D.warn) { const t = vetoWarnText(w, a, b); if (t) out.push(t); }
    for (const s of V.veto) {
      const side = s.side === "A" ? "a" : s.side === "B" ? "b" : null;
      if (s.verb === "picks" && side && D.masked[side].includes(s.map))
        out.push(`${side === "a" ? a : b} has not played ${s.map} lately and is unlikely to pick it; the chances below show how often that happens.`);
    }
  }
  return out.map(t => `<p class="warn">${esc(t)}</p>`).join("");
}

// Pick and ban chances for each map of the pool, from the veto distribution (every legal veto,
// weighted by how likely it is).
function chances(pred, a, b, bo) {
  if (bo === 5) return `<div class="vch"><h3>Pick and ban chances</h3><p class="small dim">Not available for a best-of-five: only best-of-one and best-of-three vetoes have enough past series to measure. The veto above is a single simulation.</p></div>`;
  const D = vdFor(pred, bo);
  const total = D ? D.rows.reduce((x, r) => x + r.played, 0) : 0;
  if (!D || !D.rows.length || Math.abs(total - bo) > 0.2)
    return `<div class="vch"><h3>Pick and ban chances</h3><p class="small dim">Not available for this matchup.</p></div>`;
  const rows = [...D.rows].sort((x, y) => y.played - x.played || x.map.localeCompare(y.map));
  const seg = (v, cls, lbl) => v > 0.0005 ? `<i class="${cls}" style="width:${(v * 100).toFixed(2)}%" title="${esc(lbl)}"></i>` : "";
  const maskNote = r => bo === 1 ? "" : ["a", "b"].filter(k => D.masked[k].includes(r.map)).map(k =>
    `<span class="vmask ${k === "a" ? "ct" : "t"}" title="${esc(`${k === "a" ? a : b} has no games on ${r.map} in the last 90 days, so it is not expected to pick it`)}">${esc(k === "a" ? a : b)} not expected to pick</span>`).join("");
  const list = rows.map(r => {
    const parts = bo === 1 ? "" : `<span class="ct">${esc(a)} picks ${vPct(r.pa)}</span><span class="t">${esc(b)} picks ${vPct(r.pb)}</span>`;
    const lbl = `${r.map}: played ${vPct(r.played)}; ${a} ban ${vPct(r.ba)}, ${b} ban ${vPct(r.bb)}`;
    return `<li class="vrow" style="${mapBg(r.map)}" aria-label="${esc(lbl)}">
      <span class="vnm cond">${esc(r.map)}</span>
      <span class="vpl"><b class="cond">${vPct(r.played)}</b><span class="small dim">${bo === 1 ? "chance it is the map played" : "chance it is played"}</span></span>
      <span class="vbar" aria-hidden="true">${seg(r.pa, "ct", `${a} pick`)}${seg(r.pb, "t", `${b} pick`)}${seg(r.dec, "dec", "Decider")}</span>
      <span class="vsplit small">${parts}${bo === 1 ? "" : `<span class="dim">decider ${vPct(r.dec)}</span>`}</span>
      <span class="vban small"><span class="dim">Banned</span> <span class="ct">${esc(a)} ${vPct(r.ba)}</span><span class="t">${esc(b)} ${vPct(r.bb)}</span></span>
      ${maskNote(r) ? `<span class="vnotes small">${maskNote(r)}</span>` : ""}
    </li>`;
  }).join("");
  return `<div class="vch"><h3>Pick and ban chances <span class="dim small">${bo === 1 ? "which map ends up played" : "how often each map is picked, left as the decider, or banned"}</span></h3>
    <ul class="vlist">${list}</ul>
    <p class="small dim">A map's played chance is its pick chance plus its decider chance. Chances come from past vetoes and each team's recent maps, not from this event's draw.</p></div>`;
}

// One factor row's evidence from the build's fx array (see evidence() in
// viewer/build_viewer.py for the layout). Team A is listed first.
const ROSTER_TXT = ["", "stand-in", "missing IGL", "stand-in for the IGL"];
function factFor(k, x, a, b) {
  const rec = (w, l) => `${w}-${l}`;
  if (k === "base_strength") {
    const g = x[0];
    return { kind: "data", text: g === 0 ? "Even Elo" : `${g > 0 ? a : b} +${Math.abs(g)} Elo${Math.abs(g) > 200 ? " (counted up to 200)" : ""}` };
  }
  if (k === "form_30d") {
    const na = x[1] + x[2], nb = x[4] + x[5];
    if (!na || !nb) return { kind: "nodata", text: `${!na && !nb ? "Neither team has" : (!na ? a : b) + " has"} no series in the last 30 days` };
    return { kind: "data", text: `${rec(x[1], x[2])} vs ${rec(x[4], x[5])} in 30 days; Elo expected ${(x[3] / 10).toFixed(1)} vs ${(x[6] / 10).toFixed(1)} wins` };
  }
  if (k === "form_last5") {
    if (!(x[7] + x[8]) || !(x[9] + x[10])) return { kind: "nodata", text: "Not enough series yet" };
    return { kind: "data", text: `${rec(x[7], x[8])} vs ${rec(x[9], x[10])} in the last 5 series` };
  }
  if (k === "head_to_head") {
    return x[11] + x[12] ? { kind: "data", text: `${rec(x[11], x[12])} in the past year` } : { kind: "nodata", text: "No meetings in the past year" };
  }
  if (k === "map_veto") return { kind: "info", text: "Map edges on the simulated veto; shown below, not counted (no tested effect)" };
  if (k === "map_depth") return { kind: "info", text: `${x[13]} vs ${x[14]} strong maps of ${x[15]}; not counted (no tested effect beyond strength)` };
  if (k === "roster") {
    const ra = Math.floor(x[16] / 4), rb = x[16] % 4;
    if (!ra && !rb) return { kind: "nodata", text: "No stand-ins listed" };
    return { kind: "data", text: [ra && `${a}: ${ROSTER_TXT[ra]}`, rb && `${b}: ${ROSTER_TXT[rb]}`].filter(Boolean).join("; ") };
  }
  return { kind: "data", text: (LABELS[k] || ["", ""])[1] };
}

function factors(pred, a, b) {
  const fs = pred.factors;
  const mx = Math.max(4, ...fs.map(f => Math.abs(f.pp)));
  const rows = fs.map(f => {
    const [nm, sub] = LABELS[f.factor] || [f.factor, ""];
    // ev: the raw facts behind the row (build_viewer.evidence); kind "info" =
    // shown but not counted (no held-out effect), "nodata" = nothing to go on
    const ev = pred.fx ? factFor(f.factor, pred.fx, a, b) : { text: sub, kind: "data" };
    const pp = f.pp, flat = Math.abs(pp) < 0.05, off = flat || ev.kind !== "data";
    const val = ev.kind === "info" ? "info" : ev.kind === "nodata" ? "no data" : flat ? "0.0" : "+" + Math.abs(pp).toFixed(1);
    return `<div class="frow${off ? " off" : ""}" title="${esc(sub)}">
      <span class="fic">${ICON[f.factor] || ICON.overview}</span>
      <div class="fl"><b>${esc(nm)}</b><span class="sub">${esc(ev.text)}</span></div>
      <div class="dv" aria-hidden="true">${off ? "" : `<b class="${pp > 0 ? "pos" : "neg"}" style="width:${(Math.abs(pp) / mx * 50).toFixed(2)}%"></b>`}</div>
      <div class="v ${off ? "" : pp > 0 ? "ct" : "t"}">${val}</div>
    </div>`;
  }).join("");
  const warns = pred.warn.map(w => {
    let t = w;
    for (const [k, [n]] of Object.entries(LABELS)) t = t.split(`'${k}'`).join(n);
    return `<p class="warn">${esc(t)}</p>`;
  }).join("");
  return `<div class="panel"><h2>What moves the number <span class="dim">points added for <span class="ct">${esc(a)}</span> (left) or <span class="t">${esc(b)}</span> (right)</span></h2>${rows}${warns}</div>`;
}

function lineup(team, side, e) {

/* ---------------- series math (mirrors predictor.series_scorelines / flat_map_prob) ---------------- */
function scorelines(pm) {
  const need = (pm.length + 1) / 2, a = Array(need).fill(0), b = Array(need).fill(0);
  let st = new Map([["0,0", 1]]);
  for (const p of pm) {
    const nx = new Map();
    for (const [k, v] of st) {
      const [i, j] = k.split(",").map(Number);
      for (const [ii, jj, q] of [[i + 1, j, p], [i, j + 1, 1 - p]]) {
        if (ii === need) a[jj] += v * q;
        else if (jj === need) b[ii] += v * q;
        else nx.set(ii + "," + jj, (nx.get(ii + "," + jj) || 0) + v * q);
      }
    }
    st = nx;
  }
  return a.concat(b.reverse());
}
function flatQ(p, n) {
  const need = (n + 1) / 2;
  let lo = 0, hi = 1;
  for (let k = 0; k < 100; k++) {
    const mid = (lo + hi) / 2;
    if (scorelines(Array(n).fill(mid)).slice(0, need).reduce((x, y) => x + y, 0) < p) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
// [{a, b, p}] final scores from team A's view, A's wins first
function scoreSet(pred, bo) {
  let s;
  if (bo === 3) s = [pred.score.p_2_0, pred.score.p_2_1, pred.score.p_1_2, pred.score.p_0_2];
  else if (bo === 1) { const p1 = pFor(pred, 1).p; s = [p1, 1 - p1]; }
  else if (bo === 5 && pred.score5) s = ["p_3_0", "p_3_1", "p_3_2", "p_2_3", "p_1_3", "p_0_3"].map(k => pred.score5[k]);
  else if (bo === 5 && pred.map_p5) {
    // the engine's BO5 per-map chances (5 decimals in the page); rescale each
    // side so the series total is exactly the engine's BO5 win probability
    const p5 = pFor(pred, 5).p, r = scorelines(pred.map_p5), wa = r[0] + r[1] + r[2];
    s = r.map((x, i) => i < 3 ? x * p5 / wa : x * (1 - p5) / (1 - wa));
  }
  else s = scorelines(Array(bo).fill(flatQ(pFor(pred, bo).p, bo)));
  const need = (bo + 1) / 2;
  return s.map((p, i) => i < need ? { a: need, b: i, p } : { a: 2 * need - 1 - i, b: need, p });
}
const winOf = x => x.a > x.b;
const scoreFrom = (x, forA) => forA ? `${x.a}-${x.b}` : `${x.b}-${x.a}`;

/* ---------------- the matchup desk ---------------- */
const desk = { a: null, b: null, feat: null, bo: 3, tab: "overview", spot: null, key: "", next: "a", q: "" };
const DTABS = [["overview", "Overview"], ["lineups", "Lineups"], ["h2h", "Head-to-head"], ["pools", "Map pools"]];
const bigPct = v => { const [i, d] = String(v).split("."); return `${i}<small>.${d}%</small>`; };

function court(pred, a, b, o, bo) {

        <div class="cid">

          ${rfBadge(rfSides(o.rf, a, b).filter(([x]) => x === t))}
          ${o.change ? `<button type="button" class="btn cchg" data-chg="${cls}" aria-haspopup="dialog" aria-label="${esc(`Change Team ${i + 1}, now ${t}`)}">Change Team ${i + 1}${ICON.swap}</button>` : ""}
        </div>

    </div>`;

    ${o.change ? `<button type="button" class="btn" id="exSwap">${ICON.swap}Swap teams</button>` : ""}
    ${o.live ? `<span class="chip live">Live</span>` : ""}${o.verdict || ""}</div></div>`;
  const bar = pred ? `<div class="cbar">
      <div class="bar" role="img" title="The striped part is the range the model thinks the real chance falls in; a wider stripe means it's less sure. The white line is each team's estimated win percentage." aria-label="${esc(`${a} ${shown[0]}%, ${b} ${shown[1]}%; likely range for ${a} ${pct(F.band[0], 2)} to ${pct(F.band[1], 2)}`)}">
        <div class="fill" data-w="${(F.p * 100).toFixed(2)}"></div>
        <div class="band" data-l="${(F.band[0] * 100).toFixed(2)}" data-bw="${((F.band[1] - F.band[0]) * 100).toFixed(2)}"
          style="left:50%;width:0;--split:${(F.band[1] > F.band[0] ? (F.p - F.band[0]) / (F.band[1] - F.band[0]) * 100 : 50).toFixed(2)}%"></div>
        <div class="mk" data-w="${(F.p * 100).toFixed(2)}"></div>

// what the spotlight on screen shows, so a map click can redraw just the spotlight
let SPOT_ARGS = null;
function tape(pred, a, b, bo = 3) {
  SPOT_ARGS = [pred, a, b, bo];
  const win90 = pred.mr ? "90 days before this series" : "last 90 days";
  const V = vetoFor(pred, bo);
  if (!V) return "";
  const steps = V.veto;
  if (!desk.spot || !steps.some(s => s.map === desk.spot)) desk.spot = V.maps[0];
  return `<div class="tape" style="--n:${steps.length}" role="group" aria-label="Veto, in order">${steps.map((s, i) => {
    const who = s.side === "A" ? a : s.side === "B" ? b : null;
    const cls = s.verb === "bans" ? "ban" : s.verb === "picks" ? "pick" : "dec";
    const verb = s.verb === "decider" ? "Decider" : s.verb === "bans" ? "Ban" : "Pick";
    const role = s.verb === "decider" ? "Decider" : `${who} ${verb.toLowerCase()}`;
    const stat = (t, c) => {
      const v = mapRec(pred, t, s.map);
      const txt = v ? `${(v[0] * 100).toFixed(2)}% (${v[1]})` : "N/A";
      const tip = v ? `${(v[0] * 100).toFixed(2)}% won of ${v[1]} map${v[1] === 1 ? "" : "s"}` : "N/A: not played in the 90 days before";
      return `<span class="${c}${v ? "" : " na"}" title="${esc(`${t} on ${s.map}, ${win90}: ${tip}`)}">${logo(t, "xs")}<span>${txt}</span></span>`;
    };
    return `<button type="button" class="tm ${cls} ${s.side === "A" ? "sa" : s.side === "B" ? "sb" : ""}" data-spot="${esc(s.map)}" aria-pressed="${s.map === desk.spot}" style="${mapBg(s.map)}" title="${esc(role)}">
      <span class="tn">${i + 1}</span><span class="tbody"><span class="tnm cond">${esc(s.map)}</span><span class="trole"><i>${verb}</i>${s.verb === "decider" ? "" : `<em>${esc(who)}</em>`}</span>
      <span class="tst">${stat(a, "ct")}${stat(b, "t")}</span></span></button>`;
  }).join("")}</div>`;
}

function spotlight(pred, a, b, bo = 3) {
  const V = vetoFor(pred, bo);
  if (!V) return "";
  const n = V.maps.length;
  const m = desk.spot, i = V.veto.findIndex(s => s.map === m), s = V.veto[i];
  const who = s.side === "A" ? a : s.side === "B" ? b : null;
  const k = V.maps.indexOf(m), pm = k >= 0 ? V.map_p[k] : null;
  const nth = ["first", "second", "third", "fourth", "fifth", "sixth", "seventh"][n - 1] || `number ${n}`;
  const role = s.verb === "decider" ? (n === 1 ? `The map left after the bans: the only map played.`
      : `The map left after the bans: played ${nth} if it goes the distance.`)
    : s.verb === "picks" ? `${esc(who)} pick, played as map ${k + 1}.`
    : `${esc(who)} ban at step ${i + 1}. Not played in this veto.`;
  let chance = "";
  if (pm !== null) {
    const pair = displayPercent([pm, 1 - pm]);
    const fav = pm >= .5 ? a : b;
    chance = `<div class="mchance"><div class="small dim">Map win chance, ${esc(fav)} favoured</div>
      <div class="nums"><span class="cond ct">${pair[0]}%</span><span class="cond t">${pair[1]}%</span></div>
      <div class="odds" role="img" aria-label="${esc(`${a} ${pair[0]}%, ${b} ${pair[1]}% on ${m}`)}"><b style="width:${(pm * 100).toFixed(2)}%"></b></div></div>`;
  }
  const rec = (t, cls) => {
    const v = mapRec(pred, t, m);
    const line = v ? `${(v[0] * 100).toFixed(2)}% of ${v[1]} map${v[1] === 1 ? "" : "s"}` : "N/A";
    return `<div class="r ${cls}">${logo(t, "sm")}<span>${esc(t)}</span><span>${line}</span>
      <span class="trk">${v ? `<b style="width:${(v[0] * 100).toFixed(1)}%"></b>` : ""}<i></i></span></div>`;
  };
  const poss = t => /s$/i.test(t) ? `${t}'` : `${t}'s`;
  const caption = s.verb === "decider" ? "Decider" : `${poss(who)} ${s.verb === "picks" ? "pick" : "ban"}`;
  const nxt = V.veto[(i + 1) % V.veto.length].map;
  return `<div class="spot">
    <div class="img" style="${mapBg(m)}"><span class="sname"><b class="cond">${esc(m)}</b><small>${esc(caption)}</small></span>
      ${V.veto.length > 1 ? `<button type="button" class="snext" data-spot="${esc(nxt)}" aria-label="${esc(`Next map in the veto: ${nxt}`)}" title="${esc(`Next: ${nxt}`)}">${ICON.next}</button>` : ""}</div>
    <div class="info"><p class="role">${role}</p>${chance}
      <div class="mrec"><span class="small dim">Won on ${esc(m)} ${pred.mr ? "in the 90 days before this series" : "in the last 90 days"}</span>${rec(a, "a")}${rec(b, "b")}</div></div>
  </div>`;
}

// The predicted score always agrees with the predicted winner: the picked team's most
// likely winning score. (The single most likely exact score overall can belong to the
// other team in a close match, e.g. pick FURIA at 50.10% while MOUZ 2-1 is the biggest tile.)
function predictedIdx(set, p) {
  const pickA = p >= .5;
  let best = -1;
  set.forEach((x, i) => { if (winOf(x) === pickA && (best < 0 || x.p > set[best].p)) best = i; });
  return best;
}
function scoreTiles(pred, a, b, bo) {
  const set = scoreSet(pred, bo);
  const shown = displayPercent(set.map(x => x.p));
  const top = predictedIdx(set, pred.p);
  const mx = Math.max(...set.map(x => x.p));
  const t = set[top], topTeam = winOf(t) ? a : b;
  const note = bo === 1 ? "One map: the series chance is the map chance."
    : bo === 5 ? (pred.score5 || pred.map_p5 ? "Map win chances from the simulated best-of-five veto, set so the series total matches the win probability."
      : "Best-of-five: the same win chance on every map, set so the series total matches the win probability.")
    : "Map win chances from the simulated veto.";
  // team A's winning scores on the left, team B's on the right, each column from the clean sweep down
  const tile = ([x, i]) => {
    const sd = winOf(x) ? "a" : "b", who = winOf(x) ? a : b;
    return `<div class="stile ${sd}${i === top ? " top" : ""}" title="${esc(`${who} ${scoreFrom(x, winOf(x))}: ${shown[i]}%`)}">
        ${logo(who, "md")}<span class="sx"><b class="cond">${scoreFrom(x, winOf(x))}</b><span class="sn">${esc(who)}</span></span>
        <span class="v">${i === top ? `<span class="pk">Predicted</span>` : ""}${shown[i]}%</span>
        <span class="sb"><i style="width:${(x.p / mx * 100).toFixed(1)}%"></i></span></div>`;
  };
  const idx = set.map((x, i) => [x, i]);
  return `<div class="panel"><h2>Series score <span class="dim">predicted ${esc(topTeam)} ${scoreFrom(t, winOf(t))}</span></h2>
    <div class="stiles"><div class="scol">${idx.filter(([x]) => winOf(x)).map(tile).join("")}</div>
      <span class="svs cond" aria-hidden="true">vs</span>
      <div class="scol">${idx.filter(([x]) => !winOf(x)).reverse().map(tile).join("")}</div></div><p class="small dim">${note}</p></div>`;
}

function vetoBody(pred, a, b, bo) {
  const V = vetoFor(pred, bo);
  if (!V) return `<p class="empty">This tournament's map pool has fewer than five maps, so there is no best-of-five veto to simulate. Every map gets the same win chance.</p>`;
  const pool = [...new Set(V.veto.map(s => s.map))];
  return `${vetoNotes(pred, a, b, bo, V)}${tape(pred, a, b, bo)}${spotlight(pred, a, b, bo)}
    <p class="small dim vpool">Simulated with ${esc(a)} banning first, from the pool of ${pool.length}: ${pool.map(esc).sort().join(", ")}.</p>`;
}
function matchDesk(pred, a, b, o = {}) {
  const key = `${a}|${b}`;
  if (desk.key !== key) { desk.key = key; desk.spot = null; desk.tab = "overview"; }
  if (desk.tab === "veto") desk.tab = "overview";   // the Veto simulation tab is the home page's own
  const bo = o.fixedBo && [1, 3, 5].includes(o.fixedBo) ? o.fixedBo : desk.bo;
  const pool = (o.ev && o.ev.pool.length ? o.ev.pool : null) || DATA.pool;
  let body;
  const caution = rfPanel(rfSides(o.rf, a, b), { [a]: "ct", [b]: "t" });
  if (desk.tab === "lineups") body = `${caution}<div class="grid2">${lineup(a, "a", o.ev)}${lineup(b, "b", o.ev)}</div>`;
  else if (desk.tab === "h2h") body = `${h2hList(a, b)}<div class="grid2">${formList(a)}${formList(b)}</div>`;
  else if (desk.tab === "pools") body = poolCompare(a, b, pool);
  else body = `${caution}${o.notes || ""}
    ${o.played ? `<section class="panel"><h2>Maps played <span class="dim">tap a map for CT and T halves</span></h2>${o.played}</section>` : ""}
    ${pred ? `<div class="ovw"><section class="panel ovw-veto"><h2>${o.played ? "The model's simulated veto" : "Simulated veto"} <span class="dim">${vetoFor(pred, bo) ? "choose a map to see who it suits" : ""}</span></h2>${vetoBody(pred, a, b, bo)}${chances(pred, a, b, bo)}</section>
    ${scoreTiles(pred, a, b, bo)}${factors(pred, a, b)}</div>` : ""}`;
  // the section tabs ride in the court's control row (left), next to Format / Swap (right)
  const SHORT = { h2h: "H2H", pools: "Maps" };   // phone labels, so all four tabs fit in one row
  const tabs = `<div class="dtabs" role="tablist" aria-label="Matchup sections">${DTABS.map(([k, l]) => `<button type="button" role="tab" data-dtab="${k}" aria-selected="${desk.tab === k}" aria-label="${esc(l)}">${ICON[k]}<span class="tl-full">${l}</span><span class="tl-short" aria-hidden="true">${SHORT[k] || l}</span></button>`).join("")}</div>`;
  return `${o.ctx || ""}${court(pred, a, b, { ...o, tabs }, bo)}
    <div class="desk-main" role="tabpanel">${body}</div>`;
}

// "live" on the home page also needs a recent date: an unfinished record from weeks ago is stale data
const recentLive = m => isLive(m) && m.day && m.day >= daysBefore(DATA.as_of, 1);
function featuredMatch() {
  const all = Object.values(MATCH).filter(m => m.t1 && m.t2 && m.pred && T[m.t1] && T[m.t2]);
  const live = all.filter(recentLive);
  if (live.length) return live[0];
  const key = m => (m.day || "") + (m.when || "");
  // as_of is the day after the last result; matches scheduled the day before it may still be unplayed
  const up = all.filter(m => !m.finished && m.day && m.day >= daysBefore(DATA.as_of, 1)).sort((x, y) => key(x).localeCompare(key(y)));
  return up[0] || null;
}
function ctxFor(m, e) {

function verdictFor(m, pred) {

  const fav = p >= .5 ? m.t1 : m.t2, w = winnerOf(m);

}

/* ---------------- followed tournaments ----------------
   A star on a tournament keeps its next matches in "Coming up" even when
   others are sooner. Kept in this browser only (localStorage when allowed). */
const FAVS = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("faceoff.favs") || "[]");
    return new Set(Array.isArray(v) ? v.filter(x => typeof x === "string") : []);
  } catch (_) { return new Set(); }
})();
function saveFavs() { try { localStorage.setItem("faceoff.favs", JSON.stringify([...FAVS])); } catch (_) { /* not kept */ } }
const STAR = svgI(`<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9L3.5 9.8l5.9-.8z"/>`);
function favBtn(e, withLabel = false) {
  const on = FAVS.has(e.slug), tip = on ? `Stop following ${e.name}` : `Follow ${e.name}: its matches stay in Coming up`;
  return `<button type="button" class="fav${on ? " on" : ""}${withLabel ? " lab" : ""}" data-fav="${esc(e.slug)}" aria-pressed="${on}" title="${esc(tip)}" aria-label="${esc(tip)}">${STAR}${withLabel ? `<span>${on ? "Following" : "Follow"}</span>` : ""}</button>`;
}
// a team slot that is not a real team yet ("TBD", a private-club placeholder)
const isTeamSlot = n => !!n && !/^(tbd|tba|private|to be determined|bye)$/i.test(String(n).trim());

function homeLists() {
  const top = NAMES.filter(n => T[n].vrs).slice(0, 10);
  const keyOf = m => (m.day || "") + (m.when || "");
  const soon = Object.values(MATCH).filter(m => isTeamSlot(m.t1) && isTeamSlot(m.t2) && !m.finished && m.day && m.day >= daysBefore(DATA.as_of, 1))
    .sort((x, y) => keyOf(x).localeCompare(keyOf(y)));
  // by default: what is on in the next two days (the three soonest when it is quiet);
  // a followed tournament adds its next two matches however far off they are
  const nowIso = new Date().toLocaleDateString("en-CA"), ref = nowIso > DATA.as_of ? nowIso : DATA.as_of;
  const inWindow = soon.filter(m => dayDiff(ref, localDay(m.when) || m.day) <= 2);
  const picked = new Set(inWindow.length ? inWindow.slice(0, 8) : soon.slice(0, 3));
  for (const slug of FAVS) soon.filter(m => m.ev === slug).slice(0, 2).forEach(m => picked.add(m));
  const next = soon.filter(m => picked.has(m)).slice(0, 10);
  // latest finished series, each with whether the model's pre-match pick won
  const done = Object.values(MATCH).filter(m => m.t1 && m.t2 && m.finished && m.day && m.w1 !== m.w2)
    .sort((x, y) => keyOf(y).localeCompare(keyOf(x))).slice(0, 5);
  const doneRow = m => {
    const w = winnerOf(m), p = m.pred ? decode(m.pred).p : null, fav = p == null ? null : p >= .5 ? m.t1 : m.t2;
    return `<a class="nextm" href="#m-${m.id}">
      <span class="small dim">${esc(EV_BY[m.ev].name)}, ${fmtDay(m.day)}${rfBadge(rfSides(m.rf, m.t1, m.t2))}</span>
      <span class="tt"><span${w === m.t1 ? "" : ' class="lost"'}>${logo(m.t1, "sm")}<em>${esc(m.t1)}</em></span><b class="rsc cond">${m.w1}<i class="dim">:</i>${m.w2}</b><span${w === m.t2 ? "" : ' class="lost"'}><em>${esc(m.t2)}</em>${logo(m.t2, "sm")}</span></span>
      ${fav ? `<span class="rtag ${fav === w ? "hit" : "miss"}">${missLabel(fav === w, Math.max(p, 1 - p))}</span>` : ""}</a>`;
  };
  // a coming match as one fixture: when and where on the left, the two teams on a split
  // line (each half in its team's colour, the favoured half drawn full strength)
  const upcoming = m => {
    const e = EV_BY[m.ev], d = localDay(m.when) || m.day, bo = [1, 3, 5].includes(m.bo) ? m.bo : 3;
    const pred = m.pred ? decode(m.pred) : null;
    let line = `<span class="fx-line none"></span>`, nums = "";
    if (pred) {
      const p = pFor(pred, bo).p, [sa, sb] = displayPercent([p, 1 - p], 0), [c1, c2] = pairColors(m.t1, m.t2);
      const set = scoreSet(pred, bo), top = set[predictedIdx(set, p)];
      const sc = bo === 1 ? "" : scoreFrom(top, p >= .5).replace("-", "\u2013");
      line = `<span class="fx-line" style="--c1:${c1};--c2:${c2};--p:${(p * 100).toFixed(1)}%"><i${p >= .5 ? ' class="lead"' : ""}></i><i${p < .5 ? ' class="lead"' : ""}></i></span>`;
      nums = `<span class="fx-nums"><span${p >= .5 ? ' class="lead"' : ""}>${sa}%</span><span class="fx-sc">${sc ? `Projected ${sc}` : ""}</span><span${p < .5 ? ' class="lead"' : ""}>${sb}%</span></span>`;
    }
    return `<div class="fx">
      <div class="fx-meta"><span class="fx-when">${esc(dayWord(d))}${m.when ? ` <b>${esc(clock(m.when))}</b> <span class="dim">${esc(tz(m.when))}</span>` : ""}</span>
        <span class="fx-ev"><span>${esc(shortEv(e.name))}${m.bo !== 3 ? `, Bo${m.bo}` : ""}</span>${rfBadge(rfSides(m.rf, m.t1, m.t2), true)}</span></div>
      <a class="fx-main" href="#m-${m.id}">
        <span class="fx-names"><span class="fx-t">${logo(m.t1, "sm")}<em>${esc(m.t1)}</em></span><span class="fx-t r"><em>${esc(m.t2)}</em>${logo(m.t2, "sm")}</span></span>
        ${line}${nums}</a>
      ${favBtn(e)}

  };
  return { top, next, done, doneRow, upcoming };
}
// the home page always opens on this example matchup (Team 1, Team 2)
const HOME_PAIR = ["Team Falcons", "Team Spirit"];
// show a scheduled match on the desk, in its real format (the format buttons stay free to change)
function loadMatch(m) { desk.a = m.t1; desk.b = m.t2; desk.feat = m.id; desk.bo = [1, 3, 5].includes(m.bo) ? m.bo : 3; desk.spot = null; }
function homeMatchup() {
  const ok = n => CMP_NAMES.includes(n);
  let [a, b] = HOME_PAIR;
  if (!ok(a) && !ok(b)) {
    // neither example team is in the data: the next scheduled match, else the top two
    const f = featuredMatch();
    if (f) { loadMatch(f); return; }
    desk.a = CMP_NAMES[0]; desk.b = CMP_NAMES[1]; desk.feat = null; return;
  }
  if (!ok(a)) a = CMP_NAMES.find(n => n !== b);
  if (!ok(b)) b = CMP_NAMES.find(n => n !== a);
  // when the two have a meeting scheduled (Team 1 listed first), open on it with its event and date
  const keyOf = m => (m.day || "") + (m.when || "");
  const sched = Object.values(MATCH).filter(m => m.t1 === a && m.t2 === b && m.pred && !m.finished && m.day && m.day >= daysBefore(DATA.as_of, 1))
    .sort((x, y) => keyOf(x).localeCompare(keyOf(y)))[0];
  if (sched) { loadMatch(sched); return; }
  desk.a = a; desk.b = b; desk.feat = null;
}

        ${rfBadge(rfSides(o.rf, a, b).filter(([x]) => x === t))}
      </div>
      ${shown ? `<div class="ho-pct"><span class="ho-big" aria-label="${esc(`${t} ${shown[i]}% to win`)}">${shown[i]}<small>%</small></span><span class="ho-lbl" aria-hidden="true">Win probability</span></div>` : ""}
    </div>`;
  let pick = "", bar = `<p class="empty">No model call: one of these teams has no results in the data.</p>`, unc = "";
  if (pred) {
    const set = scoreSet(pred, bo), top = set[predictedIdx(set, F.p)];
    if (top) pick = `<span class="ho-pred">${HI.spark}Predicted: ${esc(shortName(winOf(top) ? a : b))}${bo === 1 ? "" : ` ${scoreFrom(top, winOf(top))}`}</span>`;
    bar = `<div class="cbar"><div class="bar" role="img" title="The striped part is the range the model thinks the real chance falls in; a wider stripe means it's less sure. The white line is the estimate." aria-label="${esc(`${a} ${shown[0]}%, ${b} ${shown[1]}%; likely range for ${a} ${pct(F.band[0], 2)} to ${pct(F.band[1], 2)}`)}">
        <div class="fill" data-w="${(F.p * 100).toFixed(2)}"></div>
        <div class="band" data-l="${(F.band[0] * 100).toFixed(2)}" data-bw="${((F.band[1] - F.band[0]) * 100).toFixed(2)}"
          style="left:50%;width:0;--split:${(F.band[1] > F.band[0] ? (F.p - F.band[0]) / (F.band[1] - F.band[0]) * 100 : 50).toFixed(2)}%"></div>
        <div class="mk" data-w="${(F.p * 100).toFixed(2)}"></div></div></div>`;
    // plus or minus half the width of the model's likely range for this win chance
    unc = `<span class="ho-unc" title="${esc(`Half the width of the model's likely range: ${a} ${pct(F.band[0], 1)} to ${pct(F.band[1], 1)}`)}">Uncertainty: ±${((F.band[1] - F.band[0]) * 50).toFixed(1)}%</span>`;
  }
  const nav = o.nav || {};
  const arw = (d, m, cls) => `<button type="button" class="ho-arw ${cls}" data-fxnav="${d}"${m ? ` data-go="${m.id}"` : ""} ${m ? `aria-label="${esc(`${d < 0 ? "Previous" : "Next"} match: ${m.t1} vs ${m.t2}`)}" title="${esc(`${m.t1} vs ${m.t2}`)}"` : `aria-label="${d < 0 ? "No earlier match" : "No later match"}" disabled`}>${d < 0 ? HI.prev : HI.next}</button>`;
  const chips = [o.live ? `<span class="chip live">Live</span>` : "", o.verdict || ""].join("");
  const mid = `<div class="ho-mid">
      <span class="ho-fmt">CS2 • Bo${bo}${o.evName ? ` • ${esc(o.evName)}` : ""}</span>
      ${pick}
      <div class="ho-vsrow">${arw(-1, nav.prev, "a")}${o.centre || `<span class="ho-vs" aria-hidden="true">VS</span>`}${arw(1, nav.next, "b")}</div>
      ${bar}${unc}${chips ? `<div class="ho-chips">${chips}</div>` : ""}
    </div>`;
  return `<section class="ho-court" aria-label="${esc(`${a} against ${b}`)}">${side(a, "a", 0)}${mid}${side(b, "b", 1)}</section>`;
}

function hoStand(top) {
  const on = PAIR || [];
  const rows = top.slice(0, 5).map(n => {
    const r = T[n].results || [], w = r.filter(x => x.won).length;
    const last = r.slice(0, 5);
    const cls = on[0] === n ? " oa" : on[1] === n ? " ob" : "";
    return `<a class="ho-tr${cls}" href="#t-${T[n].slug}"${cls ? ` title="${esc(n)} is in the matchup"` : ""}><span class="rk">${T[n].vrs.rank}</span><span class="nm">${logo(n, "sm")}<span>${esc(shortName(n))}</span></span>
      <span class="wlr" title="${esc(`${w} won, ${r.length - w} lost in the last ${r.length} series`)}">${w}-${r.length - w}</span>
      <span class="form5" role="img" aria-label="${esc(`last five: ${last.map(x => x.won ? "won" : "lost").join(", ") || "no results"}`)}">${last.slice().reverse().map(x => `<i class="${x.won ? "W" : "L"}"></i>`).join("")}</span></a>`;

  return `<section class="ho-st ho-p" aria-labelledby="hoStT">
    <header class="ho-h">${HI.bars}<div><h2 id="hoStT">VRS standings <small>Form, last 5</small></h2></div></header>
    <div class="ho-tbl"><div class="ho-tr hd" aria-hidden="true"><span>#</span><span>Team</span><span title="Series won and lost, last 10">W-L 10</span><span></span></div>${rows}</div>
  </section>`;
}

function hoTabs(bo, fixed = false) {
  if (!HTABS.some(([k]) => k === desk.tab)) desk.tab = "overview";
  const tabs = HTABS.map(([k, l]) => `<button type="button" role="tab" id="hoTab-${k}" data-dtab="${k}" aria-selected="${desk.tab === k}" aria-controls="hoBody" tabindex="${desk.tab === k ? 0 : -1}">${ICON[k]}${l}</button>`).join("");
  const fmt = `<div class="seg" role="group" aria-label="Series format">${(fixed ? [bo] : [1, 3, 5]).map(n => `<button type="button" data-bo="${n}" aria-pressed="${n === bo}"${fixed ? " disabled" : ""}>Bo${n}</button>`).join("")}</div>`;

    <div class="ho-tr2"><span class="lbl">Format</span>${fmt}${fixed ? "" : `<button type="button" class="ho-swap" id="exSwap" aria-label="Swap the two teams" title="Swap teams">${ICON.swap}</button>`}</div></div>`;
}

function hoVeto(pred, a, b, bo) {
  const V = vetoFor(pred, bo);
  const head = `<header class="ho-h">${HI.veto}<div><h2>Simulated veto</h2><p>Each team's map win rate over the ${pred.mr ? "90 days before this series" : "last 90 days"}. Choose a map for the full veto.</p></div></header>`;
  if (!V) return `<section class="ho-p ho-veto">${head}<p class="empty">This map pool has fewer than five maps, so there is no best-of-five veto to simulate.</p></section>`;
  const cards = V.veto.map((s, i) => {
    const who = s.side === "A" ? a : s.side === "B" ? b : null;
    const cls = s.verb === "bans" ? "k-ban" : s.verb === "picks" ? "k-pick" : "k-dec";
    const tag = s.verb === "decider" ? "Decider" : s.verb === "bans" ? "Ban" : "Pick";
    const foot = s.verb === "decider" ? "Decider" : `${shortName(who)} ${tag.toLowerCase()}`;
    const st = (t, c) => {
      const v = mapRec(pred, t, s.map);
      const tip = v ? `${t} won ${(v[0] * 100).toFixed(2)}% of ${v[1]} map${v[1] === 1 ? "" : "s"} on ${s.map}` : `${t}: no ${s.map} maps in the 90 days`;
      return `<span class="${v ? "" : "na"}" title="${esc(tip)}"><em>${esc(shortName(t))}</em><b class="${v ? c : ""}">${v ? Math.round(v[0] * 100) + "%" : "N/A"}</b></span>`;
    };
    return `<button type="button" class="ho-map ${cls} ${s.side === "A" ? "sa" : s.side === "B" ? "sb" : ""}" data-vspot="${esc(s.map)}" aria-label="${esc(`Step ${i + 1}, ${s.map}: ${s.verb === "decider" ? "decider" : `${who} ${tag.toLowerCase()}`}. Open the full veto`)}">
      <span class="ho-mart" style="${mapBg(s.map)}"><b>${esc(s.map)}</b><i>${tag.toUpperCase()}</i></span>
      <span class="ho-mst">${st(a, "ct")}${st(b, "t")}</span>
      <span class="ho-mft">${esc(foot)}</span></button>`;
  }).join("");
  return `<section class="ho-p ho-veto">${head}<div class="ho-maps" style="--n:${V.veto.length}" role="group" aria-label="Veto, in order">${cards}</div></section>`;
}

// the engine's factor contributions; rows it shows but never counts (map veto, map depth) are left out
function hoFactors(pred, a, b) {
  const rows = pred.factors.map(f => ({ f, ev: pred.fx ? factFor(f.factor, pred.fx, a, b) : { kind: "data", text: (LABELS[f.factor] || ["", ""])[1] } }))
    .filter(x => x.ev.kind !== "info");
  const mx = Math.max(4, ...rows.map(x => Math.abs(x.f.pp)));
  const html = rows.map(({ f, ev }) => {
    const [nm, sub] = LABELS[f.factor] || [f.factor, ""];
    const pp = f.pp, flat = Math.abs(pp) < 0.05, off = flat || ev.kind !== "data";
    const val = ev.kind === "nodata" ? "n/a" : flat ? "0.0" : `${pp > 0 ? "+" : "−"}${Math.abs(pp).toFixed(1)}`;
    const side = pp > 0 ? "a" : "b";
    return `<div class="ho-frow${off ? " off" : ""}" title="${esc(`${sub}. ${ev.text}`)}"><span>${esc(nm)}</span>
      <span class="ho-trk" aria-hidden="true">${off ? "" : `<b class="${side}" style="width:${(Math.abs(pp) / mx * 100).toFixed(1)}%"></b>`}</span>
      <span class="ho-fv ${off ? "" : side}">${val}</span></div>`;
  }).join("");
  const warns = pred.warn.map(w => {
    let t = w;
    for (const [k, [n]] of Object.entries(LABELS)) t = t.split(`'${k}'`).join(n);
    return `<p class="warn">${esc(t)}</p>`;
  }).join("");
  return `<section class="ho-p ho-fac"><header class="ho-h">${HI.bars}<div><h2>What moves the number</h2>
    <p>Points toward <span class="ct">${esc(shortName(a))}</span> (+) or <span class="t">${esc(shortName(b))}</span> (−)</p></div></header>${html}${warns}</section>`;
}

function hoDist(pred, a, b, bo) {
  const set = scoreSet(pred, bo), shown = displayPercent(set.map(x => x.p)), top = predictedIdx(set, pFor(pred, bo).p), mx = Math.max(...set.map(x => x.p));
  const cols = set.map((x, i) => {
    const w = winOf(x), who = w ? a : b, sc = scoreFrom(x, w);
    return `<div class="ho-dc ${w ? "a" : "b"}${i === top ? " top" : ""}" title="${esc(`${who} ${sc}: ${shown[i]}%${i === top ? ", the predicted score" : ""}`)}">
      <span>${esc(shortName(who))} ${sc}</span><span class="ho-db"><b style="width:${(x.p / mx * 100).toFixed(1)}%"></b></span><span class="ho-dp">${shown[i]}%</span></div>`;
  }).join("");
  return `<section class="ho-p ho-dist"><header class="ho-h"><div><h2>Series score distribution <small>(Bo${bo})</small></h2></div></header>
    <div class="ho-dg" style="--n:${set.length}">${cols}</div></section>`;
}

function hoResults(done, empty = "No finished series in this snapshot.") {
  const row = m => {
    // the same verdict as before: the model's pre-match pick against the winner
    const w = winnerOf(m), p = m.pred ? decode(m.pred).p : null, fav = p == null ? null : p >= .5 ? m.t1 : m.t2;
    const e = EV_BY[m.ev];
    return `<a class="ho-rr" href="#m-${m.id}" aria-label="${esc(`${e.name}, ${fmtDay(m.day)}: ${m.t1} ${m.w1}, ${m.t2} ${m.w2}${fav ? `. Model call ${missLabel(fav === w, Math.max(p, 1 - p)).toLowerCase()}` : ""}`)}">
      <span class="ho-rm"><b>${esc(shortEv(e.name))}</b><span>${fmtDay(m.day)}</span>${rfBadge(rfSides(m.rf, m.t1, m.t2), true)}</span>
      <span class="ho-rt"><span${w === m.t1 ? "" : ' class="lost"'}>${logo(m.t1, "sm")}<em>${esc(shortName(m.t1))}</em></span><b class="ho-rsc">${m.w1} - ${m.w2}</b><span${w === m.t2 ? "" : ' class="lost"'}>${logo(m.t2, "sm")}<em>${esc(shortName(m.t2))}</em></span></span>
      ${fav ? `<span class="ho-chip ${fav === w ? "hit" : "miss"}">${missLabel(fav === w, Math.max(p, 1 - p))}</span>` : `<span class="ho-chip none">No call</span>`}
      <span class="ho-chev" aria-hidden="true">${HI.next}</span></a>`;
  };
  return `<section class="ho-res ho-p" aria-labelledby="hoResT"><header class="ho-h">${HI.clock}<div><h2 id="hoResT">Latest results</h2></div></header>
    ${done.length ? done.map(row).join("") : `<p class="empty">${esc(empty)}</p>`}</section>`;
}

function hoBody(pred, a, b, o, bo) {
  const pool = (o.ev && o.ev.pool.length ? o.ev.pool : null) || DATA.pool;
  const caution = rfPanel(rfSides(o.rf, a, b), { [a]: "ct", [b]: "t" });
  const none = `<p class="empty">No model call: one of these teams has no results in the data.</p>`;
  if (desk.tab === "lineups") return `${caution}<div class="grid2">${lineup(a, "a", o.ev)}${lineup(b, "b", o.ev)}</div>`;
  if (desk.tab === "h2h") return `${h2hList(a, b)}<div class="grid2">${formList(a)}${formList(b)}</div>`;
  if (desk.tab === "pools") return poolCompare(a, b, pool);
  if (desk.tab === "veto") return pred ? `<section class="panel"><h2>Simulated veto <span class="dim">${vetoFor(pred, bo) ? "choose a map to see who it suits" : ""}</span></h2>${vetoBody(pred, a, b, bo)}${chances(pred, a, b, bo)}</section>` : none;
  const played = o.played ? `<section class="panel"><h2>Maps played <span class="dim">tap a map for CT and T halves</span></h2>${o.played}</section>` : "";
  return pred ? `${caution}${o.notes || ""}${played}<div class="ho-ovw">${hoVeto(pred, a, b, bo)}<div class="ho-col">${hoFactors(pred, a, b)}${hoDist(pred, a, b, bo)}</div></div>` : none;
}

function viewHome() {
  const f = featuredMatch();
  if (!desk.a || !desk.b) homeMatchup();
  const m = desk.feat && MATCH[desk.feat];
  const isFeat = m && m.t1 === desk.a && m.t2 === desk.b;
  let pred, o;
  if (isFeat) {
    pred = decode(m.pred);
    const e = EV_BY[m.ev];
    o = { ev: e, evName: shortEv(e.name), centre: m.finished || isLive(m) ? centreFor(m) : "", verdict: verdictFor(m, pred), live: recentLive(m), rf: m.rf };
  } else {
    pred = decode(DATA.pairs[`${desk.a}|${desk.b}`]);
    o = { rf: rfTool(null, desk.a, desk.b) };
  }
  o.notes = isFeat ? matchNotes(m, EV_BY[m.ev]) : pairNotes(desk.a, desk.b);
  const key = `${desk.a}|${desk.b}`;
  if (desk.key !== key) { desk.key = key; desk.spot = null; desk.tab = "overview"; }
  PAIR = [desk.a, desk.b];
  const bo = desk.bo, L = homeLists();
  o.nav = hoNav(L.next);
  return `<h1 class="sr-only">FaceOff Analytics: CS2 matchups</h1><div class="ho">
    ${hoComing(L.next)}${hoUpNext(f)}${hoCourt(pred, desk.a, desk.b, o, bo)}${hoStand(L.top)}${hoTabs(bo)}
    <div class="ho-body" id="hoBody" role="tabpanel" aria-labelledby="hoTab-${desk.tab}">${hoBody(pred, desk.a, desk.b, o, bo)}</div>
    ${hoResults(L.done)}
  </div>${builder()}`;
}

/* ---------------- header: alerts (bell) and this browser's follows (avatar) ----------------

function followedSoon() {

    const rows = list.slice(0, 6).map(m => `<li><a href="#m-${m.id}"><span class="plogos">${logo(m.t1, "sm")}${logo(m.t2, "sm")}</span>
      <span class="pm"><b>${esc(m.t1)} vs ${esc(m.t2)}</b><span>${esc(dayTime(m))}, ${esc(shortEv(EV_BY[m.ev].name))}</span></span>${HI.next}</a></li>`).join("");
    return `<h2 id="hPopT" tabindex="-1">Alerts</h2><p>${status}</p>
      <h3>Next for what you follow</h3>
      ${rows ? `<ul>${rows}</ul>` : `<p>Nothing coming up for the teams and tournaments you follow. Star a tournament under Coming up to add it here.</p>`}
      <div class="pbtns"><button type="button" class="btn acc" data-alset="al">Alert settings</button></div>`;
  }
  const evs = [...FAVS].map(s => EV_BY[s]).filter(Boolean);
  const rows = evs.map(e => `<li><span class="prow">${evImg(e, "pev")}<a class="pm" href="#e-${e.slug}"><b>${esc(e.name)}</b><span>${esc(span(e.start, e.end))}</span></a>${favBtn(e)}</span></li>`).join("");
  return `<div class="phead"><span class="hav" aria-hidden="true">${ICON.user}</span><div><h2 id="hPopT" tabindex="-1">This browser</h2><p>No account needed. What you follow is saved on this device only.</p></div></div>
    <h3>Followed tournaments</h3>
    ${rows ? `<ul>${rows}</ul>` : `<p>None yet. Use the star on a Coming up match to follow its tournament.</p>`}
    <div class="pbtns"><button type="button" class="btn" data-clearfavs="1"${FAVS.size ? "" : " disabled"}>Clear follows</button><button type="button" class="btn" data-alset="ai">Settings</button></div>`;
}
function popBtn(which) { return document.getElementById(which === "bell" ? "bellBtn" : "meBtn"); }
function openPop(which) {
  const p = $("#hPop");
  HPOP.which = which;
  p.innerHTML = popHtml(which);
  p.hidden = false;
  ["bell", "me"].forEach(w => popBtn(w).setAttribute("aria-expanded", String(w === which)));
  const h = $("#hPopT"); if (h) h.focus({ preventScroll: true });
}
function closePop(refocus) {
  if (!HPOP.which) return;
  const w = HPOP.which;
  HPOP.which = null;
  $("#hPop").hidden = true; $("#hPop").innerHTML = "";
  ["bell", "me"].forEach(x => popBtn(x).setAttribute("aria-expanded", "false"));
  if (refocus) popBtn(w).focus();
}
function refreshPop() { if (HPOP.which) { $("#hPop").innerHTML = popHtml(HPOP.which); } }
function updateBell() { const d = $("#bellDot"); if (d) d.hidden = !followedSoon().list.length; }
$("#bellBtn").addEventListener("click", () => HPOP.which === "bell" ? closePop(false) : openPop("bell"));
$("#meBtn").addEventListener("click", () => HPOP.which === "me" ? closePop(false) : openPop("me"));
$("#hPop").addEventListener("click", e => {
  const s = e.target.closest("[data-alset]");
  if (s) { closePop(false); if (window.FO_ALERTS) window.FO_ALERTS.open(s.dataset.alset); return; }
  if (e.target.closest("[data-clearfavs]")) { FAVS.clear(); saveFavs(); rerender(); refreshPop(); return; }
  if (e.target.closest("a[href]")) closePop(false);
});
document.addEventListener("pointerdown", e => { if (HPOP.which && !e.target.closest("#hPop, #bellBtn, #meBtn")) closePop(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && HPOP.which) { e.preventDefault(); closePop(true); } });
window.addEventListener("hashchange", () => closePop(false));

/* ---------------- fresh data ----------------
   An open tab never keeps showing old numbers: every 3 minutes, and whenever the tab comes
   back into view, the page compares its own data_hash with the deployed status.json.
   When a newer build is live: a hidden tab reloads as soon as it is shown again; a visible
   one gets a "New results are in" bar with a Refresh button (never a surprise reload). */
(() => {
  let newer = null;
  async function check() {
    if (newer) return;
    try {
      const r = await fetch("status.json?ts=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const st = await r.json();
      if (st.data_hash && META.data_hash && st.data_hash !== META.data_hash) { newer = st; if (!document.hidden) bar(st); }
    } catch (_) { /* offline or no status file: keep what we have */ }
  }
  function bar(st) {
    if (document.getElementById("freshBar")) return;
    const d = document.createElement("div");
    d.id = "freshBar"; d.className = "freshbar"; d.setAttribute("role", "status");
    d.innerHTML = `<span>New results are in${st.data_through ? `, through ${esc(fmtDate(st.data_through))}` : ""}.</span><button type="button" class="btn acc">Refresh</button>`;
    d.querySelector("button").addEventListener("click", () => location.reload());
    document.body.appendChild(d);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (newer) location.reload(); else check();
  });
  setTimeout(check, 20000);
  setInterval(() => { if (!document.hidden) check(); }, 180000);
})();

function evCard(e) {
  const n = new Set([...e.participants.map(p => p.team), ...e.matches.flatMap(m => [m.t1, m.t2]).filter(Boolean)]).size;
  return `<a class="evcard" href="#e-${e.slug}">

    <span class="ename">${esc(e.name)}</span>
    <span class="emeta"><span>${span(e.start, e.end)}</span>${e.city ? `<span>${esc(e.city)}${e.country ? ", " + esc(e.country) : ""}</span>` : e.type ? `<span>${esc(e.type)}</span>` : ""}</span>
    <span class="efoot">${e.champion ? `<span class="champ">${logo(e.champion, "sm")}${esc(e.champion)} won</span>` : `<span class="dim">${n ? `${n} teams` : "Teams to be announced"}</span>`}

/* v5: the season as a circuit */
/* v6: tier filter (Tournaments page only). e.tl is the event's own tier
   (S / A); both on by default. The choice is kept in
   localStorage when the browser allows it; events without a tier always show. */
const TIERS = [["S", "S-tier"], ["A", "A-tier"]];
const TIER_DEFAULT = { S: true, A: true };
const tierOn = (() => {
  const on = { ...TIER_DEFAULT };
  try {
    const v = JSON.parse(localStorage.getItem("faceoff.tiers") || "null");
    if (v && typeof v === "object") for (const [k] of TIERS) if (typeof v[k] === "boolean") on[k] = v[k];
  } catch (_) { /* no storage: defaults */ }
  return on;
})();
function saveTiers() { try { localStorage.setItem("faceoff.tiers", JSON.stringify(tierOn)); } catch (_) { /* not kept */ } }
const tierShown = e => !(e.tl in tierOn) || tierOn[e.tl];
const tierTag = e => e.tl ? `<i class="tier t${e.tl}" title="${e.tl}-tier event">${e.tl}</i>` : "";
function tierBar() {
  const n = k => EV.filter(e => e.tl === k).length;
  return `<fieldset class="tierbar"><legend>Show tiers</legend>${TIERS.map(([k, l]) => `<label class="tierbox t${k}">
    <input type="checkbox" data-tier="${k}"${tierOn[k] ? " checked" : ""}><span>${l}</span><b>${n(k)}</b></label>`).join("")}
    <span class="dim">Tier of each event</span></fieldset>`;
}
const usd = n =>"$" + Math.round(n).toLocaleString("en-US");
const prizeNum = e => +String(e.prize || "").replace(/[^\d.]/g, "") || 0;
const prizeTxt = e => prizeNum(e) ? usd(prizeNum(e)) : "";
const whereOf = e => e.city ? `${e.city}${e.country ? ", " + e.country : ""}` : (e.type || "");
const shortEv = n => n.replace(/^Intel Extreme Masters/, "IEM").replace(/^ESL Pro League Season/, "Pro League S")
  .replace(/^Esports World Cup/, "EWC").replace(/^StarLadder StarSeries/, "StarSeries")
  .replace(/^Thunderpick World Championship/, "Thunderpick WC").replace(/\s+20\d\d$/, "");
const tcVars = t => { const c = (T[t]?.color || [])[0]; return c ? `--tc:${c};--tcd:color-mix(in srgb, ${c} 11%, var(--panel));` : ""; };
const evImg = (e, cls = "", title = false) => IMG.events[e.slug]
  ? `<img class="${cls}" src="${IMG.events[e.slug]}" loading="lazy" alt="${title ? esc(e.name) : ""}"${title ? ` title="${esc(e.name)}"` : ""}>`
  : `<span class="${cls} evl-ph"${title ? ` title="${esc(e.name)}"` : ` aria-hidden="true"`}>${esc(shortEv(e.name).split(/\s+/).map(w => w[0]).join("").slice(0, 3))}</span>`;
const dayDiff = (a, b) => Math.round((dObj(b) - dObj(a)) / 864e5);
const tchip = (t, extra = "") => T[t] ? `<a href="#t-${T[t].slug}">${logo(t, "sm")}${esc(t)}${extra}</a>` : `<a>${logo(t, "sm")}${esc(t)}${extra}</a>`;
const dayRange = e => {
  const a = dObj(e.start), b = dObj(e.end);
  return a.getUTCMonth() === b.getUTCMonth() ? `${a.getUTCDate()}–${b.getUTCDate()}` : `${a.getUTCDate()}–${b.getUTCDate()} ${MONTHS[b.getUTCMonth()]}`;
};
const startsIn = e => { const d = dayDiff(DATA.as_of, e.start); return d <= 0 ? "starting" : d === 1 ? "starts tomorrow" : `in ${d} days`; };
function finalOf(e) {
  if (e.status !== "finished" || !e.champion) return null;
  const done = e.matches.filter(m => m.finished && m.t1 && m.t2);
  const gf = done.filter(m => m.stage === "Grand final");
  const m = gf.length ? gf[gf.length - 1] : [...done].sort((x, y) => (x.day || "").localeCompare(y.day || "") || (x.when || "").localeCompare(y.when || "")).pop();
  if (!m) return null;
  const one = winnerOf(m) === m.t1;
  return { m, w: winnerOf(m), l: one ? m.t2 : m.t1, sw: one ? m.w1 : m.w2, sl: one ? m.w2 : m.w1 };
}
// A team's own finish at an event: placement range from the build (results laid onto the prize slots)
function finishOf(e, team) {
  if (e.status === "upcoming") return { text: "Upcoming", cls: "word up" };
  const p = (e.placements || {})[team];
  if (!p) return e.status === "live" ? { text: "Still playing", cls: "word on" } : { text: "No series played", cls: "word" };
  if (p.from == null) return { text: p.label, cls: p.label === "Still playing" ? "word on" : "word" };
  const slot = e.prizes.find(s => s.from === p.from && s.to === p.to);
  return { text: p.from === p.to ? ordinal(p.from) : `${ordinal(p.from)}–${ordinal(p.to)}`, from: p.from, to: p.to,
    cls: p.from <= 3 ? "p" + p.from : p.from >= 9 ? "deep" : "", usd: slot && slot.usd || 0 };
}
// Team profile: the team's own finish at every event it entered (never the event winner)
function teamFinishes(team, evs) {
  const rows = evs.map(e => ({ e, f: finishOf(e, team) }));
  const wins = rows.filter(r => r.f.from === 1).length;
  const top4 = rows.filter(r => r.f.from && r.f.to <= 4).length;
  const money = rows.reduce((a, r) => a + (r.f.usd || 0), 0);
  const note = [wins ? `${wins} title${wins > 1 ? "s" : ""}` : "", top4 ? `${top4} top-four finish${top4 > 1 ? "es" : ""}` : "",
    money ? `${usd(money)} in prize money` : ""].filter(Boolean).join(", ");
  return `<section class="panel"><h2>Tournaments in 2026 <span class="dim">${note || "the team's own finish at each event"}</span></h2><div class="tfin">
    ${rows.map(({ e, f }) => `<a href="#e-${e.slug}"><span class="dt">${esc(span(e.start, e.end))}</span>${evImg(e, "el")}
      <span class="en"><b>${esc(e.name)}</b><span>${esc(whereOf(e))}${prizeTxt(e) ? `, ${prizeTxt(e)} pool` : ""}</span></span>
      <span class="plc ${f.cls}">${f.text}</span><span class="won">${f.usd ? `<b>${usd(f.usd)}</b>` : ""}</span></a>`).join("")}

}

function seasonStrip(EV) {
  const yr = +DATA.as_of.slice(0, 4);
  const first = `${yr}-01-01`;
  const last = dObj(EV.reduce((a, e) => e.end > a ? e.end : a, `${yr}-12-31`));
  const endD = new Date(Date.UTC(last.getUTCFullYear(), last.getUTCMonth() + 1, 1));
  const total = Math.round((endD - dObj(first)) / 864e5);
  const x = d => dayDiff(first, d) / total * 100;
  const months = [];
  for (let d = new Date(Date.UTC(yr, 0, 1)); d < endD; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) months.push(d);
  const mo = months.map((d, i) => {
    const iso = d.toISOString().slice(0, 10), nx = (months[i + 1] || endD).toISOString().slice(0, 10);
    return `<span class="mo${nx <= DATA.as_of ? " past" : ""}" style="left:${x(iso)}%;width:${x(nx) - x(iso)}%">${MONTHS[d.getUTCMonth()]}${d.getUTCMonth() === 0 ? ` <b>${d.getUTCFullYear()}</b>` : ""}</span>`;
  }).join("");
  const MINW = 36 / total * 100;                 // a pin is at least ~5 weeks wide so its name fits
  const lanes = [], pins = [];
  for (const e of [...EV].sort((a, b) => a.start.localeCompare(b.start))) {
    const w = Math.max((dayDiff(e.start, e.end) + 1) / total * 100, MINW);
    const l = Math.min(x(e.start), 100 - w);
    let i = lanes.findIndex(r => r <= l - .25);
    if (i < 0) { i = lanes.length; lanes.push(0); }
    lanes[i] = l + w;
    const sub = e.champion ? `${logo(e.champion, "sm")}${esc(e.champion)}` : e.status === "live" ? `<span class="chip live">Live</span>` : esc(span(e.start, e.end));
    pins.push([i, `<a class="pin ${e.status}" href="#e-${e.slug}" style="left:${l}%;width:${w}%;${e.champion ? tcVars(e.champion) : ""}" title="${esc(e.name)}, ${esc(span(e.start, e.end))}${e.champion ? `, won by ${esc(e.champion)}` : ""}">${evImg(e)}<span class="pt"><b>${tierTag(e)}${esc(shortEv(e.name))}</b><span>${sub}</span></span></a>`]);
  }
  const rows = lanes.map((_, i) => `<div class="lane">${pins.filter(p => p[0] === i).map(p => p[1]).join("")}</div>`).join("");
  return `<div class="strip-wrap"><div class="strip" role="group" aria-label="Tournament calendar">${mo}<div class="lanes">${rows}</div>
    <div class="now" style="left:${x(DATA.as_of)}%" title="Today"></div></div></div>
    <p class="strip-hint">Swipe the calendar sideways for the other months.</p>`;
}

function onAir(e) {
  const live = e.status === "live";
  const total = dayDiff(e.start, e.end) + 1;
  const today = Math.min(Math.max(dayDiff(e.start, DATA.as_of) + 1, 0), total);
  const teams = evTeamsList(e), P = e.placements || {};

  const out = teams.filter(t => P[t] && P[t].label !== "Still playing").sort((a, b) => (P[a].from || 99) - (P[b].from || 99));
  const byTime = (a, b) => (a.day || "9").localeCompare(b.day || "9") || (a.when || "").localeCompare(b.when || "");
  const next = e.matches.filter(m => !m.finished && m.t1 && m.t2).sort(byTime).slice(0, 4);
  const counter = live
    ? `<div class="dayctr"><b>Day ${today}<small> of ${total}</small></b><span>${alive.length} of ${teams.length} teams still in</span></div>`

function viewEvents() {
